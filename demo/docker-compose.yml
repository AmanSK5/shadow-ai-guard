# shadow-ai-guard local demo
# --------------------------
# One command to see the platform work with synthetic data, no cluster and
# no credentials:
#
#     docker compose up
#
# Then open either:
#
#   http://localhost:8091   the portal: devices, tools, people, and what is
#                           reporting. Start here. It runs managed mode like
#                           a real deployment, so it asks for the one-time
#                           setup code the receiver printed:
#                               docker compose logs receiver | grep setup_code
#   http://localhost:3000   Grafana (anonymous, no login), the "Shadow AI"
#                           dashboard.
#
# Both read the same findings and neither needs the other. Everything is fake:
# demo users are named after Pokemon, findings are seeded by the `seeder`
# service below.
#
# Stop and wipe with:  docker compose down -v

name: shadow-ai-guard-demo

services:
  # Log store. The receiver pushes findings here; Grafana reads them.
  loki:
    image: grafana/loki:3.4.1
    command: -config.file=/etc/loki/local-config.yaml
    # Loopback only. Docker publishes to every interface by default, and this
    # demo runs anonymous Grafana and a token everyone can read. Nothing here
    # should be reachable from the rest of the network someone happens to be
    # sitting on.
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Builds the registry from the repo's real registry.yaml into a shared
  # volume, so a fresh clone needs no pre-generated files. Runs once, exits.
  registry-builder:
    image: python:3.12-slim
    working_dir: /src
    # The repo is mounted read-only, but build.py writes into registry/dist/
    # inside the repo. So copy the registry dir to a writable temp location,
    # build there, and copy the two artifacts the receiver needs to /out.
    #
    # --no-fallback because only registry/ is copied: build.py also writes the
    # scanner's bundled fallback, which lives outside that directory and has
    # nothing to do with the demo.
    #
    # The dependencies come from the same hash-pinned file CI uses. It carries
    # a few test packages the builder has no use for, which costs a couple of
    # seconds and saves maintaining a second lockfile that would drift.
    command: >
      sh -c "pip install --quiet --require-hashes -r /src/.github/requirements-ci.txt &&
             cp -r /src/registry /tmp/registry &&
             cd /tmp && python registry/build.py --no-fallback &&
             cp registry/dist/registry.json registry/dist/collector.json /out/"
    volumes:
      - ../:/src:ro
      - registry-dist:/out
    restart: "no"

  # The real receiver, built from this repo. Pushes every finding straight to
  # the demo Loki (LOKI_PUSH_URL), so no log-scraping sidecar is needed.
  receiver:
    build: ../receiver
    environment:
      AUTH_TOKEN: "demo-token"
      LOKI_PUSH_URL: "http://loki:3100/loki/api/v1/push"
      REGISTRY_PATH: "/etc/ai-guard/registry.json"
      COLLECTOR_REGISTRY_PATH: "/etc/ai-guard/collector.json"
      DISPLAY_TZ: "UTC"
      # Managed mode, because it is the default everywhere else: enrollment,
      # the portal login and central settings, backed by one SQLite file on
      # the named volume below. `down -v` wipes it, so every fresh start of
      # the demo walks the real first-boot path: setup code, admin account,
      # wizard.
      MANAGED_MODE: "true"
      STATE_DB_PATH: /var/lib/ai-guard/state.db
      # Federated sign-in talks to the stand-in provider below instead of
      # Microsoft. DEMO ONLY - it is the trust root for who gets signed in,
      # and the receiver prints a warning naming it on every boot. Delete
      # this line and the wizard talks to the real Entra.
      SSO_AUTHORITY_URL: "http://entra-mock:8092"
    volumes:
      - registry-dist:/etc/ai-guard:ro
      - managed-state:/var/lib/ai-guard
    depends_on:
      loki:
        condition: service_healthy
      registry-builder:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Grafana, pre-provisioned with the Loki datasource and the project
  # dashboard. Anonymous access is on so there is no login step.
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Viewer: the demo is for looking at a dashboard, and Admin let
      # anyone who reached the port rewrite the provisioning.
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      # Lets the portal embed panels. Off by default in Grafana, deliberately:
      # framing a session someone is logged into is how clickjacking works.
      # Safe here because this Grafana is anonymous, read-only and bound to
      # loopback. In a real deployment this is a decision to make rather than
      # a setting to copy, which is why the portal says so instead of assuming.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # A framed page is cross-site as far as the browser is concerned, so the
      # default Lax cookie would not be sent and the frame would render a login
      # screen no amount of allow_embedding fixes.
      GF_SECURITY_COOKIE_SAMESITE: "none"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dash:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    ports:
      - "127.0.0.1:3000:3000"

  # Seeds synthetic findings once the receiver is healthy, then exits.
  # Re-run with:  docker compose run --rm seeder
  seeder:
    image: curlimages/curl:8.8.0
    entrypoint: ["/bin/sh", "/seed.sh"]
    environment:
      RECEIVER: "http://receiver:8080"
      TOKEN: "demo-token"
    volumes:
      - ./seed.sh:/seed.sh:ro
    depends_on:
      receiver:
        condition: service_healthy
    restart: "no"

  # The governance portal: devices, tools, people and the relationships
  # between them, derived from the same findings Grafana reads. Optional in a
  # real deployment and optional here - stop this service and everything else
  # still works, which is the point of it not being in the ingest path.
  #
  # Reads the compiled registry the builder produced, so tool names arriving
  # from different detectors (chatgpt.com from the extension, chatgpt from
  # everything else) resolve to one tool.
  # A mailbox you can read, so invites can be seen rather than assumed.
  # Mailpit accepts anything on 1025 and shows it at http://localhost:8025 -
  # nothing leaves the machine, which is the only sane default for a demo
  # that sends mail to addresses it invented.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A stand-in for Microsoft Entra, so the single sign-on wizard can be
  # walked without a real tenant, an app registration or a client secret.
  #
  # It is not a fake button: the receiver runs its ordinary code path
  # against this - discovery, PKCE, the code exchange, and every claim
  # check afterwards. Only the host answering changes. See the long note at
  # the top of demo/entra-mock/provider.py for what it deliberately is not.
  #
  # Stdlib only, so it runs on a bare python image with no build step.
  entra-mock:
    image: python:3.12-slim
    command: python /src/demo/entra-mock/provider.py
    environment:
      # Reachable from the BROWSER here, which is what the issuer has to
      # say: the receiver compares the token's iss against the discovery
      # document, and the browser is what visits the authorize endpoint.
      MOCK_PUBLIC_URL: "http://localhost:8092"
      # And from the RECEIVER here, over the compose network, which is
      # where the code exchange happens.
      MOCK_INTERNAL_URL: "http://entra-mock:8092"
      MOCK_TENANT: "11111111-2222-3333-4444-555555555555"
      MOCK_CLIENT_ID: "66666666-7777-8888-9999-000000000000"
    volumes:
      - ../:/src:ro
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8092/healthz')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  portal:
    build: ../portal
    environment:
      LOKI_URL: "http://loki:3100"
      # Managed mode, same as a real deployment: admin actions proxy to the
      # receiver and the portal gets a real login. The receiver prints a
      # one-time setup code to its log on first boot - find it with
      #     docker compose logs receiver | grep setup_code
      # and create the admin account from the login screen. That unlocks the
      # settings, the wizard (#wizard), fleet and enrollment tokens - the
      # parts of the platform a no-auth demo could not show.
      RECEIVER_URL: "http://receiver:8080"
      REGISTRY_PATH: "/etc/ai-guard/registry.json"
      # Governance decisions. Optional everywhere, including here: comment
      # this out and the register falls back to the registry's own approved
      # flag, which is what a deployment that has not adopted this looks
      # like.
      GOVERNANCE_PATH: "/etc/ai-guard-governance.yaml"
      # Short, because the demo is for clicking around. A real deployment
      # wants the default 300 so a seven-day query is not rerun per page load.
      CACHE_TTL_SECONDS: "10"
      LOOKBACK_HOURS: "168"
      # Which widgets the overview draws, in order. Set here so the demo shows
      # the feature rather than the default, and overridable from the shell:
      #   OVERVIEW_WIDGETS=stat_row,top_tools docker compose up -d --force-recreate portal
      #
      # A grafana: entry refers to a panel in GRAFANA_PANELS below, by title or
      # by panel id. Prefer the id where a title contains a comma, because this
      # list is comma separated and the title would split into two entries that
      # match nothing. GRAFANA_PANELS uses semicolons for that same reason.
      OVERVIEW_WIDGETS: ${OVERVIEW_WIDGETS:-stat_row,top_tools,activity_trend,recent_personal_accounts,detection_coverage,source_health,paste_guard}
      # The browser loads these frames, so this is the URL you reach Grafana
      # on, not the one the portal container would use.
      GRAFANA_URL: "http://localhost:3000"
      # dashboardUid:panelId:Title, semicolon separated. Semicolons because
      # panel titles contain commas: "Top tools (devices, 7d)" split into two
      # broken entries when this was comma separated.
      #
      # Panel ids come from the dashboard JSON. Set GRAFANA_DASHBOARD_UID
      # instead to embed the whole thing in one frame, which needs no ids and
      # survives someone rearranging them.
      GRAFANA_PANELS: >-
        ai-guard:2:Devices reporting (24h);
        ai-guard:6:Top tools (devices, 7d);
        ai-guard:5:Findings by surface (7d);
        ai-guard:4:Findings by severity (rate);
        ai-guard:10:Devices with findings, by OS;
        ai-guard:31:Pastes stopped (7d)
    volumes:
      - registry-dist:/etc/ai-guard:ro
      # A distinct path rather than inside the registry volume: /etc/ai-guard
      # is a named volume the builder writes, and a bind mount nested in it
      # depends on mount ordering that is not worth relying on.
      - ./governance.yaml:/etc/ai-guard-governance.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      registry-builder:
        condition: service_completed_successfully
    # Loopback only, same as everything else here.
    ports:
      - "127.0.0.1:8091:8091"

  # Serves the paste-guard demo page, and the real guard.js it loads.
  extension-demo:
    image: nginx:1.27-alpine
    volumes:
      - ../extension:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8090:80"

volumes:
  registry-dist:
  managed-state: