bridge_targets:
  - name: Atlassian (Jira/Confluence)
    domains: [api.atlassian.com, atlassian.net]
    notes: "API token creation is self-service for all users."
  - name: GitHub
    domains: [api.github.com, github.com]
    notes: "Personal access tokens are self-service."
  - name: Slack
    domains: [api.slack.com, slack.com]
    notes: "User tokens can be created without admin approval."
  - name: Microsoft 365 / SharePoint
    domains: [graph.microsoft.com, sharepoint.com]
    notes: "OAuth consent is locked to admin."
  - name: Google Workspace
    domains: [www.googleapis.com, drive.googleapis.com, drive.google.com, docs.google.com]
    notes: "Google API keys can be self-provisioned."
  - name: Figma
    domains: [api.figma.com, figma.com]
    notes: "Personal access tokens are self-service."
# Matched after normalisation (lowercased, path and .exe stripped, a macOS
# "X Helper (Role)" reduced to X), so one entry covers a name in every
# shape the platforms report it in - chrome, chrome.exe and Google Chrome
# Helper all match the two Chrome entries below.
allowed_processes: [chrome, "Google Chrome", chromium, firefox, safari, msedge, "Microsoft Edge",
  brave, arc, opera, vivaldi, Slack, Teams, "Microsoft Teams", ms-teams, OneDrive, Outlook,
  # Office resolves the Copilot endpoints as background M365 activity.
  Excel, PowerPnt, PowerPoint, WinWord, OneNote, MsAccess, MSPub, lync,
  Figma, Notion, svchost.exe, explorer.exe, git, gh, systemd-resolved, mDNSResponder,
  trustd, nsurlsessiond]
discover_exclude_domains: [jetbrains.com, fastly.net, ably.net, ably-realtime.com, shopifysvc.com, shopifycloud.com, vsassets.io, vscode-cdn.net, vercel.app, thehubevents.com, ai.engineer, www.ai.engineer]