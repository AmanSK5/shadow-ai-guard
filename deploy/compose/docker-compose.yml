# ai-guard, deployed with Docker Compose.
#
# Two stateless containers. The receiver accepts findings and writes them as
# JSON lines; the portal reads those lines back and derives relationships. That
# is the whole of it, and neither needs an orchestrator to run.
#
# What this deliberately does not include: Loki and Grafana. Production points
# at whatever you already run, because most people running this already have a
# log store and adding a second one is not a favour. If you have neither, the
# `with-logs` profile starts both for you:
#
#     docker compose --profile with-logs up -d
#
# Ports bind to loopback. This is meant to be reachable, and reachable is a
# decision you make with a reverse proxy in front that terminates TLS, not
# something a compose file makes for you by binding 0.0.0.0. See README.md.
#
#     cp .env.example .env          # then edit it
#     mkdir -p secrets
#     openssl rand -hex 32 > secrets/auth_token
#     openssl rand -hex 24 > secrets/portal_password
#     chmod 600 secrets/*
#     docker compose up -d

name: ai-guard

services:
  # Compiles registry.yaml into the two views the receiver serves. A one-shot
  # container on a stock image, not a build: it runs build.py from the repo you
  # cloned and exits. The receiver waits for it.
  #
  # The registry is not shipped inside the receiver image on purpose. It is the
  # thing a deployer edits most - approving a tool, adding a domain - and baking
  # it in would mean a new image for a one-line YAML change.
  registry-builder:
    image: python:3.12-slim
    working_dir: /src
    command: >
      sh -c "pip install -q --require-hashes -r /src/.github/requirements-ci.txt &&
             cp -r /src/registry /tmp/registry &&
             cd /tmp/registry && python build.py --no-fallback &&
             cp dist/registry.json dist/collector.json /out/"
    volumes:
      - ../..:/src:ro
      - registry-dist:/out
    restart: "no"

  receiver:
    image: ghcr.io/amansk5/shadow-ai-guard/receiver:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Read from a file rather than the environment. Compose has no real
      # secret story: an environment variable is visible in `docker inspect`,
      # in /proc and in every child process's environment, while a file is
      # confined to the filesystem. That is better and it is not encryption.
      AUTH_TOKEN_FILE: /run/secrets/auth_token
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-}
      REGISTRY_PATH: /etc/ai-guard/registry.json
      COLLECTOR_REGISTRY_PATH: /etc/ai-guard/collector.json
      DISPLAY_TZ: ${DISPLAY_TZ:-UTC}
    volumes:
      - registry-dist:/etc/ai-guard:ro
      - ./secrets/auth_token:/run/secrets/auth_token:ro
    depends_on:
      registry-builder:
        condition: service_completed_successfully
    # Loopback. Collectors and scanners report from off the network, so this
    # one does need to be reachable - put a reverse proxy in front of it that
    # terminates TLS rather than changing this to 0.0.0.0.
    ports:
      - "127.0.0.1:${RECEIVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Optional. Remove this service and everything above still works; it reads
  # and is not in the ingest path.
  portal:
    image: ghcr.io/amansk5/shadow-ai-guard/portal:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOKI_URL: ${LOKI_URL:?set LOKI_URL in .env - the portal reads findings from your log store}
      LOKI_TOKEN_FILE: ${LOKI_TOKEN_FILE:-}
      PORTAL_USER: ${PORTAL_USER:-admin}
      PORTAL_PASSWORD_FILE: /run/secrets/portal_password
      REGISTRY_PATH: /etc/ai-guard/registry.json
      LOOKBACK_HOURS: ${LOOKBACK_HOURS:-168}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      IDENTITY_MAP: ${IDENTITY_MAP:-}
      # The browser loads the Grafana frames, so this is the URL you reach
      # Grafana on, not the one this container would use.
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_PANELS: ${GRAFANA_PANELS:-}
      GRAFANA_DASHBOARD_UID: ${GRAFANA_DASHBOARD_UID:-}
    volumes:
      - registry-dist:/etc/ai-guard:ro
      - ./secrets/portal_password:/run/secrets/portal_password:ro
    depends_on:
      registry-builder:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/healthz')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # --------------------------------------------------------------------------
  # Only with `--profile with-logs`. For someone who has no log store yet.
  # If you already run Loki, or anything that takes JSON lines, do not use
  # these: point LOKI_PUSH_URL and LOKI_URL at what you have.
  # --------------------------------------------------------------------------

  loki:
    profiles: [with-logs]
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    profiles: [with-logs]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_DEFAULT_THEME: "dark"
      # Off by default in Grafana, deliberately: framing a session someone is
      # logged into is how clickjacking works. Both are needed for the portal's
      # Dashboard tab, and both are a decision rather than a default - a framed
      # page is cross-site, so a Lax cookie is not sent and the frame renders a
      # login screen no amount of allow_embedding fixes.
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      GF_SECURITY_COOKIE_SAMESITE: ${GRAFANA_COOKIE_SAMESITE:-lax}
      # SameSite=None is only valid on a cookie that also carries Secure, so
      # without this the browser discards the session cookie and every login
      # bounces back to the login screen with nothing explaining why. Requires
      # HTTPS in front of Grafana, which a reverse proxy is providing anyway.
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      loki:
        condition: service_healthy

volumes:
  registry-dist:
  loki-data:
  grafana-data: