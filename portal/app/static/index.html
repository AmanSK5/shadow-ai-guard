<!doctype html>
<meta charset="utf-8">
<title>ai-guard portal</title>
<style>
:root{--bg:oklch(.16 .012 250);--fg:oklch(.93 .008 250);--sf:oklch(.2 .014 250);
--sf2:oklch(.24 .016 250);--pri:oklch(.8 .17 155);--acc:oklch(.72 .13 215);
--warn:oklch(.79 .15 78);--dstr:oklch(.63 .21 25);--mut:oklch(.68 .018 250);
--bd:oklch(.3 .016 250)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{border-right:1px solid var(--bd);background:var(--sf);padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
aside .brand{padding:2px 18px 2px}
aside .brand img{display:block;width:178px;height:auto}
aside nav{flex:1}
aside .grp{margin:18px 0 8px;padding:14px 18px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--acc);border-top:2px solid var(--bd)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:7px 18px;border-left:2px solid transparent}
nav button:hover{color:var(--fg);background:color-mix(in oklch,var(--fg) 4%,transparent)}
nav button.on{color:var(--pri);border-left-color:var(--pri);background:color-mix(in oklch,var(--pri) 10%,transparent)}
nav .count{float:right;font-family:ui-monospace,monospace;font-size:11px;opacity:.7}
.foot{padding:14px 18px 2px;border-top:1px solid var(--bd);margin-top:14px;font-size:11px;line-height:1.7;color:var(--mut)}
.foot a{color:var(--mut);text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover{color:var(--pri);border-bottom-color:color-mix(in oklch,var(--pri) 40%,transparent)}
.topbar{display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5;max-width:1440px;margin:0 auto}
/* Centred, and the topbar carries the same cap and margin. Left-aligned at
   1180 the topbar border ran to the window edge while the content stopped
   520px short of it on a 1920 screen, which read as a broken layout rather
   than a margin. Removing the cap instead is worse: table{width:100%} then
   spreads five columns over 2292px on a 2560 screen and puts last seen
   1873px from the start of the row, for no gain, because the widest cell is
   already capped at 52ch. */
main{padding:22px 24px;max-width:1440px;margin:0 auto}
/* Flex rather than a fixed 12 column grid. The widget list is a deployment
   choice, so most counts do not divide evenly into a rigid grid and the last
   row ends up with a hole in it. Growing the items instead means any number
   fills its row. */
.grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.grid>*{flex:1 1 auto;min-width:0}
.w6{flex-basis:46%}.w4{flex-basis:30%}.w12{flex-basis:100%}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.w6,.w4{flex-basis:100%}}
.wcard{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.wcard h3{margin:0 0 8px;font-size:12px;font-family:ui-monospace,monospace;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-family:ui-monospace,monospace;font-size:12px}
.bar span:first-child{width:120px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:9px;background:var(--pri);border-radius:2px;min-width:2px}
.bar i.alt{background:var(--acc)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:5px 16px;margin:0}
.kv dt{color:var(--mut);font-size:12px}
.kv dd{margin:0;font-family:ui-monospace,monospace;font-size:12px}
.src-note{color:var(--mut);font-size:11px;font-style:italic;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stats div{background:var(--sf);padding:14px 16px}
.stats dt{font:600 22px/1.2 ui-monospace,monospace;color:var(--pri)}
.stats dd{margin:4px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:color-mix(in oklch,var(--pri) 50%,transparent)}
.card h3{margin:0 0 6px;font-size:15px;font-family:ui-monospace,monospace}
.card .sub{color:var(--mut);font-size:12px}
.pill{display:inline-block;white-space:nowrap;border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-size:11px;margin:2px 4px 2px 0;font-family:ui-monospace,monospace}
.nw{white-space:nowrap}
.p-warn{color:var(--dstr)} .p-ok{color:var(--pri)} .p-mut{color:var(--mut)} .p-acc{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;color:var(--mut);border-bottom:1px solid var(--bd);padding:6px 10px 6px 0;font-size:12px}
td{padding:7px 10px 7px 0;border-bottom:1px solid color-mix(in oklch,var(--bd) 45%,transparent);font-family:ui-monospace,monospace;font-size:12px}
/* The register, as cards.
   -------------------------------------------------------------------------
   Four table attempts failed, and the last measurement said why: the content
   area is 1125px, not the ~1392px every one of those attempts was sized
   against. Nine columns needed 1077px and fitted by 48px, which is not
   fitting, it is scraping. Reducing to eight would have needed 1007px and
   scraped by 118px instead.

   A register is read one tool at a time as often as it is scanned, so the
   table shape was never load-bearing. Cards drop the width problem entirely:
   auto-fill gives two per row at 1125px, one on a narrow window and three on a
   wide monitor, with no breakpoint to keep in step and no horizontal scrolling
   at any width.

   Fields that were columns are now labelled rows inside a card, which also
   removes the thing no amount of width tuning fixed: a header three columns
   away from the value it describes. */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.card{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;min-width:0}
/* Name and decision on one line, because those are the two things someone
   scanning is looking for. */
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.card-name{font-size:15px;font-weight:600}
.card-meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);
           margin-top:2px;overflow-wrap:anywhere}
.card hr{border:0;border-top:1px solid color-mix(in oklch,var(--bd) 55%,transparent);margin:12px 0}
/* A quiet label rather than another box. The lower block is organisational
   record rather than observation, and the two were reading as one list. */
.card-section{font-size:11px;color:var(--mut);text-transform:uppercase;
              letter-spacing:.08em;margin:0 0 8px}
/* An exception. Its own block rather than a row in the key/value list, because
   it has an id, a scope, a date and a reason, and flattening that into one
   line loses the scope, which is the part that says who it applies to. */
.exc{font-family:ui-monospace,monospace;font-size:11px;margin-bottom:6px;
     display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.exc-scope{color:var(--acc)}
.exc-when{color:var(--mut)}
.exc-why{flex-basis:100%;color:var(--mut);margin-top:1px}
/* Expired, and still shown. Quieter, because it is history rather than
   something currently applying, and struck through would be too loud for a
   record somebody may still want to read. */
.exc-old{opacity:.55}
.exc-old .exc-when{color:var(--dstr)}
/* Label and value, with the label beside its own value rather than three
   columns away from it. */
.card-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;
         font-family:ui-monospace,monospace}
.card-kv dt{color:var(--mut);white-space:nowrap}
.card-kv dd{margin:0;overflow-wrap:anywhere}
.card-kv dd .pill{margin:0 4px 0 0}

.gov{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.gov .pill{margin:0}
.gov-sub{font-size:11px;color:var(--mut);white-space:nowrap}
.gov-sub.over{color:var(--dstr)}
.gov-owner{white-space:nowrap}
/* No border, no fill. Absence of governance, not a state with equal weight to
   approved or reviewing. */
.inputs{margin:0 0 18px;padding-left:20px;font-size:13px;line-height:1.9}
.inputs a{color:var(--warn)}
.none{color:color-mix(in oklch,var(--mut) 70%,transparent);font-family:ui-monospace,monospace;
      font-size:11px;white-space:nowrap}
/* A zero is the absence of something and should not compete with a real
   count. Without this a row of zeros is as loud as a row of findings. */
td.n .z{color:color-mix(in oklch,var(--mut) 55%,transparent)}
/* The counts split into two questions: how widely is this used, and what is
   it signed into. A rule rather than a gap, because a gap in a dense table
   reads as a missing column. */
th.grp,td.grp{border-left:1px solid color-mix(in oklch,var(--bd) 60%,transparent);padding-left:14px}
.note{background:color-mix(in oklch,var(--warn) 10%,transparent);border:1px solid color-mix(in oklch,var(--warn) 40%,transparent);color:var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:13px}
.back{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;margin-bottom:14px}
h2{font-size:19px;margin:0 0 4px}
.lede{color:var(--mut);font-size:13px;margin:0 0 16px}
/* No max-width here. main is already capped and centred, so a second
   constraint on the prose only makes it stop short of the table it
   introduces, which reads as a broken line rather than a measure. */
input{background:var(--sf2);border:1px solid var(--bd);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;min-width:220px}
/* Managed views: small action buttons, the admin-token field, and the
   one-time pane a minted token appears in. */
button.mini{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line,#8884);border-radius:6px;background:transparent;color:var(--pri);cursor:pointer}
button.mini:hover{border-color:var(--pri)}
.mfield{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line,#8884);border-radius:6px;background:transparent;color:inherit;min-width:260px}
.tokpane{border:1px solid var(--pri);border-radius:8px;padding:12px 14px;margin:14px 0}
.tokpane code{word-break:break-all}
.adminbar{margin:10px 0 14px;font-size:12px;color:var(--mut)}
</style>
<div class="shell">
  <aside>
    <div class="brand"><img src="/logo.png" alt="Shadow AI Guard"></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="mono" id="footver">v</div>
      <div>by <a href="https://amansk.co" target="_blank" rel="noopener">Aman Karir</a></div>
      <div><a href="https://github.com/AmanSK5/shadow-ai-guard" target="_blank" rel="noopener">Source and issues</a></div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <input id="q" placeholder="filter…">
      <span id="freshness" class="mono" style="font-size:11px;color:var(--mut)"></span>
      <button id="refresh" class="back" style="margin:0">refresh</button>
    </div>
    <main id="app"></main>
  </div>
</div>
<script>
let G = {devices:{},identities:{},tools:{},bridges:{},unattributed:[],counts:{}};
// Views that read a second endpoint, cached until refresh clears them.
// Declared here rather than beside their views: load() clears them and let
// is not hoisted, so declaring them lower down is a TDZ error on first
// refresh.
let DIAG = null;
let REG = null;
let EV = null;
let PG = null;
let FLEET = null;
let TOKENS = null;
let S = null, CFG = {}, loadError = '';
// The receiver admin token, held in this tab's memory for the session and
// sent per request as a header. Never written to storage of any kind: the
// portal's whole security story for the write path is that it stores no
// credential, and localStorage would quietly undo that.
let ADMIN = '';
// The one moment a minted token is visible. Kept until dismissed or the
// admin token is forgotten, because a pane that vanishes on the next click
// loses a credential that cannot be recovered.
let MINTED = null;

async function load(force) {
  app.innerHTML = '<p class="lede">Reading findings…</p>';
  const q = force ? '?refresh=true' : '';
  // Refresh must clear the views that read a second endpoint too, or the
  // button refreshes some of the page and silently not the rest.
  if (force) { DIAG = null; REG = null; EV = null; PG = null; FLEET = null; TOKENS = null; }
  try {
    CFG = await (await fetch('/api/config')).json();
    const gr = await fetch('/api/graph' + q);
    if (!gr.ok) throw new Error((await gr.json()).detail || gr.statusText);
    G = await gr.json();
    const sr = await fetch('/api/status' + q);
    if (sr.ok) S = await sr.json();
    // Fetched here rather than lazily, because the overview may draw a paste
    // guard widget and a widget that fetches on render would flash empty.
    const pr = await fetch('/api/paste-guard' + q);
    if (pr.ok) PG = await pr.json();
    loadError = '';
  } catch (e) {
    loadError = String(e.message || e);
  }
  render();
  showFreshness();
}

// The graph is cached, and a cache you cannot see is indistinguishable from a
// portal that is not working: a finding that arrived a minute ago simply is
// not there, with nothing on screen to say why.
function showFreshness() {
  const el = document.getElementById('freshness');
  if (!el) return;
  if (loadError || !G.derived_at) { el.textContent = ''; return; }
  const tick = () => {
    const age = Math.max(0, Math.round(Date.now() / 1000 - G.derived_at));
    el.textContent = age < 5 ? 'just now'
      : age < 90 ? age + 's ago'
      : Math.round(age / 60) + 'm ago';
  };
  tick();
  clearInterval(window._freshTimer);
  window._freshTimer = setInterval(tick, 5000);
}
const app = document.getElementById('app'), q = document.getElementById('q');
// The view lives in the URL fragment. A reload landing back on Setup loses
// where you were, and storing it would need somewhere to store it; the
// fragment is free, survives a reload, and makes a view linkable to a
// colleague. An unknown fragment falls back rather than rendering nothing.
// Grouped rather than flat, so a section can be added without reshuffling
// everything else, and so the shape of the tool is legible before you click.
const NAV = [
  {grp:null,        items:[['overview','Overview']]},
  {grp:'Inventory', items:[['tools','Tools'],['people','People'],
                           ['devices','Devices'],['personal','Personal accounts'],
                           ['mcp','MCP servers']]},
  {grp:'Coverage',  items:[['setup','Setup'],['coverage','Uncovered devices']]},
  {grp:'Governance',items:[['register','AI register'],['paste','Paste guard'],
                           ['iso','ISO 42001 evidence']]},
  {grp:'Analytics', items:[['dashboard','Grafana']]},
  {grp:'Managed',   items:[['fleet','Fleet'],['tokens','Enrollment tokens']]},
  {grp:'System',    items:[['settings','Settings']]},
];

// Derived from NAV rather than written out beside it. Kept as a second list,
// #register was missing from it: the nav entry worked, the view rendered, and
// reloading the page silently sent you back to setup because the fragment was
// not recognised. Two lists that must agree, with nothing enforcing it.
const VIEWS = NAV.flatMap(sec => sec.items.map(([id]) => id));
const fromHash = () => {
  const h = (location.hash || '').replace(/^#/, '');
  return VIEWS.includes(h) ? h : 'setup';
};
let view = fromHash(), detail = null, filter = '';

// Escapes the five characters that matter in HTML text and in a quoted
// attribute. The apostrophe was missing, and it mattered: values were
// interpolated into onclick="open_('device','...')", a single-quoted JS string
// inside a double-quoted attribute, so a device name containing ' closed the
// string and ran whatever followed. The inline handlers are gone now and this
// is still the right set: an attribute quoted either way is covered, and
// nothing downstream has to remember which.
//
// This is not sufficient on its own for a JS or URL context. Nothing should be
// interpolated into either. Use a data attribute and read it back.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ents = o => Object.entries(o || {});
const label = (k, d) => d.device_name || k;
const match = s => !filter || String(s).toLowerCase().includes(filter);
// Shared by any view rendering counts or dates. Declared here rather than
// inside a view: they began as locals of register(), which made them invisible
// to every other function, and the second view to use them rendered nothing at
// all because the ReferenceError fired while building the HTML.
const num = n => n ? String(n) : '<span class="z">0</span>';
const when = t => t ? `<span class="nw">${esc(String(t).slice(0, 10))}</span>` : '—';

const WIDGETS = {

  stat_row: () => {
    const devs = ents(G.devices), pa = G.personal_accounts || [];
    const gaps = devs.filter(([,d]) => d.scanner_seen && !d.collector_seen);
    const week = Date.now()/1000 - 7*86400;
    const fresh = pa.filter(r => r.first_seen &&
      Date.parse(r.first_seen)/1000 > week).length;
    return `<dl class="stats">
      <div><dt style="color:var(--dstr)">${pa.length}</dt><dd>personal accounts</dd></div>
      <div><dt>${fresh}</dt><dd>new this week</dd></div>
      <div><dt>${new Set(pa.map(r=>r.user||r.device)).size}</dt><dd>affected people</dd></div>
      <div><dt>${new Set(pa.map(r=>r.tool)).size}</dt><dd>affected tools</dd></div>
      <div><dt>${devs.length}</dt><dd>devices</dd></div>
      <div><dt>${ents(G.tools).length}</dt><dd>tools</dd></div>
      <div><dt>${gaps.length}</dt><dd>coverage gaps</dd></div>
    </dl>`;
  },

  top_tools: () => {
    const rows = ents(G.tools)
      .sort((a,b)=>(b[1].devices||[]).length-(a[1].devices||[]).length).slice(0,7);
    const max = rows.length ? (rows[0][1].devices||[]).length || 1 : 1;
    return `<div class="wcard w6"><h3>Top tools</h3>
    ${rows.length ? rows.map(([k,t])=>{
      const n = (t.devices||[]).length;
      return `<div class="bar"><span>${esc(k)}</span>
        <i style="width:${Math.round(n/max*160)}px"></i><span>${n}</span></div>`;
    }).join('') : '<p class="lede">Nothing reported yet.</p>'}</div>`;
  },

  recent_personal_accounts: () => {
    const pa = (G.personal_accounts || []).slice(0, 6);
    return `<div class="wcard w6"><h3>Recent personal accounts</h3>
    ${pa.length ? `<table>${pa.map(r=>`<tr>
      <td>${esc(r.user || r.device_name || r.device)}</td>
      <td><span class="pill p-warn">${esc(r.account_domain)}</span></td>
      <td>${esc(r.tool)}</td>
      <td style="color:var(--mut)">${esc((r.last_seen||'').slice(0,10))}</td>
    </tr>`).join('')}</table>`
    : '<p class="lede">None seen. That is a result, not an absence of one.</p>'}
    </div>`;
  },

  detection_coverage: () => {
    if (!S) return '<div class="wcard w4"><h3>Detection coverage</h3><p class="lede">No status available.</p></div>';
    return `<div class="wcard w4"><h3>Detection coverage</h3>
    ${(S.groups||[]).map(g=>{
      const pct = g.total ? Math.round(g.reporting/g.total*100) : 0;
      return `<div class="bar"><span>${esc(g.group)}</span>
        <i class="${pct<50?'alt':''}" style="width:${Math.max(pct*1.1,2)}px"></i>
        <span>${g.reporting}/${g.total}</span></div>`;
    }).join('')}</div>`;
  },

  source_health: () => {
    if (!S) return '';
    const silent = (S.groups||[]).flatMap(g=>(g.sources||[]).filter(r=>!r.reporting));
    return `<div class="wcard w4"><h3>Silent sources</h3>
    ${silent.length ? silent.slice(0,8).map(r=>
      `<div style="font-size:12px;margin:4px 0"><span class="pill p-mut">${esc(r.source)}</span></div>`
    ).join('') : '<p class="lede">Every listed source is reporting.</p>'}</div>`;
  },

  paste_guard: () => {
    // Native rather than an embedded Grafana panel. This number is derived by
    // the portal now, so embedding an iframe to show it meant a card in
    // Grafana's typography sitting beside cards in the portal's, with a title
    // we could not restyle because it renders cross-origin.
    //
    // Two numbers, not four. The overview is a glance: is the guard running,
    // and did somebody ignore it. Warned and blocked are the detail behind
    // that, and they have a page. Four stat cells also clipped in a
    // third-width card on a narrower content area, which is the same lesson
    // the register learned the long way.
    if (!PG) return '<div class="wcard w4"><h3>Paste guard</h3>'
      + '<p class="lede">No paste guard data.</p></div>';
    const over = PG.overridden || 0, live = PG.guard_devices || 0;
    const versions = (PG.guard_versions || []).length;
    return `<div class="wcard w4"><h3>Paste guard</h3>
      <dl class="stats" style="margin:0;grid-template-columns:repeat(2,1fr)">
        <div><dt${live ? '' : ' style="color:var(--dstr)"'}>${live}</dt><dd>devices</dd></div>
        <div><dt${over ? ' style="color:var(--dstr)"' : ''}>${over}</dt><dd>overridden</dd></div>
      </dl>
      <p class="src-note">${live
        ? `Checked in from ${live} device${live === 1 ? '' : 's'}${
             versions > 1 ? ` across ${versions} versions` : ''}, so a low
           count of stopped pastes means what it says.`
        : `No device checked in, so nothing here can be read as an estate that
           pasted nothing.`}</p></div>`;
  },

  grafana: (w) => {
    const base = CFG.grafana_url;
    if (!base) return `<div class="wcard w4"><h3>${esc(w.ref)}</h3>
      <p class="lede">No Grafana configured.</p></div>`;
    const p = (CFG.grafana_panels||[]).find(x => (x.title||'') === w.ref || String(x.panel_id) === w.ref);
    if (!p) return `<div class="wcard w4"><h3>${esc(w.ref)}</h3>
      <div class="note" style="margin:0">No panel in GRAFANA_PANELS matches
      "${esc(w.ref)}". Named here but not defined there, so there is nothing
      to draw.</div></div>`;
    const q = 'orgId=1&theme=dark&from=now-7d&to=now&kiosk';
    // No heading of our own. The panel draws its own, from the dashboard, so a
    // second one is both duplicated and less trustworthy: ours comes from
    // GRAFANA_PANELS, which is a snapshot of a title someone can rename in
    // Grafana at any time.
    return `<div class="wcard w4" style="padding:10px">
      <iframe src="${esc(base)}/d-solo/${esc(p.uid)}/?${q}&panelId=${esc(p.panel_id)}"

async function register() {
  if (!REG) {
    try { REG = await (await fetch('/api/register')).json(); }
    catch (e) { return `<h2>AI register</h2><div class="note">Could not build
      the register: ${esc(String(e.message || e))}</div>`; }
  }
  const rows = (REG.rows || []).filter(r =>
    match(r.name) || match(r.id) || match(r.vendor) || match(r.category));

  const win = REG.hours >= 24 ? Math.round(REG.hours / 24) + ' days'
                              : REG.hours + ' hours';
  const dash = '<span class="pill p-mut">not set</span>';
  // A zero is the absence of a thing. Rendering it at full weight makes a
  // row of zeros as loud as a row of findings, and the eye has nothing to
  // land on.
  // Risk tier as a pill. It is a meaningful attribute and read as ordinary
  // metadata beside everything else. Restrained on purpose: status and the
  // personal-account count already carry colour, and a third loud thing in the
  // same card would leave nothing standing out.
  const RISK = {high:'p-warn', medium:'p-acc', low:'p-mut'};
  const risk = t => t
    ? `<span class="pill ${RISK[t]||'p-mut'}">${esc(t)}</span>` : '—';

  // Effective status, with the stored decision alongside when they differ.
  // An approval past its review date reads as reviewing and says why: a green
  // pill turning amber leaves someone wondering, and an approval nobody has
  // revisited is not evidence a tool is safe, it is evidence nobody looked.
  const PILL = {approved:'p-ok', not_approved:'p-warn', reviewing:'p-acc'};
  const LABEL = {approved:'approved', not_approved:'not approved',
                 reviewing:'reviewing'};
  // Status says what was decided, and at most one line of context. The expiry
  // used to live here too, which put four lines in one cell and made every
  // other row look ragged beside it. Expiry is a fact about the review date,
  // so it belongs in the review column.
  // Exceptions, as their own block under the governance rule. Deliberately not
  // folded into the status pill: an exception is a departure from the general
  // decision for a stated scope, and showing it as the status would make a
  // note about one team read as a decision about everybody.
  //
  // Expired ones are still listed, quietly. An exception that has run its
  // course is a record of something an organisation decided and then let
  // lapse, which is worth seeing rather than losing.
  const scopeText = sc => Object.entries(sc || {})
    .map(([k, v]) => `${esc(k)} ${esc(String(v))}`).join(', ');

  const exceptionBlock = r => {
    const active = r.exceptions || [], expired = r.expired_exceptions || [];
    if (!active.length && !expired.length) return '';
    const one = (e, isExpired) => `<div class="exc${isExpired ? ' exc-old' : ''}">
      <span class="mono">${esc(e.id)}</span>
      ${e.scope && Object.keys(e.scope).length
        ? `<span class="exc-scope">${scopeText(e.scope)}</span>` : ''}
      <span class="exc-when">${isExpired ? 'expired' : 'until'} ${esc(e.expires)}</span>
      ${e.reason ? `<div class="exc-why">${esc(e.reason)}</div>` : ''}
    </div>`;
    return `<hr>
      <div class="card-section">exception${active.length + expired.length === 1 ? '' : 's'}</div>
      ${active.map(e => one(e, false)).join('')}
      ${expired.map(e => one(e, true)).join('')}`;
  };

  const status = r => {
    const wrap = inner => `<div class="gov">${inner}</div>`;

    // Not in the registry at all is the row worth acting on: something is in
    // use that governance has never considered.
    if (!r.in_registry) {
      return wrap('<span class="pill p-warn">not in registry</span>');
    }

    if (r.status_source === 'governance') {
      let out = `<span class="pill ${PILL[r.status]||'p-mut'}">${LABEL[r.status]||esc(r.status)}</span>`;
      if (r.status_reason === 'approval_expired') {
        out += `<span class="gov-sub">was ${LABEL[r.stored_status]||''}</span>`;
      }
      return wrap(out);
    }

    // No governance record, so this is the registry's own flag. approved: true
    // can only have been set deliberately, because every tool ships false, so
    // it is a decision and reads as one. approved: false is ambiguous: it is
    // what an untouched registry says about everything, and rendering it as a
    // refusal would put a shipped default and a considered "no" in the same
    // red pill.
    if (r.approved === true) {
      return wrap('<span class="pill p-ok">approved</span>'
        + '<span class="gov-sub">from the registry</span>');
    }
    // Quieter than the other three. When half an estate has no decision, an
    // outlined pill on every card repeats until it reads as a status somebody
    // chose. It is the absence of one, and should look like it.
    return wrap('<span class="none">no decision</span>');
  };

  // Review: the date, and how it stands relative to today. Overdue in the
  // warning colour, upcoming in muted text. Computed here rather than passed
  // through: the API already carries days_overdue for the expired case, and
  // the countdown is arithmetic on a date the row already has.
  const review = r => {
    if (!r.review_due) return `<div class="gov">${dash}</div>`;
    const days = Math.round(
      (Date.parse(r.review_due + 'T00:00:00Z') - Date.now()) / 86400000);
    const sub = r.days_overdue
      ? `<span class="gov-sub over">${r.days_overdue}d overdue</span>`
      : (days >= 0 ? `<span class="gov-sub">in ${days}d</span>` : '');
    return `<div class="gov">
      <span class="nw"${r.days_overdue ? ' style="color:var(--dstr)"' : ''}>${esc(r.review_due)}</span>
      ${sub}</div>`;
  };

  return `<h2>AI register</h2>
  <p class="lede">The AI tools actually in use, from findings in the last
  ${esc(win)}. The registry is a watchlist rather than an inventory, so a tool
  it knows about and nothing has reported is counted below rather than listed.
  A tool observed and absent from the registry is the row worth acting on, and
  is flagged as such.</p>

  <dl class="stats">
    <div><dt>${REG.tools_observed}</dt><dd>in use</dd></div>
    <div><dt style="color:var(--dstr)">${REG.observed_not_in_registry}</dt><dd>not in registry</dd></div>
    <div><dt>${REG.tools_known}</dt><dd>watched for</dd></div>
    <div><dt>${REG.known_not_observed}</dt><dd>watched for, not seen</dd></div>
  </dl>

  ${!REG.governance_configured ? `<p class="lede">No governance file is
  configured, so status falls back to the registry's own flag and every tool
  reads as not approved. That is a shipped default rather than a decision
  anyone made. Set <span class="mono">GOVERNANCE_PATH</span> to record
  approvals, owners and review dates.</p>` : ''}

  ${((REG.governance_unmatched || []).length
     || (REG.exceptions_unmatched || []).length) ? `<div class="note">
    ${(() => {
      const d = REG.governance_unmatched || [], x = REG.exceptions_unmatched || [];
      const names = [...new Set([...d, ...x])];
      const what = d.length && x.length ? 'records' : (d.length ? 'decision' : 'exception');
      const n = d.length + x.length;
      return `<b>${n === 1 ? `1 ${what} names a tool` : `${n} ${what}${what === 'records' ? '' : 's'} name tools`}
        the registry does not know:</b>
        ${names.map(t => `<span class="pill p-warn">${esc(t)}</span>`).join('')}`;
    })()}
    <div style="margin-top:6px">That is fine for a deliberate record about
    something not yet registered, and it is also what a typo looks like. Either
    way it is not being applied to anything, so it is shown rather than
    dropped.</div>
  </div>` : ''}

  <p class="lede">One card per tool: what it is, how it is used, and what was
  decided about it. First seen is in the CSV rather than here, because inside a
  lookback window it is usually the same as last seen and Overview already
  answers what is new this week.
  <a href="/api/register?fmt=csv" style="color:var(--pri)">Download CSV</a></p>

  ${rows.length ? `<div class="cards">
  ${rows.map(r => `<div class="card">
    <div class="card-top">
      <div style="min-width:0">
        <div class="card-name">${esc(r.name)}</div>
        <div class="card-meta">${r.vendor ? esc(r.vendor) + ' · ' : ''}${esc(r.id)}</div>
      </div>
      ${status(r)}
    </div>
    <hr>
    <dl class="card-kv">
      <dt>usage</dt><dd>${r.devices} device${r.devices === 1 ? '' : 's'},
        ${r.users} user${r.users === 1 ? '' : 's'}</dd>
      <dt>accounts</dt><dd>corp ${num(r.corporate_accounts)} ·
        personal ${r.personal_accounts
          ? `<span class="pill p-warn">${r.personal_accounts}</span>` : num(0)}</dd>
      <dt>surfaces</dt><dd>${r.surfaces.length ? esc(r.surfaces.join(', ')) : '—'}</dd>
      <dt>risk</dt><dd>${risk(r.risk_tier)}</dd>
      <dt>last seen</dt><dd>${when(r.last_seen)}</dd>
    </dl>
    <hr>
    <div class="card-section">governance</div>
    <dl class="card-kv">
      <dt>owner</dt><dd>${r.owner ? esc(r.owner) : dash}</dd>
      <dt>review</dt><dd>${review(r)}</dd>
    </dl>
    ${exceptionBlock(r)}
  </div>`).join('')}
  </div>` : `<p class="lede">No AI tools observed in the last ${esc(win)}.
  That is a real answer for a small estate, and it is also what a fleet with no
  collectors deployed looks like: check Setup before reading it as a clean
  one.</p>`}`;
}

async function paste() {
  if (!PG) {
    try { PG = await (await fetch('/api/paste-guard')).json(); }
    catch (e) { return `<h2>Paste guard</h2><div class="note">Could not read
      paste guard activity: ${esc(String(e.message || e))}</div>`; }
  }
  const rows = (PG.rows || []).filter(r => match(r.tool));

  return `<h2>Paste guard</h2>
  <p class="lede">What the paste guard stopped, on which tool, and how often.
  Metadata only: the guard inspects clipboard content on the device and reports
  detector identifiers, so what was nearly pasted is not here and is not stored
  anywhere. A warning heeded is the guard working; an override is somebody who
  was shown the detector by name and pasted anyway, which is the row worth
  following up.</p>

  <dl class="stats">
    <div><dt${(PG.guard_devices || 0) ? '' : ' style="color:var(--dstr)"'}>${PG.guard_devices || 0}</dt>
      <dd>devices running the guard</dd></div>
    <div><dt>${PG.warned || 0}</dt><dd>warned</dd></div>
    <div><dt style="color:var(--dstr)">${PG.overridden || 0}</dt><dd>overridden</dd></div>
    <div><dt>${PG.blocked || 0}</dt><dd>blocked</dd></div>
    <div><dt>${PG.devices || 0}</dt><dd>devices with an event</dd></div>
  </dl>

  ${(PG.guard_versions || []).length ? `<p class="lede">Running
    ${PG.guard_versions.map(v => `<span class="pill p-mut">${esc(v.version)} on ${v.devices}</span>`).join('')}
    in ${PG.guard_modes.map(m => `<span class="pill ${m.mode === 'block' ? 'p-ok' : 'p-acc'}">${esc(m.mode)} on ${m.devices}</span>`).join('')}.
    A fleet split across versions is a rollout that stalled, and a device in
    warn mode where policy says block is a policy that is not in force. Neither
    is visible in a count of what was stopped.</p>` : ''}

  ${rows.length ? `<table>
  <tr><th>tool</th><th class="n">warned</th><th class="n">overridden</th>
  <th class="n">blocked</th><th class="n">devices</th><th>detectors</th>
  <th>last seen</th></tr>
  ${rows.map(r => `<tr>
    <td>${esc(r.tool)}</td>
    <td class="n">${num(r.warned)}</td>
    <td class="n">${r.overridden
      ? `<span class="pill p-warn">${r.overridden}</span>` : num(0)}</td>
    <td class="n">${num(r.blocked)}</td>
    <td class="n">${num(r.devices)}</td>
    <td>${r.detectors.map(d => `<span class="pill p-mut">${esc(d)}</span>`).join('')}</td>
    <td class="nowrap">${when(r.last_seen)}</td>
  </tr>`).join('')}
  </table>` : `<p class="lede">No paste events in this window. That is a real
  answer, and it is also what an estate with the extension not deployed looks
  like: check Setup before reading it as nobody having tried.</p>`}`;
}

async function iso() {
  if (!EV) {
    try { EV = await (await fetch('/api/evidence')).json(); }
    catch (e) { return `<h2>ISO/IEC 42001 evidence</h2><div class="note">Could
      not build the evidence index: ${esc(String(e.message || e))}</div>`; }
  }
  const e = EV;
  const n = v => `<b>${v}</b>`;

  // An index, not a report. Each row says what area of an AI management system
  // this supports, what the platform can currently say about it, and where the
  // underlying evidence lives. Deliberately not a card per theme: that would
  // re-render every source view and turn this into a second Overview, when the
  // value here is knowing where to look.
  //
  // No clause numbers. A mapping asserted without validation implies an
  // authority this project does not have, and reproducing the standard's own
  // wording is not ours to do.
  const rows = [
    ['Inventory and usage',
     `${n(e.tools_observed)} tools in use, ${n(e.tools_watched_for)} watched for`
     + (e.tools_not_in_registry
        ? `, ${n(e.tools_not_in_registry)} not in the registry` : ''),
     'register', 'AI register'],

    ['Governance',
     `${n(e.decisions_recorded)} decisions recorded, `
     + `${n(e.tools_without_decision)} tools without one`
     + (e.approvals_expired ? `, ${n(e.approvals_expired)} approval expired` : '')
     + (e.active_exceptions ? `, ${n(e.active_exceptions)} active exception` : ''),
     'register', 'AI register'],

    ['Monitoring coverage',
     `${n(e.sources_reporting)} of ${n(e.sources_known)} expected sources reporting`,
     'setup', 'Setup'],

    ['Account governance',
     `${n(e.personal_accounts)} personal accounts across `
     + `${n(e.personal_account_tools)} tools`,
     'personal', 'Personal accounts'],

    ['Data protection',
     `${n(e.paste_events)} paste events, ${n(e.paste_overridden)} overridden. `
     + `Inspected content is not retained`,
     'paste', 'Paste guard'],

    ['Integrations',
     `${n(e.mcp_servers)} MCP servers observed`,
     'mcp', 'MCP servers'],

    ['Third parties',
     `${n(e.providers)} providers observed across the tools in use`,
     'register', 'AI register'],

    ['Evidence',
     `Snapshot for the window ${esc((e.window||{}).from||'').slice(0,10)} to `
     + `${esc((e.window||{}).to||'').slice(0,10)}, checksummed`,
     null, 'This page'],
  ];

  // Review inputs are the only separate block, because they are things
  // somebody may need to act on rather than a category of evidence. Framed as
  // inputs to a human review, not as conclusions: the platform can say a tool
  // has no decision, and cannot say whether that matters.
  const inputs = [
    [e.approvals_expired, `${e.approvals_expired} approval${e.approvals_expired === 1 ? '' : 's'} expired`, 'register'],
    [e.tools_without_decision, `${e.tools_without_decision} observed tool${e.tools_without_decision === 1 ? '' : 's'} with no governance decision`, 'register'],
    [e.tools_not_in_registry, `${e.tools_not_in_registry} tool${e.tools_not_in_registry === 1 ? '' : 's'} in use and not in the registry`, 'register'],
    [e.tools_without_owner, `${e.tools_without_owner} decision${e.tools_without_owner === 1 ? '' : 's'} with no owner`, 'register'],
    [e.reviews_due_soon, `${e.reviews_due_soon} review${e.reviews_due_soon === 1 ? '' : 's'} due within ${e.reviews_due_soon_days} days`, 'register'],
    [e.personal_accounts, `${e.personal_accounts} personal account${e.personal_accounts === 1 ? '' : 's'} observed`, 'personal'],
    [Math.max(0, (e.sources_known||0) - (e.sources_reporting||0)),
     `${Math.max(0, (e.sources_known||0) - (e.sources_reporting||0))} expected source${(e.sources_known - e.sources_reporting) === 1 ? '' : 's'} not reporting`, 'setup'],
    [e.paste_overridden, `${e.paste_overridden} paste warning${e.paste_overridden === 1 ? '' : 's'} overridden`, 'paste'],
    [e.mcp_findings, `${e.mcp_findings} MCP finding${e.mcp_findings === 1 ? '' : 's'}`, 'mcp'],
  ].filter(([count]) => count > 0);

  return `<h2>ISO/IEC 42001 evidence</h2>
  <p class="lede">Evidence Shadow AI Guard can provide to support an AI
  management system. An index of what the platform can currently say and where
  each record lives, not an assessment: nothing here is a compliance score, a
  clause mapping, or a claim that a control is satisfied. The gaps are shown
  beside the totals because a gap is the more useful finding.</p>

  <table>
  <tr><th>Theme</th><th>What Shadow AI Guard can say</th><th>Evidence source</th></tr>
  ${rows.map(([theme, says, target, label]) => `<tr>
    <td>${esc(theme)}</td>
    <td style="font-family:inherit">${says}</td>
    <td>${target ? `<a href="#${target}" style="color:var(--pri)">${esc(label)}</a>`
                 : esc(label)}</td>
  </tr>`).join('')}
  </table>

  <h3 style="margin-top:26px;font-size:14px">Review inputs</h3>
  <p class="lede">Things a person may need to look at. These are inputs to a
  review rather than conclusions: the platform can say a tool has no recorded
  decision, and cannot say whether that is a problem.</p>
  ${inputs.length ? `<ul class="inputs">
    ${inputs.map(([, text, target]) =>
      `<li><a href="#${target}">${esc(text)}</a></li>`).join('')}
  </ul>` : `<p class="lede">Nothing outstanding in this window. That is a real
  answer for a small estate, and it is also what an estate with no collectors
  reporting looks like: ${e.sources_reporting} of ${e.sources_known} expected
  sources are reporting.</p>`}

  <h3 style="margin-top:26px;font-size:14px">Evidence snapshot</h3>
  <p class="lede">A checksummed statement of the counts above, for the stated
  window, with the registry and governance files identified by hash. Generated
  on demand and not stored. Not reproducible, because log retention may mean
  the same window returns less later; tamper-evident, because the manifest
  carries a digest of itself with that field omitted.
  <a href="/api/evidence?download=true" style="color:var(--pri)">Download JSON</a></p>`;
}

async function settings() {
  if (!DIAG) {
    try { DIAG = await (await fetch('/api/diagnostics')).json(); }
    catch (e) { return `<h2>Settings</h2><div class="note">Could not read
      diagnostics: ${esc(String(e.message || e))}</div>`; }
  }
  const r = DIAG.runtime, d = DIAG.deployment;
  const yn = v => v ? '<span class="pill p-ok">yes</span>'
                    : '<span class="pill p-mut">no</span>';
  const ago = t => !t ? '—' :
    Math.round(Date.now()/1000 - t) + 's ago';
  const dur = sec => sec < 3600 ? Math.round(sec/60) + 'm'
    : Math.floor(sec/3600) + 'h ' + Math.round(sec%3600/60) + 'm';

  return `<h2>Settings and diagnostics</h2>
  <p class="lede">Read only. Everything under the first four headings is
  something the portal verified about itself. Anything it was merely told is
  grouped at the bottom and labelled, so a value nobody updated cannot be
  mistaken for one something checked.</p>

  <div class="wcard" style="margin-bottom:10px"><h3>Application</h3>
  <dl class="kv">
    <dt>Version</dt><dd>${esc(r.version)}</dd>
    <dt>Uptime</dt><dd>${dur(r.uptime_seconds)}</dd>
  </dl></div>

  <div class="wcard" style="margin-bottom:10px"><h3>Loki</h3>
  <dl class="kv">
    <dt>Configured</dt><dd>${yn(r.loki_configured)}</dd>
    <dt>Last successful read</dt><dd>${ago(r.loki_last_success)}</dd>
    ${r.loki_last_error ? `<dt>Last error</dt><dd style="color:var(--dstr)">${esc(r.loki_last_error)}</dd>` : ''}
    <dt>Lookback window</dt><dd>${esc(r.lookback_hours)}h</dd>
    <dt>Cache TTL</dt><dd>${esc(r.cache_ttl_seconds)}s</dd>
  </dl></div>

  <div class="wcard" style="margin-bottom:10px"><h3>Registry</h3>
  <dl class="kv">
    <dt>Loaded</dt><dd>${yn(r.registry_loaded)}</dd>
    <dt>Tools</dt><dd>${esc(r.registry_tools)}</dd>
    <dt>Path</dt><dd>${esc(r.registry_path)}</dd>
    ${r.registry_error ? `<dt>Error</dt><dd style="color:var(--dstr)">${esc(r.registry_error)}</dd>` : ''}
  </dl>
  ${!r.registry_loaded ? `<p class="src-note">Without it, tool names are not
  normalised, so chatgpt.com and chatgpt stay two different tools.</p>` : ''}
  </div>

  <div class="wcard" style="margin-bottom:10px"><h3>Access and embedding</h3>
  <dl class="kv">
    <dt>Auth mode</dt><dd>${esc(r.auth_mode)}</dd>
    <dt>Identity map</dt><dd>${yn(r.identity_map_configured)}</dd>
    <dt>Grafana</dt><dd>${yn(r.grafana_configured)}</dd>
    <dt>Overview widgets</dt><dd>${(r.overview_widgets||[]).length}</dd>
  </dl>
  <p class="src-note">Credential values are never shown here, only whether one
  is configured.</p></div>

  <div class="wcard" style="border-style:dashed"><h3>Provided by deployment configuration</h3>
  <dl class="kv">
    <dt>Chart version</dt><dd>${esc(d.chart_version) || '—'}</dd>
    <dt>Release</dt><dd>${esc(d.release) || '—'}</dd>
    <dt>Namespace</dt><dd>${esc(d.namespace) || '—'}</dd>
  </dl>
  <p class="src-note">The portal cannot verify any of this. It is passed in as
  environment variables by whatever deployed it, and shown because it helps
  when raising an issue, not because it was observed. A deployment that does
  not set it leaves it empty rather than guessing.</p></div>`;
}

function setup() {
  if (loadError) return `<h2>Setup</h2>
    <div class="note">Could not read findings: ${esc(loadError)}</div>
    <p class="lede">The portal reads from Loki; it does not collect anything
    itself. Set <code>LOKI_URL</code> to the same Loki the receiver writes to.</p>`;
  if (!S) return '<h2>Setup</h2><p class="lede">No status available.</p>';

  const g = S.groups || [];
  return `<h2>Setup</h2>
  <p class="lede">What is reporting, derived from findings rather than from
  configuration being present. A source that has never reported is either not
  set up or genuinely has nothing to say, and those look identical from a
  dashboard — so they are listed rather than counted.</p>

  <dl class="stats">
    ${g.map(x => `<div><dt>${x.reporting}/${x.total}</dt><dd>${esc(x.group)}</dd></div>`).join('')}
  </dl>

  ${S.reporting === 0 ? `<div class="note">Nothing has reported in the last
  ${esc(S.hours)} hours. If you have just deployed the receiver that is
  expected: roll one collector or enable one scanner and it appears here.</div>` : ''}

  ${g.map(x => `
    <h2 style="margin-top:22px;font-size:16px">${esc(x.group)}
      <span class="pill ${x.reporting ? 'p-ok' : 'p-mut'}">${x.reporting} of ${x.total}</span></h2>
    <table><tr><th>source</th><th>status</th><th>findings</th><th>devices</th><th>last seen</th></tr>
    ${x.sources.map(r => `<tr>
      <td>${esc(r.label)}<br><span class="mono" style="font-size:11px;color:var(--mut)">${esc(r.source)}</span>
        ${r.reporting ? '' : `<div style="margin-top:6px;font-family:inherit;font-size:12px;color:var(--mut);max-width:52ch;line-height:1.5">
          ${esc(r.needs || '')}
          <br><span class="mono" style="font-size:11px">${esc(r.doc)}</span></div>`}
        ${r.artifact && CFG.managed && CFG.managed.artifacts_ready ? `<div style="margin-top:6px">
          <button class="mini" data-act="artifact" data-key="${esc(r.artifact)}">Download pre-configured script</button></div>` : ''}</td>
      <td>${r.reporting ? '<span class="pill p-ok">reporting</span>'
                        : '<span class="pill p-mut">not reporting</span>'}</td>
      <td>${r.findings || '—'}</td><td>${r.devices || '—'}</td>
      <td>${esc((r.last_seen || '—').replace('T',' ').replace('Z',''))}</td>
    </tr>`).join('')}</table>`).join('')}

  <h2 style="margin-top:28px;font-size:16px">Attaching people to devices
    <span class="pill ${CFG.identity_map_configured ? 'p-ok' : 'p-mut'}">${
      CFG.identity_map_configured ? 'map configured' : 'no map'}</span></h2>
  <p class="lede">This platform does not resolve identity itself. Endpoint
  findings carry a device and a local username, and that username is a hint
  rather than a key: it is firstname.lastname on one enrolment, a local account
  on another, and whatever the person chose on an unmanaged machine. Cloud
  findings carry an identity and no device. The two meet at the person, and
  that join is a lookup you own against whatever you run — an MDM, an RMM, a
  CMDB, or a spreadsheet.</p>
  ${CFG.identity_map_configured ? `<p class="lede">A map is configured.
  Devices it does not cover stay unattributed, which is a legitimate answer.</p>`
  : `<ol class="lede" style="padding-left:18px;line-height:2">
    <li><a href="/api/suggest-identities?fmt=csv" style="color:var(--pri)">Download
      a proposed map</a>. It matches local usernames against the identities your
      cloud sources report, and lists everything it could not match for you to
      fill in.</li>
    <li>Review every line. These are string matches, not authoritative: a wrong
      line puts the wrong person's name against someone else's activity.</li>
    <li>Save it outside this repository. It associates named people with
      machines, so it is personal data and belongs wherever you keep deployment
      configuration, not in git.</li>
    <li>Set <code>IDENTITY_MAP</code> to its path. In Docker, mount it read-only;
      in Kubernetes, a ConfigMap or Secret mounted as a file.</li>
  </ol>
  <p class="lede">The file is re-read whenever the graph rebuilds, so an edit
  takes effect within ${esc(CFG.cache_ttl_seconds || 300)} seconds without a
  restart. Devices with no mapping stay unattributed and everything else keeps
  working.</p>`}

  ${(S.unexpected || []).length ? `<h2 style="margin-top:26px;font-size:16px">Unrecognised sources</h2>
  <p class="lede">Reporting, but not a source this build knows about. Either
  something newer than this portal, or a source string that does not match what
  the scanners emit — both worth chasing rather than ignoring.</p>
  <table><tr><th>source</th></tr>${S.unexpected.map(u =>
    `<tr><td>${esc(u)}</td></tr>`).join('')}</table>` : ''}`;
}

// A way out to the real Grafana. The embedded frames are kiosk mode with a
// fixed window, which is right for a glance and wrong the moment somebody
// wants to change the range or drill into a series. The URL has to be
// configured for the embed to work at all, so linking to it costs nothing.
const openIn = base => `<p class="lede">Embedded below in kiosk mode with a
  fixed window. To change the range, drill in, or edit anything, open
  <a href="${esc(base)}" target="_blank" rel="noopener noreferrer"
     style="color:var(--pri)">${esc(base)}</a> directly.</p>`;

function dashboard() {
  if (!CFG.grafana_url) return `<h2>Grafana</h2>
    <div class="note">No Grafana configured. Set <code>GRAFANA_URL</code> to a
    Grafana that permits embedding, then either <code>GRAFANA_PANELS</code> as
    <code>dashboardUid:panelId:Title</code> entries separated by commas, or
    <code>GRAFANA_DASHBOARD_UID</code> to embed a whole dashboard in one frame.
    <br><br>
    Grafana refuses to be framed by default. It needs
    <code>allow_embedding = true</code> (<code>GF_SECURITY_ALLOW_EMBEDDING</code>),
    a cookie <code>SameSite</code> setting that permits the frame, and a decision
    about how the frame authenticates — anonymous access on a locked-down
    Grafana, or an auth proxy. Those are yours to make; the portal cannot make
    them for you.</div>
    <p class="lede">Nothing else here depends on this. Grafana is better at
    graphs and this is better at relationships, so charts are enrichment rather
    than a dependency.</p>`;

  const base = CFG.grafana_url, panels = CFG.grafana_panels || [];
  const q = 'orgId=1&theme=dark&from=now-7d&to=now&kiosk';

  if (!panels.length && CFG.grafana_dashboard_uid) {
    return `<h2>Grafana</h2>
      ${openIn(base)}
      <p class="lede">Embedded from ${esc(base)}. Set
      <code>GRAFANA_PANELS</code> to pick individual panels instead of the
      whole dashboard.</p>
      <iframe src="${esc(base)}/d/${esc(CFG.grafana_dashboard_uid)}/?${q}"
        style="width:100%;height:78vh;border:1px solid var(--bd);border-radius:10px;background:var(--sf)"
        title="Grafana dashboard"></iframe>`;
  }

  if (!panels.length) return `<h2>Dashboard</h2>
    <div class="note">Grafana is configured but nothing is selected to show.
    Set <code>GRAFANA_PANELS</code> or <code>GRAFANA_DASHBOARD_UID</code>.</div>`;

  const bad = panels.filter(p => p.error);
  return `<h2>Grafana</h2>
  ${openIn(base)}
  <p class="lede">Panels embedded from ${esc(base)}. If a frame stays blank,
  Grafana is refusing to be framed rather than the panel being wrong — check
  <code>allow_embedding</code> and the cookie <code>SameSite</code> setting.</p>
  ${bad.length ? `<div class="note">${bad.map(b => esc(b.error)).join('<br>')}</div>` : ''}
  <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))">
  ${panels.filter(p => !p.error).map(p => `
    <iframe src="${esc(base)}/d-solo/${esc(p.uid)}/?${q}&panelId=${esc(p.panel_id)}"
      style="width:100%;height:300px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)"
      title="${esc(p.title || 'Grafana panel')}"></iframe>`).join('')}
  </div>`;
}

// ------------------------------------------------------------- managed --
// These two views call the receiver's admin API through the portal. The
// admin token is entered once per session, held in the ADMIN variable, and
// forwarded per request; forgetting it (or a 401) drops back to the gate.

function managedGate(title) {
  if (!CFG.managed || !CFG.managed.enabled) return `<h2>${esc(title)}</h2>
  <p class="lede">Managed mode is not configured. Set <code>RECEIVER_URL</code>
  on the portal (and <code>MANAGED_MODE=true</code> on the receiver) to manage
  enrollment tokens and devices from here. The classic file-and-token flow
  keeps working without it.</p>`;
  if (!ADMIN) return `<h2>${esc(title)}</h2>
  <p class="lede">This view calls the receiver's admin API. Enter the
  receiver's admin token: it is held in this tab's memory only, sent with
  each request, and never stored — the portal keeps holding no credentials.</p>
  <input type="password" id="admin-token-input" class="mfield"
    placeholder="receiver admin token">
  <button class="mini" data-act="admin-save">Unlock</button>`;
  return '';
}

const adminBar = () => `<div class="adminbar">admin token held in memory —
  <button class="mini" data-act="admin-forget">forget it</button></div>`;

async function mfetch(path, opts) {
  return fetch(path, {...(opts || {}), headers: {
    'X-Admin-Token': ADMIN, 'Content-Type': 'application/json',
    ...((opts || {}).headers || {})}});
}

async function managedError(r, title) {
  let d = r.statusText;
  try { d = (await r.json()).detail || d; } catch (e) { /* keep statusText */ }
  if (r.status === 401) ADMIN = '';
  return `<h2>${esc(title)}</h2><div class="note">${esc(String(d))}</div>`
    + (r.status === 401 ? `<p class="lede">The admin token was refused; enter
      it again from the view menu.</p>` : '');
}

async function fleet() {
  const gate = managedGate('Fleet'); if (gate) return gate;
  if (!FLEET) {
    const r = await mfetch('/api/fleet');
    if (!r.ok) return managedError(r, 'Fleet');
    FLEET = await r.json();
  }
  const ds = FLEET.devices || [];
  return `<h2>Fleet</h2>
  <p class="lede">Enrolled devices, from the receiver's registry — who holds a
  credential, rather than who has reported lately (the Devices view derives
  that from findings). Revoking stops that one credential on its next
  request and touches nothing else. A device that re-enrolled (a reimaged
  laptop, a scanner that enrolls every run — or a serial someone else
  enrolled while it was silent) keeps its row and says so under "enrolled".</p>
  ${adminBar()}
  ${ds.length ? `<table><tr><th>device</th><th>platform</th><th>serial</th>
    <th>enrolled</th><th>last seen</th><th>agent</th><th>status</th><th></th></tr>
  ${ds.map(d => `<tr>
    <td>${esc(d.hostname || d.serial)}<br><span class="mono" style="font-size:11px;color:var(--mut)">${esc(d.id)}</span></td>
    <td>${esc(d.platform)}</td><td class="mono">${esc(d.serial)}</td>
    <td>${when(d.enrolled_at)}${d.reenrolled_at ? `<br><span style="font-size:11px;color:var(--mut)">re-enrolled ×${esc(String((d.enrollments || 1) - 1))}, last ${when(d.reenrolled_at)}</span>` : ''}</td><td>${when(d.last_seen)}</td>
    <td>${esc(d.agent_version || '—')}</td>
    <td>${d.revoked_at ? '<span class="pill p-mut">revoked</span>'
                       : '<span class="pill p-ok">active</span>'}</td>
    <td>${d.revoked_at ? '' : `<button class="mini" data-act="revoke-device" data-key="${esc(d.id)}">revoke</button>`}</td>
  </tr>`).join('')}</table>`
  : `<div class="note">No devices enrolled yet. Mint an enrollment token in
    the Enrollment tokens view, or download a pre-configured collector from
    Setup, and machines appear here as they enroll.</div>`}`;
}

async function tokens() {
  const gate = managedGate('Enrollment tokens'); if (gate) return gate;
  if (!TOKENS) {
    const r = await mfetch('/api/enrollment-tokens');
    if (!r.ok) return managedError(r, 'Enrollment tokens');
    TOKENS = await r.json();
  }
  const ts = TOKENS.tokens || [];
  const nowIso = new Date().toISOString();
  const state = t => t.revoked_at ? ['revoked', 'p-mut']
    : t.expires_at <= nowIso ? ['expired', 'p-mut'] : ['active', 'p-ok'];
  return `<h2>Enrollment tokens</h2>
  <p class="lede">An enrollment token goes where the shared token goes today —
  a Jamf parameter, the Intune script, an RMM variable — and machines exchange
  it once for their own credential. It can create auditable device records and
  nothing else, which is why a long life inside an MDM artifact is
  acceptable; revoke it here the moment it is not.</p>
  ${adminBar()}
  ${MINTED ? (MINTED.error
    ? `<div class="note">${esc(MINTED.error)}
       <button class="mini" data-act="dismiss-minted">dismiss</button></div>`
    : `<div class="tokpane"><strong>Token ${esc(MINTED.id)} minted.</strong>
       This is the only time it is shown — the receiver stores a hash.
       <br><code>${esc(MINTED.token)}</code><br>
       <button class="mini" data-act="copy" data-copy="${esc(MINTED.token)}">copy</button>
       <button class="mini" data-act="dismiss-minted">done, it is saved</button>
       </div>`) : ''}
  <div style="margin:10px 0 16px">
    <input id="mint-note" class="mfield" placeholder="note, e.g. macOS Jamf rollout">
    <input id="mint-ttl" class="mfield" style="min-width:90px" value="180" title="days until expiry">
    <button class="mini" data-act="mint">Mint token</button>
  </div>
  ${ts.length ? `<table><tr><th>id</th><th>note</th><th>created</th><th>expires</th><th>status</th><th></th></tr>
  ${ts.map(t => { const [lbl, cls] = state(t); return `<tr>
    <td class="mono">${esc(t.id)}</td><td>${esc(t.note || '—')}</td>
    <td>${when(t.created_at)}</td><td>${when(t.expires_at)}</td>
    <td><span class="pill ${cls}">${lbl}</span></td>
    <td>${lbl === 'active' ? `<button class="mini" data-act="revoke-token" data-key="${esc(t.id)}">revoke</button>` : ''}</td>
  </tr>`; }).join('')}</table>` : '<div class="note">No enrollment tokens yet.</div>'}`;
}

async function managedAction(act, el) {
  if (act === 'admin-save') {
    const v = document.getElementById('admin-token-input');
    ADMIN = ((v && v.value) || '').trim();
    FLEET = null; TOKENS = null; render(); return;
  }
  if (act === 'admin-forget') {
    ADMIN = ''; FLEET = null; TOKENS = null; MINTED = null; render(); return;
  }
  if (act === 'dismiss-minted') { MINTED = null; render(); return; }
  if (act === 'copy') {
    try { await navigator.clipboard.writeText(el.getAttribute('data-copy') || '');
          el.textContent = 'copied'; } catch (e) { /* clipboard denied */ }
    return;
  }
  if (!ADMIN) {
    alert('Enter the receiver admin token first — Managed section, either view.');
    return;
  }
  if (act === 'mint') {
    const note = (document.getElementById('mint-note')?.value || '').trim();
    const ttl = parseInt(document.getElementById('mint-ttl')?.value || '180', 10) || 180;
    const r = await mfetch('/api/enrollment-tokens',
      {method: 'POST', body: JSON.stringify({note, ttl_days: ttl})});
    if (r.ok) { MINTED = await r.json(); TOKENS = null; }
    else {
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      if (r.status === 401) ADMIN = '';
      MINTED = {error: String(d)};
    }
    render(); return;
  }
  if (act === 'revoke-token' || act === 'revoke-device') {
    const id = el.getAttribute('data-key');
    const what = act === 'revoke-token' ? 'enrollment token' : 'device credential';
    if (!confirm('Revoke ' + what + ' ' + id + '? This cannot be undone; a '
                 + 'revoked device re-enrolls with a valid enrollment token.')) return;
    const path = act === 'revoke-token'
      ? '/api/enrollment-tokens/' + encodeURIComponent(id) + '/revoke'
      : '/api/devices/' + encodeURIComponent(id) + '/revoke';
    const r = await mfetch(path, {method: 'POST'});
    if (!r.ok) {
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      if (r.status === 401) ADMIN = '';
      alert('Revoke failed: ' + d);
    }
    FLEET = null; TOKENS = null; render(); return;
  }
  if (act === 'artifact') {
    const kind = el.getAttribute('data-key');
    const r = await mfetch('/api/artifacts/' + encodeURIComponent(kind), {method: 'POST'});
    if (!r.ok) {
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      if (r.status === 401) ADMIN = '';
      alert('Could not generate the artifact: ' + d);
      return;
    }
    // Each artifact mints its own enrollment token, so the tokens list is
    // stale the moment this succeeds.
    TOKENS = null;
    const blob = await r.blob();
    const m = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (m && m[1]) || 'ai-guard-collector';
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
}

function drawNav() {
  const n = document.getElementById('nav');
  n.innerHTML = NAV.map(sec =>
    (sec.grp ? `<div class="grp">${sec.grp}</div>` : '') +
    sec.items.map(([id, lbl]) => {
      const c = id === 'personal' ? (G.personal_accounts||[]).length : null;
      return `<button data-v="${id}" class="${view===id?'on':''}">${lbl}` +
             (c ? `<span class="count">${c}</span>` : '') + `</button>`;
    }).join('')
  ).join('');
  n.querySelectorAll('button').forEach(b => b.onclick = () => {
    view = b.dataset.v; detail = null;
    // Replace rather than push: clicking through the nav should not fill the
    // back button with every tab you glanced at.
    history.replaceState(null, '', '#' + view);
    drawNav(); render();
  });
  const fv = document.getElementById('footver');
  if (fv && CFG.version) fv.textContent = 'v' + CFG.version;
}

async function render() {
  drawNav();
  if (detail) {
    const D = {device: deviceDetail, tool: toolDetail, mcp: mcpDetail};
    app.innerHTML = D[detail[0]](detail[1]);
    return;
  }
  // settings reads a second endpoint, so it is the one async view.
  // settings and register each read a second endpoint, so they are async.
  if (view === 'settings') { app.innerHTML = await settings(); return; }
  if (view === 'register') { app.innerHTML = await register(); return; }
  if (view === 'paste') { app.innerHTML = await paste(); return; }
  if (view === 'iso') { app.innerHTML = await iso(); return; }
  if (view === 'fleet') { app.innerHTML = await fleet(); return; }
  if (view === 'tokens') { app.innerHTML = await tokens(); return; }
  app.innerHTML = ({setup, overview, devices, people, tools, coverage,
                    dashboard, personal, mcp})[view]();
}
function open_(kind, key) { detail = kind ? [kind, key] : null; render(); window.scrollTo(0,0); }

// One delegated listener rather than an onclick per row. The handlers used to
// be inline, which put a finding's own text inside executable script: a device
// name containing an apostrophe closed the JS string and ran what followed,
// and the only thing standing between a poisoned finding and code in the
// portal's origin was an escape function that did not cover the apostrophe.
//
// A data attribute cannot become code however it is escaped, which is the
// point: the value is read back as a string rather than parsed as part of a
// program. Delegation also means rows rendered after this runs are covered,
// with no listener to attach per render.
app.addEventListener('click', e => {
  const el = e.target.closest('[data-open]');
  if (!el) return;
  const kind = el.getAttribute('data-open');
  open_(kind || null, el.getAttribute('data-key'));
});
// Managed actions, same delegation for the same reason. A separate listener
// rather than branches in the one above, because data-open is navigation and
// data-act is a side effect, and a row carrying both should do both.
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) managedAction(el.getAttribute('data-act'), el);
});
// Someone editing the fragment, or arriving on a link to a view.
window.addEventListener('hashchange', () => {
  const h = fromHash();
  if (h !== view) { view = h; detail = null; drawNav(); render(); }
});
q.oninput = e => { filter = e.target.value.toLowerCase(); detail = null; render(); };
document.getElementById('refresh').onclick = () => load(true);
load();
</script>
