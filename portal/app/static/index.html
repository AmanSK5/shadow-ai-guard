<!doctype html>
<meta charset="utf-8">
<title>ai-guard portal</title>
<style>
:root{--bg:oklch(.16 .012 250);--fg:oklch(.93 .008 250);--sf:oklch(.2 .014 250);
--sf2:oklch(.24 .016 250);--pri:oklch(.8 .17 155);--acc:oklch(.72 .13 215);
--warn:oklch(.79 .15 78);--dstr:oklch(.63 .21 25);--mut:oklch(.68 .018 250);
--bd:oklch(.3 .016 250)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{border-right:1px solid var(--bd);background:var(--sf);padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
aside .brand{padding:2px 18px 2px}
aside .brand img{display:block;width:178px;height:auto}
aside nav{flex:1}
aside .grp{margin:18px 0 8px;padding:14px 18px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--acc);border-top:2px solid var(--bd)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:7px 18px;border-left:2px solid transparent}
nav button:hover{color:var(--fg);background:color-mix(in oklch,var(--fg) 4%,transparent)}
nav button.on{color:var(--pri);border-left-color:var(--pri);background:color-mix(in oklch,var(--pri) 10%,transparent)}
nav .count{float:right;font-family:ui-monospace,monospace;font-size:11px;opacity:.7}
.foot{padding:14px 18px 2px;border-top:1px solid var(--bd);margin-top:14px;font-size:11px;line-height:1.7;color:var(--mut)}
.foot a{color:var(--mut);text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover{color:var(--pri);border-bottom-color:color-mix(in oklch,var(--pri) 40%,transparent)}
.topbar{display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5;max-width:1440px;margin:0 auto}
/* Centred, and the topbar carries the same cap and margin. Left-aligned at
   1180 the topbar border ran to the window edge while the content stopped
   520px short of it on a 1920 screen, which read as a broken layout rather
   than a margin. Removing the cap instead is worse: table{width:100%} then
   spreads five columns over 2292px on a 2560 screen and puts last seen
   1873px from the start of the row, for no gain, because the widest cell is
   already capped at 52ch. */
main{padding:22px 24px;max-width:1440px;margin:0 auto}
/* Flex rather than a fixed 12 column grid. The widget list is a deployment
   choice, so most counts do not divide evenly into a rigid grid and the last
   row ends up with a hole in it. Growing the items instead means any number
   fills its row. */
.grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.grid>*{flex:1 1 auto;min-width:0}
.w6{flex-basis:46%}.w4{flex-basis:30%}.w12{flex-basis:100%}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.w6,.w4{flex-basis:100%}}
.wcard{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.wcard h3{margin:0 0 8px;font-size:12px;font-family:ui-monospace,monospace;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-family:ui-monospace,monospace;font-size:12px}
.bar span:first-child{width:120px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:9px;background:var(--pri);border-radius:2px;min-width:2px}
.bar i.alt{background:var(--acc)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:5px 16px;margin:0}
.kv dt{color:var(--mut);font-size:12px}
.kv dd{margin:0;font-family:ui-monospace,monospace;font-size:12px}
.src-note{color:var(--mut);font-size:11px;font-style:italic;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stats div{background:var(--sf);padding:14px 16px}
.stats dt{font:600 22px/1.2 ui-monospace,monospace;color:var(--pri)}
.stats dd{margin:4px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:color-mix(in oklch,var(--pri) 50%,transparent)}
.card h3{margin:0 0 6px;font-size:15px;font-family:ui-monospace,monospace}
.card .sub{color:var(--mut);font-size:12px}
.pill{display:inline-block;white-space:nowrap;border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-size:11px;margin:2px 4px 2px 0;font-family:ui-monospace,monospace}
.nw{white-space:nowrap}
.p-warn{color:var(--dstr)} .p-ok{color:var(--pri)} .p-mut{color:var(--mut)} .p-acc{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;color:var(--mut);border-bottom:1px solid var(--bd);padding:6px 10px 6px 0;font-size:12px}
td{padding:7px 10px 7px 0;border-bottom:1px solid color-mix(in oklch,var(--bd) 45%,transparent);font-family:ui-monospace,monospace;font-size:12px}
/* The register, as cards.
   -------------------------------------------------------------------------
   Four table attempts failed, and the last measurement said why: the content
   area is 1125px, not the ~1392px every one of those attempts was sized
   against. Nine columns needed 1077px and fitted by 48px, which is not
   fitting, it is scraping. Reducing to eight would have needed 1007px and
   scraped by 118px instead.

   A register is read one tool at a time as often as it is scanned, so the
   table shape was never load-bearing. Cards drop the width problem entirely:
   auto-fill gives two per row at 1125px, one on a narrow window and three on a
   wide monitor, with no breakpoint to keep in step and no horizontal scrolling
   at any width.

   Fields that were columns are now labelled rows inside a card, which also
   removes the thing no amount of width tuning fixed: a header three columns
   away from the value it describes. */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.card{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;min-width:0}
/* Name and decision on one line, because those are the two things someone
   scanning is looking for. */
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.card-name{font-size:15px;font-weight:600}
.card-meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);
           margin-top:2px;overflow-wrap:anywhere}
.card hr{border:0;border-top:1px solid color-mix(in oklch,var(--bd) 55%,transparent);margin:12px 0}
/* A quiet label rather than another box. The lower block is organisational
   record rather than observation, and the two were reading as one list. */
.card-section{font-size:11px;color:var(--mut);text-transform:uppercase;
              letter-spacing:.08em;margin:0 0 8px}
/* An exception. Its own block rather than a row in the key/value list, because
   it has an id, a scope, a date and a reason, and flattening that into one
   line loses the scope, which is the part that says who it applies to. */
.exc{font-family:ui-monospace,monospace;font-size:11px;margin-bottom:6px;
     display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.exc-scope{color:var(--acc)}
.exc-when{color:var(--mut)}
.exc-why{flex-basis:100%;color:var(--mut);margin-top:1px}
/* Expired, and still shown. Quieter, because it is history rather than
   something currently applying, and struck through would be too loud for a
   record somebody may still want to read. */
.exc-old{opacity:.55}
.exc-old .exc-when{color:var(--dstr)}
/* Label and value, with the label beside its own value rather than three
   columns away from it. */
.card-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;
         font-family:ui-monospace,monospace}
.card-kv dt{color:var(--mut);white-space:nowrap}
.card-kv dd{margin:0;overflow-wrap:anywhere}
.card-kv dd .pill{margin:0 4px 0 0}

.gov{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.gov .pill{margin:0}
.gov-sub{font-size:11px;color:var(--mut);white-space:nowrap}
.gov-sub.over{color:var(--dstr)}
.gov-owner{white-space:nowrap}
/* No border, no fill. Absence of governance, not a state with equal weight to
   approved or reviewing. */
.inputs{margin:0 0 18px;padding-left:20px;font-size:13px;line-height:1.9}
.inputs a{color:var(--warn)}
.none{color:color-mix(in oklch,var(--mut) 70%,transparent);font-family:ui-monospace,monospace;
      font-size:11px;white-space:nowrap}
/* A zero is the absence of something and should not compete with a real
   count. Without this a row of zeros is as loud as a row of findings. */
td.n .z{color:color-mix(in oklch,var(--mut) 55%,transparent)}
/* The counts split into two questions: how widely is this used, and what is
   it signed into. A rule rather than a gap, because a gap in a dense table
   reads as a missing column. */
th.grp,td.grp{border-left:1px solid color-mix(in oklch,var(--bd) 60%,transparent);padding-left:14px}
.note{background:color-mix(in oklch,var(--warn) 10%,transparent);border:1px solid color-mix(in oklch,var(--warn) 40%,transparent);color:var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:13px}
.back{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;margin-bottom:14px}
h2{font-size:19px;margin:0 0 4px}
.lede{color:var(--mut);font-size:13px;margin:0 0 16px}
/* No max-width here. main is already capped and centred, so a second
   constraint on the prose only makes it stop short of the table it
   introduces, which reads as a broken line rather than a measure. */
input,select{background:var(--sf2);border:1px solid var(--bd);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;min-width:220px}
select.mfield{min-width:160px}
/* Managed views: small action buttons, the login fields, and the one-time
   pane a minted token appears in. */
button.mini{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line,#8884);border-radius:6px;background:transparent;color:var(--pri);cursor:pointer}
button.mini:hover{border-color:var(--pri)}
.mfield{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line,#8884);border-radius:6px;background:transparent;color:inherit;min-width:260px}
.tokpane{border:1px solid var(--pri);border-radius:8px;padding:12px 14px;margin:14px 0}
.tokpane code{word-break:break-all}
</style>
<div class="shell">
  <aside>
    <div class="brand"><img src="/logo.png" alt="Shadow AI Guard"></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="mono" id="footver">v</div>
      <div>by <a href="https://amansk.co" target="_blank" rel="noopener">Aman Karir</a></div>
      <div><a href="https://github.com/AmanSK5/shadow-ai-guard" target="_blank" rel="noopener">Source and issues</a></div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <input id="q" placeholder="filter…">
      <span id="freshness" class="mono" style="font-size:11px;color:var(--mut)"></span>
      <button id="refresh" class="back" style="margin:0">refresh</button>
      <span id="who" class="mono" style="font-size:11px;color:var(--mut);margin-left:auto"></span>
      <button id="signout" class="back" style="margin:0;display:none">sign out</button>
    </div>
    <main id="app"></main>
  </div>
</div>
<script>
let G = {devices:{},identities:{},tools:{},bridges:{},unattributed:[],counts:{}};
// Views that read a second endpoint, cached until refresh clears them.
// Declared here rather than beside their views: load() clears them and let
// is not hoisted, so declaring them lower down is a TDZ error on first
// refresh.
let DIAG = null;
let REG = null;
let EV = null;
let PG = null;
let FLEET = null;
let TOKENS = null;
let SETTINGS = null;
// Governance editing: which tool's card shows the form, prefill fetched
// from the recorded decision (the row lacks the free-text reason, and an
// owner edit must not silently blank it), and the last refusal to show.
let GOVEDIT = null, GOVPRE = null, GOVERR = '';
// One-line outcome of the last Settings action ("saved", or a refusal).
let SETMSG = '';
// The wizard's second fetches: the registry watchlist and the recorded
// decisions, so the governance baseline shows what stands. Owner and
// review date survive the re-render each decision causes, or the second
// approval would silently carry an empty owner.
let REGTOOLS = null, GOVDECS = null, WIZOWNER = '', WIZREVIEW = '';
// Which log-store shape the wizard's step 2 shows, and the last result of
// each connection test, keyed by API name, so a result survives re-renders.
let WIZSTORE = 'self', TESTS = {};
// Whether the register's watchlist section is expanded. Tracked because a
// decision re-renders the view, and a <details> that snaps shut under the
// operator mid-triage would lose their place.
let WLOPEN = false;
// The Tool registry view: the custom entries listing, which entry the form
// is editing ('' = a new one, null = no form), the prefill the form renders
// from (kept across a refused save so typing survives), the last refusal,
// and whether the advanced-JSON editor is showing.
let RENTRIES = null, REDIT = null, RPRE = null, RERR = '', RADV = false;
// The discovery queue: candidates the estate observed that nobody defined.
let CAND = null;
let S = null, CFG = {}, loadError = '';
// What /api/auth said: {mode, authenticated, username, setup_needed}.
// The session itself is an HttpOnly cookie this script can never read -
// the portal's whole security story for the write path is that nothing
// credential-shaped is reachable from page script.
let AUTH = null;
// The one moment a minted token is visible. Kept until dismissed, because a
// pane that vanishes on the next click loses a credential that cannot be
// recovered.
let MINTED = null;

// The login screen replaces the whole page, so the chrome around it (nav,
// filter, refresh) goes quiet rather than sitting there doing nothing.
function chrome(on) {
  document.querySelector('.topbar').style.display = on ? '' : 'none';
  document.getElementById('nav').style.display = on ? '' : 'none';
  const so = document.getElementById('signout'), who = document.getElementById('who');
  const login = AUTH && AUTH.mode === 'login';
  so.style.display = on && login ? '' : 'none';
  who.textContent = on && login && AUTH.username ? AUTH.username : '';
}

function showLogin(msg) {
  // A minted token's show-once pane must not outlive the session that
  // minted it: signing out and back in would show the plaintext again.
  MINTED = null; FLEET = null; TOKENS = null; SETTINGS = null;
  GOVEDIT = null; GOVPRE = null; GOVERR = ''; SETMSG = '';
  REGTOOLS = null; GOVDECS = null; TESTS = {}; WLOPEN = false;
  RENTRIES = null; REDIT = null; RPRE = null; RERR = ''; RADV = false;
  chrome(false);
  const create = AUTH && AUTH.setup_needed;
  app.innerHTML = `<div style="max-width:440px;margin:8vh auto 0">
    <h2>${create ? 'Create the admin account' : 'Sign in'}</h2>
    <p class="lede">${create
      ? `No admin account exists yet. The receiver printed a one-time setup
         code to its log at boot — <code>kubectl logs deploy/&lt;release&gt;-ai-guard
         | grep setup_code</code>, or <code>docker compose logs receiver</code>.
         Enter it here; it is consumed on use and a restart mints a fresh one.`
      : `The portal signs in against the receiver's admin account. The session
         is an HttpOnly cookie: nothing is stored where page script can read it.`}</p>
    ${msg ? `<div class="note">${esc(msg)}</div>` : ''}
    ${create ? `<p><input id="li-code" class="mfield" style="width:100%"
      placeholder="setup code (aigs_…)" autocomplete="off"></p>` : ''}
    <p><input id="li-user" class="mfield" style="width:100%"
      placeholder="username" autocomplete="username"></p>
    <p><input id="li-pass" class="mfield" style="width:100%" type="password"
      placeholder="${create ? 'password (12 characters or more)' : 'password'}"
      autocomplete="${create ? 'new-password' : 'current-password'}"></p>
    <button class="mini" style="padding:6px 16px"
      data-act="${create ? 'do-setup' : 'do-login'}">${create ? 'Create account' : 'Sign in'}</button>
  </div>`;
  const u = document.getElementById(create ? 'li-code' : 'li-user');
  if (u) u.focus();
}

// A 401 mid-session means the session expired or was revoked; the honest
// response is the login screen with a line saying why, not a broken view.
async function sessionLost() {
  if (AUTH) AUTH.authenticated = false;
  try { AUTH = await (await fetch('/api/auth')).json(); } catch (e) { /* keep what we had */ }
  showLogin('Signed out — the session expired or was revoked. Sign in again.');
}

async function boot() {
  try { AUTH = await (await fetch('/api/auth')).json(); }
  catch (e) { AUTH = null; }
  if (AUTH && AUTH.mode === 'login' && !AUTH.authenticated) { showLogin(); return; }
  chrome(true);
  load();
}

async function load(force) {
  app.innerHTML = '<p class="lede">Reading findings…</p>';
  const q = force ? '?refresh=true' : '';
  // Refresh must clear the views that read a second endpoint too, or the
  // button refreshes some of the page and silently not the rest.
  if (force) { DIAG = null; REG = null; EV = null; PG = null; FLEET = null; TOKENS = null; SETTINGS = null; REGTOOLS = null; GOVDECS = null; RENTRIES = null; CAND = null; }
  try {
    const cr = await fetch('/api/config');
    if (cr.status === 401 && AUTH && AUTH.mode === 'login') { sessionLost(); return; }
    CFG = await cr.json();
    const gr = await fetch('/api/graph' + q);
    if (!gr.ok) throw new Error((await gr.json()).detail || gr.statusText);
    G = await gr.json();
    const sr = await fetch('/api/status' + q);
    if (sr.ok) S = await sr.json();
    // Fetched here rather than lazily, because the overview may draw a paste
    // guard widget and a widget that fetches on render would flash empty.
    const pr = await fetch('/api/paste-guard' + q);
    if (pr.ok) PG = await pr.json();
    // Same again for the review queue: it draws from the register, and in
    // managed mode from the discovery candidates queue too.
    if ((CFG.overview_widgets || []).some(w => w.kind === 'review_queue')) {
      const rr = await fetch('/api/register' + q);
      if (rr.ok) REG = await rr.json();
      if (CFG.managed && CFG.managed.enabled && AUTH && AUTH.mode === 'login') {
        const cq = await mfetch('/api/candidates');
        if (cq.ok) CAND = (await cq.json()).candidates || [];
      }
    }
    loadError = '';
  } catch (e) {
    loadError = String(e.message || e);
  }
  // First run: a managed deployment that has never finished onboarding
  // opens on the wizard - unless the operator navigated somewhere on
  // purpose, because a wizard that traps is worse than none.
  if (CFG.managed && CFG.managed.enabled && AUTH && AUTH.mode === 'login') {
    if (!SETTINGS) {
      const wr = await mfetch('/api/settings');
      if (wr.ok) SETTINGS = await wr.json();
    }
    const done = SETTINGS && SETTINGS.settings
      && SETTINGS.settings.onboarding_done.value;
    if (SETTINGS && !done && (!location.hash || location.hash === '#wizard')) {
      view = 'wizard';
      history.replaceState(null, '', '#wizard');
    }
  }
  render();
  showFreshness();
}

// The graph is cached, and a cache you cannot see is indistinguishable from a
// portal that is not working: a finding that arrived a minute ago simply is
// not there, with nothing on screen to say why.
function showFreshness() {
  const el = document.getElementById('freshness');
  if (!el) return;
  if (loadError || !G.derived_at) { el.textContent = ''; return; }
  const tick = () => {
    const age = Math.max(0, Math.round(Date.now() / 1000 - G.derived_at));
    el.textContent = age < 5 ? 'just now'
      : age < 90 ? age + 's ago'
      : Math.round(age / 60) + 'm ago';
  };
  tick();
  clearInterval(window._freshTimer);
  window._freshTimer = setInterval(tick, 5000);
}
const app = document.getElementById('app'), q = document.getElementById('q');
// The view lives in the URL fragment. A reload landing back on Setup loses
// where you were, and storing it would need somewhere to store it; the
// fragment is free, survives a reload, and makes a view linkable to a
// colleague. An unknown fragment falls back rather than rendering nothing.
// Grouped rather than flat, so a section can be added without reshuffling
// everything else, and so the shape of the tool is legible before you click.
const NAV = [
  {grp:null,        items:[['overview','Overview']]},
  {grp:'Inventory', items:[['tools','Tools'],['people','People'],
                           ['devices','Devices'],['personal','Personal accounts'],
                           ['mcp','MCP servers']]},
  {grp:'Coverage',  items:[['setup','Setup'],['coverage','Uncovered devices']]},
  {grp:'Governance',items:[['register','AI register'],['registry','Tool registry'],
                           ['paste','Paste guard'],['iso','ISO 42001 evidence']]},
  {grp:'Analytics', items:[['dashboard','Grafana']]},
  {grp:'Managed',   items:[['fleet','Fleet'],['tokens','Enrollment tokens']]},
  {grp:'System',    items:[['settings','Settings']]},
];

// Derived from NAV rather than written out beside it. Kept as a second list,
// #register was missing from it: the nav entry worked, the view rendered, and
// reloading the page silently sent you back to setup because the fragment was
// not recognised. Two lists that must agree, with nothing enforcing it.
// 'wizard' is reachable by fragment but absent from the nav: it is a door
// you walk through once, not a place to live.
const VIEWS = NAV.flatMap(sec => sec.items.map(([id]) => id)).concat(['wizard']);
const fromHash = () => {
  const h = (location.hash || '').replace(/^#/, '');
  return VIEWS.includes(h) ? h : 'setup';
};
let view = fromHash(), detail = null, filter = '';

// Escapes the five characters that matter in HTML text and in a quoted
// attribute. The apostrophe was missing, and it mattered: values were
// interpolated into onclick="open_('device','...')", a single-quoted JS string
// inside a double-quoted attribute, so a device name containing ' closed the
// string and ran whatever followed. The inline handlers are gone now and this
// is still the right set: an attribute quoted either way is covered, and
// nothing downstream has to remember which.
//
// This is not sufficient on its own for a JS or URL context. Nothing should be
// interpolated into either. Use a data attribute and read it back.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ents = o => Object.entries(o || {});
const label = (k, d) => d.device_name || k;
const match = s => !filter || String(s).toLowerCase().includes(filter);
// Shared by any view rendering counts or dates. Declared here rather than
// inside a view: they began as locals of register(), which made them invisible
// to every other function, and the second view to use them rendered nothing at
// all because the ReferenceError fired while building the HTML.
const num = n => n ? String(n) : '<span class="z">0</span>';
const when = t => t ? `<span class="nw">${esc(String(t).slice(0, 10))}</span>` : '—';

const WIDGETS = {

  stat_row: () => {
    const devs = ents(G.devices), pa = G.personal_accounts || [];
    const gaps = devs.filter(([,d]) => d.scanner_seen && !d.collector_seen);
    const week = Date.now()/1000 - 7*86400;
    const fresh = pa.filter(r => r.first_seen &&
      Date.parse(r.first_seen)/1000 > week).length;
    return `<dl class="stats">
      <div><dt style="color:var(--dstr)">${pa.length}</dt><dd>personal accounts</dd></div>
      <div><dt>${fresh}</dt><dd>new this week</dd></div>
      <div><dt>${new Set(pa.map(r=>r.user||r.device)).size}</dt><dd>affected people</dd></div>
      <div><dt>${new Set(pa.map(r=>r.tool)).size}</dt><dd>affected tools</dd></div>
      <div><dt>${devs.length}</dt><dd>devices</dd></div>
      <div><dt>${ents(G.tools).length}</dt><dd>tools</dd></div>
      <div><dt>${gaps.length}</dt><dd>coverage gaps</dd></div>
    </dl>`;
  },

  top_tools: () => {
    const rows = ents(G.tools)
      .sort((a,b)=>(b[1].devices||[]).length-(a[1].devices||[]).length).slice(0,7);
    const max = rows.length ? (rows[0][1].devices||[]).length || 1 : 1;
    return `<div class="wcard w6"><h3>Top tools</h3>
    ${rows.length ? rows.map(([k,t])=>{
      const n = (t.devices||[]).length;
      return `<div class="bar"><span>${esc(k)}</span>
        <i style="width:${Math.round(n/max*160)}px"></i><span>${n}</span></div>`;
    }).join('') : '<p class="lede">Nothing reported yet.</p>'}</div>`;
  },

  recent_personal_accounts: () => {
    const pa = (G.personal_accounts || []).slice(0, 6);
    return `<div class="wcard w6"><h3>Recent personal accounts</h3>
    ${pa.length ? `<table>${pa.map(r=>`<tr>
      <td>${esc(r.user || r.device_name || r.device)}</td>
      <td><span class="pill p-warn">${esc(r.account_domain)}</span></td>
      <td>${esc(r.tool)}</td>
      <td style="color:var(--mut)">${esc((r.last_seen||'').slice(0,10))}</td>
    </tr>`).join('')}</table>`
    : '<p class="lede">None seen. That is a result, not an absence of one.</p>'}
    </div>`;
  },

  detection_coverage: () => {
    if (!S) return '<div class="wcard w4"><h3>Detection coverage</h3><p class="lede">No status available.</p></div>';
    return `<div class="wcard w4"><h3>Detection coverage</h3>
    ${(S.groups||[]).map(g=>{
      const pct = g.total ? Math.round(g.reporting/g.total*100) : 0;
      return `<div class="bar"><span>${esc(g.group)}</span>
        <i class="${pct<50?'alt':''}" style="width:${Math.max(pct*1.1,2)}px"></i>
        <span>${g.reporting}/${g.total}</span></div>`;
    }).join('')}</div>`;
  },

  source_health: () => {
    if (!S) return '';
    const silent = (S.groups||[]).flatMap(g=>(g.sources||[]).filter(r=>!r.reporting));
    return `<div class="wcard w4"><h3>Silent sources</h3>
    ${silent.length ? silent.slice(0,8).map(r=>
      `<div style="font-size:12px;margin:4px 0"><span class="pill p-mut">${esc(r.source)}</span></div>`
    ).join('') : '<p class="lede">Every listed source is reporting.</p>'}</div>`;
  },

  paste_guard: () => {
    // Native rather than an embedded Grafana panel. This number is derived by
    // the portal now, so embedding an iframe to show it meant a card in
    // Grafana's typography sitting beside cards in the portal's, with a title
    // we could not restyle because it renders cross-origin.
    //
    // Two numbers, not four. The overview is a glance: is the guard running,
    // and did somebody ignore it. Warned and blocked are the detail behind
    // that, and they have a page. Four stat cells also clipped in a
    // third-width card on a narrower content area, which is the same lesson
    // the register learned the long way.
    if (!PG) return '<div class="wcard w4"><h3>Paste guard</h3>'
      + '<p class="lede">No paste guard data.</p></div>';
    const over = PG.overridden || 0, live = PG.guard_devices || 0;
    const versions = (PG.guard_versions || []).length;
    return `<div class="wcard w4"><h3>Paste guard</h3>
      <dl class="stats" style="margin:0;grid-template-columns:repeat(2,1fr)">
        <div><dt${live ? '' : ' style="color:var(--dstr)"'}>${live}</dt><dd>devices</dd></div>
        <div><dt${over ? ' style="color:var(--dstr)"' : ''}>${over}</dt><dd>overridden</dd></div>
      </dl>
      <p class="src-note">${live
        ? `Checked in from ${live} device${live === 1 ? '' : 's'}${
             versions > 1 ? ` across ${versions} versions` : ''}, so a low
           count of stopped pastes means what it says.`
        : `No device checked in, so nothing here can be read as an estate that
           pasted nothing.`}</p></div>`;
  },

  review_queue: () => {
    // The queue that replaces a weekly review pipeline: observed tools no
    // one has decided about. Recording the decision IS the acknowledgment,
    // so an empty queue means exactly what it says. Not-in-registry rows
    // first - they are the gap evidence - then newest first.
    if (!REG || !REG.rows) return `<div class="wcard w6"><h3>Awaiting a decision</h3>
      <p class="lede">No register data - open the AI register for the reason.</p></div>`;
    const dayAgo = Date.now() - 86400000;
    const isNew = r => r.first_seen && Date.parse(r.first_seen) > dayAgo;
    const undecided = (REG.rows || [])
      .filter(r => r.status_source !== 'governance' && r.status_source !== 'portal')
      .sort((a, b) => ((a.in_registry ? 1 : 0) - (b.in_registry ? 1 : 0))
        || ((Date.parse(b.first_seen || 0) || 0) - (Date.parse(a.first_seen || 0) || 0)));
    // Discovery candidates: observed in the estate's telemetry, defined by
    // nobody. Open ones only - resolved means a registry entry answered it,
    // dismissed means a human did.
    const cands = (CAND || []).filter(c => !c.resolved && !c.dismissed_at);
    const candBlock = !cands.length ? '' : `
      <h4 style="margin:10px 0 4px">New AI tools found
        <span class="count">${cands.length}</span></h4>
      <table>${cands.slice(0, 6).map(c => `<tr>
        <td>${esc(c.name)}<div style="color:var(--mut);font-size:12px">
          ${esc((c.domains || []).join(', '))}</div></td>
        <td style="color:var(--mut)">${c.devices || 0} device${c.devices === 1 ? '' : 's'}
          ${c.confidence ? ' · ' + esc(c.confidence) : ''}</td>
        <td style="white-space:nowrap">
          <button class="btn" data-act="cand-add" data-key="${esc(c.key)}">Add to registry</button>
          <button class="btn" data-act="cand-dismiss" data-key="${esc(c.key)}">Dismiss</button>
        </td></tr>`).join('')}</table>
      ${cands.length > 6 ? `<p class="src-note">And ${cands.length - 6} more in the queue.</p>` : ''}`;
    if (!undecided.length && !cands.length) {
      const ago = t => {
        const m = Math.round((Date.now() - Date.parse(t)) / 60000);
        return m < 90 ? m + 'm ago' : Math.round(m / 60) + 'h ago';
      };
      const srcs = ((S && S.groups) || []).flatMap(g => g.sources || [])
        .filter(x => x.last_seen).sort((a, b) => a.last_seen < b.last_seen ? 1 : -1)
        .slice(0, 2);
      return `<div class="wcard w6"><h3>Awaiting a decision</h3>
        <p class="lede">No new AI tools awaiting a decision.${srcs.length
          ? ' Newest source data: ' + srcs.map(x =>
              esc(x.label) + ' ' + ago(x.last_seen)).join(', ') + '.' : ''}</p></div>`;
    }
    return `<div class="wcard w6"><h3>Awaiting a decision
      <span class="count">${undecided.length + cands.length}</span></h3>
    ${candBlock}
    ${!undecided.length ? '' : `
    ${cands.length ? '<h4 style="margin:10px 0 4px">Observed, no decision recorded</h4>' : ''}
    <table>${undecided.slice(0, 6).map(r => `<tr>
      <td><a href="#register" style="color:var(--fg);text-decoration:none">${esc(r.name)}</a></td>
      <td>${!r.in_registry ? '<span class="pill p-warn">not in registry</span>' : ''}
          ${isNew(r) ? '<span class="pill p-acc">new today</span>' : ''}</td>
      <td style="color:var(--mut)">${esc((r.first_seen || '').slice(0, 10))}</td>
    </tr>`).join('')}</table>`}
    <p class="src-note"><a href="#register" style="color:var(--pri)">Decide on
    the AI register</a> - a decision is the acknowledgment, so deciding
    clears the queue.</p></div>`;
  },

  grafana: (w) => {
    const base = CFG.grafana_url;
    if (!base) return `<div class="wcard w4"><h3>${esc(w.ref)}</h3>
      <p class="lede">No Grafana configured.</p></div>`;
    const p = (CFG.grafana_panels||[]).find(x => (x.title||'') === w.ref || String(x.panel_id) === w.ref);
    if (!p) return `<div class="wcard w4"><h3>${esc(w.ref)}</h3>
      <div class="note" style="margin:0">No panel in GRAFANA_PANELS matches
      "${esc(w.ref)}". Named here but not defined there, so there is nothing
      to draw.</div></div>`;
    const q = 'orgId=1&theme=dark&from=now-7d&to=now&kiosk';
    // No heading of our own. The panel draws its own, from the dashboard, so a
    // second one is both duplicated and less trustworthy: ours comes from
    // GRAFANA_PANELS, which is a snapshot of a title someone can rename in
    // Grafana at any time.
    return `<div class="wcard w4" style="padding:10px">
      <iframe src="${esc(base)}/d-solo/${esc(p.uid)}/?${q}&panelId=${esc(p.panel_id)}"
        style="width:100%;height:210px;border:0;border-radius:6px;background:var(--sf2)"
        title="${esc(p.title || 'Grafana panel')}"></iframe></div>`;
  },

  error: (w) => `<div class="wcard w12"><h3>Widget not drawn</h3>
    <div class="note" style="margin:0">${esc(w.error)}</div>
    <p class="src-note">Said out loud rather than skipped: a widget that
    silently does not appear looks identical to one that appeared with nothing
    to show.</p></div>`,
};

// The truncation banner (issue #104): a Loki read that stopped at the
// safety cap means every count on screen is a floor. Saying so beats a
// smaller number pretending to be the total.
const truncNote = flag => flag ? `<div class="note">Only the newest findings
  in this window were fetched (the read hit its safety cap): every count
  here is a floor, not a total. Narrow the window, or raise
  <span class="mono">LOKI_MAX_FINDINGS</span>.</div>` : '';

function overview() {
  const ws = CFG.overview_widgets || [{kind:'stat_row'},{kind:'review_queue'},
    {kind:'top_tools'},{kind:'recent_personal_accounts'},{kind:'detection_coverage'}];
  const stat = ws.filter(w => w.kind === 'stat_row');
  const rest = ws.filter(w => w.kind !== 'stat_row');
  return `<h2>Overview</h2>
  ${truncNote(G.findings_truncated)}
  <p class="lede">Which widgets appear is a deployment decision, set in
  <code>OVERVIEW_WIDGETS</code>, so an organisation shapes its own landing page
  and the portal keeps no state and needs no accounts.</p>
  ${stat.map(w => WIDGETS.stat_row(w)).join('')}
  <div class="grid">${rest.map(w =>
    (WIDGETS[w.kind] ? WIDGETS[w.kind](w) : WIDGETS.error({error:'no renderer for '+w.kind}))
  ).join('')}</div>`;
}

function card(k, d) {
  return `<div class="card" data-open="device" data-key="${esc(k)}">
    <h3>${esc(label(k,d))}</h3>
    <div class="sub">${(d.tools||[]).map(t=>`<span class="pill p-mut">${esc(t)}</span>`).join('')}</div>
    <div class="sub" style="margin-top:6px">
      ${(d.personal_accounts||[]).map(a=>`<span class="pill p-warn">${esc(a)}</span>`).join('')}
      ${d.person?`<span class="pill p-ok">${esc(d.person)}</span>`:''}
      ${(d.local_users||[]).map(u=>`<span class="pill p-mut">${esc(u)}</span>`).join('')}
    </div></div>`;
}

function devices() {
  const rows = ents(G.devices)
    .filter(([k,d]) => match(k) || match(d.device_name) || (d.local_users||[]).some(match) || (d.tools||[]).some(match))
    .sort((a,b) => (b[1].tools||[]).length - (a[1].tools||[]).length);
  return `<h2>Devices</h2><p class="lede">${rows.length} shown. The key is the most
  stable identifier the source could get, usually a serial. Click for detail.</p>
  ${rows.map(([k,d]) => card(k,d)).join('')}`;
}

function people() {
  const rows = ents(G.identities).filter(([k]) => match(k))
    .sort((a,b) => (b[1].tools||[]).length - (a[1].tools||[]).length);
  return `<h2>People</h2><p class="lede">Identities come from cloud sources, which know people rather
  than machines. Devices appear here only where an identity map attaches them —
  see <a href="/api/suggest-identities?fmt=csv" style="color:var(--pri)">a
  proposed map</a> to start one.</p>
  <table><tr><th>identity</th><th>tools</th><th>devices</th></tr>
  ${rows.map(([k,i]) => `<tr><td>${esc(k)}</td>
    <td>${(i.tools||[]).map(t=>`<span class="pill p-mut">${esc(t)}</span>`).join('')}</td>
    <td>${(i.devices||[]).map(d=>`<span class="pill p-acc">${esc(d)}</span>`).join('') || '<span class="pill p-mut">unmapped</span>'}</td></tr>`).join('')}
  </table>`;
}

function tools() {
  const rows = ents(G.tools).filter(([k]) => match(k))
    .sort((a,b) => (b[1].devices||[]).length - (a[1].devices||[]).length);
  return `<h2>Tools</h2><p class="lede">Surfaces are kept apart on purpose: the same
  tool in a browser, a desktop app and a CLI are different exposures.</p>
  <table><tr><th>tool</th><th>devices</th><th>identities</th><th>by surface</th></tr>
  ${rows.map(([k,t]) => `<tr data-open="tool" data-key="${esc(k)}" style="cursor:pointer">
    <td>${esc(k)}</td><td>${(t.devices||[]).length}</td><td>${(t.identities||[]).length}</td>
    <td>${ents(t.devices_by_surface||{}).sort((a,b)=>b[1].length-a[1].length)
      .map(([s,v])=>`<span class="pill p-acc">${esc(s||'none')} ${v.length}</span>`).join('')}</td>
  </tr>`).join('')}</table>
  ${ents(G.bridges||{}).length ? `<h2 style="margin-top:26px">Bridge targets</h2>
  <p class="lede">Where an AI tool reached. Not a tool inventory: these are
  destinations of an integration, not something someone installed.</p>
  <table><tr><th>resource</th><th>devices</th></tr>
  ${ents(G.bridges).sort((a,b)=>b[1].devices.length-a[1].devices.length)
    .map(([k,b])=>`<tr><td>${esc(k)}</td><td>${b.devices.length}</td></tr>`).join('')}
  </table>` : ''}`;
}

function coverage() {
  const gaps = ents(G.devices).filter(([,d]) => d.scanner_seen && !d.collector_seen);
  return `<h2>Coverage</h2><p class="lede">An inventory or telemetry source knows
  these machines, but no endpoint collector reports from them. An empty collector
  result and an undeployed collector look identical on a dashboard, which is why
  they are listed rather than counted.</p>
  ${gaps.length ? `<table><tr><th>device</th><th>sources</th><th>tools seen</th></tr>
  ${gaps.map(([k,d])=>`<tr><td>${esc(label(k,d))}</td>
    <td>${(d.sources||[]).map(s=>`<span class="pill p-mut">${esc(s)}</span>`).join('')}</td>
    <td>${(d.tools||[]).length}</td></tr>`).join('')}</table>`
  : '<p class="lede">Every device with a scanner finding also has a collector reporting.</p>'}`;
}

function deviceDetail(k) {
  const d = G.devices[k]; if (!d) return '<p>not found</p>';
  const bridges = ents(G.bridges||{}).filter(([,b]) => (b.devices||[]).includes(k)).map(([n])=>n);
  return `<button class="back" data-open="">back</button>
  <h2>${esc(label(k,d))}</h2>
  <p class="lede">${esc(k)} · ${esc((d.os||[]).join(', ')) || 'os unknown'} · ${d.findings} findings</p>
  <table>
    <tr><th>person</th><td>${d.person ? esc(d.person) : '<span class="pill p-mut">unattributed</span>'}</td></tr>
    <tr><th>local users</th><td>${esc((d.local_users||[]).join(', ')) || '—'}</td></tr>
    <tr><th>surfaces</th><td>${esc((d.surfaces||[]).filter(Boolean).join(', '))}</td></tr>
    <tr><th>sources</th><td>${esc((d.sources||[]).join(', ')) || '—'}</td></tr>
    <tr><th>accounts</th><td>${(d.accounts||[]).map(a =>
      `<span class="pill ${(d.personal_accounts||[]).includes(a)?'p-warn':'p-ok'}">${esc(a)}</span>`).join('') || '—'}</td></tr>
    <tr><th>tools and accounts</th><td>${ents(d.tool_accounts||{}).length
      ? ents(d.tool_accounts).sort().map(([t,accts]) =>
        `<div style="margin:2px 0"><span class="pill p-mut">${esc(t)}</span>
         ${accts.length ? accts.map(a =>
            `<span class="pill ${(d.personal_accounts||[]).includes(a)?'p-warn':'p-ok'}">${esc(a)}</span>`).join('')
          : '<span style="color:var(--mut);font-size:11px">no account seen</span>'}</div>`).join('')
      : (d.tools||[]).map(t=>`<span class="pill p-mut">${esc(t)}</span>`).join('')}</td></tr>
    <tr><th>bridge targets</th><td>${bridges.map(b=>`<span class="pill p-acc">${esc(b)}</span>`).join('') || '—'}</td></tr>
  </table>`;
}

function toolDetail(k) {
  const t = G.tools[k]; if (!t) return '<p>not found</p>';
  return `<button class="back" data-open="">back</button>
  <h2>${esc(k)}</h2>
  <p class="lede">${(t.devices||[]).length} devices · ${(t.identities||[]).length} identities · ${t.findings} findings</p>
  <table><tr><th>by surface</th><td>${ents(t.devices_by_surface||{})
    .sort((a,b)=>b[1].length-a[1].length)
    .map(([s,v])=>`<span class="pill p-acc">${esc(s||'none')} ${v.length}</span>`).join('')}</td></tr>
  <tr><th>accounts</th><td>${esc((t.accounts||[]).join(', ')) || '—'}</td></tr></table>
  <h2 style="margin-top:22px;font-size:16px">Devices</h2>
  ${(t.devices||[]).map(dk => G.devices[dk] ? card(dk, G.devices[dk]) : '').join('')}`;
}

function mcp() {
  const rows = (G.mcp_servers || []).filter(r =>
    match(r.server) || (r.tools||[]).some(match) ||
    (r.device_names||[]).some(match) || (r.devices||[]).some(match));
  const tools = ents(G.tools).filter(([,t]) => (t.surfaces||[]).includes('mcp'));
  const devs = new Set(rows.flatMap(r => r.devices || []));
  return `<h2>MCP servers</h2>
  <p class="lede">An MCP server is a standing integration rather than an
  application someone opens. It holds its own credentials and can reach
  whatever it was pointed at whether or not the tool that configured it is in
  use, which makes the server the thing worth counting rather than the tool.</p>

  <dl class="stats">
    <div><dt>${rows.length}</dt><dd>servers</dd></div>
    <div><dt>${devs.size}</dt><dd>devices</dd></div>
    <div><dt>${tools.length}</dt><dd>configuring tools</dd></div>
  </dl>

  ${rows.length ? `<table>
  <tr><th>server</th><th>devices</th><th>configured by</th>
  <th>first seen</th><th>last seen</th></tr>
  ${rows.map(r => `<tr data-open="mcp" data-key="${esc(r.server)}" style="cursor:pointer">
    <td>${esc(r.server)}</td>
    <td>${(r.devices||[]).length}</td>
    <td>${(r.tools||[]).map(t=>`<span class="pill p-mut">${esc(t)}</span>`).join('')}</td>
    <td style="color:var(--mut)">${esc((r.first_seen||'').slice(0,10) || '—')}</td>
    <td style="color:var(--mut)">${esc((r.last_seen||'').slice(0,10) || '—')}</td>
  </tr>`).join('')}</table>
  <p class="src-note">Click a server for the machines it is configured on. A
  server on twenty machines is a different problem from one on a single laptop,
  so the widest reach is listed first. The server names
  come from the finding evidence rather than the tool name: folding the list
  into the name made every distinct combination look like a separate tool.</p>`
  : `<p class="lede">No MCP servers found. That is only meaningful if the
  endpoint collectors are reporting, which the Setup page will tell you: the
  MCP scan is produced by them reading AI tool config files, so a silent
  collector and an estate with no MCP servers look identical from here.</p>`}`;
}

function mcpDetail(k) {
  const r = (G.mcp_servers || []).find(x => x.server === k);
  if (!r) return '<p>not found</p>';
  const devs = (r.devices || []);
  return `<button class="back" data-open="">back</button>
  <h2>${esc(r.server)}</h2>
  <p class="lede">${devs.length} device${devs.length === 1 ? '' : 's'} ·
  configured by ${esc((r.tools||[]).join(', '))} ·
  first seen ${esc((r.first_seen||'').slice(0,10) || 'unknown')} ·
  last seen ${esc((r.last_seen||'').slice(0,10) || 'unknown')}</p>
  <p class="lede">Whatever this server was pointed at is reachable from these
  machines without the configuring tool being open. What it can actually do
  there depends on the credentials it holds, which are not visible from here.</p>
  ${devs.length ? devs.map(dk => G.devices[dk]
      ? card(dk, G.devices[dk])
      : `<div class="card" style="cursor:default"><h3>${esc(dk)}</h3>
         <div class="sub">No other findings from this device in the window,
         so there is nothing else to show about it.</div></div>`).join('')
    : '<p class="lede">No device recorded against it.</p>'}`;
}

function personal() {
  const rows = (G.personal_accounts || []).filter(r =>
    match(r.user) || match(r.account_domain) || match(r.tool) ||
    match(r.device) || match(r.device_name));
  return `<h2>Personal accounts</h2>
  <p class="lede">An approved tool signed into a personal account is still
  unmanaged data flow and an offboarding gap, so this is its own section rather
  than a number on a summary page. Personal means the reporting source judged
  the account domain to be outside your corporate list, decided where that list
  actually lives. These are leads to follow up, not verdicts.</p>
  ${rows.length ? `<table>
  <tr><th>who</th><th>account domain</th><th>tool</th><th>device</th>
  <th>surface</th><th>first seen</th><th>last seen</th><th>source</th></tr>
  ${rows.map(r => `<tr>
    <td>${r.user ? esc(r.user) : '<span class="pill p-mut">no identity</span>'}</td>
    <td><span class="pill p-warn">${esc(r.account_domain)}</span></td>
    <td>${esc(r.tool)}</td>
    <td>${esc(r.device_name || r.device || '—')}</td>
    <td>${(r.surfaces||[]).map(x=>`<span class="pill p-mut">${esc(x)}</span>`).join('')}</td>
    <td style="color:var(--mut)">${esc((r.first_seen||'').slice(0,10) || '—')}</td>
    <td style="color:var(--mut)">${esc((r.last_seen||'').slice(0,10) || '—')}</td>
    <td style="color:var(--mut)">${esc((r.sources||[]).join(', ')) || '—'}</td>
  </tr>`).join('')}</table>`
  : `<p class="lede">None seen in the last ${CFG.lookback_hours || '?'} hours.
  That is a result rather than an absence of one, provided the sources on the
  Setup page are reporting.</p>`}`;
}


// The inline decision editor on a register card. Prefilled from the
// recorded decision when one exists (GOVPRE), else from what the row shows,
// so editing one field does not silently rewrite the others.
function govForm(r) {
  const pre = GOVPRE || {};
  const status = pre.status || r.stored_status || 'reviewing';
  const opt = (v, lbl) => `<option value="${v}"${status === v ? ' selected' : ''}>${lbl}</option>`;
  return `${GOVERR ? `<div class="note">${esc(GOVERR)}</div>` : ''}
  <div style="display:flex;flex-direction:column;gap:6px">
    <select id="gov-status" class="mfield">
      ${opt('approved', 'approved')}${opt('not_approved', 'not approved')}${opt('reviewing', 'reviewing')}
    </select>
    <input id="gov-owner" class="mfield" placeholder="owner, e.g. Security"
      value="${esc(pre.owner ?? r.owner ?? '')}">
    <input id="gov-review" class="mfield" placeholder="review due (YYYY-MM-DD, required for approved)"
      value="${esc(pre.review_due ?? r.review_due ?? '')}">
    <input id="gov-reason" class="mfield" placeholder="reason (optional)"
      value="${esc(pre.reason ?? '')}">
    <div>
      <button class="mini" data-act="gov-save" data-key="${esc(r.id)}">save decision</button>
      <button class="mini" data-act="gov-cancel">cancel</button>
    </div>
  </div>`;
}

// ------------------------------------------------------- tool registry --
// Portal-defined tools: the same shape as a shipped entry, validated by
// the receiver to the registry's own rules, detected by the fleet on its
// next check-in. Shipped entries are shown read-only - they update with
// releases, which is the point of not touching them.

// The categories the registry schema allows. Mirrored from
// registry/schema.json; a source-text test keeps the two in step.
const REG_CATEGORIES = ['assistant', 'coding', 'transcription', 'writing',
  'image', 'search', 'local-model', 'voice', 'productivity', 'platform',
  'agent', 'other', 'unreviewed'];

const _csv = v => (v || []).join(', ');
const _uncsv = id => _val(id).split(',').map(x => x.trim()).filter(Boolean);

function regForm() {
  const e = RPRE || {};

  return `<div class="wcard" style="margin-bottom:10px">
  <h3>${REDIT === '' ? 'Define a tool' : 'Edit ' + esc(REDIT)}</h3>
  <p class="lede" style="margin-bottom:10px">Identifiers are what the fleet

  ${RERR ? `<div class="note">${esc(RERR)}</div>` : ''}
  <div style="margin-bottom:8px">

  </div>
  ${RADV ? `<textarea id="re-json" class="mfield" rows="14"
      style="width:100%;font-family:ui-monospace,monospace"

  : `<dl class="kv">
    ${REDIT === '' ? row('re-id', 'id', e.id, 'lowercase-slug, e.g. acme-copilot')

    ${row('re-name', 'name', e.name, 'Acme Copilot')}
    ${row('re-vendor', 'vendor', e.vendor, 'Acme')}
    <dt>category</dt><dd><select id="re-category" class="mfield">

    <dt>risk tier</dt><dd><select id="re-risk" class="mfield">
      ${['high', 'medium', 'low'].map(r => opt(r, e.risk_tier || 'medium')).join('')}</select></dd>
    ${row('re-domains', 'browser domains', _csv(e.domains), 'copilot.acme.example (lowercase)')}
    ${row('re-app-names', 'macOS app names', _csv(e.app_names), 'Acme Copilot.app')}
    ${row('re-bundle-ids', 'macOS bundle ids', _csv(e.bundle_ids), 'com.acme.copilot')}
    ${row('re-exe-names', 'windows exe names', _csv(e.exe_names), 'acme.exe')}
    ${row('re-cli-binaries', 'cli binaries', _csv(cli.binaries), 'acme')}
    ${row('re-cli-config', 'cli config paths (from $HOME)', _csv(cli.config_paths), '.acme')}
    ${row('re-ext-vscode', 'vscode extension ids', _csv(ext.vscode), 'acme.copilot')}
    ${row('re-email', 'signup email sender domains', _csv(e.email_senders), 'acme.example')}
    ${row('re-mcp-ids', 'mcp identifiers', _csv(e.mcp_identifiers), 'acme-copilot')}
    ${row('re-mcp-any', 'mcp config paths (all OS, from $HOME)', _csv(e.mcp_config_paths), '.acme/mcp.json')}
    ${row('re-mcp-macos', 'mcp config paths (macOS)', _csv(e.mcp_config_paths_macos), 'Library/Acme/mcp.json')}
    ${row('re-mcp-windows', 'mcp config paths (Windows)', _csv(e.mcp_config_paths_windows), 'AppData/Acme/mcp.json')}
    ${row('re-mcp-linux', 'mcp config paths (Linux)', _csv(e.mcp_config_paths_linux), '.config/acme/mcp.json')}
    ${row('re-notes', 'notes', e.notes, '')}
  </dl>`}
  <div style="margin-top:10px">
    <button class="mini" data-act="reg-save">save tool</button>
    <button class="mini" data-act="reg-cancel">cancel</button>
  </div></div>`;
}

// The entry the form currently describes. Empty lists and empty strings
// are dropped, because the schema's shapes are optional-or-meaningful and
// an empty cli object is neither.
function regEntryFromForm() {
  if (RADV) {
    const t = document.getElementById('re-json');
    return JSON.parse((t && t.value) || '{}');
  }
  const e = {
    id: REDIT === '' ? _val('re-id') : REDIT,
    name: _val('re-name'), vendor: _val('re-vendor'),
    category: _val('re-category'), risk_tier: _val('re-risk'),
  };
  const lists = {
    domains: _uncsv('re-domains'), app_names: _uncsv('re-app-names'),
    bundle_ids: _uncsv('re-bundle-ids'), exe_names: _uncsv('re-exe-names'),
    email_senders: _uncsv('re-email'), mcp_identifiers: _uncsv('re-mcp-ids'),
    mcp_config_paths: _uncsv('re-mcp-any'),
    mcp_config_paths_macos: _uncsv('re-mcp-macos'),
    mcp_config_paths_windows: _uncsv('re-mcp-windows'),
    mcp_config_paths_linux: _uncsv('re-mcp-linux'),
  };
  Object.keys(lists).forEach(k => { if (lists[k].length) e[k] = lists[k]; });
  const binaries = _uncsv('re-cli-binaries'), config = _uncsv('re-cli-config');
  if (binaries.length || config.length) {
    e.cli = {};
    if (config.length) e.cli.config_paths = config;
    if (binaries.length) e.cli.binaries = binaries;
  }
  const vscode = _uncsv('re-ext-vscode');
  if (vscode.length) e.extension_ids = {vscode: vscode};
  const notes = _val('re-notes');
  if (notes) e.notes = notes;
  return e;
}

  <details style="margin-top:22px">

  <table style="margin-top:10px"><tr><th>id</th><th>name</th><th>vendor</th></tr>
  ${shipped.map(t => `<tr><td class="mono">${esc(t.id)}</td>

// The watchlist as a decision surface: registry tools nothing has observed
// yet, with the same approve / not-approved controls the wizard's baseline
// had. This exists because the wizard was the only place to record a
// decision about a tool BEFORE anyone uses it, and the wizard is a door
// you walk through once. Collapsed, so the register's own rule holds: the
// record is what is in use, and the watchlist stays secondary.
function watchlistBlock(observedIds) {
  if (!CFG.managed || !CFG.managed.enabled || !REGTOOLS) return '';
  const decided = {};
  (GOVDECS || []).forEach(d => { decided[d.tool_id] = d.status; });
  const rows = REGTOOLS.filter(t => !observedIds.has(t.id));
  if (!rows.length) return '';
  const yearOut = new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10);
  const LBL = {approved: ['approved', 'p-ok'],
               not_approved: ['not approved', 'p-warn']};
  const undecided = rows.filter(t => !decided[t.id]).length;
  return `<details id="wl-details" style="margin-top:22px" ${WLOPEN ? 'open' : ''}>
  <summary data-act="wl-toggle" style="cursor:pointer;font-size:14px">
    Watchlist — known, not observed (${rows.length}${undecided
      ? `, ${undecided} without a decision` : ''})</summary>
  <p class="lede" style="margin-top:10px">Decisions recorded here apply the
  moment a tool first appears. Approvals carry the review date below.</p>
  ${GOVERR ? `<div class="note">${esc(GOVERR)}</div>` : ''}
  <div style="margin-bottom:10px">
    <input id="wiz-owner" class="mfield" value="${esc(WIZOWNER)}"
      placeholder="owner for these decisions, e.g. Security">
    <input id="wiz-review" class="mfield" style="min-width:170px"
      value="${esc(WIZREVIEW || yearOut)}" title="review due date for approvals">
  </div>
  <table><tr><th>tool</th><th>vendor</th><th>decision</th><th></th></tr>
  ${rows.map(t => {
    const d = decided[t.id];
    const state = d && LBL[d]
      ? `<span class="pill ${LBL[d][1]}">${LBL[d][0]}</span>`
      : d ? `<span class="pill p-acc">${esc(d)}</span>`
      : '<span class="none">no decision</span>';
    return `<tr><td>${esc(t.name)}</td>
      <td style="color:var(--mut)">${esc(t.vendor)}</td>
      <td>${state}</td>
      <td><button class="mini" data-act="wiz-approve" data-key="${esc(t.id)}">approve</button>
          <button class="mini" data-act="wiz-notapprove" data-key="${esc(t.id)}">not approved</button></td>
    </tr>`;
  }).join('')}</table></details>`;
}

async function register() {
  if (!REG) {
    try {
      const r = await fetch('/api/register');
      if (!r.ok) {
        if (r.status === 401 && AUTH && AUTH.mode === 'login') { sessionLost(); return ''; }
        // An error body parses as JSON too; storing it as REG rendered a
        // page of "undefined" instead of the reason.
        let d = r.statusText;
        try { d = (await r.json()).detail || d; } catch (e2) { /* keep */ }
        return `<h2>AI register</h2><div class="note">Could not build
      the register: ${esc(String(d))}</div>`;
      }
      REG = await r.json();
    }
    catch (e) { return `<h2>AI register</h2><div class="note">Could not build
      the register: ${esc(String(e.message || e))}</div>`; }
  }
  if (CFG.managed && CFG.managed.enabled) {
    if (!REGTOOLS) {
      const r = await mfetch('/api/registry-tools');
      REGTOOLS = r.ok ? (await r.json()).tools || [] : [];
    }
    if (!GOVDECS) {
      const r = await mfetch('/api/governance-decisions');
      GOVDECS = r.ok ? (await r.json()).decisions || [] : [];
    }
  }
  const rows = (REG.rows || []).filter(r =>
    match(r.name) || match(r.id) || match(r.vendor) || match(r.category));
  // Queue order: undecided first (the register doubles as the review
  // queue), keeping the server's exposure order within each half.
  const _decided = r => (r.status_source === 'governance'
    || r.status_source === 'portal') ? 1 : 0;
  rows.sort((a, b) => _decided(a) - _decided(b));
  const _newToday = r => r.first_seen
    && Date.parse(r.first_seen) > Date.now() - 86400000;

  const win = REG.hours >= 24 ? Math.round(REG.hours / 24) + ' days'
                              : REG.hours + ' hours';
  const dash = '<span class="pill p-mut">not set</span>';
  // A zero is the absence of a thing. Rendering it at full weight makes a
  // row of zeros as loud as a row of findings, and the eye has nothing to
  // land on.
  // Risk tier as a pill. It is a meaningful attribute and read as ordinary
  // metadata beside everything else. Restrained on purpose: status and the
  // personal-account count already carry colour, and a third loud thing in the
  // same card would leave nothing standing out.
  const RISK = {high:'p-warn', medium:'p-acc', low:'p-mut'};
  const risk = t => t
    ? `<span class="pill ${RISK[t]||'p-mut'}">${esc(t)}</span>` : '—';

  // Effective status, with the stored decision alongside when they differ.
  // An approval past its review date reads as reviewing and says why: a green
  // pill turning amber leaves someone wondering, and an approval nobody has
  // revisited is not evidence a tool is safe, it is evidence nobody looked.
  const PILL = {approved:'p-ok', not_approved:'p-warn', reviewing:'p-acc'};
  const LABEL = {approved:'approved', not_approved:'not approved',
                 reviewing:'reviewing'};
  // Status says what was decided, and at most one line of context. The expiry
  // used to live here too, which put four lines in one cell and made every
  // other row look ragged beside it. Expiry is a fact about the review date,
  // so it belongs in the review column.
  // Exceptions, as their own block under the governance rule. Deliberately not
  // folded into the status pill: an exception is a departure from the general
  // decision for a stated scope, and showing it as the status would make a
  // note about one team read as a decision about everybody.
  //
  // Expired ones are still listed, quietly. An exception that has run its
  // course is a record of something an organisation decided and then let
  // lapse, which is worth seeing rather than losing.
  const scopeText = sc => Object.entries(sc || {})
    .map(([k, v]) => `${esc(k)} ${esc(String(v))}`).join(', ');

  const exceptionBlock = r => {
    const active = r.exceptions || [], expired = r.expired_exceptions || [];
    if (!active.length && !expired.length) return '';
    const one = (e, isExpired) => `<div class="exc${isExpired ? ' exc-old' : ''}">
      <span class="mono">${esc(e.id)}</span>
      ${e.scope && Object.keys(e.scope).length
        ? `<span class="exc-scope">${scopeText(e.scope)}</span>` : ''}
      <span class="exc-when">${isExpired ? 'expired' : 'until'} ${esc(e.expires)}</span>
      ${e.reason ? `<div class="exc-why">${esc(e.reason)}</div>` : ''}
    </div>`;
    return `<hr>
      <div class="card-section">exception${active.length + expired.length === 1 ? '' : 's'}</div>
      ${active.map(e => one(e, false)).join('')}
      ${expired.map(e => one(e, true)).join('')}`;
  };

  const status = r => {
    const wrap = inner => `<div class="gov">${inner}</div>`;

    // Not in the registry at all is the row worth acting on: something is in
    // use that governance has never considered.
    if (!r.in_registry) {
      return wrap('<span class="pill p-warn">not in registry</span>');
    }

    if (r.status_source === 'governance' || r.status_source === 'portal') {
      let out = `<span class="pill ${PILL[r.status]||'p-mut'}">${LABEL[r.status]||esc(r.status)}</span>`;
      if (r.status_reason === 'approval_expired') {
        out += `<span class="gov-sub">was ${LABEL[r.stored_status]||''}</span>`;
      }
      // A decision recorded in the portal says so: a reader auditing the
      // governance file should not go hunting for a record that lives in
      // the receiver's database instead.
      if (r.status_source === 'portal') {
        out += `<span class="gov-sub">set in the portal</span>`;
      }
      return wrap(out);
    }

    // No governance record, so this is the registry's own flag. approved: true
    // can only have been set deliberately, because every tool ships false, so
    // it is a decision and reads as one. approved: false is ambiguous: it is
    // what an untouched registry says about everything, and rendering it as a
    // refusal would put a shipped default and a considered "no" in the same
    // red pill.
    if (r.approved === true) {
      return wrap('<span class="pill p-ok">approved</span>'
        + '<span class="gov-sub">from the registry</span>');
    }
    // Quieter than the other three. When half an estate has no decision, an
    // outlined pill on every card repeats until it reads as a status somebody
    // chose. It is the absence of one, and should look like it.
    return wrap('<span class="none">no decision</span>');
  };

  // Review: the date, and how it stands relative to today. Overdue in the
  // warning colour, upcoming in muted text. Computed here rather than passed
  // through: the API already carries days_overdue for the expired case, and
  // the countdown is arithmetic on a date the row already has.
  const review = r => {
    if (!r.review_due) return `<div class="gov">${dash}</div>`;
    const days = Math.round(
      (Date.parse(r.review_due + 'T00:00:00Z') - Date.now()) / 86400000);
    const sub = r.days_overdue
      ? `<span class="gov-sub over">${r.days_overdue}d overdue</span>`
      : (days >= 0 ? `<span class="gov-sub">in ${days}d</span>` : '');
    return `<div class="gov">
      <span class="nw"${r.days_overdue ? ' style="color:var(--dstr)"' : ''}>${esc(r.review_due)}</span>
      ${sub}</div>`;
  };

  return `<h2>AI register</h2>
  ${truncNote(REG.findings_truncated)}
  <p class="lede">The AI tools actually in use, from findings in the last
  ${esc(win)}. The registry is a watchlist rather than an inventory, so a tool
  it knows about and nothing has reported is counted below rather than listed.
  A tool observed and absent from the registry is the row worth acting on, and
  is flagged as such.</p>

  <dl class="stats">
    <div><dt>${REG.tools_observed}</dt><dd>in use</dd></div>
    <div><dt style="color:var(--dstr)">${REG.observed_not_in_registry}</dt><dd>not in registry</dd></div>
    <div><dt>${REG.tools_known}</dt><dd>watched for</dd></div>
    <div><dt>${REG.known_not_observed}</dt><dd>watched for, not seen</dd></div>
  </dl>

  ${!REG.governance_configured ? (CFG.managed && CFG.managed.enabled
    ? `<p class="lede">No decisions recorded yet, so status falls back to the
    registry's own flag - a shipped default rather than a decision anyone
    made. Record one with <b>edit</b> on any card; it is stored centrally
    and a governance file (<span class="mono">GOVERNANCE_PATH</span>) still
    works alongside.</p>`
    : `<p class="lede">No governance file is
  configured, so status falls back to the registry's own flag and every tool
  reads as not approved. That is a shipped default rather than a decision
  anyone made. Set <span class="mono">GOVERNANCE_PATH</span> to record
  approvals, owners and review dates.</p>`) : ''}

  ${((REG.governance_unmatched || []).length
     || (REG.exceptions_unmatched || []).length) ? `<div class="note">
    ${(() => {
      const d = REG.governance_unmatched || [], x = REG.exceptions_unmatched || [];
      const names = [...new Set([...d, ...x])];
      const what = d.length && x.length ? 'records' : (d.length ? 'decision' : 'exception');
      const n = d.length + x.length;
      return `<b>${n === 1 ? `1 ${what} names a tool` : `${n} ${what}${what === 'records' ? '' : 's'} name tools`}
        the registry does not know:</b>
        ${names.map(t => `<span class="pill p-warn">${esc(t)}</span>`).join('')}`;
    })()}
    <div style="margin-top:6px">That is fine for a deliberate record about
    something not yet registered, and it is also what a typo looks like. Either
    way it is not being applied to anything, so it is shown rather than
    dropped.</div>
  </div>` : ''}

  <p class="lede">One card per tool: what it is, how it is used, and what was
  decided about it. First seen is in the CSV rather than here, because inside a
  lookback window it is usually the same as last seen and Overview already
  answers what is new this week.
  <a href="/api/register?fmt=csv" style="color:var(--pri)">Download CSV</a></p>

  ${rows.length ? `<div class="cards">
  ${rows.map(r => `<div class="card">
    <div class="card-top">
      <div style="min-width:0">
        <div class="card-name">${esc(r.name)}
          ${_newToday(r) ? '<span class="pill p-acc">new today</span>' : ''}</div>
        <div class="card-meta">${r.vendor ? esc(r.vendor) + ' · ' : ''}${esc(r.id)}</div>
      </div>
      ${status(r)}
    </div>
    <hr>
    <dl class="card-kv">
      <dt>usage</dt><dd>${r.devices} device${r.devices === 1 ? '' : 's'},
        ${r.users} user${r.users === 1 ? '' : 's'}</dd>
      <dt>accounts</dt><dd>corp ${num(r.corporate_accounts)} ·
        personal ${r.personal_accounts
          ? `<span class="pill p-warn">${r.personal_accounts}</span>` : num(0)}</dd>
      <dt>surfaces</dt><dd>${r.surfaces.length ? esc(r.surfaces.join(', ')) : '—'}</dd>

async function paste() {

  return `<h2>Paste guard</h2>
  <p class="lede">What the paste guard stopped, on which tool, and how often.
  Metadata only: the guard inspects clipboard content on the device and reports
  detector identifiers, so what was nearly pasted is not here and is not stored
  anywhere. A warning heeded is the guard working; an override is somebody who
  was shown the detector by name and pasted anyway, which is the row worth
  following up.</p>

  <dl class="stats">
    <div><dt${(PG.guard_devices || 0) ? '' : ' style="color:var(--dstr)"'}>${PG.guard_devices || 0}</dt>

    <div><dt>${PG.warned || 0}</dt><dd>warned</dd></div>
    <div><dt style="color:var(--dstr)">${PG.overridden || 0}</dt><dd>overridden</dd></div>
    <div><dt>${PG.blocked || 0}</dt><dd>blocked</dd></div>
    <div><dt>${PG.devices || 0}</dt><dd>devices with an event</dd></div>
  </dl>

  ${(PG.guard_versions || []).length ? `<p class="lede">Running

    in ${PG.guard_modes.map(m => `<span class="pill ${m.mode === 'block' ? 'p-ok' : 'p-acc'}">${esc(m.mode)} on ${m.devices}</span>`).join('')}.
    A fleet split across versions is a rollout that stalled, and a device in

  ${rows.length ? `<table>

      ? `<span class="pill p-warn">${r.overridden}</span>` : num(0)}</td>

    <td class="n">${num(r.devices)}</td>
    <td>${r.detectors.map(d => `<span class="pill p-mut">${esc(d)}</span>`).join('')}</td>
    <td class="nowrap">${when(r.last_seen)}</td>

}

async function iso() {
  if (!EV) {
    try { EV = await (await fetch('/api/evidence')).json(); }
    catch (e) { return `<h2>ISO/IEC 42001 evidence</h2><div class="note">Could
      not build the evidence index: ${esc(String(e.message || e))}</div>`; }
  }
  const e = EV;
  const n = v => `<b>${v}</b>`;

  // An index, not a report. Each row says what area of an AI management system
  // this supports, what the platform can currently say about it, and where the
  // underlying evidence lives. Deliberately not a card per theme: that would
  // re-render every source view and turn this into a second Overview, when the
  // value here is knowing where to look.
  //
  // No clause numbers. A mapping asserted without validation implies an
  // authority this project does not have, and reproducing the standard's own
  // wording is not ours to do.
  const rows = [
    ['Inventory and usage',
     `${n(e.tools_observed)} tools in use, ${n(e.tools_watched_for)} watched for`
     + (e.tools_not_in_registry
        ? `, ${n(e.tools_not_in_registry)} not in the registry` : ''),
     'register', 'AI register'],

    ['Governance',
     `${n(e.decisions_recorded)} decisions recorded, `
     + `${n(e.tools_without_decision)} tools without one`
     + (e.approvals_expired ? `, ${n(e.approvals_expired)} approval expired` : '')
     + (e.active_exceptions ? `, ${n(e.active_exceptions)} active exception` : ''),
     'register', 'AI register'],

    ['Monitoring coverage',
     `${n(e.sources_reporting)} of ${n(e.sources_known)} expected sources reporting`,
     'setup', 'Setup'],

    ['Account governance',
     `${n(e.personal_accounts)} personal accounts across `
     + `${n(e.personal_account_tools)} tools`,
     'personal', 'Personal accounts'],

    ['Data protection',
     `${n(e.paste_events)} paste events, ${n(e.paste_overridden)} overridden. `
     + `Inspected content is not retained`,
     'paste', 'Paste guard'],

    ['Integrations',
     `${n(e.mcp_servers)} MCP servers observed`,
     'mcp', 'MCP servers'],

    ['Third parties',
     `${n(e.providers)} providers observed across the tools in use`,
     'register', 'AI register'],

    ['Evidence',
     `Snapshot for the window ${esc((e.window||{}).from||'').slice(0,10)} to `
     + `${esc((e.window||{}).to||'').slice(0,10)}, checksummed`,
     null, 'This page'],
  ];

  // Review inputs are the only separate block, because they are things
  // somebody may need to act on rather than a category of evidence. Framed as
  // inputs to a human review, not as conclusions: the platform can say a tool
  // has no decision, and cannot say whether that matters.
  const inputs = [
    [e.approvals_expired, `${e.approvals_expired} approval${e.approvals_expired === 1 ? '' : 's'} expired`, 'register'],
    [e.tools_without_decision, `${e.tools_without_decision} observed tool${e.tools_without_decision === 1 ? '' : 's'} with no governance decision`, 'register'],
    [e.tools_not_in_registry, `${e.tools_not_in_registry} tool${e.tools_not_in_registry === 1 ? '' : 's'} in use and not in the registry`, 'register'],
    [e.tools_without_owner, `${e.tools_without_owner} decision${e.tools_without_owner === 1 ? '' : 's'} with no owner`, 'register'],
    [e.reviews_due_soon, `${e.reviews_due_soon} review${e.reviews_due_soon === 1 ? '' : 's'} due within ${e.reviews_due_soon_days} days`, 'register'],
    [e.personal_accounts, `${e.personal_accounts} personal account${e.personal_accounts === 1 ? '' : 's'} observed`, 'personal'],
    [Math.max(0, (e.sources_known||0) - (e.sources_reporting||0)),
     `${Math.max(0, (e.sources_known||0) - (e.sources_reporting||0))} expected source${(e.sources_known - e.sources_reporting) === 1 ? '' : 's'} not reporting`, 'setup'],
    [e.paste_overridden, `${e.paste_overridden} paste warning${e.paste_overridden === 1 ? '' : 's'} overridden`, 'paste'],
    [e.mcp_findings, `${e.mcp_findings} MCP finding${e.mcp_findings === 1 ? '' : 's'}`, 'mcp'],
  ].filter(([count]) => count > 0);

  return `<h2>ISO/IEC 42001 evidence</h2>
  <p class="lede">Evidence Shadow AI Guard can provide to support an AI
  management system. An index of what the platform can currently say and where
  each record lives, not an assessment: nothing here is a compliance score, a
  clause mapping, or a claim that a control is satisfied. The gaps are shown
  beside the totals because a gap is the more useful finding.</p>

  <table>
  <tr><th>Theme</th><th>What Shadow AI Guard can say</th><th>Evidence source</th></tr>
  ${rows.map(([theme, says, target, label]) => `<tr>
    <td>${esc(theme)}</td>
    <td style="font-family:inherit">${says}</td>
    <td>${target ? `<a href="#${target}" style="color:var(--pri)">${esc(label)}</a>`
                 : esc(label)}</td>
  </tr>`).join('')}
  </table>

  <h3 style="margin-top:26px;font-size:14px">Review inputs</h3>
  <p class="lede">Things a person may need to look at. These are inputs to a
  review rather than conclusions: the platform can say a tool has no recorded
  decision, and cannot say whether that is a problem.</p>
  ${inputs.length ? `<ul class="inputs">
    ${inputs.map(([, text, target]) =>
      `<li><a href="#${target}">${esc(text)}</a></li>`).join('')}
  </ul>` : `<p class="lede">Nothing outstanding in this window. That is a real
  answer for a small estate, and it is also what an estate with no collectors
  reporting looks like: ${e.sources_reporting} of ${e.sources_known} expected
  sources are reporting.</p>`}

  <h3 style="margin-top:26px;font-size:14px">Evidence snapshot</h3>
  <p class="lede">A checksummed statement of the counts above, for the stated
  window, with the registry and governance files identified by hash. Generated
  on demand and not stored. Not reproducible, because log retention may mean
  the same window returns less later; tamper-evident, because the manifest
  carries a digest of itself with that field omitted.
  <a href="/api/evidence?download=true" style="color:var(--pri)">Download JSON</a></p>`;
}

// One string setting as an editable row: input, save, and where the value
// came from. The password key reports {set, source} rather than a value,
// so its input is always blank and saving blank CLEARS it - said in the
// note rather than discovered.
function settingRow(key, label, placeholder, note) {
  const s = (SETTINGS && SETTINGS.settings || {})[key] || {value: '', source: 'unset'};
  const secret = !('value' in s);
  const src = s.source === 'db'
    ? (s.env ? `Saved in the portal, shadowing the deployment's value; clearing falls back to it.` : 'Saved in the portal.')
    : s.source === 'env' ? `From the deployment; saving here overrides it without touching the deployment.` : '';
  const secretNote = secret
    ? (s.set ? 'A value is set (never shown). Leave blank and save to CLEAR it; type and save to replace it.' : 'Not set.')
    : '';
  return `<dt>${esc(label)}</dt><dd>
    <input id="set-${esc(key)}" class="mfield" style="min-width:340px"
      ${secret ? 'type="password" autocomplete="off"' : ''}
      placeholder="${esc(placeholder)}"
      value="${secret ? '' : esc(s.value || '')}">
    <button class="mini" data-act="save-setting" data-key="${esc(key)}">save</button>
    <div class="src-note">${esc(note)}${note ? ' ' : ''}${secretNote || src}</div></dd>`;
}

// The last result of a connection test, rendered where its button lives.
function testNote(which) {
  const t = TESTS[which];
  if (!t) return '';
  const bits = [];
  if (t.ok) bits.push('<span class="pill p-ok">ok</span>');
  else bits.push('<span class="pill p-warn">failed</span>');
  if (t.version) bits.push('receiver ' + esc(t.version));
  if (t.url) bits.push('<span class="mono">' + esc(t.url) + '</span>');
  if (t.detail) bits.push(esc(t.detail));
  if (t.hint) bits.push('<i>' + esc(t.hint) + '</i>');
  (t.warnings || []).forEach(w => bits.push('<span style="color:var(--warn)">' + esc(w) + '</span>'));
  return `<div class="src-note" style="margin-top:6px">${bits.join(' · ')}</div>`;
}

// The log-store step/card, shared by the wizard and the Settings view. The

// The first-run wizard: everything a fresh managed install needs, in
// order, on one page. Every step is skippable and everything here is

async function wizard() {
  if (!CFG.managed || !CFG.managed.enabled) return managedGate('Setup wizard')
    || '<h2>Setup wizard</h2>';
  if (!REGTOOLS) {
    const r = await mfetch('/api/registry-tools');
    if (!r.ok) { if (r.status === 401) { sessionLost(); return ''; } REGTOOLS = []; }
    else REGTOOLS = (await r.json()).tools || [];
  }
  if (!GOVDECS) {
    const r = await mfetch('/api/governance-decisions');
    GOVDECS = r.ok ? (await r.json()).decisions || [] : [];
  }
  const s = (SETTINGS && SETTINGS.settings) || {};
  const cd = s.corp_domains || {value: [], source: 'unset'};
  const eid = (s.extension_id || {}).value || '';
  const decided = {};
  GOVDECS.forEach(d => { decided[d.tool_id] = d.status; });
  const yearOut = new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10);
  const LABEL = {approved: ['approved', 'p-ok'],
                 not_approved: ['not approved', 'p-warn']};

  const toolRow = t => {
    const d = decided[t.id];
    const state = d && LABEL[d]
      ? `<span class="pill ${LABEL[d][1]}">${LABEL[d][0]}</span>`
      : d ? `<span class="pill p-acc">${esc(d)}</span>`

      <td style="color:var(--mut)">${esc(t.vendor)}</td>
      <td>${state}</td>
      <td><button class="mini" data-act="wiz-approve" data-key="${esc(t.id)}">approve</button>
          <button class="mini" data-act="wiz-notapprove" data-key="${esc(t.id)}">not approved</button></td>
    </tr>`;
  };

  const storeBtn = (k, lbl) => `<button class="mini"
    ${WIZSTORE === k ? 'style="border-color:var(--pri)"' : ''}
    data-act="wiz-store" data-key="${k}">${lbl}</button>`;

  return `<h2>Welcome — set up your deployment</h2>
  <p class="lede">Everything below is optional, editable later under
  Settings, and stored centrally: it takes effect at runtime, so nothing
  needs a redeploy afterwards.</p>
  ${SETMSG ? `<div class="note">${esc(SETMSG)}</div>` : ''}

  <div class="wcard" style="margin-bottom:10px"><h3>1 · Where endpoints reach the receiver</h3>
  <p class="lede" style="margin-bottom:10px">The public URL baked into every
  downloaded artifact. It must resolve from the machines being enrolled -
  not from inside the cluster, and not only from this one. Save, then probe.</p>
  <dl class="kv">
    ${settingRow('receiver_public_url', 'Public receiver URL',
      'https://ai-guard.your-tailnet.ts.net', '')}
  </dl>
  <div style="margin-top:8px">
    <button class="mini" data-act="run-test" data-key="receiver-url">probe the saved URL</button>
  </div>${testNote('receiver-url')}</div>

  <div class="wcard" style="margin-bottom:10px"><h3>2 · The log store</h3>
  <p class="lede" style="margin-bottom:10px">Findings are JSON lines the
  receiver pushes to a Loki-compatible store and the portal reads back.
  Where is yours?</p>
  <div style="margin-bottom:10px">
    ${storeBtn('self', 'self-hosted / in-cluster')}
    ${storeBtn('cloud', 'hosted (Grafana Cloud)')}
    ${storeBtn('none', 'none yet')}
  </div>
  ${WIZSTORE === 'none' ? `<p class="lede">Fine: findings still land on the
    receiver's stdout, so anything scraping container logs keeps them.
    The estate views here stay empty until a store is configured - add one
    later under Settings.</p>`
  : `${WIZSTORE === 'self' ? `<p class="lede">Find the in-cluster service -
    <span class="mono">kubectl get svc -A | grep -i loki</span> - and use
    its base URL, typically
    <span class="mono">http://loki.&lt;namespace&gt;.svc.cluster.local:3100</span>.
    No credentials needed for a typical in-cluster Loki.</p>`
  : `<p class="lede">From Grafana Cloud's Loki details page: the URL, the
    numeric instance id as username, and an access-policy token with
    <b>logs:write AND logs:read</b> - a write-only token stores nothing and
    tells nobody, which is exactly what the tests below catch.</p>`}
  <dl class="kv">${logStoreFields(WIZSTORE === 'cloud')}</dl>
  ${logStoreTests()}`}</div>

  <div class="wcard" style="margin-bottom:10px"><h3>3 · Corporate domains</h3>
  <p class="lede" style="margin-bottom:10px">Accounts on these domains are

  <input id="set-domains" class="mfield" style="min-width:340px"

    value="${esc((cd.value || []).join(', '))}">
  <button class="mini" data-act="save-domains">save</button></div>

  <div class="wcard" style="margin-bottom:10px"><h3>4 · Governance baseline</h3>
  <p class="lede" style="margin-bottom:10px">What your organisation has
  decided about the tools the registry watches for. Touch only the ones you
  have a position on - the rest stay undecided, which is the honest state.

  AI register.</p>
  ${GOVERR ? `<div class="note">${esc(GOVERR)}</div>` : ''}
  <div style="margin-bottom:10px">
    <input id="wiz-owner" class="mfield" value="${esc(WIZOWNER)}"
      placeholder="owner for these decisions, e.g. Security">

  <table><tr><th>tool</th><th>vendor</th><th>decision</th><th></th></tr>

  <div class="wcard" style="margin-bottom:10px"><h3>5 · Browser extension ID</h3>

  <div class="wcard" style="margin-bottom:10px"><h3>6 · Alerting and Grafana (optional)</h3>
  <dl class="kv">
    ${settingRow('alertmanager_url', 'Alertmanager URL',
      'http://alertmanager.monitoring.svc:9093',
      'warn findings page through this; empty means nothing pages.')}
