async function budget() {
  const gate = managedGate('Budget'); if (gate) return gate;
  if (!BUDGET) {
    const r = await mfetch('/api/budget');
    if (!r.ok) return managedError(r, 'Budget');
    BUDGET = await r.json();
  }
  if (!REGTOOLS) {
    const r = await fetch('/api/registry-tools');
    REGTOOLS = r.ok ? (await r.json()).tools || [] : [];
  }
  await bFetchFx();
  if (BCSV) return budgetImport();
  if (BWIZ) return budgetWizard();
  const ro = AUTH && AUTH.role === 'viewer';
  const subs = BUDGET.subscriptions || [];
  const spendParts = bSpendParts(subs);
  const conv = bConverted(subs);
  const spend = conv ? bMoney(conv.total, bPrefCur())
    : spendParts.join(' + ') || '0';
  return `<h2>Budget</h2>
  <p class="lede">The AI tools the organisation pays for, against what the
  estate is observed doing: seats nobody uses, users no seat covers, and
  personal accounts running alongside paid ones. User lists come from a
  vendor's admin API where one exists, or a CSV export where one does not -
  the numbers work the same either way and each card says which it is.</p>
  ${BMSG ? `<div class="note">${esc(BMSG)}</div>` : ''}
  ${subs.length ? `<dl class="stats" style="margin-bottom:14px">
    <div><dt>${spend}</dt><dd>tracked spend / month${conv
      ? ` · ${spendParts.join(' + ')} at ECB ${esc(conv.date)}` : ''}</dd></div>
    <div><dt>${subs.length}</dt><dd>tools linked</dd></div>
  </dl>` : ''}
  ${subs.map(budgetCard).join('')}
  ${subs.length ? '' : `<div class="note">Nothing linked yet. Link a tool
    to record what it costs and see the users-versus-reality picture the
    detection data already holds.</div>`}
  <p style="margin-top:10px">
    ${ro ? '' : '<button class="mini" data-act="b-open">Link a tool</button>'}
    ${subs.length ? '<button class="mini" data-act="b-report">share / export</button>' : ''}</p>
  <p class="src-note">Automatic user sync currently supports
  ${ents((BUDGET.providers) || {}).map(([, p]) => esc(p.label)).join(' and ') || 'no vendors yet'}.
  More vendors will be added for automatic configuration - if you want a
  particular tool, please raise an issue on
  <a href="https://github.com/AmanSK5/shadow-ai-guard/issues" target="_blank" rel="noopener">GitHub</a>.
  ChatGPT Business has no admin API on that plan, so it uses the CSV
  import.</p>`;
}

async function budgetAction(act, el) {
  const key = el ? el.getAttribute('data-key') : '';
  const post = async (path, body) => {
    const r = await mfetch(path, {method: 'POST', body: JSON.stringify(body)});
    if (r.status === 401) { sessionLost(); return null; }
    return r;
  };
  if (act === 'b-open') {
    BMSG = '';
    const seen = new Set(Object.keys(G.tools || {}));
    const first = (REGTOOLS || []).slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .find(t => seen.has(t.id)) || (REGTOOLS || [])[0];
    BWIZ = {step: 1, tool_id: first ? first.id : '',
            source: 'csv', provider: 'anthropic', tiers: [], api_key: '',
            covers: null, currency: bPrefCur()};
    render(); return;
  }
  if (act === 'b-edit') {
    const sub = (BUDGET.subscriptions || []).find(s => s.tool_id === key);
    const conn = (BUDGET.connections || []).find(c => c.tool_id === key);
    BMSG = '';
    BWIZ = {step: 1, editing: true, tool_id: key, vendor: sub.vendor,
            plan: sub.plan, source: conn ? 'api' : 'csv',
            provider: conn ? conn.provider : 'anthropic', api_key: '',
            key_set: !!conn, tiers: sub.seat_tiers || [],
            covers: bCovers(sub).filter(t => t !== key),
            currency: sub.currency, renewal: sub.renewal_date,
            owner: sub.owner};
    render(); return;
  }
  if (act === 'b-report') {
    view = 'budget-report'; detail = null;
    history.replaceState(null, '', '#budget-report');
    drawNav(); render(); return;
  }
  if (act === 'b-report-back') {
    view = 'budget'; detail = null;
    history.replaceState(null, '', '#budget');
    drawNav(); render(); return;
  }
  if (act === 'b-report-names') { BRNAMES = !BRNAMES; render(); return; }
  if (act === 'b-report-print') { window.print(); return; }
  if (act === 'b-report-csv') {
    const stamp = new Date().toISOString().slice(0, 10);
    const blob = new Blob([budgetCsv()], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ai-guard-budget-${stamp}${BRNAMES ? '' : '-anonymised'}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
  if (act === 'b-cancel') { BWIZ = null; BMSG = ''; render(); return; }
  if (act === 'b-source') {
    // The label carries the value: a click on its text lands here before
    // the browser forwards it to the radio, so the checked state cannot
    // be trusted yet - the data-key can.
    bStash();
    BWIZ.source = el.getAttribute('data-key');
    render(); return;
  }
  if (act === 'b-step') { bStash(); BWIZ.step = parseInt(key, 10); render(); return; }
  if (act === 'b-save') {
    bStash();
    const w = BWIZ;
    if (!w.tool_id) { BMSG = 'Pick a tool first.'; render(); return; }
    let r = await post('/api/budget/subscription', {
      tool_id: w.tool_id, vendor: w.vendor || '', plan: w.plan || '',
      currency: (w.currency || '').toUpperCase(), renewal_date: w.renewal || '',
      owner: w.owner || '', covers: w.covers || [],
      seat_tiers: w.tiers || []});
    if (!r) return;
    if (!r.ok) { BMSG = 'Not saved: ' + await _refusal(r); render(); return; }
    if (w.source === 'api' && w.api_key) {
      r = await post('/api/budget/connection', {
        tool_id: w.tool_id, provider: w.provider, api_key: w.api_key});
      if (!r) return;
      if (!r.ok) { BMSG = 'Subscription saved, but the connection was refused: '
        + await _refusal(r); BUDGET = null; BWIZ = null; render(); return; }
      const s = await post('/api/budget/sync', {tool_id: w.tool_id});
      if (!s) return;
      const out = s.ok ? await s.json() : {ok: false, detail: await _refusal(s)};
      BMSG = out.ok ? `Linked. Synced ${out.count} members from the vendor.`
        : 'Linked, but the first sync failed: ' + out.detail;
    } else if (w.source === 'csv' && !w.editing) {
      BWIZ = null; BUDGET = null;
      BCSV = {tool_id: w.tool_id, text: '', parsed: null};
      BMSG = '';
      render(); return;
    } else BMSG = w.editing ? 'Saved.' : 'Linked. Add users from the card.';
    BWIZ = null; BUDGET = null; render(); return;
  }
  if (act === 'b-sync') {
    const r = await post('/api/budget/sync', {tool_id: key});
    if (!r) return;
    const out = r.ok ? await r.json() : {ok: false, detail: await _refusal(r)};
    BMSG = out.ok ? `Synced ${out.count} members for ${key}.`
      : `Sync failed for ${key}: ` + out.detail;
    BUDGET = null; render(); return;
  }
  if (act === 'b-unlink') {
    const r = await post('/api/budget/subscription-delete', {tool_id: key});
    if (!r) return;
    BMSG = r.ok ? `Unlinked ${key}. Its users and any stored key went with it.`
      : 'Not unlinked: ' + await _refusal(r);
    BUDGET = null; render(); return;
  }
  if (act === 'b-import') {
    BMSG = ''; BCSV = {tool_id: key, text: '', parsed: null};
    render(); return;
  }
  if (act === 'b-csv-parse') {
    BCSV.text = document.getElementById('b-csv').value;
    BCSV.parsed = parseUsersCsv(BCSV.text);
    BMSG = ''; render(); return;
  }
  if (act === 'b-csv-cancel') { BCSV = null; BMSG = ''; render(); return; }
  if (act === 'b-csv-save') {
    const r = await post('/api/budget/members', {
      tool_id: BCSV.tool_id, source: 'csv', members: BCSV.parsed.members});
    if (!r) return;
    BMSG = r.ok ? `Imported ${BCSV.parsed.members.length} members for ${BCSV.tool_id}.`
      : 'Not imported: ' + await _refusal(r);
    if (r.ok) { BCSV = null; BUDGET = null; }
    render(); return;
  }
  if (act === 'b-madd') {
    const email = _val('bm-email-' + key), tier = _val('bm-tier-' + key);
    if (!email) return;
    const sub = (BUDGET.subscriptions || []).find(s => s.tool_id === key);
    const manual = (sub.members || []).filter(m => m.source === 'manual')
      .map(m => ({email: m.email, name: m.name, role: m.role,
                  seat_tier: m.seat_tier}));
    manual.push({email, seat_tier: tier});
    const r = await post('/api/budget/members',
                         {tool_id: key, source: 'manual', members: manual});
    if (!r) return;
    BMSG = r.ok ? '' : 'Not added: ' + await _refusal(r);
    if (r.ok) BUDGET = null;
    render(); return;
  }
  if (act === 'b-mdel') {
    const tool = el.getAttribute('data-tool');
    const sub = (BUDGET.subscriptions || []).find(s => s.tool_id === tool);
    const manual = (sub.members || [])
      .filter(m => m.source === 'manual' && m.email !== key)
      .map(m => ({email: m.email, name: m.name, role: m.role,
                  seat_tier: m.seat_tier}));
    const r = await post('/api/budget/members',
                         {tool_id: tool, source: 'manual', members: manual});
    if (!r) return;
    if (r.ok) BUDGET = null;
    render(); return;
  }
}

// Set, accept or clear a finding's lifecycle status, then refresh the
// local copy so the row shows the answer that was just recorded.
async function paWrite(key, status, reason) {
  const r = await mfetch('/api/finding-status', {method: 'POST',
    body: JSON.stringify({key, status: status || '', reason: reason || ''})});
  if (r.status === 401) { sessionLost(); return; }
  if (r.ok) {
    const fr = await mfetch('/api/finding-status');
    if (fr.ok) {
      PSTAT = {};
      ((await fr.json()).statuses || []).forEach(s => PSTAT[s.key] = s);
    }
  }
  PAFORM = null; render();
}

// The refusal detail from a failed write, for the message line.
async function _refusal(r) {
  let d = r.statusText;
  try { d = (await r.json()).detail || d; } catch (e) { /* keep statusText */ }
  return typeof d === 'string' ? d : 'check the values';
}

async function managedAction(act, el) {
  if (act.startsWith('b-')) return budgetAction(act, el);
  if (act === 'id-download') {
    window.location = '/api/suggest-identities?fmt=csv';
    return;
  }
  if (act === 'id-export') {
    window.location = '/api/identity-map.csv';
    return;
  }
  if (act === 'id-open') {
    IDMSG = '';
    IDPARSE = IDPARSE || {text: '', rows: null, skipped: 0};
    render(); return;
  }
  if (act === 'id-cancel') { IDPARSE = null; IDMSG = ''; render(); return; }
  if (act === 'id-parse') {
    const file = (document.getElementById('id-file') || {}).files;
    const text = file && file[0]
      ? await file[0].text()
      : (document.getElementById('id-csv') || {}).value || '';
    IDPARSE = Object.assign({text}, parseIdentityCsv(text));
    IDMSG = ''; render(); return;
  }
  if (act === 'id-save' || act === 'id-clear') {
    const entries = act === 'id-clear' ? [] : (IDPARSE.rows || []);
    if (act === 'id-clear'
        && !confirm('Clear the identity map saved in the portal? Devices it '
                    + 'attributed become unattributed. A mounted file, if any, '
                    + 'still applies.')) return;
    const r = await mfetch('/api/identity-map', {method: 'POST',
      body: JSON.stringify({entries})});
    if (r.status === 401) { sessionLost(); return; }
    if (!r.ok) { IDMSG = 'Not saved: ' + await _refusal(r); render(); return; }
    const out = await r.json();
    IDMSG = act === 'id-clear'
      ? 'Cleared. Attribution falls back to the mounted file, if there is one.'
      : `Saved ${out.count} rows. Every page re-derives with them now.`;
    IDPARSE = null; IDMAP = null;
    // Attribution runs through the graph, so the page must re-read it
    // rather than re-render yesterday's answer with today's map.
    await load(true);
    return;
  }

  if (act === 'user-create') {
    const role = (document.getElementById('user-role') || {}).value || 'viewer';
    const r = await mfetch('/api/users', {method: 'POST', body: JSON.stringify(
      {username: _val('user-name'), password: _val('user-pass'), role})});
    if (r.status === 401) { sessionLost(); return; }
    USERR = r.ok ? '' : 'Not created: ' + await _refusal(r);
    if (r.ok) USERS = null;
    render(); return;
  }
  if (act === 'user-delete') {
    const r = await mfetch('/api/users/' + el.getAttribute('data-key') + '/delete',
                           {method: 'POST'});
    if (r.status === 401) { sessionLost(); return; }
    USERR = r.ok ? '' : 'Not deleted: ' + await _refusal(r);
    if (r.ok) USERS = null;
    render(); return;
  }
  if (act === 'user-reset-form') { URFORM = el.getAttribute('data-key'); USERR = ''; render(); return; }
  if (act === 'user-reset-cancel') { URFORM = null; render(); return; }
  if (act === 'user-reset') {
    const r = await mfetch('/api/users/' + el.getAttribute('data-key') + '/password',
      {method: 'POST', body: JSON.stringify({new: _val('ur-new')})});
    if (r.status === 401) { sessionLost(); return; }
    USERR = r.ok ? 'Password set. Their old sessions are signed out.'
                 : 'Not reset: ' + await _refusal(r);
    URFORM = null; render(); return;
  }
  if (act === 'pa-ack') { paWrite(el.getAttribute('data-key'), 'acknowledged'); return; }
  if (act === 'pa-accept-form') { PAFORM = el.getAttribute('data-key'); render(); return; }
  if (act === 'pa-cancel') { PAFORM = null; render(); return; }
  if (act === 'pa-accept') {
    paWrite(el.getAttribute('data-key'), 'accepted', _val('pa-reason')); return;
  }
  if (act === 'pa-reopen') { paWrite(el.getAttribute('data-key'), ''); return; }
  if (act === 'do-login' || act === 'do-setup') {
    const body = act === 'do-setup'
      ? {setup_code: _val('li-code'), username: _val('li-user'), password: _val('li-pass')}
      : {username: _val('li-user'), password: _val('li-pass')};
    const r = await mfetch(act === 'do-setup' ? '/api/setup' : '/api/login',
      {method: 'POST', body: JSON.stringify(body)});
    if (r.ok) {
      const o = await r.json();
      AUTH = {mode: 'login', authenticated: true, username: o.username, setup_needed: false};
      // /api/auth also carries the account's role, which gates the
      // account-management card and labels the read-only state.
      try { AUTH = await (await fetch('/api/auth')).json(); } catch (e) { /* keep the basics */ }
      chrome(true); load();
    } else {
      let d = r.statusText;
      try {
        const e = await r.json();
        // 422 is pydantic refusing the shape (a short password, an empty
        // field); its detail is a list, so name the field rule instead.
        d = r.status === 422 ? 'Check the fields: the password needs 12 '
          + 'characters or more and nothing may be empty.' : e.detail || d;
      } catch (e) { /* keep statusText */ }
      showLogin(String(d));
    }
    return;
  }
  if (act === 'wiz-approve' || act === 'wiz-notapprove') {
    const id = el.getAttribute('data-key');
    const approve = act === 'wiz-approve';
    WIZOWNER = _val('wiz-owner'); WIZREVIEW = _val('wiz-review');
    const r = await mfetch('/api/governance-decisions', {method: 'POST',
      body: JSON.stringify({decisions: [{
        tool_id: id,
        status: approve ? 'approved' : 'not_approved',
        owner: _val('wiz-owner'),
        review_due: approve ? _val('wiz-review') : '',
        reason: 'onboarding baseline',
      }]})});
    if (r.ok) { GOVDECS = (await r.json()).decisions || []; GOVERR = ''; REG = null; EV = null; }
    else {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      GOVERR = typeof d === 'string' ? d : 'Check the review date: YYYY-MM-DD.';
    }
    render(); return;
  }
  if (act === 'wiz-finish') {
    const r = await mfetch('/api/settings', {method: 'POST',
      body: JSON.stringify({onboarding_done: true})});
    if (!r.ok) {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      SETMSG = 'Could not finish: ' + d; render(); return;
    }
    SETTINGS = await r.json(); SETMSG = '';
    view = 'setup'; detail = null;
    history.replaceState(null, '', '#setup');
    drawNav(); render(); return;
  }
  if (act === 'reg-add') { REDIT = ''; RPRE = null; RERR = ''; RADV = false; render(); return; }
  if (act === 'reg-cancel') { REDIT = null; RPRE = null; RERR = ''; RADV = false; render(); return; }
  if (act === 'reg-adv') {
    // Toggling into JSON carries the form's current state with it, so
    // nothing typed is lost; toggling back re-renders the form from the
    // JSON if it parses, and stays put with the error if it does not.
    try { RPRE = regEntryFromForm(); RADV = !RADV; RERR = ''; }
    catch (e) { RERR = 'That JSON does not parse: ' + String(e.message || e); }
    render(); return;
  }
  if (act === 'reg-edit') {
    const id = el.getAttribute('data-key');
    const x = (RENTRIES || []).find(r => r.tool_id === id);
    REDIT = id; RPRE = x ? x.entry : null; RERR = ''; RADV = false;
    render(); return;
  }
  if (act === 'reg-suggest') {
    // From the register's "not in registry" row: open the form prefilled
    // with what was observed. A domain-shaped tool name seeds domains.
    const t = el.getAttribute('data-key');
    const slug = t.toLowerCase().replace(/[^a-z0-9-]+/g, '-')
      .replace(/^-+|-+$/g, '').replace(/^[^a-z0-9]+/, '') || 'new-tool';
    RPRE = {id: slug, name: t};
    if (t.indexOf('.') > 0 && t.indexOf(' ') < 0) RPRE.domains = [t.toLowerCase()];
    REDIT = ''; RERR = ''; RADV = false;
    view = 'registry'; detail = null;
    history.replaceState(null, '', '#registry');
    drawNav(); render(); return;
  }
  if (act === 'cand-add') {
    // From the review queue: open the registry form prefilled with what
    // discovery observed and how the classifier read it. Saving the entry
    // is what resolves the candidate - the receiver marks it resolved the
    // moment the registry claims one of its domains, so there is no second
    // "yes I meant it" step.
    const c = (CAND || []).find(x => x.key === el.getAttribute('data-key'));
    if (!c) return;
    const slug = c.name.toLowerCase().replace(/[^a-z0-9-]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'new-tool';
    RPRE = {id: slug, name: c.name};
    if (c.vendor) RPRE.vendor = c.vendor;
    if (REG_CATEGORIES.indexOf(c.category) >= 0) RPRE.category = c.category;
    if ((c.domains || []).length) RPRE.domains = c.domains;
    REDIT = ''; RERR = ''; RADV = false;
    view = 'registry'; detail = null;
    history.replaceState(null, '', '#registry');
    drawNav(); render(); return;
  }
  if (act === 'cand-dismiss') {
    const key = el.getAttribute('data-key');
    const r = await mfetch('/api/candidates/dismiss',
      {method: 'POST', body: JSON.stringify({key})});
    if (!r.ok) {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      alert('Could not dismiss: ' + d);
    } else {
      CAND = (CAND || []).filter(x => x.key !== key);
    }
    render(); return;
  }
  if (act === 'reg-save') {
    let entry;
    try { entry = regEntryFromForm(); }
    catch (e) { RERR = 'That JSON does not parse: ' + String(e.message || e); render(); return; }
    const r = await mfetch('/api/registry-entries',
      {method: 'POST', body: JSON.stringify({entries: [entry]})});
    if (r.ok) {
      RENTRIES = (await r.json()).entries || [];
      REDIT = null; RPRE = null; RERR = ''; RADV = false;
      // The registry feeds everything derived; those views are stale now,
      // the candidates queue included - a saved entry may have resolved one.
      REG = null; REGTOOLS = null; EV = null; CAND = null;
    } else {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      RERR = typeof d === 'string' ? d : 'Check the fields.';
      RPRE = entry;  // the redraw keeps what was typed
    }
    render(); return;
  }
  if (act === 'reg-delete') {
    const id = el.getAttribute('data-key');
    if (!confirm('Delete the custom tool ' + id + '? The fleet stops '
                 + 'scanning for its identifiers on the next check-in.')) return;
    const r = await mfetch('/api/registry-entries',
      {method: 'POST', body: JSON.stringify({delete: [id]})});
    if (!r.ok) {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      alert('Could not delete: ' + d);
    } else { RENTRIES = (await r.json()).entries || []; }
    REG = null; REGTOOLS = null; EV = null; CAND = null;
    render(); return;
  }
  if (act === 'gov-edit') {
    const id = el.getAttribute('data-key');
    GOVPRE = null; GOVERR = '';
    const r = await mfetch('/api/governance-decisions');
    if (r.ok) {
      GOVPRE = ((await r.json()).decisions || []).find(d => d.tool_id === id) || null;
    } else if (r.status === 401) { sessionLost(); return; }
    GOVEDIT = id; render(); return;
  }
  if (act === 'gov-cancel') { GOVEDIT = null; GOVPRE = null; GOVERR = ''; render(); return; }
  if (act === 'gov-save') {
    const id = el.getAttribute('data-key');
    const body = {decisions: [{
      tool_id: id,
      status: _val('gov-status'),
      owner: _val('gov-owner'),
      review_due: _val('gov-review'),
      reason: _val('gov-reason'),
    }]};
    const r = await mfetch('/api/governance-decisions',
      {method: 'POST', body: JSON.stringify(body)});
    if (r.ok) { GOVEDIT = null; GOVPRE = null; GOVERR = ''; REG = null; EV = null; }
    else {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      GOVERR = typeof d === 'string' ? d : 'Check the fields: dates are YYYY-MM-DD.';
      // The redraw prefills from GOVPRE; without this a refusal would also
      // throw away everything the operator just typed.
      GOVPRE = body.decisions[0];
    }
    render(); return;
  }
  if (act === 'gov-clear') {
    const id = el.getAttribute('data-key');
    if (!confirm('Clear the recorded decision for ' + id + '? Status falls '
                 + 'back to the governance file or the registry default.')) return;
    const r = await mfetch('/api/governance-decisions',
      {method: 'POST', body: JSON.stringify({delete: [id]})});
    if (!r.ok) {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      alert('Could not clear the decision: ' + d);
    }
    REG = null; EV = null; render(); return;
  }
  if (act === 'save-markings' || act === 'clear-markings') {
    const marks = act === 'clear-markings' ? null
      : _val('set-classification_markings').split('\n')
          .map(x => x.trim()).filter(Boolean);
    const r = await mfetch('/api/settings',
      {method: 'POST', body: JSON.stringify({classification_markings: marks})});
    if (r.ok) { SETTINGS = await r.json(); SETMSG = 'Saved. Regenerate the extension artifacts to roll it out.'; }
    else if (r.status === 401) { sessionLost(); return; }
    else { let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {} SETMSG = 'Not saved: ' + d; }
    render(); return;
  }
  if (act === 'save-widgets') {
    const catalog = CFG.overview_widget_catalog || {};
    const parts = Object.keys(catalog)
      .filter(k => document.getElementById('ow-' + k)?.checked);
    document.querySelectorAll('[id^="owg-"],[id^="owo-"]').forEach(el => {
      if (el.checked) parts.push('grafana:' + el.getAttribute('data-ref'));
    });
    if (!parts.length) {
      SETMSG = 'Pick at least one widget: an empty list falls back to the '
        + 'default set, which is probably not what unticking everything meant.';
      render(); return;
    }
    const r = await mfetch('/api/settings', {method: 'POST',
      body: JSON.stringify({overview_widgets: parts.join(',')})});
    if (r.status === 401) { sessionLost(); return; }
    if (!r.ok) { SETMSG = 'Not saved: ' + await _refusal(r); render(); return; }
    SETTINGS = await r.json();
    SETMSG = 'Saved. The overview draws these from now on.';
    // The overview reads the effective list from config, and a freshly
    // enabled spend tile needs its data - refetch both so the change is
    // visible on the very next click, not the next full reload.
    try {
      CFG = await (await fetch('/api/config')).json();
      if ((CFG.overview_widgets || []).some(w => w.kind === 'budget_spend')
          && CFG.managed && CFG.managed.enabled && !BUDGET) {
        const br = await mfetch('/api/budget');
        if (br.ok) BUDGET = await br.json();
        await bFetchFx();
      }
    } catch (e) { /* the overview picks it up on its next load */ }
    render(); return;
  }
  if (act === 'save-setting') {
    const key = el.getAttribute('data-key');
    let val = _val('set-' + key);
    // People paste the whole dashboard URL, reasonably. The UID is the
    // segment after /d/, so accept the URL and trim it to the UID.
    if (key === 'grafana_dashboard_uid' && val.indexOf('/d/') >= 0) {
      val = val.split('/d/')[1].split('/')[0].split('?')[0];
    }
    const body = {};
    body[key] = val;
    const r = await mfetch('/api/settings', {method: 'POST', body: JSON.stringify(body)});
    if (r.ok) {
      SETTINGS = await r.json(); SETMSG = 'Saved. It takes effect immediately.';
      // The public URL gates the download buttons through CFG; refresh it
      // so saving in step 1 unlocks step 7 without a reload.
      if (key === 'receiver_public_url') {
        const cr = await fetch('/api/config');
        if (cr.ok) CFG = await cr.json();
      }
      // A newly saved log store should be read from NOW: the boot-time
      // load failed honestly while nothing was configured, and leaving
      // that error standing until a manual refresh reads as broken.
      if (key.indexOf('log_store') === 0) { await load(true); return; }
      // A Grafana change needs a full page load: the CSP that lets the
      // frames render is fixed per document, and this document was served
      // before the change existed. Learned live - saving the URL and
      // opening the Grafana tab showed only the browser's blocked-content
      // message until a manual reload.
      if (key.indexOf('grafana') === 0) { location.reload(); return; }
    } else {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      SETMSG = 'Not saved: ' + (typeof d === 'string' ? d : 'check the value.');
    }
    render(); return;
  }
  if (act === 'run-test') {
    const which = el.getAttribute('data-key');
    const r = await mfetch('/api/test/' + which, {method: 'POST'});
    if (r.status === 401) { sessionLost(); return; }
    let out;
    try { out = await r.json(); } catch (e) { out = {ok: false, detail: r.statusText}; }
    // A 400 ("nothing configured to test") arrives as {detail}; shape it
    // like a result so the note renders it rather than a blank.
    if (out.detail && out.ok === undefined) out = {ok: false, detail: String(out.detail)};
    TESTS[which] = out;
    render(); return;
  }
  if (act === 'wiz-store') {
    WIZSTORE = el.getAttribute('data-key'); render(); return;
  }
  if (act === 'wl-toggle') {
    // Mirror the element rather than flip a flag: the browser applies its
    // own toggle as the click's default action AFTER this handler, so read
    // the settled state a tick later. Flipping blindly goes permanently
    // out of sync the first time the two ever disagree.
    setTimeout(() => {
      const d = document.getElementById('wl-details');
      if (d) WLOPEN = d.open;
    }, 0);
    return;
  }
  if (act === 'open-wizard') {
    view = 'wizard'; detail = null;
    history.replaceState(null, '', '#wizard');
    drawNav(); render(); return;
  }
  if (act === 'ext-open') {
    view = 'extsetup'; detail = null;
    history.replaceState(null, '', '#extsetup');
    drawNav(); render(); return;
  }
  if (act === 'ext-page') {
    EXTPAGE = Math.min(6, Math.max(1, parseInt(el.getAttribute('data-key'), 10) || 1));
    SETMSG = '';
    render(); return;
  }
  if (act === 'save-domains' || act === 'clear-domains' || act === 'save-extid') {
    const body = act === 'save-domains'
      ? {corp_domains: _val('set-domains').split(',').map(s => s.trim()).filter(Boolean)}
      : act === 'clear-domains' ? {corp_domains: null}
      : {extension_id: _val('set-extid')};
    const r = await mfetch('/api/settings',
      {method: 'POST', body: JSON.stringify(body)});
    if (r.ok) { SETTINGS = await r.json(); SETMSG = 'Saved. The fleet hears it on its next check-in.'; }
    else {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      SETMSG = 'Not saved: ' + (typeof d === 'string' ? d : 'check the values.');
    }
    render(); return;
  }
  if (act === 'change-password') {
    const r = await mfetch('/api/password', {method: 'POST', body: JSON.stringify(
      {current: _val('set-curpass'), new: _val('set-newpass')})});
    if (r.ok) SETMSG = 'Password changed. Every other session was signed out.';
    else {
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      // A wrong current password is also a 401, from the receiver rather
      // than the session gate; only the gate's refusal means signed out.
      if (r.status === 401 && String(d).indexOf('current password') < 0) {
        sessionLost(); return;
      }
      SETMSG = 'Password unchanged: ' + (typeof d === 'string' ? d
        : 'the new password needs 12 characters or more.');
    }
    render(); return;
  }
  if (act === 'dismiss-minted') { MINTED = null; render(); return; }
  if (act === 'copy') {
    try { await navigator.clipboard.writeText(el.getAttribute('data-copy') || '');
          el.textContent = 'copied'; } catch (e) { /* clipboard denied */ }
    return;
  }
  if (act === 'mint') {
    const note = (document.getElementById('mint-note')?.value || '').trim();
    const ttl = parseInt(document.getElementById('mint-ttl')?.value || '180', 10) || 180;
    const r = await mfetch('/api/enrollment-tokens',
      {method: 'POST', body: JSON.stringify({note, ttl_days: ttl})});
    if (r.ok) { MINTED = await r.json(); TOKENS = null; }
    else {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      MINTED = {error: String(d)};
    }
    render(); return;
  }
  if (act === 'revoke-token' || act === 'revoke-device') {
    const id = el.getAttribute('data-key');
    const what = act === 'revoke-token' ? 'enrollment token' : 'device credential';
    if (!confirm('Revoke ' + what + ' ' + id + '? This cannot be undone; a '
                 + 'revoked device re-enrolls with a valid enrollment token.')) return;
    const path = act === 'revoke-token'
      ? '/api/enrollment-tokens/' + encodeURIComponent(id) + '/revoke'
      : '/api/devices/' + encodeURIComponent(id) + '/revoke';
    const r = await mfetch(path, {method: 'POST'});
    if (!r.ok) {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      alert('Revoke failed: ' + d);
    }
    FLEET = null; TOKENS = null; render(); return;
  }
  if (act === 'artifact') {
    const kind = el.getAttribute('data-key');
    const r = await mfetch('/api/artifacts/' + encodeURIComponent(kind), {method: 'POST'});
    if (!r.ok) {
      if (r.status === 401) { sessionLost(); return; }
      let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) {}
      alert('Could not generate the artifact: ' + d);
      return;
    }
    // Each artifact mints its own enrollment token, so the tokens list is
    // stale the moment this succeeds.
    TOKENS = null;
    const blob = await r.blob();
    const m = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (m && m[1]) || 'ai-guard-collector';
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
}

// A section remembers which of its views you were last on, so switching
// sections and back does not lose your place.
const SECTAB = {};
const sectionOf = v => NAV.find(s => s.items.some(([id]) => id === v));

function drawNav() {
  const n = document.getElementById('nav');
  const cur = sectionOf(view);
  n.innerHTML = NAV.map(sec => {
    // Personal accounts outstanding. An unexplained number on a nav
    // item reads as a notification of something unspecified.
    const c = sec.id === 'inventory' ? (G.personal_accounts||[]).length : null;
    return `<button data-s="${sec.id}" class="${cur && cur.id===sec.id ? 'on':''}" title="${sec.lbl}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${NAVICONS[sec.id]}</svg>
      <span class="lbl">${sec.lbl}</span>` +
      (c ? `<span class="count" title="${c} personal account${c === 1 ? '' : 's'} seen in this window">${c}</span>` : '') + `</button>`;
  }).join('');
  n.querySelectorAll('button').forEach(b => b.onclick = () => {
    const sec = NAV.find(s => s.id === b.dataset.s);
    view = SECTAB[sec.id] || sec.items[0][0]; detail = null;
    // Replace rather than push: clicking through the nav should not fill the
    // back button with every tab you glanced at.
    history.replaceState(null, '', '#' + view);
    drawNav(); render();
  });
  const fv = document.getElementById('footver');
  if (fv && CFG.version) fv.textContent = 'v' + CFG.version;
}

// The in-page tab bar for sections holding more than one view. The wizard
// and the extension guide belong to no section and get none.
function tabbar() {
  const sec = sectionOf(view);
  if (!sec || sec.items.length < 2) return '';
  return `<div class="tabs">${sec.items.map(([id, lbl]) =>
    `<button data-nav="${id}" class="${view===id?'on':''}">${lbl}</button>`).join('')}</div>`;
}

// Did the estate data actually arrive? Every "none seen, and that is a
// real answer" line on this page is a claim about the ESTATE, and it is
// only true if the read succeeded. A viewer account whose reads are
// refused used to get those same confident sentences over zeros, which
// is the worst failure this product can have: it reports a clean estate
// it never looked at.
const dataOk = () => !loadError;

// The banner that says so, above every view rather than on the one page
// that happened to check.
function loadBanner() {
  if (!loadError) return '';
  const denied = /401|403|login|permission|read-only|forbidden/i.test(loadError);
  return `<div class="note" style="border-color:var(--dstr);margin-bottom:14px">
    <strong>The findings could not be read, so this page is not an answer.</strong>
    <div class="src-note" style="margin-top:4px;font-style:normal">${esc(loadError)}</div>
    <div class="src-note" style="margin-top:6px">${denied
      ? `This account was refused. Reads go through the portal, and this
         deployment has no log-store credential of its own, so they are
         being made with your session - which this role cannot use. An
         admin can fix it for every account by setting
         <span class="mono">RECEIVER_ADMIN_TOKEN</span> on the portal, or
         giving it <span class="mono">LOKI_URL</span> and its own
         credentials. Until then the counts below are zeros because
         nothing was read, not because nothing is happening.`
      : `Every count below is missing rather than zero. Settings >
         Diagnostics records when the last read succeeded and when the
         last one failed.`}</div>
  </div>`;
}

async function render() {
  const sec = sectionOf(view);
  if (sec) SECTAB[sec.id] = view;
  drawNav();
  // A full render is a change of place, so the inspector closes with it.
  if (!detail) { DSTACK = []; document.body.classList.remove('open'); }
  const tb = tabbar() + loadBanner();
  // settings and register each read a second endpoint, so they are async.
  if (view === 'settings') { app.innerHTML = tb + await settings(); return; }
  if (view === 'register') { app.innerHTML = tb + await register(); return; }
  if (view === 'paste') { app.innerHTML = tb + await paste(); return; }
  if (view === 'iso') { app.innerHTML = tb + await iso(); return; }
  if (view === 'fleet') { app.innerHTML = tb + await fleet(); return; }
  if (view === 'tokens') { app.innerHTML = tb + await tokens(); return; }
  if (view === 'wizard') { app.innerHTML = await wizard(); return; }
  if (view === 'extsetup') { app.innerHTML = await extSetup(); return; }
  if (view === 'registry') { app.innerHTML = tb + await registryView(); return; }
  if (view === 'budget') { app.innerHTML = tb + await budget(); return; }
  if (view === 'budget-report') {
    // The report needs the same data the page does, and is linkable, so
    // it fetches for itself rather than assuming someone came via Budget.
    if (!BUDGET) {
      const r = await mfetch('/api/budget');
      if (!r.ok) { app.innerHTML = await managedError(r, 'Budget report'); return; }
      BUDGET = await r.json();
    }
    await bFetchFx();
    app.innerHTML = budgetReport();
    return;
  }
  if (view === 'people') { app.innerHTML = tb + await people(); return; }
  app.innerHTML = tb + ({setup, overview, devices, tools, coverage,
                         dashboard, personal, mcp})[view]();
}
// A detail opens in the inspector beside the list rather than replacing it.
// Opening touches only the drawer, so the list keeps its scroll position;
// a data-open inside the drawer (a device on a tool page) swaps the drawer
// content in place. The drawer keeps its own trail, so drilling from a tool
// into one of its devices offers a back step rather than only the ×.
let DSTACK = [];
function drawDetail() {
  const D = {device: deviceDetail, tool: toolDetail, mcp: mcpDetail};
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = '<button class="dclose" data-open="" title="close">×</button>'
    + (DSTACK.length > 1 ? '<button class="back" data-dback="">‹ back</button>' : '')
    + D[detail[0]](detail[1]);
  drawer.scrollTop = 0;
  document.body.classList.add('open');
}
function open_(kind, key) {
  if (!kind) { detail = null; DSTACK = []; document.body.classList.remove('open'); return; }
  // A click from a list starts a fresh trail; one from inside the drawer
  // extends it.
  if (!document.body.classList.contains('open')) DSTACK = [];
  const top = DSTACK[DSTACK.length - 1];
  if (top && top[0] === kind && top[1] === key) return;
  detail = [kind, key];
  DSTACK.push(detail);
  drawDetail();
}

// One delegated listener rather than an onclick per row. The handlers used to
// be inline, which put a finding's own text inside executable script: a device
// name containing an apostrophe closed the JS string and ran what followed,
// and the only thing standing between a poisoned finding and code in the
// portal's origin was an escape function that did not cover the apostrophe.
//
// A data attribute cannot become code however it is escaped, which is the
// point: the value is read back as a string rather than parsed as part of a
// program. Delegation also means rows rendered after this runs are covered,
// with no listener to attach per render.
app.addEventListener('click', e => {
  const el = e.target.closest('[data-open]');
  if (!el) return;
  const kind = el.getAttribute('data-open');
  open_(kind || null, el.getAttribute('data-key'));
});
// The in-page tabs, delegated for the same reason as the rows: the bar is
// re-rendered with every view.
app.addEventListener('click', e => {
  const el = e.target.closest('[data-nav]');
  if (!el) return;
  view = el.getAttribute('data-nav'); detail = null;
  history.replaceState(null, '', '#' + view);
  drawNav(); render();
});
// Changing the wizard's tool re-suggests what the licence covers: the
// checkboxes belong to the selected tool's licence group, not the page.
app.addEventListener('change', e => {
  if (e.target && e.target.id === 'bw-tool' && BWIZ) {
    BWIZ.tool_id = e.target.value;
    BWIZ.covers = null;
    render();
  }
});
// The Settings sub-tabs, delegated like everything else in #app.
app.addEventListener('click', e => {
  const el = e.target.closest('[data-settab]');
  if (!el) return;
  SETTAB = el.getAttribute('data-settab');
  // In the fragment like every other navigation in this page, so a
  // reload keeps the tab and a colleague can be sent the one you mean.
  history.replaceState(null, '', '#settings/' + SETTAB);
  render();
});
// The per-field i: toggles the note in the field's own dd. Delegated on
// document rather than #app so fields rendered anywhere - Settings, the
// wizard, the extension guide - get it for free.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-info]');
  if (!el) return;
  const dt = el.closest('dt');
  const note = dt && dt.nextElementSibling
    ? dt.nextElementSibling.querySelector('.fnote') : null;
  if (note) { note.classList.toggle('shown'); el.classList.toggle('on'); }
});
// The inspector lives outside #app, so it needs the same delegation the
// views get: its close button and the rows inside a detail both use
// data-open, and anything action-shaped uses data-act.
const drawerEl = document.getElementById('drawer');
drawerEl.addEventListener('click', e => {
  const el = e.target.closest('[data-open]');
  if (!el) return;
  open_(el.getAttribute('data-open') || null, el.getAttribute('data-key'));
});
drawerEl.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) managedAction(el.getAttribute('data-act'), el);
});
drawerEl.addEventListener('click', e => {
  if (!e.target.closest('[data-dback]')) return;
  DSTACK.pop();
  detail = DSTACK[DSTACK.length - 1];
  drawDetail();
});
document.getElementById('overlay').addEventListener('click', () => open_(null));
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('open')) open_(null);
});
// Managed actions, same delegation for the same reason. A separate listener
// rather than branches in the one above, because data-open is navigation and
// data-act is a side effect, and a row carrying both should do both.
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) managedAction(el.getAttribute('data-act'), el);
});
// Someone editing the fragment, or arriving on a link to a view.
window.addEventListener('hashchange', () => {
  const h = fromHash();
  if (h !== view) { view = h; detail = null; drawNav(); render(); }
});
// Enter in a login field is the same as clicking its button. Delegated like
// the clicks, because the form is re-rendered on every failed attempt.
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (!e.target.matches || !e.target.matches('#li-user,#li-pass,#li-code')) return;
  const btn = app.querySelector('[data-act="do-login"],[data-act="do-setup"]');
  if (btn) btn.click();
});
q.oninput = e => { filter = e.target.value.toLowerCase(); detail = null; render(); };
document.getElementById('refresh').onclick = () => load(true);
// Theme and sidebar width are the viewer's own habits, so they live in this
// browser rather than in a setting every operator would share.
function setTheme(t) {
  if (t === 'dark') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('aiguard-theme', t); } catch (e) {}
}
document.getElementById('themebtn').onclick = () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  // Re-render: the Grafana frames carry the theme in their URL, and an
  // embedded dark dashboard on a light page reads as a broken frame.
  render();
};
try { if (localStorage.getItem('aiguard-theme') === 'dark') setTheme('dark'); } catch (e) {}
const fold = document.getElementById('fold');
fold.onclick = () => {
  const on = document.getElementById('shell').classList.toggle('collapsed');
  fold.textContent = on ? '»' : '«';
  fold.title = on ? 'expand sidebar' : 'collapse sidebar';
  try { localStorage.setItem('aiguard-side', on ? '1' : ''); } catch (e) {}
};
try { if (localStorage.getItem('aiguard-side')) fold.onclick(); } catch (e) {}
document.getElementById('signout').onclick = async () => {
  await mfetch('/api/logout', {method: 'POST'});
  AUTH = {mode: 'login', authenticated: false, username: '', setup_needed: false};
  showLogin('Signed out.');
};
boot();
</script>
