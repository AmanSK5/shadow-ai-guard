// ------------------------------------------------- extension setup guide --
// The pack-and-host workflow from extension/README.md as six short pages,
// so setting the extension up needs neither a checkout nor the README:
// the source download is pre-configured, the update manifests are
// generated, and the hosting URLs are probed. Reachable from the wizard's
// step 5 and from Settings; every value it saves is the same central
// setting the flat Settings rows edit.
let EXTPAGE = 1;

function extSettingsState() {
  const s = (SETTINGS && SETTINGS.settings) || {};
  const v = k => ((s[k] || {}).value || '');
  return {
    id: v('extension_id'), crx: v('extension_crx_url'),
    upd: v('extension_update_url'), gecko: v('firefox_extension_id'),
    xpi: v('extension_xpi_url'), mode: v('paste_guard_mode'),
  };
}

// The wizard step-5 summary: where extension setup stands, at a glance.
function extStatusRows() {
  const st = extSettingsState();
  const pill = val => val
    ? `<span class="pill p-ok">set</span> <span class="mono" style="font-size:11px">${esc(val)}</span>`
    : '<span class="none">not set</span>';
  return `<dl class="kv">
    <dt>Chromium extension ID</dt><dd>${pill(st.id)}</dd>
    <dt>Chromium hosting</dt><dd>${pill(st.crx && st.upd ? 'crx + updates.xml URLs' : st.crx || st.upd)}</dd>
    <dt>Firefox (optional)</dt><dd>${pill(st.gecko && st.xpi ? st.gecko : st.gecko || st.xpi)}</dd>
    <dt>Paste guard mode</dt><dd><span class="pill ${st.mode === 'block' ? 'p-warn' : 'p-ok'}">${esc(st.mode || 'warn (default)')}</span></dd>
  </dl>`;
}

const extCmd = c => `<div style="display:flex;gap:8px;align-items:flex-start;margin:8px 0">
  <pre class="mono" style="margin:0;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;overflow-x:auto;flex:1;font-size:12px">${esc(c)}</pre>
  <button class="mini" data-act="copy" data-copy="${esc(c)}">copy</button></div>`;

async function extSetup() {
  const gate = CFG.managed && CFG.managed.enabled
    ? '' : (managedGate('Extension setup') || '<h2>Extension setup</h2>');
  if (gate) return gate;
  const st = extSettingsState();
  const ver = (CFG.managed && CFG.managed.extension_version) || '';
  const rx = (CFG.managed && CFG.managed.receiver_public_url_default) || '';
  const ready = CFG.managed && CFG.managed.artifacts_ready;
  const crxName = 'ai-guard-' + (ver || 'VERSION') + '.crx';
  const xpiName = 'ai-guard-' + (ver || 'VERSION') + '.xpi';

  const PAGES = [
    ['Download', !!ready],
    ['Pack', null],
    ['Identity', !!st.id],
    ['Host it', !!(st.crx && st.upd)],
    ['Firefox', !!(st.gecko && st.xpi)],
    ['Behaviour', null],
  ];
  const chips = PAGES.map(([t, done], i) => `<button class="mini"
    ${EXTPAGE === i + 1 ? 'style="border-color:var(--pri);color:var(--pri)"' : ''}

  const dlBtn = (kind, label) => `<button class="mini" style="padding:6px 14px"
    data-act="artifact" data-key="${kind}">${label}</button>`;

  if (EXTPAGE === 1) body = `
    <h3>Download the pre-configured source</h3>
    <p class="lede">The extension is not on a web store: you pack it once and

    extension source shipped with this portal${ver ? ` (version ${esc(ver)})` : ''},
    with its manifest already pointed at
    <span class="mono">${esc(rx || 'your receiver')}</span> - the one edit
    packing needs. Unzip it somewhere you will keep: repacking a later
    release must use the same folder name and the same key.</p>
    ${ready ? dlBtn('extension-source', 'download the extension source (zip)')
      : '<div class="note">No public receiver URL yet - the manifest bakes the origin your browsers report to. Save one in the wizard\'s step 1 (or Settings) and this download appears.</div>'}
    <p class="src-note">If the receiver URL ever changes, download again and
    repack - the extension reads no central config, so the origin lives in
    the package. Trimming the covered AI sites is possible too (edit
    host_permissions and both content_scripts match lists together), but the

  if (EXTPAGE === 2) body = `
    <h3>Pack it, and keep the key</h3>
    <p class="lede">Packing happens in any Chromium browser on your own
    machine and produces two files: the extension package (.crx) and its
    signing key (.pem).</p>
    <ol class="lede" style="line-height:2">
      <li>Open <span class="mono">chrome://extensions</span>, switch on
        <b>Developer mode</b> (top right).</li>
      <li><b>Pack extension</b> → root directory = the unzipped
        <span class="mono">ai-guard-extension</span> folder. Leave the key

      <li>You get <span class="mono">ai-guard-extension.crx</span> and

    <p class="lede" style="margin-top:10px">Derive the 32-letter extension id

    ${extCmd("openssl rsa -in ai-guard-extension.pem -pubout -outform DER 2>/dev/null | shasum -a 256 | cut -c1-32 | tr '0-9a-f' 'a-p'")}
    <p class="lede">Then pin the identity so every future repack keeps the
    same id: derive the public key,</p>
    ${extCmd('openssl rsa -in ai-guard-extension.pem -pubout -outform DER 2>/dev/null | openssl base64 -A; echo')}
    <p class="lede">add it to <span class="mono">manifest.json</span> as a

    </dl>`;
  if (EXTPAGE === 4) body = `
    <h3>Host the package</h3>
    <p class="lede">Two small files go on HTTPS anywhere every browser in
    the fleet can fetch: the packed <span class="mono">${esc(crxName)}</span>
    and an update manifest (<span class="mono">updates.xml</span>) that
    points at it. Any static host or artifact pipeline your org already
    trusts works; serve the .crx as
    <span class="mono">application/x-chrome-extension</span>. Two habits

  if (EXTPAGE === 5) body = `

    <p class="lede"><b>1 · Identity.</b> In your unzipped source, edit

    <dl class="kv">

    </dl>

    <h3>What the guard does</h3>

    <dl class="kv">${pasteGuardBehaviourFields()}</dl>
    <p class="lede" style="margin-top:14px">That is the one-time work done.

    <button class="mini" style="padding:6px 14px" data-act="open-wizard">back to the setup wizard</button>`;

  return `<h2>Extension setup</h2>
  <p class="lede">The browser extension, from source to hosted package, one
  step at a time. Nothing here needs a checkout, and every saved value stays
  editable under Settings.</p>
  ${SETMSG ? `<div class="note">${esc(SETMSG)}</div>` : ''}
  <div style="margin:12px 0">${chips}</div>
  <div class="wcard" style="margin-bottom:10px">${body}</div>
  <div style="margin:14px 0">
    ${EXTPAGE > 1 ? `<button class="mini" data-act="ext-page" data-key="${EXTPAGE - 1}">← back</button>` : ''}
    ${EXTPAGE < 6 ? `<button class="mini" data-act="ext-page" data-key="${EXTPAGE + 1}">next →</button>` : ''}

// The first-run wizard: everything a fresh managed install needs, in
// order, on one page. Every step is skippable and everything here is
// editable later (Settings, and the register's edit controls); Finish just
// records that onboarding happened so the portal stops opening here.
async function wizard() {
  if (!CFG.managed || !CFG.managed.enabled) return managedGate('Setup wizard')
    || '<h2>Setup wizard</h2>';
  if (!REGTOOLS) {
    const r = await mfetch('/api/registry-tools');
    if (!r.ok) { if (r.status === 401) { sessionLost(); return ''; } REGTOOLS = []; }
    else REGTOOLS = (await r.json()).tools || [];
  }
  if (!GOVDECS) {
    const r = await mfetch('/api/governance-decisions');
    GOVDECS = r.ok ? (await r.json()).decisions || [] : [];
  }
  const s = (SETTINGS && SETTINGS.settings) || {};
  const cd = s.corp_domains || {value: [], source: 'unset'};
  const eid = (s.extension_id || {}).value || '';
  const decided = {};
  GOVDECS.forEach(d => { decided[d.tool_id] = d.status; });
  const yearOut = new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10);
  const LABEL = {approved: ['approved', 'p-ok'],
                 not_approved: ['not approved', 'p-warn']};

  const toolRow = t => {
    const d = decided[t.id];
    const state = d && LABEL[d]
      ? `<span class="pill ${LABEL[d][1]}">${LABEL[d][0]}</span>`
      : d ? `<span class="pill p-acc">${esc(d)}</span>`
      : '<span class="none">no decision</span>';
    return `<tr><td>${esc(t.name)}</td>
      <td style="color:var(--mut)">${esc(t.vendor)}</td>
      <td>${state}</td>
      <td><button class="mini" data-act="wiz-approve" data-key="${esc(t.id)}">approve</button>
          <button class="mini" data-act="wiz-notapprove" data-key="${esc(t.id)}">not approved</button></td>
    </tr>`;
  };

  const storeBtn = (k, lbl) => `<button class="mini"
    ${WIZSTORE === k ? 'style="border-color:var(--pri)"' : ''}
    data-act="wiz-store" data-key="${k}">${lbl}</button>`;

  return `<h2>Welcome — set up your deployment</h2>
  <p class="lede">Work through the steps top to bottom. Everything here can
  be changed later under Settings, and changes take effect immediately - no
  redeploys.</p>
  ${SETMSG ? `<div class="note">${esc(SETMSG)}</div>` : ''}

  <div class="wcard" style="margin-bottom:10px"><h3>1 · Where your machines reach the receiver</h3>
  <p class="lede" style="margin-bottom:10px">The URL your laptops and servers
  will send findings to. It gets baked into every download below, so it has
  to work from those machines - not just from inside the cluster. That means
  a DNS record pointing this name at your ingress or reverse proxy, plus a
  certificate - unless something like a Tailscale operator handles both for
  you. Save it, then hit probe to check.</p>
  <dl class="kv">
    ${settingRow('receiver_public_url', 'Public receiver URL',
      'https://ai-guard.your-tailnet.ts.net', '')}
  </dl>
  <div style="margin-top:8px">
    <button class="mini" data-act="run-test" data-key="receiver-url">probe the saved URL</button>
  </div>${testNote('receiver-url')}</div>

  <div class="wcard" style="margin-bottom:10px"><h3>2 · The log store</h3>
  <p class="lede" style="margin-bottom:10px">Findings are stored in a
  Loki-compatible log store: the receiver writes to it, this portal reads
  from it. Where is yours?</p>
  <div style="margin-bottom:10px">
    ${storeBtn('self', 'self-hosted / in-cluster')}
    ${storeBtn('cloud', 'hosted (Grafana Cloud)')}
    ${storeBtn('none', 'none yet')}
  </div>
  ${WIZSTORE === 'none' ? `<p class="lede">That's fine - findings still land

    stay empty until you add a store later under Settings.</p>`
  : `${WIZSTORE === 'self' ? `<p class="lede">Find your Loki service -

    its base URL, usually
    <span class="mono">http://loki.&lt;namespace&gt;.svc.cluster.local:3100</span>.

  : `<p class="lede">From Grafana Cloud's Loki details page you need three

  ${extStatusRows()}

    : Math.floor(sec/3600) + 'h ' + Math.round(sec%3600/60) + 'm';

  return `<p class="lede">Read only. Everything except the last card is

  <dl class="kv">

    ${r.loki_last_error && r.loki_last_error_at && r.loki_last_error_at > (r.loki_last_success || 0)

  </dl>

  <div class="wcard" style="margin-bottom:10px"><h3>Access and embedding</h3>

  <p class="src-note">The portal cannot verify any of this. It is passed in as

  ${AUDITLOG === null ? '' : `<div class="wcard" style="margin:10px 0 0"><h3>Recent admin activity</h3>

async function settings() {
  if (!DIAG) {
    try { DIAG = await (await fetch('/api/diagnostics')).json(); }
    catch (e) { return `<h2>Settings</h2><div class="note">Could not read
      diagnostics: ${esc(String(e.message || e))}</div>`; }
  }
  const managed = CFG.managed && CFG.managed.enabled;
  if (managed && !SETTINGS) {
    const r = await mfetch('/api/settings');
    if (r.ok) SETTINGS = await r.json();
    else if (r.status === 401) { sessionLost(); return ''; }
  }
  if (managed && SETTAB === 'diagnostics' && AUDITLOG === null) {
    try {
      const ar = await mfetch('/api/audit?limit=50');
      if (ar.ok) AUDITLOG = (await ar.json()).events || [];
    } catch (e) { /* the card simply stays absent */ }
  }
  if (managed && SETTAB === 'account' && USERS === null
      && AUTH && AUTH.role !== 'viewer') {
    try {
      const ur = await mfetch('/api/users');
      if (ur.ok) USERS = (await ur.json()).users || [];
    } catch (e) { /* the accounts card simply stays absent */ }
  }
  if (!managed || !SETTINGS) return `<h2>Settings and diagnostics</h2>
    ${diagnosticsCards()}`;

  const SGROUPS = {fleet: fleetSettings, connection: connectionSettings,
                   alerting: alertingSettings, account: accountSettings,
                   diagnostics: diagnosticsCards};
  const STABS = [['fleet', 'Fleet'], ['connection', 'Receiver & log store'],
                 ['alerting', 'Alerting & Grafana'], ['account', 'Account'],
                 ['diagnostics', 'Diagnostics']];
  if (!SGROUPS[SETTAB]) SETTAB = 'fleet';
  return `<h2>Settings</h2>
  <p class="lede">Central settings are editable and reach the fleet at
  runtime - a value saved here overrides the matching environment variable.
  Diagnostics is the read-only view: what the portal verified about itself.</p>
  ${SETMSG ? `<div class="note">${esc(SETMSG)}</div>` : ''}
  <div class="tabs">${STABS.map(([id, lbl]) =>
    `<button data-settab="${id}" class="${SETTAB===id?'on':''}">${lbl}</button>`).join('')}</div>
  ${SGROUPS[SETTAB]()}`;
}

function setup() {
  if (loadError) return `<h2>Sources</h2>
    <div class="note">Could not read findings: ${esc(loadError)}</div>

  if (!S) return '<h2>Sources</h2><p class="lede">No status available.</p>';

  const g = S.groups || [];
  return `<h2>Sources</h2>
  <p class="lede">What's reporting and what isn't, worked out from actual

  </dl>

  ${S.reporting === 0 ? `<div class="note">Nothing has reported in the last

  ${g.map(x => `

      <span class="pill ${x.reporting ? 'p-ok' : 'p-mut'}">${x.reporting} of ${x.total}</span></div>

    ${x.sources.map(r => `<tr>
      <td>${esc(r.label)}<br><span class="mono" style="font-size:11px;color:var(--mut)">${esc(r.source)}</span>
        ${r.reporting ? '' : `<details class="how"><summary>how to set this up</summary>
          <div>${esc(r.needs || '')}
          <br><a class="mono" style="font-size:11px;color:var(--acc)"
            href="${esc(docUrl(r.doc))}" target="_blank"
            rel="noopener noreferrer">${esc(r.doc)}</a></div></details>`}
        ${r.artifact && CFG.managed && CFG.managed.artifacts_ready ? `<div style="margin-top:6px">
          <button class="mini" data-act="artifact" data-key="${esc(r.artifact)}">Download pre-configured artifact</button></div>` : ''}</td>
      <td>${r.reporting ? '<span class="pill p-ok">reporting</span>'
                        : '<span class="pill p-mut">not reporting</span>'}</td>
      <td>${r.findings || '—'}</td><td>${r.devices || '—'}</td>
      <td class="nw">${stamp(r.last_seen)}</td>
    </tr>`).join('')}</table></div>`).join('')}

  <div class="tcard" style="padding-bottom:14px">
  <div class="cardhead"><h3>Attaching people to devices</h3>
    <span class="pill ${CFG.identity_map_configured ? 'p-ok' : 'p-mut'}">${
      CFG.identity_map_configured ? 'map configured' : 'no map'}</span></div>
  <p class="lede">Endpoint findings know the machine but only a local
  username; cloud findings know the person but not the machine. Joining the
  two - "this laptop belongs to this person" - needs a lookup only you have:
  your MDM, RMM, CMDB, or a spreadsheet. The portal helps you build that
  file below.</p>
  ${CFG.identity_map_configured ? `<p class="lede">A map is configured.
  ${(() => {
    const un = ents(G.devices || {}).filter(([, d]) => !d.person);
    if (!un.length) return 'Every device it covers has a person attached.';
    return `It does not cover <strong>${un.length}</strong> of
      ${ents(G.devices || {}).length} devices, which show as unattributed -
      a legitimate answer, and one you can shorten:
      <button class="mini" data-nav="people">edit the map on People</button>`;
  })()}</p>`
  : `<details class="how" style="margin:0 0 14px"><summary>how to build the map</summary><div>
  <ol style="padding-left:18px;line-height:2;margin:6px 0">
    <li><a href="/api/suggest-identities?fmt=csv" style="color:var(--pri)">Download
      a proposed map</a>. It matches local usernames against identities from
      your cloud sources, and lists what it couldn't match for you to fill
      in.</li>
    <li>Check every line. These are string matches, and a wrong one puts the
      wrong person's name against someone else's activity.</li>
    <li>Keep the file outside this repository. It links named people to
      machines, so it's personal data - store it with your deployment
      config, not in git.</li>
    <li>Set <code>IDENTITY_MAP</code> to its path. In Docker, mount it read-only;
      in Kubernetes, a ConfigMap or Secret mounted as a file.</li>
  </ol>
  The file is re-read automatically, so edits take effect within
  ${esc(CFG.cache_ttl_seconds || 300)} seconds, no restart needed. Devices
  with no mapping just show as unattributed.</div></details>`}</div>

  ${(S.unexpected || []).length ? `<div class="tcard">
  <div class="cardhead"><h3>Unrecognised sources</h3>
    <span class="pill p-amb">${S.unexpected.length}</span></div>
  <p class="lede">These are reporting, but this portal build doesn't know
  them. Either something newer than this portal, or a custom scanner with its
  own source name. Worth checking either way.</p>
  <table><tr><th>source</th></tr>${S.unexpected.map(u =>
    `<tr><td>${esc(u)}</td></tr>`).join('')}</table></div>` : ''}`;
}

// A way out to the real Grafana. The embedded frames are kiosk mode with a
// fixed window, which is right for a glance and wrong the moment somebody

// configured for the embed to work at all, so linking to it costs nothing.
const openIn = base => `<p class="lede">Embedded below in kiosk mode with a

function dashboard() {
  if (!CFG.grafana_url) return `<h2>Grafana</h2>

    <code>dashboardUid:panelId:Title</code> entries separated by commas, or
    <code>GRAFANA_DASHBOARD_UID</code> to embed a whole dashboard in one frame.
    <br><br>
    Grafana refuses to be framed by default. It needs
    <code>allow_embedding = true</code> (<code>GF_SECURITY_ALLOW_EMBEDDING</code>),
    a cookie <code>SameSite</code> setting that permits the frame, and a decision
    about how the frame authenticates — anonymous access on a locked-down
    Grafana, or an auth proxy. Those are yours to make; the portal cannot make
    them for you.</div>
    <p class="lede">Everything else in the portal works without Grafana -
    this page just adds charts and history.</p>`;

  const base = CFG.grafana_url, panels = CFG.grafana_panels || [];
  const q = 'orgId=1&theme=' + (document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light')

  if (!panels.length && CFG.grafana_dashboard_uid) {

  const bad = panels.filter(p => p.error);
  return `<h2>Grafana</h2>
  ${openIn(base)}
  <p class="lede">Panels embedded from ${esc(base)}. If a frame stays blank,
  Grafana is refusing to be embedded - check <code>allow_embedding</code> and
  the cookie <code>SameSite</code> setting on the Grafana side.</p>
  ${bad.length ? `<div class="note">${bad.map(b => esc(b.error)).join('<br>')}</div>` : ''}
  <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))">

      style="width:100%;height:300px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)"

// ------------------------------------------------------------- managed --
// These two views call the receiver's admin API through the portal, on the
// same session the whole page runs on: the portal forwards the cookie's
// token per request and the receiver authorizes. Nothing to enter, nothing
// held in page script.

function managedGate(title) {
  if (!CFG.managed || !CFG.managed.enabled) return `<h2>${esc(title)}</h2>
  <p class="lede">Managed mode is not configured. Set <code>RECEIVER_URL</code>
  on the portal (and <code>MANAGED_MODE=true</code> on the receiver) to manage
  enrollment tokens and devices from here. The classic file-and-token flow
  keeps working without it.</p>`;
  return '';
}

async function mfetch(path, opts) {
  // Content-Type on every request, body or not: in login mode the portal
  // refuses POSTs without it, which is the CSRF rule cookies made necessary.
  return fetch(path, {...(opts || {}), headers: {
    'Content-Type': 'application/json',
    ...((opts || {}).headers || {})}});
}

async function managedError(r, title) {
  if (r.status === 401) { sessionLost(); return ''; }
  let d = r.statusText;
  try { d = (await r.json()).detail || d; } catch (e) { /* keep statusText */ }
  return `<h2>${esc(title)}</h2><div class="note">${esc(String(d))}</div>`;
}

    <td>${esc(d.agent_version || '—')}</td>

const _val = id => (document.getElementById(id)?.value || '').trim();

// ------------------------------------------------------------- budget --
// What the organisation pays for, joined against what the estate is
// observed doing. The stored half (subscriptions, user lists, connections)
// lives in the receiver; the observed half is the same graph every other
// view reads. The join happens here, in the page, from data both halves
// already sent - no new endpoint learns anything new about anyone.

// A person, normalised for matching: lowercase, letters and digits only.
// The same trick suggest_identity_rows uses server-side, for the same
// reason - jane.smith, Jane Smith and jsmith@ need to have a chance of
// meeting in the middle. A miss here is reported as "not matched", never
// as "not a member", because a name that failed to normalise into an
// email is exactly that: unmatched, not absent.
const bNorm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

// Findings never carry full addresses - the platform stores account
// DOMAINS and identity hints, deliberately - so a user's email is matched
// on its local part against the observed identities and mapped persons.

// Every key a person can be recognised by: the whole string normalised,
// plus the local part normalised when it is an address. The shapes in
// play never agree - an Entra sign-in carries the full UPN
// (jane@corp.example), a roster carries the address, a collector or an
// identity map carries jane.smith or Jane Smith - and the first real
// deployment proved it: whole-string-only matching left the same person
// counted as an unused seat AND an unmatched user.
function bKeys(s) {
  const out = new Set();
  const str = String(s || '');
  const whole = bNorm(str);
  if (whole) out.add(whole);
  if (str.includes('@')) {
    const local = bNorm(str.split('@')[0]);
    if (local) out.add(local);
  }
  return out;
}

// The tools a subscription's licence entitles: its own tool plus the
// stored covers list. Older rows carry an empty covers and mean exactly
// what they always meant - the one tool.
const bCovers = sub => {
  const out = [sub.tool_id];
  (sub.covers || []).forEach(t => { if (!out.includes(t)) out.push(t); });
  return out;
};

// A tier's effective coverage: its own list when it has one, else
// everything the subscription covers.
const bTierCovers = (t, eff) =>
  (t && t.covers && t.covers.length) ? t.covers : eff;

// bObserved across the whole covered set, keeping the per-tool split so
// the card can say HOW the licence is used, not just that it is.
function bObservedMulti(tools) {
  const perTool = {};
  tools.forEach(t => {
    perTool[t] = new Set((((G.tools || {})[t]) || {}).identities || []);
  });
  let devices = 0, unlinked = 0;
  ents(G.devices).forEach(([k, d]) => {
    const hits = tools.filter(t => (d.tools || []).includes(t));
    if (!hits.length) return;
    devices++;
    if (d.person) hits.forEach(t => perTool[t].add(d.person));
    else unlinked++;
  });
  const names = new Set();
  tools.forEach(t => perTool[t].forEach(n => names.add(n)));
  const personal = (G.personal_accounts || [])
    .filter(r => tools.includes(r.tool));
  return {names: [...names], perTool, devices, unlinked, personal};
}

// Which tier a member sits on, by the same forgiving name containment
// the tier table counts with. A single-tier plan claims everyone.
function bTierResolver(tiers, eff) {
  const entries = (tiers || []).map(t => ({t, key: bNorm(t.name)}))
    .filter(e => e.key).sort((a, b) => b.key.length - a.key.length);
  const sole = entries.length === 1 ? entries[0].t : null;
  return m => {
    const k = bNorm(m.seat_tier);
    if (!k) return sole;
    const hit = entries.find(e => k === e.key)
      || entries.find(e => k.includes(e.key));
    return hit ? hit.t : sole;
  };
}

// The whole join for one subscription. "Never observed" is one verdict
// judged against the whole covered set: only someone invisible on every
// covered tool lands in unobserved. Per-tool presence survives on the
// positive side (seenOn), and the entitlement findings are the one place
// per-tool absence appears - framed as seat economics, not absence:
//   unused    - a tier's exclusive tool (premium's claude-code) that a
//               member of that tier has never been seen on
//   uncovered - a member seen on a tool their tier does not cover
function bReconcile(sub) {
  const eff = bCovers(sub);
  const obs = bObservedMulti(eff);
  const keysByTool = {};
  eff.forEach(t => {
    const map = new Map();
    obs.perTool[t].forEach(n => bKeys(n).forEach(k => {
      if (!map.has(k)) map.set(k, new Set());
      map.get(k).add(n);
    }));
    keysByTool[t] = map;
  });
  const tiers = sub.seat_tiers || [];
  const resolveTier = bTierResolver(tiers, eff);
  const matched = [], unobserved = [];
  const usedNames = new Set();
  (sub.members || []).forEach(m => {
    const keys = [...bKeys(m.email), ...bKeys(m.name)];
    const seenOn = eff.filter(t => keys.some(k => keysByTool[t].has(k)));
    seenOn.forEach(t => keys.forEach(k => {
      (keysByTool[t].get(k) || []).forEach(n => usedNames.add(n));
    }));
    const tier = resolveTier(m);
    if (seenOn.length) matched.push({m, tier, seenOn});
    else unobserved.push({m, tier});
  });
  const strangers = obs.names.filter(n => !usedNames.has(n));
  const findings = [];
  if (tiers.length > 1) {
    eff.forEach(tool => {
      const covering = tiers.filter(t => bTierCovers(t, eff).includes(tool));
      tiers.forEach(T => {
        const covers = bTierCovers(T, eff).includes(tool);
        if (covers && covering.length < tiers.length) {
          const ms = matched
            .filter(x => x.tier === T && !x.seenOn.includes(tool))
            .map(x => x.m.email)
            .concat(unobserved.filter(x => x.tier === T)
              .map(x => x.m.email));
          if (ms.length) findings.push(
            {tier: T.name, tool, kind: 'unused', members: ms});
        }
        if (!covers) {
          const ms = matched
            .filter(x => x.tier === T && x.seenOn.includes(tool))
            .map(x => x.m.email);
          if (ms.length) findings.push(
            {tier: T.name, tool, kind: 'uncovered', members: ms});
        }
      });
    });
  }
  return {eff, obs, matched, unobserved, strangers, findings};
}

const CURRENCY_SIGNS = {GBP: '£', USD: '$', EUR: '€'};
function bMoney(n, cur) {
  const v = Math.round(n).toLocaleString('en-GB');
  const sign = CURRENCY_SIGNS[(cur || '').toUpperCase()];
  return sign ? sign + v : (cur ? esc(cur) + ' ' + v : v);
}

// The preferred currency saved in Settings, or ''. A display preference:
// it orders the headline and prefills the wizard, and nothing is ever
// converted - a converted number would drift with the exchange rate
// while the invoices it summarises would not.
const bPrefCur = () => (((SETTINGS && SETTINGS.settings || {})
  .budget_currency || {}).value || '').toUpperCase();

const bSubMonthly = s => (s.seat_tiers || []).reduce(
  (x, t) => x + (t.seats || 0) * (t.unit_price_monthly || 0), 0);

// Monthly totals per currency, preferred first: "£934 + $546" is the
// honest spelling of a mixed estate - one summed number over two
// currencies would be a figure that lies.
function bSpendParts(subs) {
  const byCur = {};
  (subs || []).forEach(s => {
    const c = (s.currency || '').toUpperCase();
    byCur[c] = (byCur[c] || 0) + bSubMonthly(s);
  });
  const pref = bPrefCur();
  return ents(byCur)
    .sort((a, b) => (b[0] === pref) - (a[0] === pref)
      || a[0].localeCompare(b[0]))
    .map(([c, v]) => bMoney(v, c));
}

// The per-currency totals folded into the preferred currency at the
// ECB's daily reference rate (fetched by the receiver, cached half a
// day). Null when there is nothing to convert - no preference, a single
// currency, no rates, or a currency the ECB does not fix - and callers
// then fall back to the per-currency parts, so a rate source that
// cannot answer degrades to the honest breakdown rather than an error.
// A subscription with no currency recorded counts as already-preferred:
// the preference is exactly the currency this organisation thinks in.
function bConverted(subs) {
  const pref = bPrefCur();
  if (!pref || !BFX || !BFX.ok || BFX.base !== pref) return null;
  const byCur = {};
  (subs || []).forEach(s => {
    const c = (s.currency || '').toUpperCase();
    byCur[c] = (byCur[c] || 0) + bSubMonthly(s);
  });
  const foreign = Object.keys(byCur).filter(c => c && c !== pref);
  if (!foreign.length) return null;
  let total = 0;
  for (const [c, v] of ents(byCur)) {
    if (!c || c === pref) total += v;
    else if ((BFX.rates || {})[c]) total += v / BFX.rates[c];
    else return null;
  }
  return {total, date: BFX.date || ''};
}

async function bFetchFx() {
  const pref = bPrefCur();
  if (!pref || (BFX && BFX.base === pref)) return;
  try {
    const r = await mfetch('/api/budget/fx?to=' + encodeURIComponent(pref));
    // The base is kept even on a refusal, so a source that cannot answer
    // is asked once per session, not once per render.
    if (r.ok) BFX = Object.assign({base: pref}, await r.json());
  } catch (e) { /* the per-currency parts are the fallback */ }
}

// One delimited row, with just enough quote handling for "Last, First"
// name cells. Not a general CSV parser and not trying to be one.
function bCsvRow(line, delim) {
  const out = []; let cur = '', q = false;
  for (const c of line) {
    if (q) { if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

const B_EMAIL_RE = /^[^@\s]+@[^@\s]+$/;
const ordinal = n => n + ({1: 'st', 2: 'nd', 3: 'rd'}[n % 10 > 3 || (n % 100 >= 11 && n % 100 <= 13) ? 0 : n % 10] || 'th');

// A pasted member export from any vendor's admin page. The delimiter is
// detected, not assumed: a saved .csv pastes with commas, but copying
// the same rows out of Excel or Numbers puts TABS on the clipboard, and
// the first deployment to try this skipped every row because the parser
// only knew commas. Column mapping is by header name (the spellings the
// vendors actually use - Claude's export is name,email,role,status,seat
// tier; ChatGPT's is email,role,seat type); with no header row, the
// email column is found by looking for an address in the first row.
// Returns {members, skipped} - skipped rows are counted and shown, never
// silently dropped, because an import that quietly lost three rows reads
// as three people who left.
function parseUsersCsv(text) {
  const lines = String(text || '').replace(/^\uFEFF/, '').split(/\r\n|\r|\n/)
    .filter(l => l.trim() && !l.trim().startsWith('#'));
  if (!lines.length) return {members: [], skipped: 0};
  const delim = lines[0].includes('\t') ? '\t'
    : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
  const row = l => bCsvRow(l, delim);
  const head = row(lines[0]).map(h => h.toLowerCase());
  // A header row names columns; a data row contains an address. The
  // distinction matters because "email" appears in both a header cell
  // and jane@example.com's cell.
  const hasHeader = !head.some(h => B_EMAIL_RE.test(h));
  const col = names => head.findIndex(h => names.some(n => h.includes(n)));
  let iEmail, iName = -1, iRole = -1, iTier = -1;
  if (hasHeader) {
    iEmail = col(['email', 'e-mail', 'mail']);
    iName = col(['name', 'member', 'user']);
    iRole = col(['role']);
    iTier = col(['seat', 'tier', 'license', 'licence', 'plan']);
    if (iEmail < 0) return {members: [], skipped: lines.length};
  } else {
    // No header: the email column is wherever the first row keeps its
    // address.
    iEmail = Math.max(0, row(lines[0]).findIndex(c => B_EMAIL_RE.test(c)));
  }
  const members = []; let skipped = 0, extra = 0;
  const seen = new Set();
  lines.slice(hasHeader ? 1 : 0).forEach(l => {
    const cells = row(l);
    if (!hasHeader) extra = Math.max(extra, cells.filter(c => c).length - 1);
    const email = (cells[iEmail] || '').toLowerCase();
    if (!B_EMAIL_RE.test(email) || seen.has(email)) { skipped++; return; }
    seen.add(email);
    members.push({
      email,
      name: iName >= 0 ? (cells[iName] || '') : '',
      role: iRole >= 0 ? (cells[iRole] || '').toLowerCase() : '',
      seat_tier: iTier >= 0 ? (cells[iTier] || '').toLowerCase() : '',
    });
  });
  // headerless: rows carried columns beyond the addresses that nothing
  // could name - the import kept only the emails, and the preview says
  // so out loud, because roles and seat tiers vanishing silently is how
  // an assigned-seats table reads 0 under a full member list.
  return {members, skipped,
          headerless: !hasHeader && extra > 0,
          missing: hasHeader ? {role: iRole < 0, tier: iTier < 0} : null,
          // How the paste was read, for the preview to show: guessing at
          // a delimiter mismatch over a support thread is slower than the
          // page just saying what it decided.
          map: {delim: delim === '\t' ? 'tabs' : delim === ';' ? 'semicolons' : 'commas',
                header: hasHeader,
                cols: {email: iEmail, name: iName, role: iRole, tier: iTier}}};
}

const BPROVIDER_NONE = `ChatGPT Business (Team) has no admin API - OpenAI
  keeps SCIM and the Compliance API for Enterprise - so its users come in
  through the guided import below. That is the vendor's boundary, not this
  page's.`;

function bTierRows(tiers, eff) {
  const rows = [...(tiers || [])];
  while (rows.length < Math.min(4, (tiers || []).length + 2)) rows.push({});
  const covRow = (t, i) => (eff || []).length < 2 ? '' :
    `<div style="margin:-2px 0 8px 2px;font-size:11.5px;color:var(--mut)">covers:
      ${eff.map(tool => `<label style="margin-right:12px;cursor:pointer">
        <input type="checkbox" id="bt-cov-${i}-${esc(tool)}"
          style="min-width:0;margin:0 4px 0 0;accent-color:var(--pri)"
          ${!t.covers || !t.covers.length || t.covers.includes(tool) ? 'checked' : ''}>${esc(tool)}</label>`).join('')}
    </div>`;
  return rows.map((t, i) => `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
    <input id="bt-name-${i}" class="mfield" style="min-width:140px" placeholder="tier, e.g. premium"
      value="${esc(t.name || '')}">
    <input id="bt-seats-${i}" class="mfield" style="min-width:80px" placeholder="seats"
      value="${t.seats != null ? esc(String(t.seats)) : ''}">
    <input id="bt-price-${i}" class="mfield" style="min-width:120px" placeholder="price / seat / month"
      value="${t.unit_price_monthly != null ? esc(String(t.unit_price_monthly)) : ''}">
  </div>${covRow(t, i)}`).join('');
}

function bReadTiers(eff) {
  const tiers = [];
  for (let i = 0; i < 6; i++) {
    const name = _val('bt-name-' + i);
    if (!name) continue;
    const tier = {name,
      seats: parseInt(_val('bt-seats-' + i), 10) || 0,
      unit_price_monthly: parseFloat(_val('bt-price-' + i)) || 0};
    if ((eff || []).length > 1
        && document.getElementById('bt-cov-' + i + '-' + eff[0])) {
      const cs = eff.filter(tool =>
        document.getElementById('bt-cov-' + i + '-' + tool)?.checked);
      // Everything ticked - or nothing, which cannot mean "covers
      // nothing" - reads as the subscription's full coverage.
      tier.covers = (cs.length && cs.length < eff.length) ? cs : [];
    } else tier.covers = (tiers[i] || {}).covers || [];
    tiers.push(tier);
  }
  return tiers;
}

// Read whatever wizard inputs are on screen into BWIZ, so moving between
// steps loses nothing.
function bStash() {
  const w = BWIZ; if (!w) return;
  if (document.getElementById('bw-tool')) w.tool_id = _val('bw-tool');
  if (document.getElementById('bw-vendor')) {
    w.vendor = _val('bw-vendor'); w.plan = _val('bw-plan');
    const boxes = document.querySelectorAll('[id^="bwc-"]');
    if (boxes.length) {
      w.covers = [...boxes].filter(el => el.checked && !el.disabled)
        .map(el => el.id.slice(4));
    }
  }
  if (document.getElementById('bw-source')) {
    w.source = (document.querySelector('input[name="bw-source"]:checked') || {}).value || w.source;
    w.provider = (document.getElementById('bw-provider') || {}).value || w.provider;
    if (document.getElementById('bw-key')) w.api_key = _val('bw-key');
  }
  if (document.getElementById('bt-name-0')) {
    w.tiers = bReadTiers([w.tool_id].concat(w.covers || []));
    w.currency = _val('bw-currency'); w.renewal = _val('bw-renewal');
    w.owner = _val('bw-owner');
  }
}

// Days since an ISO timestamp, or null. Past this many, a member list
// is presumed drifting: on plans with no admin API the import is a
// manual loop, and a card that never says "this is old" lets the loop
// quietly stop while the numbers keep looking authoritative.
const B_STALE_DAYS = 30;
const bAgeDays = at => at ? Math.floor((Date.now() - Date.parse(at)) / 86400000) : null;

function bProvenance(sub, conn) {
  const srcs = new Set((sub.members || []).map(m => m.source));
  const bits = [];
  const stale = (at, verb) => {
    const days = bAgeDays(at);
    return days != null && days > B_STALE_DAYS
      ? ` <span class="pill p-amb">${days}d old - ${verb}?</span>` : '';
  };
  if (conn) {
    if (conn.last_sync_at) {
      bits.push((conn.last_sync_ok
        ? `users synced via API ${when(conn.last_sync_at)}`
        : `last API sync failed ${when(conn.last_sync_at)}: ${esc(conn.last_sync_detail)}`)
        + stale(conn.last_sync_at, 'sync again'));
    } else bits.push('API connection saved, never synced');
  }
  if (srcs.has('csv')) {
    const at = (sub.members.filter(m => m.source === 'csv')
      .map(m => m.updated_at).sort().pop() || '');
    bits.push(`imported from CSV ${when(at)}` + stale(at, 're-import'));
  }
  if (srcs.has('manual')) bits.push('manual entries');
  return bits.join(' · ');
}

function budgetCard(sub) {
  const ro = AUTH && AUTH.role === 'viewer';
  const conn = ((BUDGET.connections || []).find(c => c.tool_id === sub.tool_id)) || null;
  const tiers = sub.seat_tiers || [];
  const monthly = tiers.reduce((a, t) => a + (t.seats || 0) * (t.unit_price_monthly || 0), 0);
  const seats = tiers.reduce((a, t) => a + (t.seats || 0), 0);
  const {eff, obs, matched, unobserved, strangers, findings} = bReconcile(sub);
  const days = sub.renewal_date
    ? Math.ceil((Date.parse(sub.renewal_date) - Date.now()) / 86400000) : null;
  // The tier table counts by the same forgiving containment the
  // resolver matches with; what resolves to nothing is counted and said
  // below the table rather than silently dropped to zero.
  const tierKeys = tiers.map(t => bNorm(t.name)).filter(Boolean)
    .sort((a, b) => b.length - a.length);
  const soleTier = tierKeys.length === 1 ? tierKeys[0] : null;
  const tierOf = {}; let noTier = 0; const oddTiers = {};
  (sub.members || []).forEach(m => {
    const k = bNorm(m.seat_tier);
    if (!k) {
      if (soleTier) tierOf[soleTier] = (tierOf[soleTier] || 0) + 1;
      else noTier++;
      return;
    }
    const hit = tierKeys.find(tk => k === tk)
      || tierKeys.find(tk => k.includes(tk));
    if (hit) tierOf[hit] = (tierOf[hit] || 0) + 1;
    else oddTiers[m.seat_tier] = (oddTiers[m.seat_tier] || 0) + 1;
  });
  const usageBits = m => {
    const u = m.usage || {};
    const b = [];
    if (u.transcripts != null) b.push(u.transcripts + ' transcripts');
    if (u.minutes != null) b.push(u.minutes + ' min');
    return b.join(', ');
  };
  const seenOnByEmail = {};
  matched.forEach(x => { seenOnByEmail[x.m.email] = x.seenOn; });
  const pills = m => eff.length > 1 && (seenOnByEmail[m.email] || []).length
    ? `<br>${seenOnByEmail[m.email].map(t =>
        `<span class="pill p-ok" style="font-size:10px">${esc(t)}</span>`).join(' ')}`
    : '';
  const memberRow = m => `<tr>
    <td>${esc(m.email)}${m.name ? `<br><span style="font-size:11px;color:var(--mut)">${esc(m.name)}</span>` : ''}${pills(m)}</td>
    <td>${esc(m.role || '—')}</td><td>${esc(m.seat_tier || '—')}</td>
    <td>${esc(usageBits(m)) || '<span class="src-note">—</span>'}</td>
    <td>${m.source === 'manual' && !ro
      ? `<button class="mini" data-act="b-mdel" data-tool="${esc(sub.tool_id)}" data-key="${esc(m.email)}">remove</button>`
      : `<span class="pill p-mut">${esc(m.source)}</span>`}</td></tr>`;
  // The same licence linked twice, from before covers existed: name the
  // fold-together steps on the card rather than leave the double count
  // for someone to notice in a spreadsheet.
  const groupOf = {};
  (REGTOOLS || []).forEach(t => { if (t.license_group) groupOf[t.id] = t.license_group; });
  const myGroups = new Set(eff.map(t => groupOf[t]).filter(Boolean));
  const twins = (BUDGET.subscriptions || []).filter(o =>
    o.tool_id !== sub.tool_id && myGroups.has(groupOf[o.tool_id]));
  const findingBlock = f => f.kind === 'unused'
    ? `<details><summary>${f.members.length} ${esc(f.tier)}
        ${f.members.length === 1 ? 'seat' : 'seats'} never observed on
        ${esc(f.tool)} — the ${esc(f.tier)} delta may be unused</summary>
      <p class="src-note">${esc(f.tool)} access is what a ${esc(f.tier)}
      seat buys over the tiers that lack it. A member using the rest of
      the licence but never this counts as observed - this list is seat
      economics, not absence.</p>
      <ul>${f.members.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details>`
    : `<details><summary style="color:var(--warn)">${f.members.length}
        ${esc(f.tier)} ${f.members.length === 1 ? 'seat' : 'seats'} observed
        on ${esc(f.tool)}, which that tier does not cover</summary>
      <p class="src-note">Either the tier's coverage here is recorded too
      narrowly, or these people have access their seat should not grant -
      worth knowing which.</p>
      <ul>${f.members.map(e => `<li>${esc(e)}</li>`).join('')}</ul></details>`;
  return `<div class="wcard" style="margin-bottom:12px"><h3>${esc(sub.tool_id)}
    ${sub.plan ? `<span class="pill p-acc">${esc(sub.plan)}</span>` : ''}
    ${eff.length > 1 ? `<span style="font-size:12px;color:var(--mut);font-weight:normal">covers ${eff.map(esc).join(' + ')}</span>` : ''}</h3>
  ${twins.length ? `<div class="note">${twins.map(o => esc(o.tool_id)).join(', ')}
    ${twins.length === 1 ? 'is' : 'are'} linked separately but
    ${twins.length === 1 ? 'shares' : 'share'} this licence. One licence,
    one subscription: unlink ${twins.map(o => esc(o.tool_id)).join(', ')},
    then edit this one and tick ${twins.length === 1 ? 'it' : 'them'} under
    "also covers" - the spend stops double-counting and observed use
    unifies.</div>` : ''}
  <dl class="stats">
    <div><dt>${bMoney(monthly, sub.currency)}</dt><dd>per month, ${seats} seats</dd></div>
    <div><dt>${(sub.members || []).length}</dt><dd>on the company account</dd></div>
    <div><dt>${matched.length}</dt><dd>of them observed by ai-guard</dd></div>
    <div><dt${unobserved.length ? ' style="color:var(--warn)"' : ''}>${unobserved.length}</dt><dd>people on this licence never observed</dd></div>
    <div><dt${strangers.length ? ' style="color:var(--warn)"' : ''}>${strangers.length}</dt><dd>observed users not matched to a seat</dd></div>
    <div><dt${obs.personal.length ? ' style="color:var(--dstr)"' : ''}>${obs.personal.length}</dt><dd>personal-account uses</dd></div>
  </dl>
  ${seats > (sub.members || []).length ? `<p class="src-note">${seats - (sub.members || []).length}
    of the ${seats} paid seats ${seats - (sub.members || []).length === 1 ? 'is' : 'are'}
    assigned to nobody on the user list - the cheapest saving here, and not
    counted in any figure above.</p>` : ''}
  ${eff.length > 1 && matched.length ? `<p class="src-note">observed on:
    ${eff.map(t => `${esc(t)} ${matched.filter(x => x.seenOn.includes(t)).length}`).join(' · ')}
    — one licence, several surfaces; a member seen on any of them counts
    as observed.</p>` : ''}
  ${days != null ? `<p class="src-note">renews ${when(sub.renewal_date)}
    ${days <= 30 ? `<span class="pill p-amb">${days <= 0 ? 'past due' : 'in ' + days + 'd'}</span>` : ''}
    ${sub.owner ? ' · owner: ' + esc(sub.owner) : ''}</p>` : ''}
  ${tiers.length ? `<table class="plain"><tr><th>tier</th><th>seats paid</th><th>assigned to users</th><th>price/seat</th><th>monthly</th>${eff.length > 1 ? '<th>covers</th>' : ''}</tr>
    ${tiers.map(t => `<tr><td>${esc(t.name)}</td><td class="num">${t.seats}</td>
      <td class="num">${tierOf[bNorm(t.name)] || 0}</td>
      <td class="num">${bMoney(t.unit_price_monthly, sub.currency)}</td>
      <td class="num">${bMoney((t.seats || 0) * (t.unit_price_monthly || 0), sub.currency)}</td>
      ${eff.length > 1 ? `<td>${bTierCovers(t, eff).map(esc).join(', ')}</td>` : ''}</tr>`).join('')}</table>` : ''}
  ${tiers.length && noTier ? `<p class="src-note">${noTier} user${noTier === 1 ? '' : 's'} carr${noTier === 1 ? 'ies' : 'y'} no seat tier${conn && conn.last_sync_at ? ' - the vendor API does not report tiers; a CSV import or the add-member row sets them' : ''}.</p>` : ''}
  ${ents(oddTiers).length ? `<p class="src-note" style="color:var(--warn)">User tiers matching no tier above: ${ents(oddTiers).map(([v, n]) => `"${esc(v)}" (${n})`).join(', ')}. Rename a tier in edit, or re-import, to line them up.</p>` : ''}
  ${(sub.members || []).length ? `<details style="margin-top:8px"><summary>Users
      (${(sub.members || []).length}) — ${bProvenance(sub, conn) || 'manual'}</summary>
    <table><tr><th>member</th><th>role</th><th>seat</th>
      <th title="Usage the vendor's own API reports. Only some vendors expose it, and a licence whose users come from a CSV import has none.">vendor usage</th><th>source</th></tr>
    ${(sub.members || []).map(memberRow).join('')}</table></details>`
    : `<p class="src-note">No users yet${conn ? ' - run a sync' : ''}.</p>`}
  ${unobserved.length ? `<details><summary>${unobserved.length} paid
      ${unobserved.length === 1 ? 'seat' : 'seats'} with no observed use — downgrade candidates</summary>
    <p class="src-note">"Never observed" means no detection surface has
    matched this member to activity on ${eff.length > 1
      ? 'any tool this licence covers (' + eff.map(esc).join(', ') + ')'
      : esc(sub.tool_id)} in the current
    window. Coverage gaps look the same as absence: check the Sources view
    before acting on this list.</p>
    <ul>${unobserved.map(x => `<li>${esc(x.m.email)}${x.m.seat_tier ? ` <span class="pill p-mut">${esc(x.m.seat_tier)}</span>` : ''}</li>`).join('')}</ul></details>` : ''}
  ${findings.map(findingBlock).join('')}
  ${strangers.length ? `<details><summary>${strangers.length} observed
      ${strangers.length === 1 ? 'user' : 'users'} not matched to any seat</summary>
    <p class="src-note">Observed identities that matched nobody on the
    user list. Matching is by name, and a miss is "unmatched", not proof
    someone is unlicensed - but several of these alongside personal
    accounts below is the shadow-spend picture this page exists for.</p>
    <ul>${strangers.map(n => `<li>${esc(n)}</li>`).join('')}</ul></details>` : ''}

// A cell that cannot be read as a formula by a spreadsheet. The server
// side has csv_safe for the same reason: an exported address beginning
// with = is a live formula in Excel, and this file is written to be
// opened in one.
const B_FORMULA_LEAD = ['=', '+', '-', '@', '\t', '\r'];
function bCsvCell(v) {
  let out = String(v == null ? '' : v);
  if (out && B_FORMULA_LEAD.includes(out[0])) out = "'" + out;
  return /[",\n]/.test(out) ? '"' + out.replace(/"/g, '""') + '"' : out;
}

// One flat table, because the thing a recipient does with this is pivot
// it. row_type says which question each row answers, so seats, the
// people no seat covers, and personal-account use all live in one file
// without pretending to be the same kind of row.
function budgetCsv() {
  const rows = [['row_type', 'licence', 'tool', 'person', 'name', 'role',
                 'seat_tier', 'status', 'seen_on', 'account_domain',
                 'device', 'last_seen', 'source']];
  const who = e => BRNAMES ? e : 'withheld';
  (BUDGET.subscriptions || []).forEach(sub => {
    const {eff, obs, matched, unobserved, strangers} = bReconcile(sub);
    const cov = eff.join(' + ');
    matched.forEach(x => rows.push(['seat', cov, sub.tool_id,
      who(x.m.email), who(x.m.name || ''), x.m.role || '',
      x.m.seat_tier || (x.tier || {}).name || '', 'observed',
      x.seenOn.join(' '), '', '', '', x.m.source || '']));
    unobserved.forEach(x => rows.push(['seat', cov, sub.tool_id,
      who(x.m.email), who(x.m.name || ''), x.m.role || '',
      x.m.seat_tier || (x.tier || {}).name || '', 'never observed',
      '', '', '', '', x.m.source || '']));
    strangers.forEach(n => rows.push(['unmatched_user', cov, sub.tool_id,
      who(n), '', '', '', 'no seat matched', '', '', '', '', 'observed']));
    obs.personal.forEach(r => rows.push(['personal_account', cov, r.tool,
      who(r.user || ''), '', '', '', 'personal account', '',
      r.account_domain || '', who(r.device_name || r.device || ''),
      (r.last_seen || '').slice(0, 10), (r.sources || []).join(' ')]));
  });
  return rows.map(r => r.map(bCsvCell).join(',')).join('\n') + '\n';
}
