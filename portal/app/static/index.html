<!doctype html>
<meta charset="utf-8">
<title>ai-guard portal</title>
<style>
/* Light is the default and dark is the [data-theme=dark] overlay. The
   variable names are load-bearing: views reference them inline, so both
   themes define the same set and the views never know which is active. */
:root{
  --bg:#f6f6f3; --fg:#1c2024; --sf:#ffffff; --sf2:#eef0ec;
  --pri:#177245; --acc:#0e6e8c; --warn:#8a5b00; --dstr:#b3261e;
  --mut:#5c636e; --bd:#e4e5e0; --line:var(--bd);
  --pri-soft:#e7f3ec; --acc-soft:#e3f0f5; --warn-soft:#fdf0d3; --dstr-soft:#fbeae9;
  --shadow:0 1px 2px rgba(20,24,28,.05),0 4px 16px rgba(20,24,28,.05);
  /* The sidebar keeps its own palette: midnight navy from the logo's hood,
     the same in both themes, so the chrome holds still while content adapts. */
  --side:#131b29; --side-ink:#e1e7ef; --side-mut:#8d99ab;
  --side-line:rgba(255,255,255,.08); --side-on:rgba(94,199,222,.13); --side-on-ink:#7cd4e6;
}
[data-theme=dark]{
  --bg:#14171b; --fg:#e8eaed; --sf:#1d2126; --sf2:#262b31;
  --pri:#46c07f; --acc:#67c1dd; --warn:#e3b341; --dstr:#f28b82;
  --mut:#9aa3ad; --bd:#2b313a;
  --pri-soft:#1c3328; --acc-soft:#12303a; --warn-soft:#33290f; --dstr-soft:#3a1f1d;
  --shadow:none;
  --side:#0f1520; --side-line:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
/* Monospace is reserved for what earns it: serials, domains, tokens, URLs. */
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.shell.collapsed{grid-template-columns:66px 1fr}
/* Signed out there is no navigating to do, so there is no sidebar: the
   sign-in card is the whole page. */
body.auth aside{display:none}
body.auth .shell{grid-template-columns:1fr}
aside{background:var(--side);color:var(--side-ink);padding:16px 0 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;padding:2px 14px 14px;min-height:46px}
.brand img{display:block;width:100%;max-width:180px;height:auto}
/* Collapsed, the wordmark crops down to the hooded-figure mark. */
.collapsed .brand{padding:2px 0 12px;justify-content:center}
.collapsed .brand img{width:28px;height:44px;max-width:none;object-fit:cover;object-position:left center}
aside nav{flex:1;padding:4px 10px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-radius:8px;color:var(--side-mut);font:inherit;font-weight:500;cursor:pointer;
  padding:8px 10px;margin:1px 0}
nav button svg{flex:none;opacity:.8}
nav button:hover{background:rgba(255,255,255,.06);color:var(--side-ink)}
nav button.on{background:var(--side-on);color:var(--side-on-ink)}
nav button.on svg{opacity:1}
nav .count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;opacity:.7}
.collapsed nav button{justify-content:center;padding:10px 0}
.collapsed nav .lbl,.collapsed nav .count,.collapsed .foot .txt{display:none}
.fold{background:none;border:1px solid var(--side-line);border-radius:8px;color:var(--side-mut);
  font:inherit;font-size:13px;cursor:pointer;padding:5px 0;width:calc(100% - 20px);margin:8px 10px 6px}
.fold:hover{color:var(--side-ink);border-color:var(--side-mut)}
.foot{padding:12px 16px 0;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-mut);line-height:1.8}
.foot a{color:var(--side-mut);text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover{color:var(--side-on-ink);border-bottom-color:rgba(124,212,230,.4)}
.topbar{display:flex;gap:14px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--bd);
  position:sticky;top:0;background:var(--sf);z-index:5}
.search{flex:0 1 380px;display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--bd);border-radius:8px;padding:6px 12px;color:var(--mut)}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--fg);width:100%;min-width:0;padding:0}
/* Centred with a cap, for the same reason as before: uncapped tables spread
   five columns across the whole of a 2560 screen for no gain. */
main{padding:22px 26px 60px;max-width:1280px;margin:0 auto}
/* Section tabs, for the views that share a sidebar entry. */
.tabs{display:flex;gap:2px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;
  padding:3px;width:max-content;max-width:100%;overflow-x:auto;margin:0 0 18px}
.tabs button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--mut);
  padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--pri-soft);color:var(--pri)}
.tabs button:hover:not(.on){color:var(--fg)}
/* Flex rather than a fixed 12 column grid. The widget list is a deployment
   choice, so most counts do not divide evenly into a rigid grid and the last
   row ends up with a hole in it. Growing the items instead means any number
   fills its row. */
.grid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.grid>*{flex:1 1 auto;min-width:0}
.w6{flex-basis:46%}.w4{flex-basis:30%}.w12{flex-basis:100%}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.w6,.w4{flex-basis:100%}}
.wcard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
.wcard h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
.bar span:first-child{width:130px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:8px;background:var(--pri);border-radius:99px;min-width:2px}
.bar i.alt{background:var(--warn)}
.bar span:last-child{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--mut);font-size:12.5px}
.kv dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;overflow-wrap:anywhere}
.src-note{color:var(--mut);font-size:11.5px;font-style:italic;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow)}
.stats dt{font-size:25px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stats dd{margin:3px 0 0;font-size:12px;color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--pri) 50%,transparent)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:600}
.card .sub{color:var(--mut);font-size:12.5px}
.pill{display:inline-block;white-space:nowrap;border-radius:6px;padding:1.5px 8px;font-size:12px;
  font-weight:550;margin:2px 4px 2px 0;background:var(--sf2);color:var(--mut)}
.nw{white-space:nowrap}
/* One status language everywhere: green is fine, red needs attention,
   cyan is classification, grey is neutral. */
.p-warn{background:var(--dstr-soft);color:var(--dstr)}
.p-ok{background:var(--pri-soft);color:var(--pri)}
.p-mut{background:var(--sf2);color:var(--mut)}
.p-acc{background:var(--acc-soft);color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--mut);border-bottom:1px solid var(--bd);
  padding:7px 12px 7px 0;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 12px 8px 0;border-bottom:1px solid color-mix(in srgb,var(--bd) 55%,transparent);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:0}
tr[data-open]:hover td{background:color-mix(in srgb,var(--pri-soft) 45%,transparent)}
/* The register, as cards.
   -------------------------------------------------------------------------
   A register is read one tool at a time as often as it is scanned, so the
   table shape was never load-bearing. Cards drop the width problem entirely:
   auto-fill gives two per row at typical widths, one on a narrow window and
   three on a wide monitor, with no breakpoint to keep in step and no
   horizontal scrolling at any width. Fields that were columns are labelled
   rows inside a card, which also removes the thing no amount of width tuning
   fixed: a header three columns away from the value it describes. */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
/* Name and decision on one line, because those are the two things someone
   scanning is looking for. */
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.card-name{font-size:15.5px;font-weight:650}
.card-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--mut);
           margin-top:2px;overflow-wrap:anywhere}
.card hr{border:0;border-top:1px solid color-mix(in srgb,var(--bd) 55%,transparent);margin:12px 0}
/* A quiet label rather than another box. The lower block is organisational
   record rather than observation, and the two were reading as one list. */
.card-section{font-size:11px;color:var(--mut);text-transform:uppercase;
              letter-spacing:.08em;margin:0 0 8px}
/* An exception. Its own block rather than a row in the key/value list, because
   it has an id, a scope, a date and a reason, and flattening that into one
   line loses the scope, which is the part that says who it applies to. */
.exc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;margin-bottom:6px;
     display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.exc-scope{color:var(--acc)}
.exc-when{color:var(--mut)}
.exc-why{flex-basis:100%;color:var(--mut);margin-top:1px}
/* Expired, and still shown. Quieter, because it is history rather than
   something currently applying, and struck through would be too loud for a
   record somebody may still want to read. */
.exc-old{opacity:.55}
.exc-old .exc-when{color:var(--dstr)}
/* Label and value, with the label beside its own value rather than three
   columns away from it. */
.card-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.card-kv dt{color:var(--mut);white-space:nowrap}
.card-kv dd{margin:0;overflow-wrap:anywhere}
.card-kv dd .pill{margin:0 4px 0 0}

.gov{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.gov .pill{margin:0}
.gov-sub{font-size:11.5px;color:var(--mut);white-space:nowrap}
.gov-sub.over{color:var(--dstr)}
.gov-owner{white-space:nowrap}
.inputs{margin:0 0 18px;padding-left:20px;font-size:13.5px;line-height:1.9}
.inputs a{color:var(--warn)}
/* No fill, barely-there text. Absence of governance, not a state with equal
   weight to approved or reviewing. */
.none{color:color-mix(in srgb,var(--mut) 70%,transparent);font-size:12px;white-space:nowrap}
/* A zero is the absence of something and should not compete with a real
   count. Without this a row of zeros is as loud as a row of findings. */
td.n .z{color:color-mix(in srgb,var(--mut) 55%,transparent)}
/* The counts split into two questions: how widely is this used, and what is
   it signed into. A rule rather than a gap, because a gap in a dense table
   reads as a missing column. */
th.grp,td.grp{border-left:1px solid color-mix(in srgb,var(--bd) 60%,transparent);padding-left:14px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  color:var(--warn);border-radius:9px;padding:12px 14px;margin-bottom:18px;font-size:13.5px}
.back{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:7px;
  padding:5px 11px;cursor:pointer;font:inherit;font-size:13px;margin-bottom:14px}
.back:hover{color:var(--fg);border-color:var(--mut)}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.lede{color:var(--mut);font-size:13.5px;margin:0 0 16px}
input,select{background:var(--sf2);border:1px solid var(--bd);color:var(--fg);border-radius:7px;padding:6px 10px;font:inherit;min-width:220px}
select.mfield{min-width:160px}
button.mini{font:inherit;font-size:12.5px;font-weight:550;padding:4px 11px;border:1px solid var(--bd);
  border-radius:7px;background:transparent;color:var(--pri);cursor:pointer}
button.mini:hover{border-color:var(--pri)}
.mfield{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--bd);border-radius:7px;
  background:var(--sf2);color:inherit;min-width:260px}
.tokpane{border:1px solid var(--pri);border-radius:9px;padding:12px 14px;margin:14px 0;background:var(--sf)}
.tokpane code{word-break:break-all}
/* The inspector: a device, tool or MCP server opens beside the list rather
   than replacing it, so the list you were scanning stays where it was. */
.overlay{position:fixed;inset:0;background:rgba(15,18,20,.35);opacity:0;pointer-events:none;transition:opacity .18s;z-index:19}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,92vw);background:var(--sf);
  border-left:1px solid var(--bd);box-shadow:-12px 0 40px rgba(15,18,20,.18);z-index:20;
  transform:translateX(102%);transition:transform .2s ease;padding:20px 24px;overflow-y:auto}
body.open .overlay{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.dclose{position:absolute;top:12px;right:14px;background:none;border:0;font-size:22px;
  line-height:1;color:var(--mut);cursor:pointer;padding:4px 8px}
.dclose:hover{color:var(--fg)}
.drawer h2{padding-right:30px}
.drawer .back{margin:0 0 12px}
/* Fold-away guidance. The tables and status stay scannable; the how-to is
   one click away when a silent row is the one being fixed. */
details.how{margin-top:6px;max-width:62ch}
details.how summary{cursor:pointer;font-size:12.5px;color:var(--acc);font-weight:550;list-style:none;width:max-content}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:'▸ '}
details.how[open] summary::before{content:'▾ '}
details.how>div{margin-top:6px;font-size:12.5px;color:var(--mut);line-height:1.55}
/* Per-field help, behind the small i beside the label. A row is label,
   input, save; the sentence about it appears when asked for. */
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:99px;border:1px solid color-mix(in srgb,var(--mut) 65%,transparent);
  background:none;color:var(--mut);font:600 10px/1 ui-monospace,monospace;
  cursor:pointer;margin-left:7px;padding:0;vertical-align:1px}
.info:hover,.info.on{color:var(--acc);border-color:var(--acc)}
.fnote{display:none;max-width:62ch}
.fnote.shown{display:block}
/* Sparklines, deltas, coverage dots: each overview widget gets the visual
   form its question deserves, instead of every one being the same bar. */
.spark{display:block;margin-top:8px}
td .spark,.covrow .spark{margin-top:0}
.trend{font-size:12px;margin-left:6px;vertical-align:3px}
.trend.bad{color:var(--dstr)} .trend.good{color:var(--pri)}
.covrow{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.covrow>span{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.covrow b{font-weight:500;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--mut) 22%,transparent)}
.dots i.on{background:var(--pri)}
table.plain td{border-bottom:0;padding:4.5px 10px 4.5px 0;vertical-align:middle}
.p-amb{background:var(--warn-soft);color:var(--warn)}
/* A list's table sits in a card, so a page of several sections reads as
   several bounded things rather than one run-on column of rows. */
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:6px 16px 10px;box-shadow:var(--shadow);margin-bottom:14px}
.cardhead{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.cardhead h3{margin:0;font-size:12px;font-weight:600;color:var(--mut);
  text-transform:uppercase;letter-spacing:.06em}
/* The share view exists to leave this browser: printed, saved as PDF and
   sent to someone who will never open the portal. So printing drops the
   furniture (sidebar, topbar, buttons, inspector), forces the light
   palette whatever the viewer's theme, and keeps a subscription whole on
   one page where it fits. */
@media print {
  @page { margin: 14mm; }
  html, body { background: #fff !important; color: #111 !important; }
  .shell { display: block !important; }
  aside, .topbar, .drawer, .overlay, .mini, .back, .tabs,
  [data-act], .noprint { display: none !important; }
  main#app { padding: 0 !important; }
  .wcard, table, .rep-block {
    break-inside: avoid; page-break-inside: avoid;
    box-shadow: none !important; background: #fff !important;
    border-color: #bbb !important;
  }
  .rep-head { break-after: avoid; page-break-after: avoid; }
  h2, h3 { break-after: avoid; page-break-after: avoid; color: #111 !important; }
  a { color: #111 !important; text-decoration: none; }
  .stats div { border: 1px solid #ddd !important; }
  dt, dd, td, th, p, li, span { color: #111 !important; }
  .src-note { color: #555 !important; }
}
</style>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="shell" id="shell">
  <aside>
    <div class="brand"><img src="/logo.png" alt="Shadow AI Guard"></div>
    <nav id="nav"></nav>
    <button class="fold" id="fold" title="collapse sidebar">«</button>
    <div class="foot"><span class="txt">
      <div class="mono" id="footver">v</div>
      <div>by Aman Karir</div>
      <div><a href="https://github.com/AmanSK5/shadow-ai-guard" target="_blank" rel="noopener">Source and issues</a></div>
    </span></div>
  </aside>
  <div>
    <div class="topbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        <input id="q" placeholder="filter this view…">
      </div>
      <span id="freshness" class="mono" style="font-size:11px;color:var(--mut)"></span>
      <button id="refresh" class="back" style="margin:0">refresh</button>
      <span id="who" class="mono" style="font-size:11px;color:var(--mut);margin-left:auto"></span>
      <button id="signout" class="back" style="margin:0;display:none">sign out</button>
      <button id="themebtn" class="back" style="margin:0" title="light / dark">◐</button>
    </div>
    <main id="app"></main>
  </div>
</div>
<script>
let G = {devices:{},identities:{},tools:{},bridges:{},unattributed:[],counts:{}};
// Views that read a second endpoint, cached until refresh clears them.
// Declared here rather than beside their views: load() clears them and let
// is not hoisted, so declaring them lower down is a TDZ error on first
// refresh.
let SETTAB = 'fleet';
let DIAG = null;
let REG = null;
let EV = null;
let PG = null;
let FLEET = null;
let TOKENS = null;
let SETTINGS = null;
// Governance editing: which tool's card shows the form, prefill fetched
// from the recorded decision (the row lacks the free-text reason, and an
// owner edit must not silently blank it), and the last refusal to show.
let GOVEDIT = null, GOVPRE = null, GOVERR = '';
// One-line outcome of the last Settings action ("saved", or a refusal).
let SETMSG = '';
// The wizard's second fetches: the registry watchlist and the recorded
// decisions, so the governance baseline shows what stands. Owner and
// review date survive the re-render each decision causes, or the second
// approval would silently carry an empty owner.
let REGTOOLS = null, GOVDECS = null, WIZOWNER = '', WIZREVIEW = '';
// Which log-store shape the wizard's step 2 shows, and the last result of
// each connection test, keyed by API name, so a result survives re-renders.
let WIZSTORE = 'self', TESTS = {};
// The budget view: the fetched spend data, the link-a-tool wizard's state
// (null = closed), the last action's one-line outcome, and a parsed CSV
// preview waiting for confirmation.
let BUDGET = null, BWIZ = null, BMSG = '', BCSV = null, BFX = null;
// The identity map editor on People: the saved rows, a parsed upload
// waiting for confirmation, and the last outcome.
let IDMAP = null, IDPARSE = null, IDMSG = '';
// The share view's one choice: whether people are named. A finance
// recipient needs the names to act; a board pack does not, and the page
// names individuals and their personal account domains, so withholding
// them has to be one click rather than a careful edit afterwards.
let BRNAMES = true;
// Whether the register's watchlist section is expanded. Tracked because a
// decision re-renders the view, and a <details> that snaps shut under the
// operator mid-triage would lose their place.
let WLOPEN = false;
// The Tool registry view: the custom entries listing, which entry the form
// is editing ('' = a new one, null = no form), the prefill the form renders
// from (kept across a refused save so typing survives), the last refusal,
// and whether the advanced-JSON editor is showing.
let RENTRIES = null, REDIT = null, RPRE = null, RERR = '', RADV = false;
// The discovery queue: candidates the estate observed that nobody defined.
let CAND = null;
// Finding lifecycle: key -> {status, reason, actor, at} from the receiver,
// and which personal-account row has its accept-reason form open.
let PSTAT = null, PAFORM = null;
// The audit trail, fetched when the Diagnostics tab asks for it.
let AUDITLOG = null;
// The accounts list (admins only), which row has its reset form open, and
// the last account-management refusal.
let USERS = null, URFORM = null, USERR = '';
let S = null, CFG = {}, loadError = '';
// What /api/auth said: {mode, authenticated, username, setup_needed}.
// The session itself is an HttpOnly cookie this script can never read -
// the portal's whole security story for the write path is that nothing
// credential-shaped is reachable from page script.
let AUTH = null;
// The one moment a minted token is visible. Kept until dismissed, because a

// The login screen replaces the whole page, so the chrome around it (nav,
// filter, refresh) goes quiet rather than sitting there doing nothing.
function chrome(on) {
  document.body.classList.toggle('auth', !on);
  document.querySelector('.topbar').style.display = on ? '' : 'none';
  document.getElementById('nav').style.display = on ? '' : 'none';
  document.getElementById('fold').style.display = on ? '' : 'none';
  if (!on) { detail = null; DSTACK = []; document.body.classList.remove('open'); }
  const so = document.getElementById('signout'), who = document.getElementById('who');
  const login = AUTH && AUTH.mode === 'login';
  so.style.display = on && login ? '' : 'none';
  who.textContent = on && login && AUTH.username
    ? AUTH.username + (AUTH.role === 'viewer' ? ' · read-only' : '') : '';
}

// A 401 mid-session means the session expired or was revoked; the honest
// response is the login screen with a line saying why, not a broken view.
async function sessionLost() {
  if (AUTH) AUTH.authenticated = false;
  try { AUTH = await (await fetch('/api/auth')).json(); } catch (e) { /* keep what we had */ }
  showLogin('Signed out — the session expired or was revoked. Sign in again.');
}

async function boot() {
  try { AUTH = await (await fetch('/api/auth')).json(); }
  catch (e) { AUTH = null; }
  if (AUTH && AUTH.mode === 'login' && !AUTH.authenticated) { showLogin(); return; }
  chrome(true);
  load();
}

async function load(force) {
  // Draw the furniture first: navigation comes from NAV, not from
  // findings, so it has no reason to wait for a read that may take
  // seconds on a large estate.
  drawNav();
  app.innerHTML = '<p class="lede">Reading findings…</p>';
  const q = force ? '?refresh=true' : '';
  // Refresh must clear the views that read a second endpoint too, or the
  // button refreshes some of the page and silently not the rest.
  if (force) { DIAG = null; REG = null; EV = null; PG = null; FLEET = null; TOKENS = null; SETTINGS = null; REGTOOLS = null; GOVDECS = null; RENTRIES = null; CAND = null; PSTAT = null; AUDITLOG = null; USERS = null; BUDGET = null; BFX = null; }
  try {
    const cr = await fetch('/api/config');
    if (cr.status === 401 && AUTH && AUTH.mode === 'login') { sessionLost(); return; }
    CFG = await cr.json();
    const gr = await fetch('/api/graph' + q);
    if (!gr.ok) throw new Error((await gr.json()).detail || gr.statusText);
    G = await gr.json();
    const sr = await fetch('/api/status' + q);
    if (sr.ok) S = await sr.json();
    // Fetched here rather than lazily, because the overview may draw a paste
    // guard widget and a widget that fetches on render would flash empty.
    const pr = await fetch('/api/paste-guard' + q);
    if (pr.ok) PG = await pr.json();
    // The recorded answers to findings (acknowledged / accepted), managed
    // mode only. Failure leaves PSTAT null and every row simply reads open.
    if (CFG.managed && CFG.managed.enabled && AUTH && AUTH.mode === 'login') {
      try {
        const fr = await mfetch('/api/finding-status');
        if (fr.ok) {
          PSTAT = {};
          ((await fr.json()).statuses || []).forEach(s => PSTAT[s.key] = s);
        }
      } catch (e) { /* open rows are the honest fallback */ }
    }
    // The spend tile needs the budget data, fetched only when the widget
    // is configured and this is a signed-in managed portal - everywhere
    // else the tile renders as nothing rather than an error.
    if ((CFG.overview_widgets || []).some(w => w.kind === 'budget_spend')
        && CFG.managed && CFG.managed.enabled && AUTH
        && AUTH.mode === 'login' && !BUDGET) {
      try {
        const br = await mfetch('/api/budget');
        if (br.ok) BUDGET = await br.json();
        if (!SETTINGS) {
          const wr = await mfetch('/api/settings');
          if (wr.ok) SETTINGS = await wr.json();
        }
        await bFetchFx();
      } catch (e) { /* the tile simply stays absent */ }
    }
    // Same again for the review queue: it draws from the register, and in
    // managed mode from the discovery candidates queue too.
    if ((CFG.overview_widgets || []).some(w => w.kind === 'review_queue')) {
      const rr = await fetch('/api/register' + q);
      if (rr.ok) REG = await rr.json();
      if (CFG.managed && CFG.managed.enabled && AUTH && AUTH.mode === 'login') {
        const cq = await mfetch('/api/candidates');
        if (cq.ok) CAND = (await cq.json()).candidates || [];
      }
    }
    loadError = '';
  } catch (e) {
    loadError = String(e.message || e);
  }
  // First run: a managed deployment that has never finished onboarding
  // opens on the wizard - unless the operator navigated somewhere on
  // purpose, because a wizard that traps is worse than none.
  if (CFG.managed && CFG.managed.enabled && AUTH && AUTH.mode === 'login') {
    if (!SETTINGS) {
      const wr = await mfetch('/api/settings');
      if (wr.ok) SETTINGS = await wr.json();
    }
    const done = SETTINGS && SETTINGS.settings
      && SETTINGS.settings.onboarding_done.value;
    if (SETTINGS && !done && (!location.hash || location.hash === '#wizard')) {
      view = 'wizard';
      history.replaceState(null, '', '#wizard');
    }
  }
  render();
  showFreshness();
}

// The graph is cached, and a cache you cannot see is indistinguishable from a
// portal that is not working: a finding that arrived a minute ago simply is
// not there, with nothing on screen to say why.
function showFreshness() {
  const el = document.getElementById('freshness');
  if (!el) return;
  if (loadError || !G.derived_at) { el.textContent = ''; return; }
  const tick = () => {
    const age = Math.max(0, Math.round(Date.now() / 1000 - G.derived_at));
    el.textContent = age < 5 ? 'just now'
      : age < 90 ? age + 's ago'
      : Math.round(age / 60) + 'm ago';
  };
  tick();
  clearInterval(window._freshTimer);
  window._freshTimer = setInterval(tick, 5000);
}

// Escapes the five characters that matter in HTML text and in a quoted
// attribute. The apostrophe was missing, and it mattered: values were
// interpolated into onclick="open_('device','...')", a single-quoted JS string
// inside a double-quoted attribute, so a device name containing ' closed the
// string and ran whatever followed. The inline handlers are gone now and this
// is still the right set: an attribute quoted either way is covered, and
// nothing downstream has to remember which.
//
// This is not sufficient on its own for a JS or URL context. Nothing should be
// interpolated into either. Use a data attribute and read it back.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ents = o => Object.entries(o || {});
const label = (k, d) => d.device_name || k;

// inside a view: they began as locals of register(), which made them invisible
// to every other function, and the second view to use them rendered nothing at
// all because the ReferenceError fired while building the HTML.
const num = n => n ? String(n) : '<span class="z">0</span>';
const when = t => t ? `<span class="nw">${esc(String(t).slice(0, 10))}</span>` : '—';
// One timestamp format, whatever a source sent. Findings arrive with
// four spellings of "now" - naive, offset-aware, seconds, microseconds -
// and a column showing all four reads as four different kinds of thing.
// Rendered as a relative age with the absolute time on hover, because
// the question these columns answer is "how long ago", not "when".
function stamp(t) {
  if (!t) return '—';
  const ms = Date.parse(String(t).includes('T') ? t
    : String(t).replace(' ', 'T') + (/[+Z]/.test(t) ? '' : 'Z'));
  if (!ms) return esc(String(t));
  const secs = Math.max(0, Math.round((Date.now() - ms) / 1000));
  const rel = secs < 90 ? secs + 's ago'
    : secs < 5400 ? Math.round(secs / 60) + 'm ago'
    : secs < 172800 ? Math.round(secs / 3600) + 'h ago'
    : Math.round(secs / 86400) + 'd ago';
  return `<span title="${esc(new Date(ms).toISOString().replace('T', ' ').slice(0, 19))} UTC">${rel}</span>`;
}

// A tiny inline chart: the shape of the week, not a chart to read values
// off. Bars rather than a line, because seven integer points joined by a
// line imply a continuity the data does not have.
function spark(series, warn) {
  if (!series || !series.some(v => v)) return '';
  const max = Math.max(...series), w = 6, gap = 2;
  const W = series.length * (w + gap) - gap;
  return `<svg class="spark" width="${W}" height="18" viewBox="0 0 ${W} 18" aria-hidden="true">`
    + series.map((v, i) => {
      const h = v ? Math.max(2, Math.round(v / max * 16)) : 1.5;
      return `<rect x="${i * (w + gap)}" y="${18 - h}" width="${w}" height="${h}" rx="1.5"
        fill="${v ? `var(--${warn ? 'dstr' : 'pri'})` : 'color-mix(in srgb,var(--mut) 30%,transparent)'}"/>`;
    }).join('') + '</svg>';
}
// The window split in half: is the second half worse than the first. Not a
// week-over-week claim - the data only covers one window - which is why the
// arrow carries a title saying exactly what it compared.
function delta(series) {
  if (!series || series.length < 4) return null;
  const mid = Math.floor(series.length / 2);
  const a = series.slice(0, mid).reduce((x, y) => x + y, 0);
  const b = series.slice(mid).reduce((x, y) => x + y, 0);
  return {a, b, up: b > a, down: b < a};
}
const trendChip = (series, badWhenUp) => {
  const d = delta(series);
  if (!d || (!d.up && !d.down)) return '';
  const bad = badWhenUp ? d.up : d.down;
  return `<span class="trend ${bad ? 'bad' : 'good'}"
    title="second half of the window: ${d.b}, first half: ${d.a}">${d.up ? '▲' : '▼'}</span>`;
};

      <dl class="stats" style="margin:0;grid-template-columns:repeat(2,1fr)">

        <div><dt${over ? ' style="color:var(--dstr)"' : ''}>${over}</dt><dd>overridden</dd></div>
      </dl>
      ${warnMode && warned ? `<p class="src-note" style="color:var(--warn);font-style:normal">
        In block mode, ${warned} warned paste${warned === 1 ? '' : 's'} would have
        been stopped outright - the breakdown is on the Paste guard page.</p>` : ''}
      <p class="src-note">${live
        ? `The guard is running on ${live} device${live === 1 ? '' : 's'}${

  },

  review_queue: () => {
    // The queue that replaces a weekly review pipeline: observed tools no
    // one has decided about. Recording the decision IS the acknowledgment,
    // so an empty queue means exactly what it says. Not-in-registry rows
    // first - they are the gap evidence - then newest first.
    if (!REG || !REG.rows) return `<div class="wcard w6"><h3>Awaiting a decision</h3>
      <p class="lede">No register data - open the AI register for the reason.</p></div>`;
    const dayAgo = Date.now() - 86400000;
    const isNew = r => r.first_seen && Date.parse(r.first_seen) > dayAgo;
    const undecided = (REG.rows || [])
      .filter(r => r.status_source !== 'governance' && r.status_source !== 'portal')
      .sort((a, b) => ((a.in_registry ? 1 : 0) - (b.in_registry ? 1 : 0))
        || ((Date.parse(b.first_seen || 0) || 0) - (Date.parse(a.first_seen || 0) || 0)));
    // Discovery candidates: observed in the estate's telemetry, defined by
    // nobody. Open ones only - resolved means a registry entry answered it,
    // dismissed means a human did.
    const cands = (CAND || []).filter(c => !c.resolved && !c.dismissed_at);
    const candBlock = !cands.length ? '' : `
      <h4 style="margin:10px 0 4px">New AI tools found
        <span class="count">${cands.length}</span></h4>
      <table>${cands.slice(0, 6).map(c => `<tr>
        <td>${esc(c.name)}
          ${c.kind === 'mcp_server' ? ' <span class="pill p-acc">MCP server</span>' : ''}
          <div style="color:var(--mut);font-size:12px">
          ${esc(c.kind === 'mcp_server' ? (c.evidence || '')
                                        : (c.domains || []).join(', '))}</div></td>
        <td style="color:var(--mut)">${c.devices || 0} device${c.devices === 1 ? '' : 's'}
          ${c.confidence ? ' · ' + esc(c.confidence) : ''}</td>
        <td style="white-space:nowrap">
          <button class="btn" data-act="cand-add" data-key="${esc(c.key)}">Add to registry</button>

        </td></tr>`).join('')}</table>
      ${cands.length > 6 ? `<p class="src-note">And ${cands.length - 6} more in the queue.</p>` : ''}`;
    if (!undecided.length && !cands.length) {
      const ago = t => {
        const m = Math.round((Date.now() - Date.parse(t)) / 60000);
        return m < 90 ? m + 'm ago' : Math.round(m / 60) + 'h ago';
      };
      const srcs = ((S && S.groups) || []).flatMap(g => g.sources || [])
        .filter(x => x.last_seen).sort((a, b) => a.last_seen < b.last_seen ? 1 : -1)

        <p class="lede">No new AI tools awaiting a decision.${srcs.length

    }
    return `<div class="wcard w6"><h3>Awaiting a decision
      <span class="count">${undecided.length + cands.length}</span></h3>
    ${candBlock}
    ${!undecided.length ? '' : `
    ${cands.length ? '<h4 style="margin:10px 0 4px">Observed, no decision recorded</h4>' : ''}
    <table>${undecided.slice(0, 6).map(r => `<tr>
      <td><a href="#register" style="color:var(--fg);text-decoration:none">${esc(r.name)}</a></td>
      <td>${!r.in_registry ? '<span class="pill p-warn">not in registry</span>' : ''}
          ${isNew(r) ? '<span class="pill p-acc">new today</span>' : ''}</td>
      <td style="color:var(--mut)">${esc((r.first_seen || '').slice(0, 10))}</td>
    </tr>`).join('')}</table>`}
    <p class="src-note"><a href="#register" style="color:var(--pri)">Decide on
    the AI register</a> - recording a decision clears the tool from this
    queue.</p></div>`;
  },

  grafana: (w) => {
    const base = CFG.grafana_url;

function identityMapEditor() {

    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">

// key,identity - the format the proposal downloads in, so the file can go
// straight back in. Comments and the header row are dropped exactly as the
// server-side loader drops them.
function parseIdentityCsv(text) {
  const out = [], seen = new Set();
  let skipped = 0;
  String(text || '').replace(/^\uFEFF/, '').split(/\r\n|\r|\n/).forEach(line => {
    const bare = line.split('#')[0].trim();
    if (!bare) return;
    const cells = bCsvRow(bare, bare.includes('\t') ? '\t' : ',');
    const [key, identity] = [(cells[0] || '').trim(), (cells[1] || '').trim()];
    if (!key || !identity) { if (bare) skipped++; return; }
    if (['key', 'device', 'local_user'].includes(key.toLowerCase())) return;
    if (seen.has(key.toLowerCase())) { skipped++; return; }
    seen.add(key.toLowerCase());
    out.push({key, identity});
  });
  return {rows: out, skipped};
}

async function people() {

// Why a tool needs looking at, as named factors rather than a score. A
// number would rank the same tools while hiding the reasoning; the factors
// ARE the explanation, and the level is just how many of them stack up.
function attention(k, t) {
  const personal = (G.personal_accounts || []).filter(r => r.tool === k).length;
  const devs = (t.devices || []).length;
  const f = [];
  if (personal) f.push(`${personal} personal account${personal === 1 ? '' : 's'}`);
  if (devs >= 5) f.push(`wide spread (${devs} devices)`);
  if ((t.surfaces || []).filter(Boolean).length >= 2) f.push('multiple surfaces');
  const fs = ((G.trends || {}).tool_first_seen || {})[k];
  if (fs && Date.parse(fs) > Date.now() - 2 * 86400000) f.push('new this week');
  const level = (personal && devs >= 3) || personal >= 2 ? 'high'
    : personal || f.length >= 2 ? 'medium' : '';
  return {level, factors: f};
}
const attnPill = a => a.level === 'high'
  ? `<span class="pill p-warn" title="${esc(a.factors.join(' · '))}">attention</span>`
  : a.level === 'medium'
  ? `<span class="pill p-amb" title="${esc(a.factors.join(' · '))}">watch</span>`
  : '';

function tools() {
  const rows = ents(G.tools).filter(([k]) => match(k))
    .map(([k, t]) => [k, t, attention(k, t)])
    .sort((a, b) => {
      const rank = x => x[2].level === 'high' ? 2 : x[2].level === 'medium' ? 1 : 0;
      return rank(b) - rank(a) || (b[1].devices||[]).length - (a[1].devices||[]).length;
    });
  return `<h2>Tools</h2><p class="lede">Surfaces are kept apart on purpose: the same
  tool in a browser, a desktop app and a CLI are different exposures. The ones
  needing a look sort first, marked <span class="pill p-warn">attention</span>
  when several factors stack up and <span class="pill p-amb">watch</span> for
  one - open a tool to see exactly which. "Identities from sources" counts
  people a source named directly; the AI register counts those plus the people
  the identity map attaches through a device, so the two differ for tools found
  on endpoints.</p>
  <div class="tcard"><table><tr><th>tool</th><th></th><th>devices</th>
    <th title="People a SOURCE named on this tool. A cloud sign-in carries a person; an endpoint finding carries a machine, and the person behind it comes from the identity map - so this is lower than the register's user count for tools found on endpoints.">identities from sources</th>
    <th>by surface</th></tr>
  ${rows.map(([k,t,a]) => `<tr data-open="tool" data-key="${esc(k)}" style="cursor:pointer">
    <td>${esc(k)}</td><td>${attnPill(a)}</td>

      .map(([s,v])=>`<span class="pill p-acc">${esc(s||'none')} ${v.length}</span>`).join('')
      || (t.surfaces||[]).filter(Boolean).map(s2 =>
        `<span class="pill p-mut">${esc(s2)}</span>`).join('')
      || '<span class="src-note">seen in cloud sign-ins only - no device attribution</span>'}</td>
  </tr>`).join('')}</table></div>
  ${ents(G.bridges||{}).length ? `<div class="tcard">
  <div class="cardhead"><h3>Bridge targets</h3></div>

    .map(([k,b])=>`<tr><td>${esc(k)}</td><td>${b.devices.length}</td></tr>`).join('')}
  </table></div>` : ''}`;
}

function toolDetail(k) {
  const t = G.tools[k]; if (!t) return '<p>not found</p>';
  const a = attention(k, t);
  const series = ((G.trends || {}).tools || {})[k];
  return `<h2>${esc(k)}</h2>
  <p class="lede">${(t.devices||[]).length} devices · ${(t.identities||[]).length} identities · ${t.findings} findings</p>
  ${series && series.some(v => v) ? `<div style="margin:0 0 12px">${spark(series)}
    <div class="src-note" style="margin-top:2px">daily activity, oldest to newest</div></div>` : ''}
  ${a.level ? `<p class="lede" style="color:var(--${a.level === 'high' ? 'dstr' : 'warn'})">
    ${a.level === 'high' ? 'Needs attention' : 'Worth watching'}:
    ${esc(a.factors.join(' · '))}.</p>` : ''}
  <table><tr><th>by surface</th><td>${ents(t.devices_by_surface||{})

}

function mcp() {
  const rows = (G.mcp_servers || []).filter(r =>
    match(r.server) || (r.tools||[]).some(match) ||
    (r.device_names||[]).some(match) || (r.devices||[]).some(match));
  const tools = ents(G.tools).filter(([,t]) => (t.surfaces||[]).includes('mcp'));
  const devs = new Set(rows.flatMap(r => r.devices || []));
  return `<h2>MCP servers</h2>
  <p class="lede">MCP servers are integrations AI tools are configured to use.
  They hold their own credentials and can reach whatever they were pointed at,
  even when the tool that configured them isn't open. That's why they get
  their own page.</p>

  <dl class="stats">
    <div><dt>${rows.length}</dt><dd>servers</dd></div>
    <div><dt>${devs.size}</dt><dd>devices</dd></div>
    <div><dt>${tools.length}</dt><dd>configuring tools</dd></div>
  </dl>

  ${rows.length ? `<div class="tcard"><table>
  <tr><th>server</th><th>devices</th><th>configured by</th>
  <th>first seen</th><th>last seen</th></tr>
  ${rows.map(r => `<tr data-open="mcp" data-key="${esc(r.server)}" style="cursor:pointer">
    <td>${esc(r.server)}</td>
    <td>${(r.devices||[]).length}</td>
    <td>${(r.tools||[]).map(t=>`<span class="pill p-mut">${esc(t)}</span>`).join('')}</td>

function mcpDetail(k) {
  const r = (G.mcp_servers || []).find(x => x.server === k);
  if (!r) return '<p>not found</p>';
  const devs = (r.devices || []);
  return `<h2>${esc(r.server)}</h2>
  <p class="lede">${devs.length} device${devs.length === 1 ? '' : 's'} ·
  configured by ${esc((r.tools||[]).join(', '))} ·
  first seen ${esc((r.first_seen||'').slice(0,10) || 'unknown')} ·
  last seen ${esc((r.last_seen||'').slice(0,10) || 'unknown')}</p>
  <p class="lede">Whatever this server was pointed at is reachable from these
  machines without the configuring tool being open. What it can actually do
  there depends on the credentials it holds, which are not visible from here.</p>
  ${devs.length ? devs.map(dk => G.devices[dk]

// A personal-account row's identity, as the opaque key the receiver stores
// lifecycle answers under. JSON so no field can smuggle a separator.
const paKey = r => JSON.stringify(
  [r.user || '', r.account_domain || '', r.tool || '', r.device || '']);
const paStatus = r => (PSTAT || {})[paKey(r)] || null;

function paActions(r) {
  const st = paStatus(r);
  const key = esc(paKey(r));
  if (st) return `<button class="mini" data-act="pa-reopen" data-key="${key}">reopen</button>`;
  if (PAFORM === paKey(r)) return `
    <input id="pa-reason" class="mfield" style="min-width:180px"
      placeholder="why this is acceptable" autocomplete="off">
    <button class="mini" data-act="pa-accept" data-key="${key}">accept</button>
    <button class="mini" data-act="pa-cancel">cancel</button>`;
  return `<button class="mini" data-act="pa-ack" data-key="${key}"
      title="spoken to - stays visible, stops being new">ack</button>
    <button class="mini" data-act="pa-accept-form" data-key="${key}"
      title="accepted with a reason - drops out of the open count">accept…</button>`;
}

const paChip = st => !st ? ''
  : st.status === 'accepted'
    ? `<span class="pill p-ok" title="${esc(st.reason || '')} — ${esc(st.actor)} ${esc((st.at||'').slice(0,10))}">accepted</span>`
    : `<span class="pill p-acc" title="${esc(st.actor)} ${esc((st.at||'').slice(0,10))}">acknowledged</span>`;

function personal() {
  const rows = (G.personal_accounts || []).filter(r =>
    match(r.user) || match(r.account_domain) || match(r.tool) ||
    match(r.device) || match(r.device_name));
  const lifecycle = CFG.managed && CFG.managed.enabled && PSTAT !== null;
  return `<h2>Personal accounts</h2>
  <p class="lede">AI tools signed into personal accounts. Even an approved
  tool on a personal account means company data flowing somewhere you don't
  manage, and access that survives offboarding. "Personal" means the account
  domain isn't in your corporate domains list. Treat these as leads to follow
  up, not verdicts${lifecycle ? ` - and record where each one got to:
  acknowledged keeps it visible, accepted needs a reason and drops it from
  the open count` : ''}.</p>
  ${rows.length ? `<div class="tcard"><table>
  <tr><th>who</th><th>account domain</th><th>tool</th><th>device</th>
  <th>surface</th><th>first seen</th><th>last seen</th><th>source</th>
  ${lifecycle ? '<th>status</th>' : ''}</tr>
  ${rows.map(r => `<tr${paStatus(r) ? ' style="opacity:.6"' : ''}>
    <td>${r.user
      ? esc(r.user) + (r.user_via === 'device'
        ? ' <span class="pill p-mut" title="This source reported no account name. The person is the one the identity map attaches to this machine.">via device</span>' : '')
      : '<span class="pill p-mut">no identity</span>'}</td>
    <td><span class="pill p-warn">${esc(r.account_domain)}</span></td>
    <td>${esc(r.tool)}</td>
    <td>${esc(r.device_name || r.device || '—')}</td>
    <td>${(r.surfaces||[]).map(x=>`<span class="pill p-mut">${esc(x)}</span>`).join('')}</td>
    <td style="color:var(--mut)">${esc((r.first_seen||'').slice(0,10) || '—')}</td>
    <td style="color:var(--mut)">${esc((r.last_seen||'').slice(0,10) || '—')}</td>
    <td style="color:var(--mut)">${esc((r.sources||[]).join(', ')) || '—'}</td>
    ${lifecycle ? `<td class="nw">${paChip(paStatus(r))} ${paActions(r)}</td>` : ''}

  : `<p class="lede">None seen in the last ${CFG.lookback_hours || '?'} hours.

// The inline decision editor on a register card. Prefilled from the

// ------------------------------------------------------- tool registry --
// Portal-defined tools: the same shape as a shipped entry, validated by
// the receiver to the registry's own rules, detected by the fleet on its
// next check-in. Shipped entries are shown read-only - they update with

// The categories the registry schema allows. Mirrored from

const REG_CATEGORIES = ['assistant', 'coding', 'transcription', 'writing',

const _csv = v => (v || []).join(', ');

  <div style="margin-top:10px">

// The entry the form currently describes. Empty lists and empty strings
// are dropped, because the schema's shapes are optional-or-meaningful and
// an empty cli object is neither.
function regEntryFromForm() {
  if (RADV) {
    const t = document.getElementById('re-json');
    return JSON.parse((t && t.value) || '{}');
  }
  const e = {
    id: REDIT === '' ? _val('re-id') : REDIT,
    name: _val('re-name'), vendor: _val('re-vendor'),
    category: _val('re-category'), risk_tier: _val('re-risk'),
  };
  const lists = {
    domains: _uncsv('re-domains'), app_names: _uncsv('re-app-names'),
    bundle_ids: _uncsv('re-bundle-ids'), exe_names: _uncsv('re-exe-names'),
    email_senders: _uncsv('re-email'), mcp_identifiers: _uncsv('re-mcp-ids'),
    mcp_config_paths: _uncsv('re-mcp-any'),
    mcp_config_paths_macos: _uncsv('re-mcp-macos'),
    mcp_config_paths_windows: _uncsv('re-mcp-windows'),
    mcp_config_paths_linux: _uncsv('re-mcp-linux'),
  };
  Object.keys(lists).forEach(k => { if (lists[k].length) e[k] = lists[k]; });
  const binaries = _uncsv('re-cli-binaries'), config = _uncsv('re-cli-config');
  if (binaries.length || config.length) {
    e.cli = {};
    if (config.length) e.cli.config_paths = config;
    if (binaries.length) e.cli.binaries = binaries;
  }
  const vscode = _uncsv('re-ext-vscode');
  if (vscode.length) e.extension_ids = {vscode: vscode};
  const notes = _val('re-notes');
  if (notes) e.notes = notes;
  return e;
}

// The watchlist as a decision surface: registry tools nothing has observed
// yet, with the same approve / not-approved controls the wizard's baseline
// had. This exists because the wizard was the only place to record a
// decision about a tool BEFORE anyone uses it, and the wizard is a door
// you walk through once. Collapsed, so the register's own rule holds: the
// record is what is in use, and the watchlist stays secondary.
function watchlistBlock(observedIds) {
  if (!CFG.managed || !CFG.managed.enabled || !REGTOOLS) return '';
  const decided = {};
  (GOVDECS || []).forEach(d => { decided[d.tool_id] = d.status; });
  const rows = REGTOOLS.filter(t => !observedIds.has(t.id));
  if (!rows.length) return '';
  const yearOut = new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10);
  const LBL = {approved: ['approved', 'p-ok'],
               not_approved: ['not approved', 'p-warn']};
  const undecided = rows.filter(t => !decided[t.id]).length;
  return `<details id="wl-details" style="margin-top:22px" ${WLOPEN ? 'open' : ''}>
  <summary data-act="wl-toggle" style="cursor:pointer;font-size:14px">
    Watchlist — known, not observed (${rows.length}${undecided
      ? `, ${undecided} without a decision` : ''})</summary>
  <p class="lede" style="margin-top:10px">Decisions recorded here apply the
  moment a tool first appears. Approvals carry the review date below.</p>
  ${GOVERR ? `<div class="note">${esc(GOVERR)}</div>` : ''}
  <div style="margin-bottom:10px">
    <input id="wiz-owner" class="mfield" value="${esc(WIZOWNER)}"
      placeholder="owner for these decisions, e.g. Security">
    <input id="wiz-review" class="mfield" style="min-width:170px"
      value="${esc(WIZREVIEW || yearOut)}" title="review due date for approvals">
  </div>
  <table><tr><th>tool</th><th>vendor</th><th>decision</th><th></th></tr>
  ${rows.map(t => {
    const d = decided[t.id];
    const state = d && LBL[d]
      ? `<span class="pill ${LBL[d][1]}">${LBL[d][0]}</span>`
      : d ? `<span class="pill p-acc">${esc(d)}</span>`
      : '<span class="none">no decision</span>';
    return `<tr><td>${esc(t.name)}</td>
      <td style="color:var(--mut)">${esc(t.vendor)}</td>
      <td>${state}</td>
      <td><button class="mini" data-act="wiz-approve" data-key="${esc(t.id)}">approve</button>
          <button class="mini" data-act="wiz-notapprove" data-key="${esc(t.id)}">not approved</button></td>
    </tr>`;
  }).join('')}</table></details>`;
}

async function register() {
  if (!REG) {
    try {
      const r = await fetch('/api/register');
      if (!r.ok) {
        if (r.status === 401 && AUTH && AUTH.mode === 'login') { sessionLost(); return ''; }
        // An error body parses as JSON too; storing it as REG rendered a
        // page of "undefined" instead of the reason.
        let d = r.statusText;
        try { d = (await r.json()).detail || d; } catch (e2) { /* keep */ }
        return `<h2>AI register</h2><div class="note">Could not build
      the register: ${esc(String(d))}</div>`;
      }
      REG = await r.json();
    }
    catch (e) { return `<h2>AI register</h2><div class="note">Could not build
      the register: ${esc(String(e.message || e))}</div>`; }
  }
  if (CFG.managed && CFG.managed.enabled) {
    if (!REGTOOLS) {
      const r = await mfetch('/api/registry-tools');
      REGTOOLS = r.ok ? (await r.json()).tools || [] : [];
    }
    if (!GOVDECS) {
      const r = await mfetch('/api/governance-decisions');
      GOVDECS = r.ok ? (await r.json()).decisions || [] : [];
    }
  }
  const rows = (REG.rows || []).filter(r =>
    match(r.name) || match(r.id) || match(r.vendor) || match(r.category));
  // Queue order: undecided first (the register doubles as the review
  // queue), keeping the server's exposure order within each half.
  const _decided = r => (r.status_source === 'governance'
    || r.status_source === 'portal') ? 1 : 0;
  rows.sort((a, b) => _decided(a) - _decided(b));
  const _newToday = r => r.first_seen
    && Date.parse(r.first_seen) > Date.now() - 86400000;

  const win = REG.hours >= 24 ? Math.round(REG.hours / 24) + ' days'
                              : REG.hours + ' hours';
  const dash = '<span class="pill p-mut">not set</span>';
  // A zero is the absence of a thing. Rendering it at full weight makes a
  // row of zeros as loud as a row of findings, and the eye has nothing to
  // land on.
  // Risk tier as a pill. It is a meaningful attribute and read as ordinary
  // metadata beside everything else. Restrained on purpose: status and the
  // personal-account count already carry colour, and a third loud thing in the
  // same card would leave nothing standing out.
  const RISK = {high:'p-warn', medium:'p-acc', low:'p-mut'};
  const risk = t => t
    ? `<span class="pill ${RISK[t]||'p-mut'}">${esc(t)}</span>` : '—';

  // Effective status, with the stored decision alongside when they differ.
  // An approval past its review date reads as reviewing and says why: a green
  // pill turning amber leaves someone wondering, and an approval nobody has
  // revisited is not evidence a tool is safe, it is evidence nobody looked.
  const PILL = {approved:'p-ok', not_approved:'p-warn', reviewing:'p-acc'};
  const LABEL = {approved:'approved', not_approved:'not approved',
                 reviewing:'reviewing'};
  // Status says what was decided, and at most one line of context. The expiry
  // used to live here too, which put four lines in one cell and made every
  // other row look ragged beside it. Expiry is a fact about the review date,
  // so it belongs in the review column.
  // Exceptions, as their own block under the governance rule. Deliberately not
  // folded into the status pill: an exception is a departure from the general
  // decision for a stated scope, and showing it as the status would make a
  // note about one team read as a decision about everybody.
  //
  // Expired ones are still listed, quietly. An exception that has run its
  // course is a record of something an organisation decided and then let
  // lapse, which is worth seeing rather than losing.
  const scopeText = sc => Object.entries(sc || {})
    .map(([k, v]) => `${esc(k)} ${esc(String(v))}`).join(', ');

  const exceptionBlock = r => {
    const active = r.exceptions || [], expired = r.expired_exceptions || [];
    if (!active.length && !expired.length) return '';
    const one = (e, isExpired) => `<div class="exc${isExpired ? ' exc-old' : ''}">
      <span class="mono">${esc(e.id)}</span>
      ${e.scope && Object.keys(e.scope).length
        ? `<span class="exc-scope">${scopeText(e.scope)}</span>` : ''}
      <span class="exc-when">${isExpired ? 'expired' : 'until'} ${esc(e.expires)}</span>
      ${e.reason ? `<div class="exc-why">${esc(e.reason)}</div>` : ''}
    </div>`;
    return `<hr>
      <div class="card-section">exception${active.length + expired.length === 1 ? '' : 's'}</div>
      ${active.map(e => one(e, false)).join('')}
      ${expired.map(e => one(e, true)).join('')}`;
  };

  const status = r => {
    const wrap = inner => `<div class="gov">${inner}</div>`;

    // Not in the registry at all is the row worth acting on: something is in
    // use that governance has never considered.
    if (!r.in_registry) {
      return wrap('<span class="pill p-warn">not in registry</span>');
    }

    if (r.status_source === 'governance' || r.status_source === 'portal') {
      let out = `<span class="pill ${PILL[r.status]||'p-mut'}">${LABEL[r.status]||esc(r.status)}</span>`;
      if (r.status_reason === 'approval_expired') {
        out += `<span class="gov-sub">was ${LABEL[r.stored_status]||''}</span>`;
      }
      // A decision recorded in the portal says so: a reader auditing the
      // governance file should not go hunting for a record that lives in
      // the receiver's database instead.
      if (r.status_source === 'portal') {
        out += `<span class="gov-sub">set in the portal</span>`;
      }
      return wrap(out);
    }

    // No governance record, so this is the registry's own flag. approved: true
    // can only have been set deliberately, because every tool ships false, so
    // it is a decision and reads as one. approved: false is ambiguous: it is
    // what an untouched registry says about everything, and rendering it as a
    // refusal would put a shipped default and a considered "no" in the same
    // red pill.
    if (r.approved === true) {
      return wrap('<span class="pill p-ok">approved</span>'
        + '<span class="gov-sub">from the registry</span>');
    }
    // Quieter than the other three. When half an estate has no decision, an
    // outlined pill on every card repeats until it reads as a status somebody
    // chose. It is the absence of one, and should look like it.
    return wrap('<span class="none">no decision</span>');
  };

  // Review: the date, and how it stands relative to today. Overdue in the
  // warning colour, upcoming in muted text. Computed here rather than passed
  // through: the API already carries days_overdue for the expired case, and
  // the countdown is arithmetic on a date the row already has.
  const review = r => {
    if (!r.review_due) return `<div class="gov">${dash}</div>`;
    const days = Math.round(
      (Date.parse(r.review_due + 'T00:00:00Z') - Date.now()) / 86400000);
    const sub = r.days_overdue
      ? `<span class="gov-sub over">${r.days_overdue}d overdue</span>`
      : (days >= 0 ? `<span class="gov-sub">in ${days}d</span>` : '');
    return `<div class="gov">
      <span class="nw"${r.days_overdue ? ' style="color:var(--dstr)"' : ''}>${esc(r.review_due)}</span>
      ${sub}</div>`;
  };

  return `<h2>AI register</h2>
  ${truncNote(REG.findings_truncated)}
  <p class="lede">The AI tools actually in use, from findings in the last
  ${esc(win)}. Tools the registry watches for but nobody uses are counted
  below, not listed. Tools in use that the registry doesn't know are flagged -
  those are the ones to act on.</p>

  <dl class="stats">
    <div><dt>${REG.tools_observed}</dt><dd>in use</dd></div>
    <div><dt style="color:var(--dstr)">${REG.observed_not_in_registry}</dt><dd>not in registry</dd></div>
    <div><dt>${REG.tools_known}</dt><dd>watched for</dd></div>
    <div><dt>${REG.known_not_observed}</dt><dd>watched for, not seen</dd></div>
  </dl>

  ${!REG.governance_configured ? (CFG.managed && CFG.managed.enabled
    ? `<p class="lede">No decisions recorded yet, so every tool shows the
    registry's shipped default (not approved). That's a default, not a
    decision anyone made. Click <b>edit</b> on any card to record a real
    one.</p>`
    : `<p class="lede">No governance file is configured, so every tool
  shows the registry's shipped default (not approved). That's a default, not
  a decision anyone made. Set <span class="mono">GOVERNANCE_PATH</span> to
  record approvals, owners and review dates.</p>`) : ''}

  ${((REG.governance_unmatched || []).length
     || (REG.exceptions_unmatched || []).length) ? `<div class="note">
    ${(() => {
      const d = REG.governance_unmatched || [], x = REG.exceptions_unmatched || [];
      const names = [...new Set([...d, ...x])];
      const what = d.length && x.length ? 'records' : (d.length ? 'decision' : 'exception');
      const n = d.length + x.length;
      return `<b>${n === 1 ? `1 ${what} names a tool` : `${n} ${what}${what === 'records' ? '' : 's'} name tools`}
        the registry does not know:</b>
        ${names.map(t => `<span class="pill p-warn">${esc(t)}</span>`).join('')}`;
    })()}
    <div style="margin-top:6px">This is fine if you recorded a decision
    ahead of registering the tool - but it's also what a typo looks like.
    Either way the record isn't being applied to anything right now.</div>
  </div>` : ''}

  <p class="lede">One card per tool: what it is, how it's used, and what was
  decided about it.
  <a href="/api/register?fmt=csv" style="color:var(--pri)">Download CSV</a></p>

  ${rows.length ? `<div class="cards">
  ${rows.map(r => `<div class="card">
    <div class="card-top">
      <div style="min-width:0">
        <div class="card-name">${esc(r.name)}
          ${_newToday(r) ? '<span class="pill p-acc">new today</span>' : ''}</div>
        <div class="card-meta">${r.vendor ? esc(r.vendor) + ' · ' : ''}${esc(r.id)}</div>
      </div>
      ${status(r)}
    </div>
    <hr>
    <dl class="card-kv">
      <dt>usage</dt><dd>${r.devices} device${r.devices === 1 ? '' : 's'},
        ${r.users} user${r.users === 1 ? '' : 's'}</dd>
      <dt>accounts</dt><dd>corp ${num(r.corporate_accounts)} ·
        personal ${r.personal_accounts
          ? `<span class="pill p-warn">${r.personal_accounts}</span>` : num(0)}</dd>
      <dt>surfaces</dt><dd>${r.surfaces.length ? esc(r.surfaces.join(', ')) : '—'}</dd>
      <dt title="The registry's own risk_tier for this tool - a shipped default about the tool's category and data reach, not an assessment of how you use it. Editable per tool in the Tool registry.">risk</dt><dd>${risk(r.risk_tier) || '<span class="src-note">not set in the registry</span>'}</dd>
      <dt>last seen</dt><dd>${when(r.last_seen)}</dd>
    </dl>
    <hr>
    <div class="card-section">governance</div>
    ${GOVEDIT === r.id ? govForm(r) : `<dl class="card-kv">
      <dt>owner</dt><dd>${r.owner ? esc(r.owner) : dash}</dd>
      <dt>review</dt><dd>${review(r)}</dd>
    </dl>
    ${CFG.managed && CFG.managed.enabled ? `<div style="margin-top:8px">
      <button class="mini" data-act="gov-edit" data-key="${esc(r.id)}">edit</button>
      ${r.status_source === 'portal' ? `<button class="mini" data-act="gov-clear"
        data-key="${esc(r.id)}">clear decision</button>` : ''}
      ${!r.in_registry ? `<button class="mini" data-act="reg-suggest"
        data-key="${esc(r.id)}">add to registry</button>` : ''}</div>` : ''}`}
    ${exceptionBlock(r)}
  </div>`).join('')}
  </div>` : !dataOk() ? `<p class="lede">No AI tools to show: the findings
  could not be read. This is not an empty estate.</p>` : `<p class="lede">No AI tools observed in the last ${esc(win)}.
  That is a real answer for a small estate, and it is also what a fleet with no
  collectors deployed looks like: check Setup before reading it as a clean
  one.</p>`}
  ${watchlistBlock(new Set((REG.rows || []).map(r => r.id)))}`;
}

async function paste() {
  if (!PG) {
    try { PG = await (await fetch('/api/paste-guard')).json(); }
    catch (e) { return `<h2>Paste guard</h2><div class="note">Could not read
      paste guard activity: ${esc(String(e.message || e))}</div>`; }
  }
  const rows = (PG.rows || []).filter(r => match(r.tool));

  return `<h2>Paste guard</h2>
  <p class="lede">What the paste guard stopped, on which tool, and how often.
  Metadata only: the guard inspects clipboard content on the device and reports
  detector identifiers, so what was nearly pasted is not here and is not stored
  anywhere. A warning heeded is the guard working; an override is somebody who
  was shown the detector by name and pasted anyway, which is the row worth
  following up.</p>

  <dl class="stats">
    <div><dt${(PG.guard_devices || 0) ? '' : ' style="color:var(--dstr)"'}>${PG.guard_devices || 0}</dt>
      <dd>devices running the guard</dd></div>
    <div><dt>${PG.warned || 0}</dt><dd>warned</dd></div>
    <div><dt style="color:var(--dstr)">${PG.overridden || 0}</dt><dd>overridden</dd></div>
    <div><dt>${PG.blocked || 0}</dt><dd>blocked</dd></div>
    <div><dt>${PG.devices || 0}</dt><dd>devices with an event</dd></div>
  </dl>

  ${(PG.guard_versions || []).length ? `<p class="lede">Running
    ${PG.guard_versions.map(v => `<span class="pill p-mut">${esc(v.version)} on ${v.devices}</span>`).join('')}
    in ${PG.guard_modes.map(m => `<span class="pill ${m.mode === 'block' ? 'p-ok' : 'p-acc'}">${esc(m.mode)} on ${m.devices}</span>`).join('')}.
    A fleet split across versions is a rollout that stalled, and a device in
    warn mode where policy says block is a policy that is not in force. Neither
    is visible in a count of what was stopped.</p>` : ''}

  ${(PG.guard_modes || []).some(m => m.mode === 'warn') && (PG.warned || 0) ? `
  <div class="wcard" style="margin-bottom:14px"><h3>If block mode were on</h3>
    <p class="lede" style="margin-bottom:10px">Every warned paste in this window
    would have been stopped outright instead of asked about - the same events,
    replayed under the stricter policy. What warn cannot stop is the override
    column: block has no "paste anyway".</p>
    ${(PG.rows || []).filter(r => r.warned).map(r =>
      `<div class="covrow" style="grid-template-columns:140px auto 1fr">
        <span>${esc(r.tool)}</span>
        <b>${r.warned} stopped${r.overridden ? ` + ${r.overridden} override${r.overridden === 1 ? '' : 's'} prevented` : ''}</b>
        <span></span></div>`).join('')}
    <p class="src-note">Flip it under Settings → Fleet → paste guard mode, then
    regenerate the policy artifacts to roll it out.</p></div>` : ''}

  ${rows.length ? `<div class="tcard"><table>
  <tr><th>tool</th><th class="n">warned</th><th class="n">overridden</th>
  <th class="n">blocked</th><th class="n">devices</th><th>detectors</th>
  <th>last seen</th></tr>
  ${rows.map(r => `<tr>
    <td>${esc(r.tool)}</td>
    <td class="n">${num(r.warned)}</td>
    <td class="n">${r.overridden
      ? `<span class="pill p-warn">${r.overridden}</span>` : num(0)}</td>
    <td class="n">${num(r.blocked)}</td>
    <td class="n">${num(r.devices)}</td>
    <td>${r.detectors.map(d => `<span class="pill p-mut">${esc(d)}</span>`).join('')}</td>
    <td class="nowrap">${when(r.last_seen)}</td>
  </tr>`).join('')}
  </table></div>` : `<p class="lede">No paste events in this window. That is a real
  answer, and it is also what an estate with the extension not deployed looks
  like: check Setup before reading it as nobody having tried.</p>`}`;
}

async function iso() {
  if (!EV) {
    try { EV = await (await fetch('/api/evidence')).json(); }
    catch (e) { return `<h2>ISO/IEC 42001 evidence</h2><div class="note">Could
      not build the evidence index: ${esc(String(e.message || e))}</div>`; }
  }
  const e = EV;
  const n = v => `<b>${v}</b>`;

  // An index, not a report. Each row says what area of an AI management system
  // this supports, what the platform can currently say about it, and where the
  // underlying evidence lives. Deliberately not a card per theme: that would
  // re-render every source view and turn this into a second Overview, when the
  // value here is knowing where to look.
  //
  // No clause numbers. A mapping asserted without validation implies an
  // authority this project does not have, and reproducing the standard's own
  // wording is not ours to do.
  const rows = [
    ['Inventory and usage',
     `${n(e.tools_observed)} tools in use, ${n(e.tools_watched_for)} watched for`
     + (e.tools_not_in_registry
        ? `, ${n(e.tools_not_in_registry)} not in the registry` : ''),
     'register', 'AI register'],

    ['Governance',
     `${n(e.decisions_recorded)} decisions recorded, `
     + `${n(e.tools_without_decision)} tools without one`
     + (e.approvals_expired ? `, ${n(e.approvals_expired)} approval expired` : '')
     + (e.active_exceptions ? `, ${n(e.active_exceptions)} active exception` : ''),
     'register', 'AI register'],

    ['Monitoring coverage',
     `${n(e.sources_reporting)} of ${n(e.sources_known)} expected sources reporting`,
     'setup', 'Setup'],

    ['Account governance',
     `${n(e.personal_accounts)} personal accounts across `
     + `${n(e.personal_account_tools)} tools`,
     'personal', 'Personal accounts'],

    ['Data protection',
     `${n(e.paste_events)} paste events, ${n(e.paste_overridden)} overridden. `
     + `Inspected content is not retained`,
     'paste', 'Paste guard'],

    ['Integrations',
     `${n(e.mcp_servers)} MCP servers observed`,
     'mcp', 'MCP servers'],

    ['Third parties',
     `${n(e.providers)} providers observed across the tools in use`,
     'register', 'AI register'],

    ['Evidence',
     `Snapshot for the window ${esc((e.window||{}).from||'').slice(0,10)} to `
     + `${esc((e.window||{}).to||'').slice(0,10)}, checksummed`,
     null, 'This page'],
  ];

  // Review inputs are the only separate block, because they are things
  // somebody may need to act on rather than a category of evidence. Framed as
  // inputs to a human review, not as conclusions: the platform can say a tool
  // has no decision, and cannot say whether that matters.
  const inputs = [
    [e.approvals_expired, `${e.approvals_expired} approval${e.approvals_expired === 1 ? '' : 's'} expired`, 'register'],
    [e.tools_without_decision, `${e.tools_without_decision} observed tool${e.tools_without_decision === 1 ? '' : 's'} with no governance decision`, 'register'],
    [e.tools_not_in_registry, `${e.tools_not_in_registry} tool${e.tools_not_in_registry === 1 ? '' : 's'} in use and not in the registry`, 'register'],
    [e.tools_without_owner, `${e.tools_without_owner} decision${e.tools_without_owner === 1 ? '' : 's'} with no owner`, 'register'],
    [e.reviews_due_soon, `${e.reviews_due_soon} review${e.reviews_due_soon === 1 ? '' : 's'} due within ${e.reviews_due_soon_days} days`, 'register'],
    [e.personal_accounts, `${e.personal_accounts} personal account${e.personal_accounts === 1 ? '' : 's'} observed`, 'personal'],
    [Math.max(0, (e.sources_known||0) - (e.sources_reporting||0)),
     `${Math.max(0, (e.sources_known||0) - (e.sources_reporting||0))} expected source${(e.sources_known - e.sources_reporting) === 1 ? '' : 's'} not reporting`, 'setup'],
    [e.paste_overridden, `${e.paste_overridden} paste warning${e.paste_overridden === 1 ? '' : 's'} overridden`, 'paste'],
    [e.mcp_findings, `${e.mcp_findings} MCP finding${e.mcp_findings === 1 ? '' : 's'}`, 'mcp'],
  ].filter(([count]) => count > 0);

  return `<h2>ISO/IEC 42001 evidence</h2>
  <p class="lede">What Shadow AI Guard can currently say, and where each
  record lives, as evidence for an AI management system. This is an index,
  not an assessment: no compliance score, no clause mapping, no claim that a
  control is satisfied. Gaps are shown next to totals on purpose - the gap is
  usually the useful part.</p>

  <table>
  <tr><th>Theme</th><th>What Shadow AI Guard can say</th><th>Evidence source</th></tr>
  ${rows.map(([theme, says, target, label]) => `<tr>
    <td>${esc(theme)}</td>
    <td style="font-family:inherit">${says}</td>
    <td>${target ? `<a href="#${target}" style="color:var(--pri)">${esc(label)}</a>`
                 : esc(label)}</td>
  </tr>`).join('')}
  </table>

  <h3 style="margin-top:26px;font-size:14px">Review inputs</h3>
  <p class="lede">Things a person may need to look at. The platform can tell
  you a tool has no recorded decision; whether that matters is your call.</p>
  ${inputs.length ? `<ul class="inputs">
    ${inputs.map(([, text, target]) =>
      `<li><a href="#${target}">${esc(text)}</a></li>`).join('')}
  </ul>` : !dataOk() ? `<p class="lede">Nothing to review: the findings
  could not be read.</p>` : `<p class="lede">Nothing outstanding in this window. Sanity check:
  ${e.sources_reporting} of ${e.sources_known} expected sources are reporting -
  an estate with nothing reporting looks "clean" too.</p>`}

  <h3 style="margin-top:26px;font-size:14px">Evidence snapshot</h3>
  <p class="lede">A checksummed JSON file of the counts above for this window,
  with the registry and governance files identified by hash. Generated on
  demand, not stored. Note it can't be regenerated identically later (log
  retention), and the checksum detects accidental changes, not deliberate
  ones.
  <a href="/api/evidence?download=true" style="color:var(--pri)">Download JSON</a></p>`;
}

// One string setting as an editable row: input, save, and where the value
// came from. The password key reports {set, source} rather than a value,
// so its input is always blank and saving blank CLEARS it - said in the
// note rather than discovered.
// The i beside a field label. Every field's explanation folds behind it,
// so a row is label + input + save - what someone changing a value scans
// for. What stays visible is state (set, and from where), because that is
// a glance rather than reading.
const INFO = '<button class="info" data-info type="button" title="about this field">i</button>';

function settingRow(key, label, placeholder, note) {
  const s = (SETTINGS && SETTINGS.settings || {})[key] || {value: '', source: 'unset'};
  const secret = !('value' in s);
  const state = secret
    ? (s.set ? '<span class="pill p-ok">set</span>' : '')
    : s.source === 'db' ? '<span class="pill p-mut">saved here</span>'
    : s.source === 'env' ? '<span class="pill p-mut">from deployment</span>' : '';
  const src = s.source === 'db'
    ? (s.env ? `Saved in the portal (overriding the deployment's value; clear to fall back to it).` : 'Saved in the portal.')
    : s.source === 'env' ? `Currently from the deployment's environment; saving here overrides it.` : '';
  const secretNote = secret
    ? (s.set ? 'A value is set (never shown). Leave blank and save to CLEAR it; type and save to replace it.' : 'Not set.')
    : '';
  const more = `${esc(note)}${note ? ' ' : ''}${secretNote || src}`.trim();
  return `<dt>${esc(label)}${more ? INFO : ''}</dt><dd>
    <input id="set-${esc(key)}" class="mfield" style="min-width:340px"
      ${secret ? 'type="password" autocomplete="off"' : ''}
      placeholder="${esc(placeholder)}"
      value="${secret ? '' : esc(s.value || '')}">
    <button class="mini" data-act="save-setting" data-key="${esc(key)}">save</button>
    ${state}
    ${more ? `<div class="src-note fnote">${more}</div>` : ''}</dd>`;
}

// The paste guard and extension-delivery settings, shared by the Settings
// view and the extension setup guide. The paste guard IS the browser
// extension - one package, one policy - and these values are baked into
// every generated policy artifact, so a change here means regenerate and
// re-push. Split in two: behaviour (what the guard does) and delivery
// (where the packed extension lives), because the guide puts them on
// different pages while Settings shows everything flat.
// The overview's widgets as toggles. The stored value underneath is
// still the comma-separated overview_widgets string an env-configured
// deployment sets, but a managed operator should never have to know the
// tokens: every widget the portal can draw is offered here by name, and
// one added in a release shows up as an unchecked option instead of
// hiding behind a list saved before it existed. Configured Grafana
// panels ride along as their own toggles.
function widgetPickerRow() {
  const catalog = CFG.overview_widget_catalog || {};
  const eff = CFG.overview_widgets || [];
  const on = new Set(eff.filter(w => w.kind && w.kind !== 'grafana'
    && w.kind !== 'error').map(w => w.kind));
  const refs = new Set(eff.filter(w => w.kind === 'grafana')
    .map(w => String(w.ref)));
  const box = (id, checked, ref, label, desc) => `
    <label style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px;cursor:pointer">
      <input type="checkbox" id="${id}" ${ref ? `data-ref="${esc(ref)}"` : ''}
        style="min-width:0;margin:0;accent-color:var(--pri)" ${checked ? 'checked' : ''}>
      <span>${label}${desc ? ` <span style="color:var(--mut)">— ${esc(desc)}</span>` : ''}</span>
    </label>`;
  const panels = (CFG.grafana_panels || []).filter(p => !p.error);
  const panelRef = p => p.title || String(p.panel_id);
  const orphans = [...refs].filter(r =>
    !panels.some(p => r === p.title || r === String(p.panel_id)));
  return `<dt>Overview widgets${INFO}</dt><dd>
    ${ents(catalog).map(([k, d]) => box('ow-' + k, on.has(k), '',
      `<span class="mono">${esc(k)}</span>`, d)).join('')}
    ${panels.map((p, i) => box('owg-' + i,
      refs.has(p.title) || refs.has(String(p.panel_id)), panelRef(p),
      `<span class="mono">grafana:${esc(panelRef(p))}</span>`,
      'embedded Grafana panel')).join('')}
    ${orphans.map((r, i) => box('owo-' + i, true, r,
      `<span class="mono">grafana:${esc(r)}</span>`,
      'saved panel reference (no longer in the panels list)')).join('')}
    <button class="mini" data-act="save-widgets" style="margin-top:4px">save</button>
    <div class="src-note fnote">What the overview draws, in this order.
    Unticking everything is refused rather than saved: an empty list falls
    back to the default set, which is probably not what you meant.</div>
  </dd>`;
}

function pasteGuardBehaviourFields() {
  const s = (SETTINGS && SETTINGS.settings) || {};
  const mode = (s.paste_guard_mode || {}).value || '';
  const marksSet = (s.classification_markings || {}).source === 'db';
  const marks = marksSet ? ((s.classification_markings || {}).value || []) : null;
  const opt = (v, label) => `<option value="${v}"${mode === v ? ' selected' : ''}>${label}</option>`;
  return `
    <dt>Paste guard mode${INFO}</dt><dd>
      <select id="set-paste_guard_mode" class="mfield">

      </select>
      <button class="mini" data-act="save-setting" data-key="paste_guard_mode">save</button>
      <div class="src-note fnote">What happens when someone pastes marked content
      into an AI tool: warn asks them first, block stops it. Baked into the
      policy downloads.</div></dd>
    <dt>Classification markings${INFO}</dt><dd>
      <textarea id="set-classification_markings" class="mfield" rows="4"
        style="min-width:340px;resize:vertical;font-family:inherit"
        placeholder="one marking per line (empty = the default set)">${marks === null ? '' : esc(marks.join('\n'))}</textarea>

      one per line. Save an empty box to use no markings; clear to go back
      to the default five. What people paste never leaves their device -
      only which detector matched gets reported.</div></dd>`;
}

// The last result of a connection test, rendered where its button lives.
function testNote(which) {
  const t = TESTS[which];
  if (!t) return '';
  const bits = [];
  if (t.ok) bits.push('<span class="pill p-ok">ok</span>');
  else bits.push('<span class="pill p-warn">failed</span>');
  if (t.version) bits.push('receiver ' + esc(t.version));
  if (t.url) bits.push('<span class="mono">' + esc(t.url) + '</span>');
  if (t.detail) bits.push(esc(t.detail));
  if (t.hint) bits.push('<i>' + esc(t.hint) + '</i>');
  (t.warnings || []).forEach(w => bits.push('<span style="color:var(--warn)">' + esc(w) + '</span>'));
  return `<div class="src-note" style="margin-top:6px">${bits.join(' · ')}</div>`;
}
