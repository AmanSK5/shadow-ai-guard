# Receiver image. Multi-arch (amd64, arm64).
#
# digest wins over tag when both are set. A tag can be moved to point at
# different bytes; a digest cannot, which is what you want in an environment
# where "the same version" has to mean the same image every time.
#   digest: "sha256:..."   (from: docker buildx imagetools inspect <ref>)
image:
  repository: ghcr.io/amansk5/shadow-ai-guard/receiver
  tag: ""            # defaults to the chart's appVersion
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# The bearer token every source authenticates with.
#
#   value:         set it here (fine for a quick start, ends up in helm values)
#   existingSecret: point at a Secret you created yourself, with key authToken
#
# Leave both unset and the chart generates a random token on first install and
# keeps it across upgrades. Read it back with:
#   kubectl get secret <release>-ai-guard -o jsonpath='{.data.authToken}' | base64 -d
auth:
  value: ""
  existingSecret: ""

# Where findings go. Unset means stdout only, which still works if something
# else scrapes container logs into your log store.
loki:
  pushUrl: ""        # e.g. http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  # Basic auth, used by BOTH containers: the receiver to write and the portal
  # to read. Grafana Cloud and most hosted Loki need these; a Loki inside the
  # cluster usually does not.
  #
  # On Grafana Cloud the username is a numeric instance id, not an email, and
  # the access policy needs logs:write AND logs:read. A read-only token
  # produces a 401 the receiver counts while still returning 200 to the
  # collector, so findings look accepted and are not stored.
  #
  # The password comes from a Secret rather than a value, because a value here
  # ends up in `helm get values` and in whatever holds this file.
  username: ""
  existingSecret: ""       # a Secret with a `lokiPassword` key

# Optional. Unset means findings are logged and dashboarded but nothing pages.
alertmanager:
  url: ""
  ttlMinutes: 120

# Timezone for the human-readable timestamp on alerts. Machine timestamps are
# always UTC.
displayTz: UTC

# Corporate domains, served to the endpoint collectors inside
# /registry/collector as config.corp_domains. Collectors prefer this list to
# their locally configured one, so a change here reaches the fleet on its
# next check-in with no MDM re-push per platform. Empty means nothing is
# served and collectors keep using their local configuration.
corpDomains: []

# Managed mode: device enrollment, per-device credentials, revocation and a
# real fleet inventory, backed by one SQLite file on a PersistentVolumeClaim.
# Off means byte-for-byte the classic receiver: no volume, no admin routes,
# no state. The shared token keeps working for ingest either way - a fleet
# migrates by swapping the token in each MDM for an enrollment token, one
# platform at a time.
#
# SQLite has one writer, so managed mode requires replicaCount: 1 (the chart
# refuses to render otherwise) and uses a Recreate strategy so two pods never
# hold the volume at once.
#
# Enabling this on a release installed with chart 0.8.7 or older needs one
# manual step first: those charts never declared an update strategy, so the
# API server's defaulted rollingUpdate block is owned by nobody and server-
# side apply cannot clear it when the strategy switches to Recreate. Either
# upgrade to this chart once with managed off (the chart takes ownership),
# or clear it directly and upgrade straight to managed:
#   kubectl patch deployment <release>-ai-guard --type=json -p='[
#     {"op":"remove","path":"/spec/strategy/rollingUpdate"},
#     {"op":"replace","path":"/spec/strategy/type","value":"Recreate"}]'
# ON BY DEFAULT since 0.9.9: a fresh install is the zero-touch path - one
# helm install, a setup code from the receiver's log, and everything else
# in the portal. Set enabled: false for classic mode: file-and-env driven,
# GitOps-reviewable, no server-side state - every managed feature has a
# file or env equivalent (governance.yaml, CORP_DOMAINS, the registry from
# a checkout, basic auth).
managed:
  enabled: true
  # OPTIONAL since 0.8.12: an API credential for /admin/* - automation, and
  # break-glass recovery when the portal password is lost. Humans need
  # nothing here: the receiver's first boot prints a one-time setup code to
  # its log, and creating the admin account in the portal is the whole
  # story. Leave both unset (the default) and no admin secret exists at all.
  # Deliberately a separate secret from the shared token, which sits on
  # every machine in the fleet.
  adminToken:
    value: ""
    existingSecret: ""   # a Secret with an `adminToken` key
  persistence:
    size: 1Gi
    storageClass: ""     # empty means the cluster default
    existingClaim: ""    # use a PVC you created yourself
  # The off-switch for the shared token, once every collector, browser
  # profile and scanner has enrolled: /report and /registry then accept
  # device credentials only, and the shared token is refused with a 401 that
  # says "enroll". The final step of the migration, not a mode - flip it back
  # and unenrolled machines report again. The shared token Secret stays
  # (the receiver still requires it at startup); it just stops being accepted.
  requireDeviceCredentials: false

# The compiled registry ships with the chart, so the receiver has an
# identifier list on first install with nothing to build. Set create: false to
# manage the ConfigMap yourself (for example from a CI job that compiles
# registry.yaml on every merge).
registry:
  create: true
  existingConfigMap: ""

service:
  type: ClusterIP
  port: 8080

# Endpoints report over HTTPS, so the receiver needs to be reachable from
# every machine that runs a collector or the browser extension.
ingress:
  enabled: false
  className: ""
  host: ai-guard.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: ai-guard-tls
  # On a Tailscale-operator cluster, set className to "tailscale" and host to
  # a short name like "ai-guard": the operator issues the cert and serves it
  # at https://ai-guard.<tailnet>.ts.net.

# ---------------------------------------------------------------- portal ----
#
# A governance view over the findings the receiver already collects: which
# tools a device has, which devices a person uses, which of your sources are
# reporting and which are silent. It reads and never writes, holds no
# database, and is not in the ingest path, so it can be removed at any time
# and collection carries on.
#
# On by default: deploying the receiver should give you somewhere to look at
# what it collected. Set enabled: false if you only want the receiver.
portal:
  enabled: true

  # Managed mode only (managed.enabled above): where the portal proxies
  # admin actions, and the ingest URL that gets baked into downloaded
  # deployment artifacts. Both default sensibly - the chart's own receiver
  # service, and the receiver ingress host when one is enabled. Set
  # receiverPublicUrl explicitly when agents reach the receiver some other
  # way: it must be reachable from the machines being enrolled, which a
  # cluster-internal service name is not.
  receiverUrl: ""
  receiverPublicUrl: ""

  image:
    repository: ghcr.io/amansk5/shadow-ai-guard/portal
    tag: ""          # defaults to the chart's appVersion
    digest: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Where the portal reads findings back from: the same log store the receiver
  # writes to, reachable from inside the cluster. Leave it empty and the portal
  # still starts and tells you it is missing, rather than failing to install.
  # This is the BASE url; the portal appends its own query path, unlike
  # loki.pushUrl above which is the full push endpoint.
  #   e.g. http://loki.monitoring.svc.cluster.local:3100
  lokiUrl: ""

  # The portal names who runs what on which machine, so it refuses to start
  # without authentication.
  #
  # In MANAGED mode (managed.enabled above) this whole block is moot unless
  # mode is none: the portal gets a real login backed by the receiver's
  # admin account - created on first boot with the setup code the receiver
  # prints to its log - and basic auth is not rendered at all.
  #
  # Classic mode:
  #   mode: basic   username plus a password, generated if you do not set one
  #   mode: none    no authentication. Correct behind a proxy or a mesh that
  #                 authenticates for it; wrong on anything reachable. Logs a
  #                 warning on every start. (Also honoured in managed mode:
  #                 reads are open, admin actions still need the login.)
  #
  # Basic auth is one shared credential with no per-user trail. If your
  # ingress can do OIDC or mTLS, do it there and set mode: none.
  #
  # Leave password unset and the chart generates one on first install and
  # keeps it across upgrades. Read it back with:
  #   kubectl get secret <release>-ai-guard-portal -o jsonpath='{.data.password}' | base64 -d
  auth:
    mode: basic
    username: admin
    password: ""
    existingSecret: ""     # a Secret you created yourself, with key `password`

  # How far back it looks, and how long a derived graph is reused. The cache
  # stops a seven-day query being rerun on every page load; it is not state,
  # since it rebuilds on restart.
  lookbackHours: 168
  # Short enough that a finding which just arrived is not invisible, long
  # enough to absorb a page refresh. The portal shows how old the data is and
  # has a refresh control, so this is a comfort setting rather than a limit.
  cacheTtlSeconds: 30

  # Optional. A ConfigMap with key identity-map.csv, mapping people to the
  # machines they use, where the key is a device identifier or a local
  # username. The portal proposes one at /api/suggest-identities?fmt=csv and
  # will not apply it: these are string matches, and a mapping the platform
  # invented and then acted on is how the wrong name lands on a report.
  #
  # This is personal data. A Secret is a defensible choice instead.
  identityMap:
    existingConfigMap: ""

  # Optional. Approval decisions, owners and review dates, as governance.yaml
  # in a ConfigMap. Without it the register falls back to the registry's own
  # approved flag, every tool reads as undecided, and the owner and review
  # columns show as not set.
  #
  # Separate from the registry on purpose. The registry answers what a tool is
  # and how to detect it, and it ships with the project. This answers what your
  # organisation decided, which is nobody else's to ship. It also never reaches
  # a detector: approval used to be compiled into the browser extension's own
  # config, which had no use for it.
  #
  # Approval records a governance position and does NOT change finding
  # severity. Severity depends on the account domain: a personal account is a
  # warn whether or not the tool is approved. Approval must never come to mean
  # safe.
  #
  # Create it from your own file:
  #   kubectl create configmap ai-guard-governance --from-file=governance.yaml
  #
  # Validate it first, with governance/validate.py from the repo. An approval
  # with no review date is a schema error, because an approval with no expiry
  # is the one that outlives the person who made it.
  governance:
    existingConfigMap: ""

  # Optional. Embeds Grafana panels on the portal's dashboard tab.
  #
  # Grafana refuses to be framed by default, deliberately: framing a session
  # someone is logged into is how clickjacking works. On the Grafana side it
  # needs allow_embedding, cookie_samesite=none, and - if your Grafana has a
  # login at all - cookie_secure=true. That last one is easy to miss and locks
  # you out of Grafana when it is: SameSite=None is only valid alongside
  # Secure, so the browser silently discards the session cookie and every
  # login bounces back to the login screen.
  #
  # url is the URL a BROWSER reaches Grafana on, not one resolvable inside the
  # cluster: the frames are loaded by the browser.
  #
  # Which widgets the overview shows, in order. A deployment decision rather
  # than a per-user one: the portal holds no state and has no users to hold it
  # against, so this is the level at which an organisation shapes its landing
  # page without the portal growing a database and an identity model.
  #
  # Known widgets: stat_row, top_tools, recent_personal_accounts,
  # detection_coverage, source_health. A grafana:<panel title> entry embeds a
  # panel named in grafana.panels below. An unknown name renders an error card
  # naming what is valid, rather than quietly not appearing.
  #
  # Empty means a sensible default rather than an empty page.
  overview:
    widgets: []

  # A weekly summary to a Slack-compatible incoming webhook: personal
  # accounts, tools in use, silent sources. Sent by the portal's background
  # task, which holds no operator session - so on the managed default,
  # where the log store is saved through the wizard, it reads via the
  # receiver's admin credential: set managed.adminToken (value or
  # existingSecret) and the chart mounts it for the portal automatically
  # while the digest is on. A deployment that sets the portal's log store
  # by env instead needs no credential. Distinct from the receiver's
  # webhook_url setting, which fires on new discovery candidates the
  # moment they appear.
  digest:
    webhookUrl: ""
    day: ""      # mon..sun, default mon
    hour: ""     # 0-23 UTC, default 8

  # Panel ids are not knowable until Grafana is running with data, so this is
  # usually a second pass. See the chart README.
  grafana:
    url: ""
    # dashboardUid:panelId:Title, semicolon separated. Semicolons because
    # panel titles contain commas.
    panels: ""
    # Or embed a whole dashboard in one frame, which needs no panel ids.
    dashboardUid: ""

  service:
    type: ClusterIP
    port: 8091

  # Unlike the receiver, nothing has to reach the portal except people. Leave
  # this off and reach it with kubectl port-forward until you have decided how
  # it should be exposed and authenticated.
  ingress:
    enabled: false
    className: ""
    host: ai-guard-portal.example.com
    annotations: {}
    tls:
      enabled: true
      secretName: ai-guard-portal-tls

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

# The receiver never calls the Kubernetes API, so it has no use for a
# ServiceAccount token. Mounting one anyway hands a credential to anything
# that gets code execution in the pod.
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Managed mode mounts a PVC for the state DB. Most StorageClasses hand the
  # volume over owned by root, and it is fsGroup that makes the kubelet chown
  # it to something uid 65532 can write - without it the receiver crash-loops
  # on "unable to open database file" before serving a single request.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}