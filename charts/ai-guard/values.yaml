# Receiver image. Multi-arch (amd64, arm64).
#
# digest wins over tag when both are set. A tag can be moved to point at
# different bytes; a digest cannot, which is what you want in an environment
# where "the same version" has to mean the same image every time.
#   digest: "sha256:..."   (from: docker buildx imagetools inspect <ref>)
image:
  repository: ghcr.io/amansk5/shadow-ai-guard/receiver
  tag: ""            # defaults to the chart's appVersion
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# The bearer token every source authenticates with.
#
#   value:         set it here (fine for a quick start, ends up in helm values)
#   existingSecret: point at a Secret you created yourself, with key authToken
#
# Leave both unset and the chart generates a random token on first install and
# keeps it across upgrades. Read it back with:
#   kubectl get secret <release>-ai-guard -o jsonpath='{.data.authToken}' | base64 -d
auth:
  value: ""
  existingSecret: ""

# Where findings go. Unset means stdout only, which still works if something
# else scrapes container logs into your log store.
loki:
  pushUrl: ""        # e.g. http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# Optional. Unset means findings are logged and dashboarded but nothing pages.
alertmanager:
  url: ""
  ttlMinutes: 120

# Timezone for the human-readable timestamp on alerts. Machine timestamps are
# always UTC.
displayTz: UTC

# The compiled registry ships with the chart, so the receiver has an
# identifier list on first install with nothing to build. Set create: false to
# manage the ConfigMap yourself (for example from a CI job that compiles
# registry.yaml on every merge).
registry:
  create: true
  existingConfigMap: ""

service:
  type: ClusterIP
  port: 8080

# Endpoints report over HTTPS, so the receiver needs to be reachable from
# every machine that runs a collector or the browser extension.
ingress:
  enabled: false
  className: ""
  host: ai-guard.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: ai-guard-tls
  # On a Tailscale-operator cluster, set className to "tailscale" and host to
  # a short name like "ai-guard": the operator issues the cert and serves it
  # at https://ai-guard.<tailnet>.ts.net.

# ---------------------------------------------------------------- portal ----
#
# A governance view over the findings the receiver already collects: which
# tools a device has, which devices a person uses, which of your sources are
# reporting and which are silent. It reads and never writes, holds no
# database, and is not in the ingest path, so it can be removed at any time
# and collection carries on.
#
# On by default: deploying the receiver should give you somewhere to look at
# what it collected. Set enabled: false if you only want the receiver.
portal:
  enabled: true

  image:
    repository: ghcr.io/amansk5/shadow-ai-guard/portal
    tag: ""          # defaults to the chart's appVersion
    digest: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Where the portal reads findings back from: the same log store the receiver
  # writes to, reachable from inside the cluster. Leave it empty and the portal
  # still starts and tells you it is missing, rather than failing to install.
  # This is the BASE url; the portal appends its own query path, unlike
  # loki.pushUrl above which is the full push endpoint.
  #   e.g. http://loki.monitoring.svc.cluster.local:3100
  lokiUrl: ""

  # The portal names who runs what on which machine, so it refuses to start
  # without authentication.
  #
  #   mode: basic   username plus a password, generated if you do not set one
  #   mode: none    no authentication. Correct behind a proxy or a mesh that
  #                 authenticates for it; wrong on anything reachable. Logs a
  #                 warning on every start.
  #
  # Basic auth is one shared credential with no per-user trail. If your
  # ingress can do OIDC or mTLS, do it there and set mode: none.
  #
  # Leave password unset and the chart generates one on first install and
  # keeps it across upgrades. Read it back with:
  #   kubectl get secret <release>-ai-guard-portal -o jsonpath='{.data.password}' | base64 -d
  auth:
    mode: basic
    username: admin
    password: ""
    existingSecret: ""     # a Secret you created yourself, with key `password`

  # How far back it looks, and how long a derived graph is reused. The cache
  # stops a seven-day query being rerun on every page load; it is not state,
  # since it rebuilds on restart.
  lookbackHours: 168
  # Short enough that a finding which just arrived is not invisible, long
  # enough to absorb a page refresh. The portal shows how old the data is and
  # has a refresh control, so this is a comfort setting rather than a limit.
  cacheTtlSeconds: 30

  # Optional. A ConfigMap with key identity-map.csv, mapping people to the
  # machines they use, where the key is a device identifier or a local
  # username. The portal proposes one at /api/suggest-identities?fmt=csv and
  # will not apply it: these are string matches, and a mapping the platform
  # invented and then acted on is how the wrong name lands on a report.
  #
  # This is personal data. A Secret is a defensible choice instead.
  identityMap:
    existingConfigMap: ""

  # Optional. Embeds Grafana panels on the portal's dashboard tab.
  #
  # Grafana refuses to be framed by default, deliberately: framing a session
  # someone is logged into is how clickjacking works. On the Grafana side it
  # needs allow_embedding, cookie_samesite=none, and - if your Grafana has a
  # login at all - cookie_secure=true. That last one is easy to miss and locks
  # you out of Grafana when it is: SameSite=None is only valid alongside
  # Secure, so the browser silently discards the session cookie and every
  # login bounces back to the login screen.
  #
  # url is the URL a BROWSER reaches Grafana on, not one resolvable inside the
  # cluster: the frames are loaded by the browser.
  #
  # Panel ids are not knowable until Grafana is running with data, so this is
  # usually a second pass. See the chart README.
  grafana:
    url: ""
    # dashboardUid:panelId:Title, semicolon separated. Semicolons because
    # panel titles contain commas.
    panels: ""
    # Or embed a whole dashboard in one frame, which needs no panel ids.
    dashboardUid: ""

  service:
    type: ClusterIP
    port: 8091

  # Unlike the receiver, nothing has to reach the portal except people. Leave
  # this off and reach it with kubectl port-forward until you have decided how
  # it should be exposed and authenticated.
  ingress:
    enabled: false
    className: ""
    host: ai-guard-portal.example.com
    annotations: {}
    tls:
      enabled: true
      secretName: ai-guard-portal-tls

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

# The receiver never calls the Kubernetes API, so it has no use for a
# ServiceAccount token. Mounting one anyway hands a credential to anything
# that gets code execution in the pod.
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}