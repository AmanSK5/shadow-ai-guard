{{- /*
Only when a password is given inline. Pointing at an existing Secret is the
better path and creates nothing here: in a cluster the relay credential is
already one, and the fewer copies of it the better.
*/ -}}
{{- if and .Values.managed.enabled .Values.managed.smtp.password.value (not .Values.managed.smtp.password.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-guard.fullname" . }}-smtp
  labels:
    {{- include "ai-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.managed.smtp.password.value | quote }}
{{- end }}
