{{- if .Values.portal.enabled }}
{{/*
  helm upgrade --reuse-values keeps only the values previously set and drops
  every chart default underneath them, so .Values.portal can arrive as a map
  containing nothing but whatever the last install happened to override. The
  templates below then fail on a nil pointer several frames deep, which tells
  the operator nothing about what they did.

  Helm's own answer is --reset-then-reuse-values. This says so rather than
  crashing.
*/}}
{{- if not .Values.portal.service }}
{{- fail (printf "\n\nThe portal values are incomplete: portal.service is missing, so the chart defaults were dropped.\n\nThis is what `helm upgrade --reuse-values` does - it keeps only the values you set previously and discards everything underneath them, including defaults added by a newer chart.\n\nUse --reset-then-reuse-values instead, which resets to the chart defaults and then reapplies your stored values on top:\n\n  helm upgrade %s charts/ai-guard --reset-then-reuse-values --set portal.enabled=true\n" .Release.Name) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-guard.portal.fullname" . }}
  labels:
    {{- include "ai-guard.portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-guard.portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-guard.portal.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: "{{ .Values.portal.image.repository }}{{ if .Values.portal.image.digest }}@{{ .Values.portal.image.digest }}{{ else }}:{{ .Values.portal.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8091
          env:
            # Not enforced at template time. The portal starts without it and
            # says what is missing, which is how the rest of it behaves: its
            # setup view exists precisely to tell an operator what is not
            # configured yet. A template that refuses to render is a worse
            # version of the same message, delivered before anyone can see it.
            - name: LOKI_URL
              value: {{ .Values.portal.lokiUrl | quote }}
            {{- /* The shared pair is the receiver's credentials reused for
                 reading - the portal had no Loki auth at all once, and a
                 chart install against an authenticated store produced
                 findings the portal got a 401 reading back. portal.loki.*
                 overrides let the portal carry a READ-ONLY token instead,
                 so a compromised portal never holds anything that can
                 write: worth doing where your log store can mint separate
                 read and write tokens. */}}
            {{- $ploki := .Values.portal.loki | default dict }}
            {{- with $ploki.username | default .Values.loki.username }}
            - name: LOKI_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $ploki.existingSecret | default .Values.loki.existingSecret }}
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: lokiPassword
            {{- end }}
            {{- if eq .Values.portal.auth.mode "none" }}
            # Deliberate, and it logs a warning on every start. Correct behind
            # something that authenticates for it; wrong on anything reachable.
            - name: PORTAL_AUTH
              value: "none"
            {{- else if not .Values.managed.enabled }}
            # Classic mode only. In managed mode the portal login (the
            # receiver's admin account) replaces basic auth, and the portal
            # ignores this pair with a warning - so it is not rendered.
            - name: PORTAL_USER
              value: {{ .Values.portal.auth.username | quote }}
            - name: PORTAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-guard.portal.secretName" . }}
                  key: password
            {{- end }}
            {{- if .Values.managed.enabled }}
            # Managed mode: where admin actions proxy to (the receiver's
            # in-cluster service) and, separately, the ingest URL agents can
            # actually reach - that one gets baked into downloaded artifacts,
            # and a cluster-internal name baked into a Jamf script would
            # enroll nothing. Defaults: the chart's own service, and the
            # receiver ingress host when one is enabled.
            - name: RECEIVER_URL
              value: {{ .Values.portal.receiverUrl | default (printf "http://%s:%v" (include "ai-guard.fullname" .) .Values.service.port) | quote }}
            {{- with .Values.portal.receiverPublicUrl | default (ternary (printf "https://%s" .Values.ingress.host) "" .Values.ingress.enabled) }}
            - name: RECEIVER_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: REGISTRY_PATH
              value: /etc/ai-guard/registry.json
            - name: LOOKBACK_HOURS
              value: {{ .Values.portal.lookbackHours | quote }}
            - name: CACHE_TTL_SECONDS
              value: {{ .Values.portal.cacheTtlSeconds | quote }}
            {{- with .Values.portal.overview.widgets }}
            - name: OVERVIEW_WIDGETS
              value: {{ join "," . | quote }}
            {{- end }}
            # Facts about this deployment that the portal cannot verify for
            # itself. Passed in so a support conversation can start from what
            # is actually running, and shown under a separate heading in the
            # UI so a value nobody updated is never mistaken for one something
            # checked.
            - name: DEPLOY_CHART_VERSION
              value: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
            - name: DEPLOY_RELEASE
              value: {{ .Release.Name | quote }}
            - name: DEPLOY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- with .Values.portal.identityMap.existingConfigMap }}
            - name: IDENTITY_MAP
              value: /etc/ai-guard-identity/identity-map.csv
            {{- end }}
            {{- with .Values.portal.governance.existingConfigMap }}
            - name: GOVERNANCE_PATH
              value: /etc/ai-guard-governance/governance.yaml
            {{- end }}
            {{- with .Values.portal.grafana.url }}
            - name: GRAFANA_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.portal.grafana.panels }}
            - name: GRAFANA_PANELS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.portal.grafana.dashboardUid }}
            - name: GRAFANA_DASHBOARD_UID
              value: {{ . | quote }}
            {{- end }}
            {{- /* default dict, because `helm upgrade --reuse-values`
                 renders old values against this new template and the digest
                 key does not exist there. Chained access on the missing key
                 is a nil-pointer render error, which turned every
                 reuse-values upgrade into a failure (v0.11.0). */}}
            {{- $digest := .Values.portal.digest | default dict }}
            {{- with $digest.webhookUrl }}
            - name: DIGEST_WEBHOOK_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.managed.enabled
                       (or .Values.managed.adminToken.value .Values.managed.adminToken.existingSecret) }}
            # The portal's own service credential for server-side receiver
            # reads: the log-store secrets hop (which viewer sessions are
            # refused, by design - a read-only account must not be a path
            # to a write-capable credential) and the digest's background
            # task. Mounted whenever the credential exists.
            - name: RECEIVER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.managed.adminToken.existingSecret | default (printf "%s-admin" (include "ai-guard.fullname" .)) }}
                  key: adminToken
            {{- end }}
            {{- with $digest.day }}
            - name: DIGEST_DAY
              value: {{ . | quote }}
            {{- end }}
            {{- with $digest.hour }}
            - name: DIGEST_HOUR
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: registry
              mountPath: /etc/ai-guard
              readOnly: true
            {{- with .Values.portal.identityMap.existingConfigMap }}
            - name: identity-map
              mountPath: /etc/ai-guard-identity
              readOnly: true
            {{- end }}
            {{- with .Values.portal.governance.existingConfigMap }}
            - name: governance
              mountPath: /etc/ai-guard-governance
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
      volumes:
        - name: registry
          configMap:
            name: {{ include "ai-guard.registryConfigMap" . }}
        {{- with .Values.portal.identityMap.existingConfigMap }}
        # Maps named people to the machines they use. Personal data: a Secret
        # is a defensible choice here too, and the portal only reads it.
        - name: identity-map
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with .Values.portal.governance.existingConfigMap }}
        - name: governance
          configMap:
            name: {{ . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}