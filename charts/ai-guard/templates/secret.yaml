{{- if not .Values.auth.existingSecret }}
{{/*
  Token precedence: an explicit value wins; otherwise reuse the token already
  in the cluster so upgrades do not rotate it out from under every deployed
  collector; otherwise generate one.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ai-guard.fullname" .) -}}
{{- $token := "" -}}
{{- if .Values.auth.value -}}
{{- $token = .Values.auth.value -}}
{{- else if and $existing $existing.data.authToken -}}
{{- $token = ($existing.data.authToken | b64dec) -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-guard.fullname" . }}
  labels:
    {{- include "ai-guard.labels" . | nindent 4 }}
type: Opaque
data:
  authToken: {{ $token | b64enc | quote }}
{{- end }}
