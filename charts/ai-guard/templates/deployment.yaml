{{- if and .Values.managed.enabled (gt (int .Values.replicaCount) 1) }}
{{- fail "managed mode is backed by SQLite, which has one writer: set replicaCount to 1 (a Postgres option is future work)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-guard.fullname" . }}
  labels:
    {{- include "ai-guard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.managed.enabled }}
  # The state volume is ReadWriteOnce, so a rolling update's new pod would
  # wedge waiting for a mount the old pod still holds.
  strategy:
    type: Recreate
  {{- else }}
  # Spelled out although it is the default, and not for readability: server-
  # side apply only clears fields the chart owns, so a release that never
  # declared rollingUpdate cannot later switch to Recreate - the defaulted
  # block stays behind, unowned, and the API server rejects the combination.
  # Owning it from the start is what makes managed.enabled a clean flip.
  # (Releases installed before this block need one manual step first; see
  # the managed.enabled comment in values.yaml.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-guard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-guard.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: receiver
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-guard.secretName" . }}
                  key: authToken
            {{- with .Values.loki.pushUrl }}
            - name: LOKI_PUSH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.loki.username }}
            - name: LOKI_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.loki.existingSecret }}
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: lokiPassword
            {{- end }}
            {{- with .Values.alertmanager.url }}
            - name: ALERTMANAGER_URL
              value: {{ . | quote }}
            - name: ALERT_TTL_MINUTES
              value: {{ $.Values.alertmanager.ttlMinutes | quote }}
            {{- end }}
            - name: DISPLAY_TZ
              value: {{ .Values.displayTz | quote }}
            {{- with .Values.corpDomains }}
            - name: CORP_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.managed.enabled }}
            - name: MANAGED_MODE
              value: "true"
            {{- if .Values.managed.requireDeviceCredentials }}
            - name: REQUIRE_DEVICE_CREDENTIALS
              value: "true"
            {{- end }}
            - name: STATE_DB_PATH
              value: /var/lib/ai-guard/state.db
            {{- if or .Values.managed.adminToken.value .Values.managed.adminToken.existingSecret }}
            # Optional since 0.8.12: the admin API credential for automation
            # and break-glass. Humans sign in through the portal instead
            # (first boot prints a one-time setup code to this pod's log).
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.managed.adminToken.existingSecret | default (printf "%s-admin" (include "ai-guard.fullname" .)) }}
                  key: adminToken
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: registry
              mountPath: /etc/ai-guard
              readOnly: true
            # The root filesystem is read-only, so anything that writes needs
            # somewhere to write. /tmp is the only one the receiver uses.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.managed.enabled }}
            - name: state
              mountPath: /var/lib/ai-guard
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: registry
          configMap:
            name: {{ include "ai-guard.registryConfigMap" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.managed.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.managed.persistence.existingClaim | default (printf "%s-state" (include "ai-guard.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}