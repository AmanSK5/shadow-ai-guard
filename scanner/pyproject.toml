[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guard"
version = "0.1.0"
description = "Shadow AI discovery and MCP security scanner for IT/security teams"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Aman", email = "aman@amansk.co"}
]
keywords = ["ai", "security", "shadow-it", "mcp", "entra", "sentinelone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
    "msal>=1.28",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
ai-guard = "ai_guard.cli:main"

[project.urls]
Homepage = "https://github.com/AmanSK5/shadow-ai-guard"
Issues = "https://github.com/AmanSK5/shadow-ai-guard/issues"

[tool.setuptools.packages.find]
include = ["ai_guard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
