# AI Service Registry
# ===================
# Central registry of known AI/LLM services and their identifiers.
# Each scanner module matches its data source against this registry.
#
# Fields:
#   name:               Display name
#   vendor:             Parent company
#   category:           chatbot | copilot | embedded | api | agent
#   risk_tier:          high | medium | low (default assessment, overridable in policy.yaml)
#   domains:            DNS domains / URLs (matched by SentinelOne Deep Visibility)
#   entra_app_ids:      Entra ID application/client IDs (matched by sign-in logs)
#   email_domains:      Sender domains for signup/verification emails (matched by Exchange)
#   desktop_apps:       Bundle IDs / exe names (matched by Intune & JAMF)
#   browser_extensions: Known extension IDs (matched by Intune & JAMF)
#   mcp_identifiers:    MCP server names / registry slugs (matched by MCP scanner)
#   notes:              Context for the IT admin reviewing the report

