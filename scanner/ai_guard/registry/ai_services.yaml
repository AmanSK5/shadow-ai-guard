# ===========================================
# BRIDGE DETECTION: SaaS targets
# ===========================================
# These are NOT AI services. These are your org's SaaS tools that
# should only be accessed by browsers under normal usage.
# If a non-browser process (e.g. VS Code, Claude, Python) connects
# to these domains, it indicates an MCP bridge, API key integration,
# or automation that IT should know about.
#
# Fields:
#   name:     SaaS service name
#   domains:  API/app domains to monitor
#   notes:    Why this matters

bridge_targets:

  - name: Atlassian (Jira/Confluence)
    domains:
      - api.atlassian.com
      - "*.atlassian.net"
      - atlassian.net
    notes: >
      API token creation is self-service for all users.
      No Atlassian Guard = no admin controls.
      MCP connectors and VS Code extensions can use API tokens
      to give AI tools full read/write access.

  - name: GitHub
    domains:
      - api.github.com
      - github.com
    notes: >
      Personal access tokens are self-service.
      AI coding assistants commonly bridge to GitHub via MCP.
      Legitimate for devs using git CLI, but flag if Claude
      or other AI processes are the ones connecting.

  - name: Slack
    domains:
      - api.slack.com
      - slack.com
    notes: >
      User tokens and bot tokens can be created without admin approval.
      AI tools with Slack MCP access can read message history.

  - name: Microsoft 365 / SharePoint
    domains:
      - graph.microsoft.com
      - sharepoint.com
    notes: >
      OAuth consent is locked to admin, but if an AI tool
      somehow obtains a token (e.g. via a delegated flow the
      user already has), it could access files and mail.

  - name: Google Workspace
    domains:
      - www.googleapis.com
      - drive.googleapis.com
      - sheets.googleapis.com
      - docs.googleapis.com
      - drive.google.com
      - docs.google.com
    notes: >
      Google API keys and OAuth tokens can be self-provisioned.
      AI tools bridging to Google Drive/Docs can access shared files.

  - name: Figma
    domains:
      - api.figma.com
      - figma.com
    notes: >
      Personal access tokens are self-service.
      Design files may contain unreleased proprietary work.

# Allowed process names for bridge detection.
# These are known browsers, native SaaS desktop apps, and system processes
# that legitimately connect to the bridge target domains.
# Only processes NOT in this list trigger a bridge finding.
allowed_processes:

  # Browsers
  - chrome
  - Google Chrome
  - Google Chrome Helper
  - Google Chrome Helper (Renderer)
  - Google Chrome Helper (GPU)
  - Google Chrome Helper (Plugin)
  - firefox
  - safari
  - Safari Networking
  - msedge
  - Microsoft Edge
  - Microsoft Edge Helper
  - brave
  - opera
  - arc
  - Arc
  - Arc Helper

  # Native SaaS desktop apps (these talk to their own backends, not bridges)
  - Slack
  - Slack.exe
  - Slack Helper
  - Slack Helper (Renderer)
  - Teams
  - Teams.exe
  - Microsoft Teams
  - Microsoft Teams Helper
  - ms-teams
  - OneDrive
  - OneDrive.exe
  - OneDriveStandaloneUpdater.exe
  - SharePoint.exe
  - Outlook
  - Outlook.exe
  - OUTLOOK.EXE
  - Figma
  - Figma.exe
  - Figma Helper
  - Notion
  - Notion.exe
  - Notion Helper

  # Windows system processes
  - svchost.exe
  - svchost
  - backgroundTaskHost.exe
  - backgroundTaskHost
  - SearchHost.exe
  - SearchProtocolHost.exe
  - RuntimeBroker.exe
  - explorer.exe
  - taskhostw.exe
  - sihost.exe
  - dllhost.exe
  - services.exe
  - lsass.exe
  - csrss.exe
  - wininit.exe
  - System
  - msedgewebview2.exe
  - WebViewHost.exe
  - CompPkgSrv.exe
  - StartMenuExperienceHost.exe

  # Microsoft Office / M365 background processes
  - OneDrive.Sync.Service.exe
  - EXCEL.EXE
  - WINWORD.EXE
  - POWERPNT.EXE
  - Microsoft.Notes.exe

  # Windows search / UI
  - SearchApp.exe

  # Firefox
  - firefox.exe

  # Linux system processes
  - systemd-resolved

  # macOS system processes
  - com.apple.WebKit.Networking
  - nsurlsessiond
  - trustd
  - mDNSResponder
  - networkserviceproxy
  - com.apple.Safari.WebContent
  - CalendarAgent
  - accountsd
  - remindd
  - sharingd

  # Auto-updaters (normal background activity)
  - updater
  - updater.exe
  - Update
  - GoogleUpdate
  - SoftwareUpdateAgent
  - softwareupdated
  - Microsoft Update Assistant
  - MicrosoftAutoUpdate

  # Git (legitimate dev tool, not an AI bridge)
  - git
  - git.exe
  - git-remote-https
  - gh
  - gh.exe

# ===========================================
# DISCOVER EXCLUSIONS
# ===========================================
