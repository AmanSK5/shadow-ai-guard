contributing: >
  To add a new AI service, submit a PR with all known identifiers.
  At minimum, provide: name, vendor, category, risk_tier, and domains.
  Entra app IDs can be found in Azure Portal > Enterprise Applications
  after a user has authenticated to the service via SSO.
  To add a bridge target, add the SaaS service's API domains to the
  bridge_targets section.
