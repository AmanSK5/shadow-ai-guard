# Custom secret rules layered on top of Trivy's built-ins.
#
# The receiver's bearer token is `openssl rand -hex 32`: no provider prefix,
# no distinguishing shape, so no built-in rule matches it. GitHub secret
# scanning cannot cover it either, since custom patterns require an
# organisation-owned repo with Secret Protection.
#
# This rule is therefore the only automated check on the two places a
# deployer is invited to paste a real token into a tracked file:
#   endpoint/windows/ai-guard-collector.ps1   ($Token = '__RECEIVER_TOKEN__')
#   extension/src/background.js               (FALLBACK_AUTH_TOKEN = "")
#
# It stays quiet on the committed placeholders: __RECEIVER_TOKEN__ is 18
# characters, below the 24 minimum, and the demo's "demo-token" is 10.

rules:
  - id: aiguard-receiver-token
    category: AIGuard
    title: ai-guard receiver bearer token in source
    severity: CRITICAL
    keywords:
      - token
      - Token
      - TOKEN
    regex: (?i)(\$token|auth_token|aiguard_token|authtoken)\s*[:=]\s*["'][A-Za-z0-9+/=_-]{24,}["']