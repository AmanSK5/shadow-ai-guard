# Example receiver deployment: Deployment, Service, Ingress in one file.
# Adapted from a real deployment; change the marked values and apply.
#
# No namespace is set, so this lands wherever you point it. Use the same one
# for all of the commands below, or the pod will sit in ContainerCreating
# waiting for a Secret that is somewhere else:
#
#   NS=ai-guard
#   kubectl create namespace "$NS"
#   kubectl -n "$NS" create secret generic ai-guard-receiver \
#     --from-literal=authToken="$(openssl rand -hex 32)"
#   python registry/build.py
#   kubectl -n "$NS" create configmap ai-guard-registry \
#     --from-file=registry.json=registry/dist/registry.json \
#     --from-file=collector.json=registry/dist/collector.json
#   kubectl -n "$NS" apply -f receiver/deploy/receiver.yaml
#
# If the Deployment is applied before the ConfigMap exists, the pod waits in
# ContainerCreating until it does, then starts on its own.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-guard-receiver
  labels:
    app: ai-guard-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-guard-receiver
  template:
    metadata:
      labels:
        app: ai-guard-receiver
    spec:
      # The receiver never calls the Kubernetes API, so it has no use for a
      # ServiceAccount token.
      automountServiceAccountToken: false
      # The image already runs as 65532, but declaring it here is what lets
      # Kubernetes enforce it and a policy scanner verify it. Matches the
      # USER line in receiver/Dockerfile; change both together or neither.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          # A release tag, not latest. latest moves, which means two clusters
          # applying the same file on different days run different code and
          # nothing says so. Pin harder with a digest if you want the same
          # bytes every time:
          #   image: ghcr.io/amansk5/shadow-ai-guard/receiver@sha256:...
          #
          # Keep this current with releases. It sat at 0.2.0 for a long time,
          # which is not a stale example: 0.2.0 predates authentication being
          # checked before the request body is parsed, the body size cap and
          # the field bounds. Anyone copying this file got materially weaker
          # ingestion than the chart gives them, from a file offered as the
          # simpler alternative.
          image: ghcr.io/amansk5/shadow-ai-guard/receiver:0.16.2
          imagePullPolicy: IfNotPresent
          # The receiver writes nothing to disk: findings go to stdout and,
          # optionally, straight to Loki. An emptyDir covers /tmp for anything
          # the Python runtime wants scratch space for.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-guard-receiver
                  key: authToken
            # CHANGE: your Loki push endpoint, or remove to log to stdout only
            - name: LOKI_PUSH_URL
              value: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          volumeMounts:
            - name: registry
              mountPath: /etc/ai-guard
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: registry
          configMap:
            name: ai-guard-registry
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-guard-receiver
spec:
  selector:
    app: ai-guard-receiver
  ports:
    - port: 8080
      targetPort: 8080
---
# CHANGE: host and class to suit your cluster. The endpoints (collectors,
# extension) POST here, so it must be HTTPS and reachable from all of them.
#
# On a Tailscale-operator cluster the whole Ingress can instead be:
#   spec:
#     ingressClassName: tailscale
#     defaultBackend:
#       service: { name: ai-guard-receiver, port: { number: 8080 } }
#     tls:
#       - hosts: [ai-guard]
# which gives you https://ai-guard.<tailnet>.ts.net with a valid cert and
# no cert-manager involved. Only useful if every endpoint is on the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-guard-receiver
spec:
  rules:
    - host: ai-guard.example.com
      http:
        # Only what reporting machines need. /admin and /metrics stay off
        # the public ingress: the portal reaches the admin API through the
        # cluster-internal Service, and metrics are scraped in-cluster.
        paths:
          - path: /report
            pathType: Prefix
            backend:
              service:
                name: ai-guard-receiver
                port:
                  number: 8080
          - path: /flag
            pathType: Prefix
            backend:
              service:
                name: ai-guard-receiver
                port:
                  number: 8080
          - path: /enroll
            pathType: Prefix
            backend:
              service:
                name: ai-guard-receiver
                port:
                  number: 8080
          - path: /registry
            pathType: Prefix
            backend:
              service:
                name: ai-guard-receiver
                port:
                  number: 8080
          - path: /candidates
            pathType: Prefix
            backend:
              service:
                name: ai-guard-receiver
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: ai-guard-receiver
                port:
                  number: 8080
  tls:
    - hosts: [ai-guard.example.com]
      secretName: ai-guard-tls