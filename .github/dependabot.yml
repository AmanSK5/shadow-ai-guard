version: 2
updates:
  # Keeps the SHA pins in ci.yml current. Dependabot bumps the SHA and the
  # trailing version comment together, which is the maintenance cost that
  # otherwise makes SHA pinning rot into a lie.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /receiver
      - /scanner
      - /discovery
    schedule:
      interval: weekly

  # Touches requirements.in only, never the .lock files, and nothing installs
  # from requirements.in: CI, the Dockerfiles and Trivy all read the lock. A
  # PR from here therefore ships nothing until the lock is regenerated.
  #
  # The lock-drift job in ci.yml enforces that, so these PRs fail until you
  # check out the branch, run `make lock` in the component directory and push
  # the result. Before that job existed they passed green and were closed as
  # no-ops, which is how uvicorn reached eighteen minor releases behind.
  - package-ecosystem: pip
    directories:
      - /receiver
      - /scanner
      - /discovery
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
