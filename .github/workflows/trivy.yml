name: trivy

# Security scanning: Python dependencies, OS packages inside the built images,
# IaC misconfiguration (Dockerfiles, compose, k8s manifests) and committed
# secrets. Findings are published to GitHub code scanning alongside CodeQL.
#
# Supply chain posture matches ci.yml: no third-party actions. The
# aquasecurity/trivy-action repo was compromised in March 2026, so Trivy runs
# here as its own container, pinned by digest, driven from plain shell. The
# one action beyond checkout is github/codeql-action/upload-sarif, which is
# GitHub-owned and pinned to a commit SHA like everything else.
#
# To bump Trivy, change the tag and digest in TRIVY together. Resolve with:
#   docker buildx imagetools inspect aquasec/trivy:0.72.0 --format '{{.Manifest.Digest}}'
#
# Each scan runs twice: once to produce SARIF (never fails, so findings always
# reach the Security tab) and once to gate the build (fails, and prints a
# readable table). The alternative is one run that writes SARIF and exits
# non-zero, which relies on Trivy writing the file before it exits. It does,
# but a scanner that silently loses findings when it trips is not worth the
# five seconds saved on a warm DB cache.
#
# Filters, and why they differ between the two:
#
#   repo scans   SARIF publishes HIGH and CRITICAL including unfixed; the gate
#                only fails on ones with a fix. These are our own Python
#                dependencies, so an unfixed finding is still actionable: pin,
#                replace or drop the package.
#
#   image scans  Both use --ignore-unfixed. These are Debian packages in
#                python:3.12-slim, which we do not control. Publishing them
#                produced 23 alerts nobody could act on, tripled because each
#                component image is its own category. When one becomes
#                fixable the gate catches it automatically, so publishing the
#                unfixed ones added noise and no signal. The full report step
#                still prints everything to the log.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. This is the job that matters: it catches CVEs published against
    # code that has not changed since the last commit.
    - cron: '13 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Required to publish SARIF to code scanning. Not granted to pull requests
  # from forks, which is why every upload tolerates failure on a fork PR: it
  # should fail on findings, not on a permission it was never going to have.
  #
  # That tolerance is scoped to fork PRs only. It used to be unconditional,
  # which meant an upload failing on main left the Security tab quietly
  # unfed while the run stayed green, and the only symptom was an absence of
  # new findings, indistinguishable from having none.
  security-events: write

env:
  TRIVY: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  # The vulnerability DB is pulled from a registry. Anonymous pulls are rate
  # limited and will flake the job, so authenticate with the workflow token.
  TRIVY_USERNAME: ${{ github.actor }}
  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repo:
    name: repo (deps, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prepare trivy cache and sarif output
        run: mkdir -p "$HOME/.cache/trivy" "${{ runner.temp }}/sarif"

      # --file-patterns is required: Trivy's pip analyzer matches
      # requirements.txt by name and would otherwise skip the .lock files that
      # are the actual source of truth in this repo.
      - name: dependencies and committed secrets (report)
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "${{ runner.temp }}/sarif:/out" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" fs /work \
              --scanners vuln,secret \
              --file-patterns 'pip:.*requirements.*\.lock' \
              --secret-config /work/trivy-secret.yaml \
              --ignorefile /work/.trivyignore \
              --severity HIGH,CRITICAL \
              --format sarif \
              --output /out/fs.sarif \
              --exit-code 0 \
              --quiet

      - name: publish dependency and secret findings
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: ${{ runner.temp }}/sarif/fs.sarif
          # Distinct category per scan. Without it each upload replaces the
          # last and the Security tab shows only whichever ran most recently.
          category: trivy-fs

      - name: dependencies and committed secrets (gate)
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" fs /work \
              --scanners vuln,secret \
              --file-patterns 'pip:.*requirements.*\.lock' \
              --secret-config /work/trivy-secret.yaml \
              --ignorefile /work/.trivyignore \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --quiet

      # always(): a failure in the dependency gate above must not stop the
      # misconfiguration scan from running. They are independent findings and
      # hiding one behind the other wastes a round trip.
      - name: dockerfiles, compose and k8s manifests (report)
        if: always()
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "${{ runner.temp }}/sarif:/out" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" config /work \
              --ignorefile /work/.trivyignore \
              --severity HIGH,CRITICAL \
              --format sarif \
              --output /out/config.sarif \
              --exit-code 0 \
              --quiet

      - name: publish misconfiguration findings
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: ${{ runner.temp }}/sarif/config.sarif
          category: trivy-config

      - name: dockerfiles, compose and k8s manifests (gate)
        if: always()
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" config /work \
              --ignorefile /work/.trivyignore \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --quiet

  images:
    name: image (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [receiver, scanner, discovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prepare trivy cache and sarif output
        run: mkdir -p "$HOME/.cache/trivy" "${{ runner.temp }}/sarif"

      # Built locally and scanned from a tar, so no docker socket is exposed to
      # the scanner and nothing is published from this workflow.
      - name: build and export
        run: |
          docker build -t "scan/${{ matrix.component }}:ci" "${{ matrix.component }}"
          docker save "scan/${{ matrix.component }}:ci" -o /tmp/image.tar

      - name: scan image (report)
        run: |
          docker run --rm \
            -v /tmp/image.tar:/tmp/image.tar:ro \
            -v "$PWD/.trivyignore:/work/.trivyignore:ro" \
            -v "${{ runner.temp }}/sarif:/out" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" image --input /tmp/image.tar \
              --scanners vuln \
              --ignorefile /work/.trivyignore \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format sarif \
              --output /out/image.sarif \
              --exit-code 0 \
              --quiet

      - name: publish image findings
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        with:
          sarif_file: ${{ runner.temp }}/sarif/image.sarif
          # Per component: one category for all three would mean the last
          # matrix leg to finish silently replaces the other two.
          category: trivy-image-${{ matrix.component }}

      - name: scan image (gate)
        run: |
          docker run --rm \
            -v /tmp/image.tar:/tmp/image.tar:ro \
            -v "$PWD/.trivyignore:/work/.trivyignore:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" image --input /tmp/image.tar \
              --scanners vuln \
              --ignorefile /work/.trivyignore \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --quiet

      # Informational: everything, including CVEs with no fix available, so a
      # failure above can be read in context without a second local run.
      - name: full report (non-blocking)
        if: always()
        run: |
          docker run --rm \
            -v /tmp/image.tar:/tmp/image.tar:ro \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            "$TRIVY" image --input /tmp/image.tar \
              --scanners vuln \
              --severity MEDIUM,HIGH,CRITICAL \
              --exit-code 0 \
              --quiet