name: ci

# Supply chain posture:
# - every action is pinned to a full commit SHA, not a movable tag
# - only official actions (actions/*, docker/*); path filtering and image
#   tag construction are plain shell so no third-party action is trusted
# - python installs use --require-hashes against committed lockfiles
#
# Action bumps come from Dependabot (.github/dependabot.yml). Always check
# that the trailing version comment moved with the SHA, it does not always.
# Resolve a tag to its commit yourself with:
#   gh api repos/OWNER/REPO/commits/TAG --jq .sha
#
# Runners: jobs assume GitHub-hosted ubuntu-latest. On self-hosted runners,
# docker/build-push-action v7 requires Actions Runner v2.327.1 or later
# (Node 24 default runtime).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default. Only the job that publishes images gets packages:
# write, and it asks for it itself. A workflow-level grant would hand that
# token to every job in the file, including the ones that run third-party
# linters over the tree.
permissions:
  contents: read

jobs:
  placeholder-guard:
    # The Windows collector and the browser extension both ship a placeholder
    # where a deployer is expected to put a real receiver token. The Trivy
    # custom secret rule catches a token that looks like one; this catches the
    # placeholder going missing, which is the same mistake from the other side
    # and works regardless of how long the token is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: token placeholders intact
        run: |
          grep -q '__RECEIVER_TOKEN__' endpoint/windows/ai-guard-collector.ps1 \
            || { echo "::error::Windows collector token placeholder was replaced"; exit 1; }
          grep -q 'FALLBACK_AUTH_TOKEN = ""' extension/src/background.js \
            || { echo "::error::extension fallback token is not empty"; exit 1; }

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck macOS collector
        run: shellcheck -S warning endpoint/macos/*.sh endpoint/linux/*.sh

  collector-delivery-state:
    # The throttle timestamp must advance only after confirmed delivery. If it
    # advances on failure, a finding that never reached the receiver is never
    # retried, which is a silent gap in a tool built to not have silent gaps.
    # Runs in a container: the collector resolves the console user from the
    # first non-root home under /home, so it needs a clean one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: delivery-state tests
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.12-slim sh -c \
            "apt-get update -qq && apt-get install -yqq curl >/dev/null && \
             endpoint/tests/test_linux_collector.sh"

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint Windows collector
        shell: pwsh
        run: |
          # PSScriptAnalyzer ships on the runner image, so the usual path
          # needs no network at all. This job failed once on a gallery lookup
          # for a module that was already present: an unnecessary request is
          # a failure mode with nothing to show for it.
          #
          # The version is exact, not a floor. A minimum means a newer
          # release can appear on the runner and lint differently from the
          # one this commit was checked against, which is the same movable
          # dependency problem the SHA pins exist to avoid.
          # Bump by checking the tags on PowerShell/PSScriptAnalyzer.
          $version = '1.25.0'
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
                  Where-Object { $_.Version -eq [version]$version } |
                  Select-Object -First 1

          if ($have) {
            Write-Host "using preinstalled PSScriptAnalyzer $($have.Version)"
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            $ok = $false
            foreach ($attempt in 1..3) {
              try {
                Install-Module PSScriptAnalyzer -RequiredVersion $version `
                  -Repository PSGallery -Force -Scope CurrentUser -ErrorAction Stop
                $ok = $true; break
              } catch {
                Write-Host "attempt ${attempt}: $($_.Exception.Message)"
                Start-Sleep -Seconds ([int][Math]::Pow(3, $attempt))
              }
            }
            if (-not $ok) { Write-Host "::error::could not install PSScriptAnalyzer $version"; exit 1 }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $version
          # Both paths. The collector lives in endpoint/windows and the
          # extension's Intune deployment script in extension/deploy/windows,
          # and a linter pointed at one of them lets the other ship unchecked.
          $r = @('endpoint/windows/', 'extension/deploy/windows/') |
               ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Warning,Error }
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  governance-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r .github/requirements-ci.txt
      - name: validate the governance example and the demo file
        # Both, because they are the two files in the repo anyone will copy.
        # The example is what a deployer starts from and the demo file is what
        # the register renders when someone tries the project, so a broken one
        # is a broken first impression either way.
        #
        # The validator exits non-zero on a schema error and warns without
        # failing on a tool id the registry does not know. That asymmetry is
        # deliberate: a decision about a tool that is not registered yet is
        # legitimate, and it is also what a typo looks like, so it is reported
        # rather than either accepted silently or treated as an error.
        run: |
          python governance/validate.py governance/governance.yaml.example
          python governance/validate.py demo/governance.yaml

  registry-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r .github/requirements-ci.txt
      - name: validate registry against schema and build all views
        # The whole directory, not a named file. Two tests were added here and
        # neither ran, because the job listed test_build.py explicitly and
        # nothing noticed the others were never collected. A test that does not
        # run is worse than no test: it looks like a guard.
        run: |
          python registry/build.py --check
          python -m pytest -q registry/

  lock-drift:
    # Nothing installs from requirements.in. This workflow, the Dockerfiles and
    # the Trivy workflow all read requirements.lock, so an edit to the .in alone
    # ships nothing and still goes green. That is how uvicorn sat eighteen minor
    # releases behind through several Dependabot PRs that each passed CI and
    # were closed as no-ops.
    #
    # Recompiles and fails if the committed lock is not what the .in currently
    # produces. Calls `make lock-check` rather than repeating the pip-compile
    # command, so there is one definition of what the lock should be, the same
    # reason registry.yaml is the single source for the compiled views.
    #
    # pip-tools is pinned in the component Makefiles. Without that this job
    # fails whenever pip-tools ships a release, for a reason unrelated to the
    # change under review, and a check that fails at random gets ignored.
    runs-on: ubuntu-latest
    strategy:
      # Report every stale component in one run. Otherwise you fix one, push,
      # and find the next.
      fail-fast: false
      matrix:
        component: [receiver, scanner, discovery, portal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the committed lock matches requirements.in
        working-directory: ${{ matrix.component }}
        run: |
          # pip-compile writes the entire lock to stdout, thousands of lines
          # that bury the result. Keep it for the failure path only.
          if ! make lock >/tmp/compile.log 2>&1; then
            echo "::error::pip-compile failed for ${{ matrix.component }}"
            tail -40 /tmp/compile.log
            exit 1
          fi
          if ! git diff --quiet requirements.lock; then
            echo "::error::${{ matrix.component }}/requirements.lock is stale. Run 'make lock' in ${{ matrix.component }}/ and commit the result."
            echo ""
            git diff --stat requirements.lock
            echo ""
            echo "Versions added or removed:"
            # Package names contain digits, dots and hyphens: h11, rpds-py,
            # markdown-it-py. A narrower pattern drops them silently.
            git diff requirements.lock | grep -E "^[+-][a-zA-Z0-9_.-]+==" || true
            exit 1
          fi
          echo "${{ matrix.component }}/requirements.lock is current."

  receiver-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r receiver/requirements.lock -r .github/requirements-ci.txt
      - run: pytest receiver/ -q

  portal-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r portal/requirements.lock -r .github/requirements-ci.txt
      # PORTAL_AUTH is set because main.py refuses to start without
      # authentication, and that refusal happens at import.
      - run: PORTAL_AUTH=none pytest portal/ -q
        env:
          PYTHONPATH: portal

  scanner-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r scanner/requirements.lock -r .github/requirements-ci.txt && pip install -e scanner/ --no-deps
      - run: pytest scanner/tests -q

  helm:
    # helm ships on the ubuntu-latest runner image, so the normal path needs
    # no download and no third-party action. The fallback pins a version and
    # checks the published checksum; that is same-origin trust, so if you want
    # this airtight, mirror the tarball and hardcode its digest here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chart-version check diffs against the base branch, which needs
          # more than the default single commit.
          fetch-depth: 0
      - name: ensure helm
        run: |
          if command -v helm >/dev/null 2>&1; then
            helm version --short
          else
            V=v3.16.3
            curl -fsSLO "https://get.helm.sh/helm-${V}-linux-amd64.tar.gz"
            curl -fsSLO "https://get.helm.sh/helm-${V}-linux-amd64.tar.gz.sha256sum"
            sha256sum -c "helm-${V}-linux-amd64.tar.gz.sha256sum"
            tar xzf "helm-${V}-linux-amd64.tar.gz"
            sudo install linux-amd64/helm /usr/local/bin/helm
          fi
      # appVersion decides which image tag a default `helm install` pulls, so
      # a stale one deploys the wrong thing while reporting success. It sat at
      # 0.2.0 through the 0.3.0 release because nothing looked at it.
      #
      # Only enforced on a tag build: on main it is normal for the chart to
      # name the release being prepared rather than the last one cut.
      - name: appVersion matches the tag being released
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -E '^appVersion:' charts/ai-guard/Chart.yaml \
                 | sed -E 's/^appVersion:[[:space:]]*"?([^"]+)"?/\1/')
          if [ "$have" != "$want" ]; then
            echo "::error::charts/ai-guard/Chart.yaml appVersion is $have but the tag is $want."
            echo "A default helm install would deploy $have while the release claims $want."
            exit 1
          fi
          echo "appVersion $have matches tag $want."

      # A chart change with an unchanged version is a change nobody is offered:
      # a repo index compares this field to decide whether an upgrade exists.
      #
      # README excluded. It is not in what a repo index compares and not in
      # what gets installed, so a corrected sentence is not an upgrade. The
      # first version of this check fired on a one-line documentation fix,
      # and a guard that fires on prose gets bypassed rather than obeyed -
      # bump-the-version-to-quiet-CI becomes the reflex, and then it is not
      # guarding anything.
      - name: the chart version moved if the chart did
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet origin/${{ github.base_ref }} HEAD -- charts/ ':!charts/**/README.md'; then
            base=$(git show origin/${{ github.base_ref }}:charts/ai-guard/Chart.yaml \
                   | grep -E '^version:' | awk '{print $2}')
            head=$(grep -E '^version:' charts/ai-guard/Chart.yaml | awk '{print $2}')
            if [ "$base" = "$head" ]; then
              echo "::error::charts/ changed but Chart.yaml version is still $head."
              echo "Bump it, or a repo index will not offer the change as an upgrade."
              exit 1
            fi
            echo "chart changed, version moved $base -> $head."
          else
            echo "charts/ unchanged."
          fi

      - name: lint and render the chart
        run: |
          helm lint charts/ai-guard
          # Render every shape with a conditional block of any size: the
          # default, the receiver ingress, the portal turned off, the portal
          # with its own ingress, and the portal with authentication disabled.
          #
          # helm renders an undefined value as the string <no value> and exits
          # zero, so a missing default reaches the cluster as a manifest that
          # is valid YAML and wrong. Grep for it rather than trust the exit
          # code.
          for args in "" \
                      "--set ingress.enabled=true" \
                      "--set portal.enabled=false" \
                      "--set portal.ingress.enabled=true --set portal.lokiUrl=http://loki:3100" \
                      "--set portal.auth.mode=none" \
                      "--set portal.identityMap.existingConfigMap=my-map" \
                      "--set portal.grafana.url=https://grafana.example.com --set portal.grafana.panels=a:1:B"; do
            # shellcheck disable=SC2086
            rendered=$(helm template ai-guard charts/ai-guard $args)
            if grep -q '<no value>' <<<"$rendered"; then
              echo "::error::helm rendered <no value>, a values key has no default"
              grep -n '<no value>' <<<"$rendered"
              exit 1
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r .github/requirements-ci.txt
      - name: the registry shipped in the chart matches registry.yaml
        # The chart ships a compiled registry so that helm install needs no
        # build step. That copy is a duplicate, and a duplicate nobody checks
        # is a duplicate that drifts.
        run: |
          python registry/build.py
          diff -q registry/dist/registry.json charts/ai-guard/files/registry.json \
            || { echo "::error::charts/ai-guard/files/registry.json is stale, copy registry/dist over it"; exit 1; }
          diff -q registry/dist/collector.json charts/ai-guard/files/collector.json \
            || { echo "::error::charts/ai-guard/files/collector.json is stale, copy registry/dist over it"; exit 1; }

  compose-smoke:
    # The production compose route, brought up the way a deployer would.
    #
    # It is not identical to what a deployer runs, and the difference is worth
    # naming rather than hiding. Production points at a log store you already
    # have; CI has none, so this uses the with-logs profile to stand one up.
    # Everything else - the images, the registry builder, file-based secrets,
    # the loopback binds - is the real thing.
    #
    # That gap is where a green job stops proving anything, so the checks below
    # are about the parts the profile does not touch: that secrets are read
    # from files, that the portal refuses to start without them, and that a
    # finding posted to the receiver comes back out of the portal as an entity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The images are built from this commit rather than pulled, so this tests
      # the code in the PR. A deployer pulls a published tag; the compose file
      # is the same either way.
      - name: build the images this commit would publish
        run: |
          docker build --build-arg APP_VERSION=ci-test \
            -t ghcr.io/amansk5/shadow-ai-guard/receiver:ci receiver
          docker build --build-arg APP_VERSION=ci-test \
            -t ghcr.io/amansk5/shadow-ai-guard/portal:ci portal

      - name: set up secrets and config the way the README says
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl rand -hex 32 > secrets/auth_token
          openssl rand -hex 24 > secrets/portal_password
          # Both images run as uid 65532 and a Linux bind mount preserves
          # ownership, so 600 owned by the runner is a file the container
          # cannot read - it exits at startup rather than running with an
          # empty credential. Docker Desktop on macOS maps ownership and hides
          # this, which is how it passed locally and failed here.
          chmod 700 secrets
          chmod 640 secrets/*
          sudo chown :65532 secrets/*
          {
            echo "IMAGE_TAG=ci"
            echo "LOKI_PUSH_URL=http://loki:3100/loki/api/v1/push"
            echo "LOKI_URL=http://loki:3100"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } >> .env

      - name: the compose file is valid
        working-directory: deploy/compose
        run: docker compose --profile with-logs config >/dev/null

      - name: bring it up
        working-directory: deploy/compose
        run: docker compose --profile with-logs up -d

      - name: the receiver becomes healthy
        working-directory: deploy/compose
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          # A bare "connection refused" says nothing about why. If it never
          # came up, the container state and its logs are the answer, and
          # printing them here beats a second run to find out.
          if ! curl -fsS http://127.0.0.1:8080/healthz; then
            echo "::error::the receiver never became reachable"
            docker compose --profile with-logs ps -a
            docker compose --profile with-logs logs
            exit 1
          fi
          # The build arg has to actually reach the running process. A version
          # that silently falls back to "dev" in every published image is
          # exactly the drift this replaced.
          echo
          if ! curl -fsS http://127.0.0.1:8080/healthz | grep -q '"version":"ci-test"'; then
            echo "::error::the receiver did not report the version it was built with"
            curl -fsS http://127.0.0.1:8080/healthz
            exit 1
          fi

      - name: the registry builder succeeded
        working-directory: deploy/compose
        run: |
          cid=$(docker compose ps -aq registry-builder)
          if [ -z "$cid" ]; then echo "::error::registry-builder never ran"; exit 1; fi
          code=$(docker wait "$cid")
          if [ "$code" != "0" ]; then
            echo "::error::registry-builder exited $code"
            docker logs "$cid"; exit 1
          fi

      - name: the receiver reads the token from the file, not the environment
        working-directory: deploy/compose
        run: |
          token=$(cat secrets/auth_token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"tool":"claude-code","surface":"cli","os":"linux","account_domain":"gmail.com","device":"CI-DEVICE","device_name":"ci-box","user":"ci","evidence":"~/.claude.json","severity":"warn","source":"collector-linux"}' \
            http://127.0.0.1:8080/report)
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::a finding with the file-supplied token was rejected ($code)"
            docker compose logs receiver; exit 1
          fi
          # And the wrong token is refused, so the check above means something.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer wrong" -H 'Content-Type: application/json' \
            -d '{"tool":"x","surface":"cli"}' http://127.0.0.1:8080/report)
          if [ "$code" != "401" ]; then
            echo "::error::a wrong token was not refused ($code)"; exit 1
          fi

      - name: the portal requires authentication
        working-directory: deploy/compose
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8091/healthz && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/)
          if [ "$code" = "000" ]; then
            echo "::error::the portal never became reachable"
            docker compose --profile with-logs logs portal
            exit 1
          fi
          if [ "$code" != "401" ]; then
            echo "::error::the portal served its UI without credentials ($code)"; exit 1
          fi

      - name: the finding comes back out of the portal as an entity
        working-directory: deploy/compose
        run: |
          pw=$(cat secrets/portal_password)
          # Loki ingests asynchronously, so retry rather than sleeping once and
          # hoping. A failure here means the whole chain is broken, not that it
          # was slow.
          for _ in $(seq 1 30); do
            body=$(curl -s -u "admin:$pw" 'http://127.0.0.1:8091/api/graph?hours=1' || true)
            echo "$body" | grep -q 'CI-DEVICE' && break
            sleep 2
          done
          # Parsed, not grepped. The first version of this matched on
          # '"personal_accounts": ["gmail.com"]' and failed on a correct
          # response, because the API returns compact JSON and the space after
          # the colon only exists when json.dumps is given an indent. An
          # assertion that depends on whitespace tests the serialiser.
          echo "$body" > /tmp/graph.json
          python3 - <<'EOF'
          import json, sys

          with open("/tmp/graph.json") as fh:
              raw = fh.read()
          if not raw.strip():
              print("::error::the portal returned nothing")
              sys.exit(1)

          g = json.loads(raw)
          dev = g.get("devices", {}).get("CI-DEVICE")
          if dev is None:
              print("::error::the finding never appeared in the portal graph")
              print(raw[:2000])
              sys.exit(1)

          checks = {
              "personal account flagged": dev.get("personal_accounts") == ["gmail.com"],
              "tool present": dev.get("tools") == ["claude-code"],
              "surface recorded": dev.get("surfaces") == ["cli"],
              "hostname carried through": dev.get("device_name") == "ci-box",
              "source recorded": dev.get("sources") == ["collector-linux"],
              "counts as collector coverage": dev.get("collector_seen") is True,
          }
          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              print("::error::the graph is wrong: %s" % ", ".join(failed))
              print(json.dumps(dev, indent=2))
              sys.exit(1)
          print("the finding came back as an entity, correct in every field checked")
          EOF

      - name: tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile with-logs down -v

  demo-smoke:
    # The demo is the first instruction in the README and the thing the
    # project asks people to run before trusting anything else. It broke and
    # stayed broken through a dozen green runs, because nothing here ran it.
    #
    # Container exit codes are not enough on their own: the seeder can exit 0
    # having posted nothing anyone stored. The checks below follow a finding
    # all the way to Loki, which is the claim the demo actually makes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bring the demo up
        working-directory: demo
        run: docker compose up -d --build
      - name: the receiver becomes healthy
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
      - name: the one-shot containers succeeded
        working-directory: demo
        run: |
          for svc in registry-builder seeder; do
            cid=$(docker compose ps -aq "$svc")
            if [ -z "$cid" ]; then
              echo "::error::$svc never ran"; exit 1
            fi
            code=$(docker wait "$cid")
            if [ "$code" != "0" ]; then
              echo "::error::$svc exited $code"; exit 1
            fi
          done
      - name: the registry is served and the demo page is up
        run: |
          curl -fsS -H "Authorization: Bearer demo-token" \
            http://127.0.0.1:8080/registry >/dev/null
          curl -fsS http://127.0.0.1:8090/demo/ >/dev/null
      - name: seeded findings reached the receiver
        run: |
          # A zero counter means the seeder posted nothing that was accepted.
          curl -fsS http://127.0.0.1:8080/metrics \
            | grep -Eq 'aiguard_findings_total\{[^}]*\} [1-9]' \
            || { echo "::error::no findings were ingested"; exit 1; }
      - name: and reached Loki
        run: |
          # Retried: the receiver returns 200 before Loki has necessarily
          # indexed anything, and a demo that shows an empty dashboard is
          # exactly the failure this job exists to catch.
          for _ in $(seq 1 15); do
            body=$(curl -fsS -G http://127.0.0.1:3100/loki/api/v1/query_range \
              --data-urlencode 'query={app="ai-guard-receiver"}' \
              --data-urlencode 'limit=5' 2>/dev/null || true)
            case "$body" in *'"values"'*) echo "findings are queryable"; exit 0 ;; esac
            sleep 2
          done
          echo "::error::findings never appeared in Loki"; exit 1
      - name: Grafana loaded the provisioned dashboard
        run: |
          # The demo's actual promise is that you open Grafana and see a
          # populated dashboard. Everything above proves the pipeline works
          # while saying nothing about the part people are told to look at:
          # a broken image, bad provisioning yaml or malformed dashboard JSON
          # would leave the demo useless and this job green.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          # Anonymous access is Viewer, which is enough to list dashboards.
          # This proves provisioning parsed the file and registered it. It
          # does not prove the panels return data; that needs the datasource
          # to answer, which is a heavier check than a smoke test wants.
          curl -fsS 'http://127.0.0.1:3000/api/search?type=dash-db' \
            | grep -q '"uid": *"ai-guard"' \
            || { echo "::error::the provisioned dashboard is not there"; exit 1; }

      - name: logs, when something above failed
        if: failure()
        working-directory: demo
        run: docker compose logs
      - name: tear down
        if: always()
        working-directory: demo
        run: docker compose down -v

  windows-path-containment:
    # Two containment bugs were found in this code by reading it, an hour
    # apart: a junction partway along a path, then a link whose target passed
    # through one. Each was verified once by hand on a VM and never again.
    # The Linux collector is driven end to end here; Windows had a style
    # linter and nothing else.
    #
    # Junctions rather than symlinks: symlinks need Developer Mode or an
    # elevated session, junctions do not, and junctions are what a redirected
    # profile folder actually is.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: path containment holds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # -FunctionsOnly loads the functions and stops before the scans, so
          # this tests the shipped code rather than a copy of it.
          . .\endpoint\windows\ai-guard-collector.ps1 -FunctionsOnly

          $root    = Join-Path $env:RUNNER_TEMP 'containment'
          $profileDir = Join-Path $root 'profile'
          $outside = Join-Path $root 'outside'
          New-Item -ItemType Directory -Path $profileDir, $outside -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $outside 'sub') -Force | Out-Null

          # $UserHome has to be set before the first call: Resolve-UnderHome
          # resolves the profile once and keeps it.
          $UserHome = $profileDir

          '{}' | Out-File (Join-Path $profileDir 'ordinary.json')
          '{}' | Out-File (Join-Path $outside 'sub\config.json')

          # a redirected folder that stays inside the profile
          New-Item -ItemType Directory -Path (Join-Path $profileDir 'real') -Force | Out-Null
          '{}' | Out-File (Join-Path $profileDir 'real\ok.json')
          New-Item -ItemType Junction -Path (Join-Path $profileDir 'inside') `
                   -Target (Join-Path $profileDir 'real') | Out-Null

          # a junction straight out of the profile
          New-Item -ItemType Junction -Path (Join-Path $profileDir 'escape') `
                   -Target $outside | Out-Null

          # and a junction whose target passes through that one
          New-Item -ItemType Junction -Path (Join-Path $profileDir 'nested') `
                   -Target (Join-Path $profileDir 'escape\sub') | Out-Null

          $cases = @(
            @{ name = 'ordinary file';                  path = Join-Path $profileDir 'ordinary.json';        allow = $true  },
            @{ name = 'junction inside the profile';    path = Join-Path $profileDir 'inside\ok.json';       allow = $true  },
            @{ name = 'junction out of the profile';    path = Join-Path $profileDir 'escape\sub\config.json'; allow = $false },
            @{ name = 'junction through a junction';    path = Join-Path $profileDir 'nested\config.json';    allow = $false },
            @{ name = 'file that is not there';         path = Join-Path $profileDir 'missing.json';         allow = $false }
          )

          $failed = 0
          foreach ($case in $cases) {
            $got = Resolve-UnderHome $case.path
            $allowed = [bool]$got
            if ($allowed -eq $case.allow) {
              Write-Host ("ok    {0,-32} allowed={1}" -f $case.name, $allowed)
            } else {
              Write-Host ("::error::{0}: expected allowed={1}, got {2}" -f $case.name, $case.allow, $allowed)
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }

  build-images:
    # main and tags only: PRs validate, they do not publish.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    needs: [placeholder-guard, shellcheck, collector-delivery-state,
            registry-validate, governance-validate,
            receiver-test, scanner-test, portal-test,
            helm, demo-smoke, compose-smoke,
            windows-path-containment]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [receiver, scanner, discovery, portal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: detect whether this component changed (tags always build)
        id: gate
        run: |
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -q '^${{ matrix.component }}/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: compute image tags
        if: steps.gate.outputs.build == 'true'
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.component }}"
          IMAGE="${IMAGE,,}"   # ghcr requires lowercase
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="$IMAGE:sha-$SHORT_SHA"
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            TAGS="$TAGS,$IMAGE:${GITHUB_REF_NAME#v},$IMAGE:latest"
          else
            TAGS="$TAGS,$IMAGE:main"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.gate.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is built under emulation on an amd64 runner. Slower than a
      # native build, but it keeps this to one job and one manifest; the
      # path gate means a component only builds when it changes.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: steps.gate.outputs.build == 'true'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.gate.outputs.build == 'true'

      # Both architectures under one tag, so `docker pull` resolves correctly
      # on Graviton, Apple Silicon and a Pi without the caller knowing.
      # requirements.lock already carries the aarch64 wheel hashes:
      # pip-compile --generate-hashes records every distribution for a
      # version, not just the one the build host happens to need.
      # The version the image reports on /healthz. A tag build says the
      # release; a build off main says the commit, because "0.4.0" on a
      # main build would claim to be a release it is not.
      #
      # This used to be a hardcoded constant in the source, and it drifted:
      # the receiver reported 0.1.6 while the release was 0.4.0, so the one
      # endpoint an operator checks to answer "am I running what I think I
      # am" answered a different question.
      - name: the version this image will report
        id: appversion
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.gate.outputs.build == 'true'
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.appversion.outputs.value }}

      - name: confirm the manifest carries both architectures
        if: steps.gate.outputs.build == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.component }}"
          IMAGE="${IMAGE,,}"
          REF="$IMAGE:sha-${GITHUB_SHA::7}"
          echo "inspecting $REF"
          # The default output lists one "Platform: os/arch" line per manifest.
          # Do not parse --raw: it pretty-prints, so "architecture": "amd64"
          # carries a space that a naive pattern misses, which fails the check
          # on an image that is perfectly fine.
          got=$(docker buildx imagetools inspect "$REF" | awk '/Platform:/ {print $2}' | sort -u)
          echo "$got"
          echo "$got" | grep -qx 'linux/amd64' || { echo "::error::amd64 missing"; exit 1; }
          echo "$got" | grep -qx 'linux/arm64' || { echo "::error::arm64 missing"; exit 1; }