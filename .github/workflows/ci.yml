name: ci

# Supply chain posture:
# - every action is pinned to a full commit SHA, not a movable tag
# - only official actions (actions/*, docker/*); path filtering and image
#   tag construction are plain shell so no third-party action is trusted
# - python installs use --require-hashes against committed lockfiles
#
# Action bumps come from Dependabot (.github/dependabot.yml). Always check
# that the trailing version comment moved with the SHA, it does not always.
# Resolve a tag to its commit yourself with:
#   gh api repos/OWNER/REPO/commits/TAG --jq .sha
#
# Runners: jobs assume GitHub-hosted ubuntu-latest. On self-hosted runners,
# docker/build-push-action v7 requires Actions Runner v2.327.1 or later
# (Node 24 default runtime).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  placeholder-guard:
    # The Windows collector and the browser extension both ship a placeholder
    # where a deployer is expected to put a real receiver token. The Trivy
    # custom secret rule catches a token that looks like one; this catches the
    # placeholder going missing, which is the same mistake from the other side
    # and works regardless of how long the token is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: token placeholders intact
        run: |
          grep -q '__RECEIVER_TOKEN__' endpoint/windows/ai-guard-collector.ps1 \
            || { echo "::error::Windows collector token placeholder was replaced"; exit 1; }
          grep -q 'FALLBACK_AUTH_TOKEN = ""' extension/src/background.js \
            || { echo "::error::extension fallback token is not empty"; exit 1; }

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck macOS collector
        run: shellcheck -S warning endpoint/macos/*.sh endpoint/linux/*.sh

  collector-delivery-state:
    # The throttle timestamp must advance only after confirmed delivery. If it
    # advances on failure, a finding that never reached the receiver is never
    # retried, which is a silent gap in a tool built to not have silent gaps.
    # Runs in a container: the collector resolves the console user from the
    # first non-root home under /home, so it needs a clean one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: delivery-state tests
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.12-slim sh -c \
            "apt-get update -qq && apt-get install -yqq curl >/dev/null && \
             endpoint/tests/test_linux_collector.sh"

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint Windows collector
        shell: pwsh
        run: |
          # PSScriptAnalyzer ships on the runner image, so the usual path
          # needs no network at all. This job failed once on a gallery lookup
          # for a module that was already present: an unnecessary request is
          # a failure mode with nothing to show for it.
          #
          # The minimum is pinned so the same commit lints the same way twice,
          # which is what every other dependency in this file already does.
          # Bump by checking the tags on PowerShell/PSScriptAnalyzer.
          $version = '1.25.0'
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
                  Where-Object { $_.Version -ge [version]$version } |
                  Select-Object -First 1

          if ($have) {
            Write-Host "using preinstalled PSScriptAnalyzer $($have.Version)"
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            $ok = $false
            foreach ($attempt in 1..3) {
              try {
                Install-Module PSScriptAnalyzer -MinimumVersion $version `
                  -Repository PSGallery -Force -Scope CurrentUser -ErrorAction Stop
                $ok = $true; break
              } catch {
                Write-Host "attempt ${attempt}: $($_.Exception.Message)"
                Start-Sleep -Seconds ([int][Math]::Pow(3, $attempt))
              }
            }
            if (-not $ok) { Write-Host "::error::could not install PSScriptAnalyzer $version"; exit 1 }
          }
          Import-Module PSScriptAnalyzer -MinimumVersion $version
          $r = Invoke-ScriptAnalyzer -Path endpoint/windows/ -Recurse -Severity Warning,Error
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  registry-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.3 jsonschema==4.25.1 pytest==8.4.2
      - name: validate registry against schema and build all views
        run: python registry/build.py --check && python -m pytest -q registry/test_build.py

  receiver-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r receiver/requirements.lock && pip install pytest==8.4.2
      - run: pytest receiver/ -q

  scanner-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --require-hashes -r scanner/requirements.lock && pip install -e scanner/ --no-deps && pip install pytest==8.4.2
      - run: pytest scanner/tests -q

  build-images:
    # main and tags only: PRs validate, they do not publish.
    if: github.event_name == 'push'
    needs: [placeholder-guard, shellcheck, collector-delivery-state,
            registry-validate, receiver-test, scanner-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [receiver, scanner, discovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: detect whether this component changed (tags always build)
        id: gate
        run: |
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -q '^${{ matrix.component }}/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: compute image tags
        if: steps.gate.outputs.build == 'true'
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.component }}"
          IMAGE="${IMAGE,,}"   # ghcr requires lowercase
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="$IMAGE:sha-$SHORT_SHA"
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            TAGS="$TAGS,$IMAGE:${GITHUB_REF_NAME#v},$IMAGE:latest"
          else
            TAGS="$TAGS,$IMAGE:main"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: steps.gate.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is built under emulation on an amd64 runner. Slower than a
      # native build, but it keeps this to one job and one manifest; the
      # path gate means a component only builds when it changes.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: steps.gate.outputs.build == 'true'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.gate.outputs.build == 'true'

      # Both architectures under one tag, so `docker pull` resolves correctly
      # on Graviton, Apple Silicon and a Pi without the caller knowing.
      # requirements.lock already carries the aarch64 wheel hashes:
      # pip-compile --generate-hashes records every distribution for a
      # version, not just the one the build host happens to need.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.gate.outputs.build == 'true'
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: confirm the manifest carries both architectures
        if: steps.gate.outputs.build == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.component }}"
          IMAGE="${IMAGE,,}"
          REF="$IMAGE:sha-${GITHUB_SHA::7}"
          echo "inspecting $REF"
          # The default output lists one "Platform: os/arch" line per manifest.
          # Do not parse --raw: it pretty-prints, so "architecture": "amd64"
          # carries a space that a naive pattern misses, which fails the check
          # on an image that is perfectly fine.
          got=$(docker buildx imagetools inspect "$REF" | awk '/Platform:/ {print $2}' | sort -u)
          echo "$got"
          echo "$got" | grep -qx 'linux/amd64' || { echo "::error::amd64 missing"; exit 1; }
          echo "$got" | grep -qx 'linux/arm64' || { echo "::error::arm64 missing"; exit 1; }